· CNBV","verbo":"Integro","desc":"Los fondos ilegales se reinsertan en la economía, aparecen como legítimos y pueden reutilizarse. Ejemplos: empresas de fachada y la venta del yate comprado antes.","orden":6,"panel":"Etapa 3 · Integración","puntos":["<b>Qué implica:<\/b> reinserción de los fondos ilegales en la economía. Los fondos aparecen como legítimos y pueden ser reutilizados.","<b>Ejemplos (VSPP):<\/b> red de empresas de fachada; la venta de un yate que se adquirió en la etapa de estratificación.","<b>Pregunta-gancho:<\/b> ¿el dinero <b>regresa<\/b> limpio y se puede volver a usar? (criterio didáctico)."],"ir":"#etapas","destacado":false}]},{"letra":"3","titulo":"Rama 3 · Las penas del CPF","pregunta":"¿Cuánto cuesta?","ritmo":"¿Cuánto cuesta?","corto":"Rama 3","color":"turquesa","items":[{"etiqueta":"Art. 400 Bis","nombre":"Operaciones con recursos de procedencia ilícita","sub":"CPF · Título Vigesimotercero","verbo":"Castigo","desc":"Manejar recursos u ocultar su origen o titularidad sabiendo que provienen de una actividad ilícita: de 5 a 15 años de prisión y de 1,000 a 5,000 días multa.","orden":7,"panel":"Art. 400 Bis CPF · operaciones con recursos de procedencia ilícita","puntos":["<b>Pena:<\/b> de <b>cinco a quince años<\/b> de prisión y de <b>mil a cinco mil días multa<\/b>, por sí o por interpósita persona.","<b>Fr. I:<\/b> adquiera, enajene, administre, custodie, posea, cambie, convierta, deposite, retire, dé o reciba por cualquier motivo, invierta, traspase, transporte o transfiera, dentro del territorio nacional, de éste hacia el extranjero o a la inversa, recursos, derechos o bienes de cualquier naturaleza, cuando tenga conocimiento de que proceden o representan el producto de una actividad ilícita.","<b>Fr. II:<\/b> oculte, encubra o pretenda ocultar o encubrir la naturaleza, origen, ubicación, destino, movimiento, propiedad o titularidad de recursos, derechos o bienes, con el mismo conocimiento.","<b>Producto de una actividad ilícita:<\/b> cuando existan indicios fundados o certeza de que provienen directa o indirectamente, o representan las ganancias derivadas de la comisión de algún delito y no pueda acreditarse su legítima procedencia.","Si se usan servicios de instituciones del sistema financiero, el Ministerio Público está en todo momento facultado para investigar.","En esos mismos casos (servicios del sistema financiero), <b>para ejercer la acción penal se requerirá la denuncia de la SHCP<\/b>, quien tendrá el carácter de víctima u ofendida (párrafo reformado DOF 16-07-2025)."],"ir":"#comparativo","destacado":true},{"etiqueta":"Art. 400 Bis 1","nombre":"Agravantes del lavado","sub":"CPF · Título Vigesimotercero","verbo":"Agravo","desc":"Sube desde un tercio hasta en una mitad si lava el personal de un sujeto al régimen; se duplica si es servidor público encargado de prevenir, detectar, denunciar, investigar o juzgar delitos.","orden":8,"panel":"Art. 400 Bis 1 CPF · agravantes","puntos":["<b>Desde un tercio hasta en una mitad:<\/b> consejero, administrador, funcionario, empleado, apoderado o prestador de servicios de cualquier persona sujeta al régimen de prevención, o dentro de los <b>dos años<\/b> siguientes de haberse separado del cargo.","Además, inhabilitación en personas morales sujetas al régimen de prevención hasta por un tiempo igual al de la prisión impuesta; corre a partir de que se cumpla la prisión.","<b>Se duplican:<\/b> servidores públicos encargados de prevenir, detectar, denunciar, investigar o juzgar delitos o ejecutar sanciones penales, y ex servidores con esas funciones en los <b>dos años<\/b> posteriores a su terminación; más inhabilitación hasta por un tiempo igual al de la prisión.","<b>Hasta en una mitad:<\/b> si utiliza a menores de dieciocho años o a personas sin capacidad para comprender el significado del hecho o para resistirlo."],"ir":"#agravantes","destacado":false},{"etiqueta":"139 Quáter → 139","nombre":"Pena del financiamiento al terrorismo","sub":"CPF · Capítulo VI Bis","verbo":"Igualo","desc":"Misma pena que el terrorismo del art. 139: de 15 a 40 años de prisión y de 400 a 1,200 veces el valor diario de la UMA, sin perjuicio de los demás delitos que resulten.","orden":9,"panel":"Pena del FT (art. 139 Quáter, que remite al 139)","puntos":["El 139 Quáter impone «la misma pena señalada en el artículo 139».","<b>Art. 139, primer párrafo:<\/b> prisión de <b>quince a cuarenta años<\/b> y multa de <b>cuatrocientas a mil doscientas veces el valor diario de la Unidad de Medida y Actualización<\/b> (párrafo reformado DOF 07-06-2024).","Es «sin perjuicio de las penas que corresponden por los demás delitos que resulten».","<b>Nota:<\/b> el art. 139 trae aumentos propios (una mitad en tres supuestos; hasta un tercio con aeronaves pilotadas a distancia). El 139 Quáter no dice si esos aumentos aplican al FT; en esta app no se preguntan."],"ir":"#comparativo","destacado":false},{"etiqueta":"Art. 139 Quinquies","nombre":"Encubrir a quien financió","sub":"CPF · Capítulo VI Bis","verbo":"Encubro","desc":"Quien encubra a una persona que participó en el financiamiento al terrorismo del art. 139 Quáter: de 1 a 9 años de prisión y de 100 a 300 días multa.","orden":10,"panel":"Art. 139 Quinquies CPF","puntos":["«Se aplicará de <b>uno a nueve años<\/b> de prisión y de <b>cien a trescientos días multa<\/b>, a quien encubra a una persona que haya participado en los delitos previstos en el artículo 139 Quáter».","Misma pena que el art. 139 Bis (encubrir a un terrorista, teniendo conocimiento de sus actividades o de su identidad)."],"destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por concepto"}},{"tipo":"tarjetas","id":"etapas","nav":"Etapas","titulo":"Las tres etapas del lavado","intro":"Con los ejemplos tal como los da el VSPP de la CNBV. Las preguntas-gancho son criterio didáctico para clasificar casos; la norma sólo da la descripción y los ejemplos.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"1 · Colocación","subtitulo":"¿Entra al sistema?","filas":[{"k":"Qué implica","v":"El lavador introduce sus ganancias ilícitas en el sistema financiero."},{"k":"Ejemplos","v":"<ul><li>Depósitos bancarios en efectivo<\/li><li>Inversión en instrumentos financieros<\/li><\/ul>"}]},{"encabezado":true,"color":"morado","titulo":"2 · Estratificación","subtitulo":"¿Cambia de forma?","filas":[{"k":"Qué implica","v":"Envío de dinero a través de diversas transacciones financieras para cambiar su forma, dificultando su rastreo."},{"k":"Ejemplos","v":"<ul><li>Transferencias bancarias<\/li><li>Compra de bienes raíces o bienes de lujo<\/li><\/ul>"}]},{"encabezado":true,"color":"turquesa","titulo":"3 · Integración","subtitulo":"¿Regresa limpio?","filas":[{"k":"Qué implica","v":"Reinserción de los fondos ilegales en la economía. Aparecen como legítimos y pueden ser reutilizados."},{"k":"Ejemplos","v":"<ul><li>Red de empresas de fachada<\/li><li>La venta de un yate que se adquirió en la estratificación<\/li><\/ul>"}]}],"nota":"<b>Objetivo del lavado (VSPP):<\/b> que los fondos aparezcan como fruto de actividades legítimas y circulen sin problema en el sistema financiero. La operación generalmente se realiza en varios niveles."},{"tipo":"tarjetas","id":"corrupcion","nav":"Corrupción","titulo":"Los tres tipos de corrupción (Transparencia Internacional)","intro":"Definición: «el abuso del poder para beneficio propio». Puede clasificarse según la cantidad de fondos perdidos y el sector en el que se cometa (Guía Anticorrupción CNBV 2020, I.1.3).","tarjetas":[{"barra":true,"color":"principal","titulo":"Corrupción a gran escala","ref":"Guía, I.1.3","html":"Actos cometidos en los <b>niveles más altos del gobierno<\/b>, que involucran la distorsión de políticas o de funciones centrales del Estado, y que permiten a las PEP beneficiarse a expensas del bien común."},{"barra":true,"color":"morado","titulo":"Actos de corrupción menores","ref":"Guía, I.1.3","html":"<b>Abuso cotidiano<\/b> de poder por PEP de <b>bajo y mediano rango<\/b> al interactuar con ciudadanos comunes, quienes a menudo intentan acceder a bienes y servicios básicos en ámbitos como hospitales, escuelas, departamentos de policía y otros organismos."},{"barra":true,"color":"turquesa","titulo":"Corrupción política","ref":"Guía, I.1.3","html":"<b>Manipulación de políticas, instituciones y normas de procedimiento<\/b> en la asignación de recursos y financiamiento por los responsables de las decisiones políticas, que abusan de su posición para conservar su poder, estatus y patrimonio."}],"nota":"Glosario de TI citado en la Guía: <b>cohecho<\/b> es ofrecer, prometer, dar, aceptar o solicitar una ventaja como incentivo para una acción ilegal, poco ética o una falta de confianza; el <b>desvío de fondos públicos<\/b> se da cuando quien ocupa un cargo se apropia con el fin de obtener beneficios privados."},{"tipo":"tarjetas","id":"lista-ft","nav":"Lista del FT","titulo":"¿Qué delitos financia el FT? (art. 139 Quáter)","intro":"El FT no sólo es apoyar a terroristas: también es aportar o recaudar para cometer, en México o en el extranjero, cualquiera de estos delitos.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Fr. I · Del Código Penal Federal","subtitulo":"Cinco numerales","filas":[{"k":"1)","v":"<b>Terrorismo<\/b>: arts. 139, 139 Bis y 139 Ter"},{"k":"2)","v":"<b>Sabotaje<\/b>: art. 140"},{"k":"3)","v":"<b>Terrorismo internacional<\/b>: arts. 148 Bis, 148 Ter y 148 Quáter"},{"k":"4)","v":"<b>Ataques a las vías de comunicación<\/b>: arts. 167, fr. IX, y 170, párrafos primero, segundo y tercero"},{"k":"5)","v":"<b>Robo<\/b>: art. 368 Quinquies"}]},{"encabezado":true,"color":"negro","titulo":"Fr. II · Ley de reservas mineras","subtitulo":"Uranio, torio e isótopos hendibles","filas":[{"k":"Ley","v":"Ley que Declara Reservas Mineras los Yacimientos de Uranio, Torio y las demás Substancias de las cuales se obtengan Isótopos Hendibles que puedan producir Energía Nuclear"},{"k":"Artículos","v":"Los previstos en los <b>arts. 10 y 13<\/b>"}]}],"nota":"Ritmo para recordarlo: <b>5 + 1<\/b>. Cinco grupos del CPF y una ley especial."},{"tipo":"tarjetas","id":"comparativo","nav":"LD vs FT","titulo":"Lavado contra financiamiento al terrorismo","intro":"Los dos delitos del temario 1.1, lado a lado.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Lavado · art. 400 Bis","subtitulo":"Operaciones con recursos de procedencia ilícita","filas":[{"k":"Conducta","v":"Fr. I: adquirir, poseer, depositar, transferir… recursos. Fr. II: ocultar o encubrir su naturaleza, origen, destino o titularidad."},{"k":"Conocimiento","v":"De que <b>proceden o representan el producto<\/b> de una actividad ilícita."},{"k":"Prisión","v":"<b>5 a 15 años<\/b>"},{"k":"Multa","v":"<b>1,000 a 5,000 días multa<\/b>"},{"k":"Acción penal","v":"Si se usan servicios del sistema financiero: el MP puede investigar en todo momento, y para ejercer la acción penal se requiere <b>denuncia de la SHCP<\/b>, que tiene el carácter de víctima u ofendida."}]},{"encabezado":true,"color":"morado","titulo":"FT · art. 139 Quáter","subtitulo":"Financiamiento al terrorismo","filas":[{"k":"Conducta","v":"Aportar o recaudar, directa o indirectamente, fondos económicos o recursos <b>de cualquier naturaleza<\/b>."},{"k":"Conocimiento","v":"De que <b>serán destinados<\/b> a financiar o apoyar terroristas, o a cometer los delitos que enlista."},{"k":"Prisión","v":"<b>15 a 40 años<\/b> (la del art. 139)"},{"k":"Multa","v":"<b>400 a 1,200 veces el valor diario de la UMA<\/b> (la del art. 139)"},{"k":"Encubrir","v":"Art. 139 Quinquies: 1 a 9 años y 100 a 300 días multa."}]}],"nota":"Gancho: en el lavado el conocimiento mira <b>hacia atrás<\/b> (de dónde viene el dinero); en el FT mira <b>hacia adelante<\/b> (a dónde va). Es criterio didáctico que resume la redacción de cada artículo."},{"tipo":"escala","id":"agravantes","nav":"Agravantes","titulo":"Cuánto sube la pena del lavado (art. 400 Bis 1)","niveles":[{"t":"Pena base","d":"Cualquier persona, por sí o por interpósita persona.","req":"5 a 15 años · 1,000 a 5,000 días multa (art. 400 Bis)"},{"t":"Hasta en una mitad","d":"Utiliza a menores de 18 años o a personas sin capacidad para comprender el significado del hecho o para resistirlo.","req":"Art. 400 Bis 1, último párrafo"},{"t":"Desde un tercio hasta en una mitad","d":"Consejero, administrador, funcionario, empleado, apoderado o prestador de servicios de un sujeto al régimen de prevención, o dentro de los 2 años de haberse separado. Más inhabilitación.","req":"Art. 400 Bis 1, primer y segundo párrafos"},{"t":"Se duplican","d":"Servidores públicos encargados de prevenir, detectar, denunciar, investigar o juzgar delitos o ejecutar sanciones; y ex servidores en los 2 años posteriores. Más inhabilitación.","req":"Art. 400 Bis 1, tercer párrafo"}],"memo":"La inhabilitación, en ambos casos, es hasta por un tiempo igual al de la prisión impuesta y corre a partir de que se cumpla la prisión. El orden de la escala es didáctico: los dos aumentos intermedios llegan al mismo máximo (una mitad), pero el del personal del sujeto tiene mínimo de un tercio; el de servidores públicos duplica."},{"tipo":"cifras","id":"cifras","nav":"Cifras","titulo":"Penas y cifras que preguntan","intro":"Cada número con su unidad y su artículo. Ojo con la unidad de la multa: días multa en el lavado, veces la UMA en el FT.","cifras":[["5–15","años","Prisión por operaciones con recursos de procedencia ilícita","Art. 400 Bis"],["1,000–5,000","días multa","Multa por operaciones con recursos de procedencia ilícita","Art. 400 Bis"],["⅓ a ½","más","Aumento si lava el personal de un sujeto al régimen de prevención","Art. 400 Bis 1, ¶1"],["2","años","Después de dejar el cargo, en que aún aplica el agravante (personal del sujeto y ex servidores públicos)","Art. 400 Bis 1, ¶1 y ¶3"],["×2","la pena","Si lava un servidor público encargado de prevenir, detectar, denunciar, investigar o juzgar delitos","Art. 400 Bis 1, ¶3"],["½","hasta","Aumento si se utiliza a menores de 18 años o a incapaces","Art. 400 Bis 1, ¶4"],["15–40","años","Prisión por financiamiento al terrorismo (la misma del terrorismo)","Arts. 139 Quáter y 139"],["400–1,200","veces UMA","Multa por financiamiento al terrorismo: veces el valor diario de la UMA","Arts. 139 Quáter y 139"],["1–9","años","Prisión por encubrir a quien participó en el FT (más 100 a 300 días multa)","Art. 139 Quinquies"],["3","etapas","Del lavado: colocación, estratificación e integración","VSPP"],["3","tipos","De corrupción según TI: gran escala, menores y política","Guía, I.1.3"],["5 + 1","grupos","De delitos cuyo financiamiento es FT: cinco del CPF y una ley especial","Art. 139 Quáter"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"c_ld":"Lavado de dinero y sus etapas","c_ft":"Financiamiento al terrorismo","c_corr":"Corrupción","c_penas":"Penas del CPF"},"modos":[{"k":"c_ld","l":"Lavado y etapas","tema":"c_ld"},{"k":"c_ft","l":"Financiamiento al terrorismo","tema":"c_ft"},{"k":"c_corr","l":"Corrupción","tema":"c_corr"},{"k":"c_penas","l":"Penas","tema":"c_penas"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"C001","tema":"c_ld","tipo":"memoria","q":"Según el VSPP de la CNBV, el lavado de dinero es «el proceso a través del cual es ____ el origen de los fondos generados mediante el ejercicio de algunas actividades ilegales».","a":"encubierto","o":["encubierto","justificado","transformado","transferido"],"x":"El VSPP usa «encubierto»: el lavado oculta el origen de los fondos. «Transformado» se parece a la estratificación (cambiar la forma), pero no es la palabra de la definición.","ref":"VSPP, concepto"},{"id":"C002","tema":"c_ld","tipo":"memoria","q":"En el concepto del VSPP, ¿qué es lo que se encubre en el lavado de dinero?","a":"El origen de los fondos generados por actividades ilegales","o":["La titularidad de las cuentas que reciben los fondos de actividades ilegales","La identidad de las personas que participan en las actividades ilegales","El origen de los fondos generados por actividades ilegales","El destino de los fondos que se aportarán a actividades ilegales"],"x":"La definición del VSPP habla de encubrir «el origen de los fondos». La opción del destino de fondos que «se aportarán» a actividades ilegales describe la redacción del financiamiento al terrorismo. Ojo: el art. 400 Bis, fr. II, sí menciona destino y titularidad, pero la pregunta es sobre el concepto del VSPP.","ref":"VSPP, concepto"},{"id":"C003","tema":"c_ld","tipo":"memoria","q":"Según el VSPP, el objetivo del lavado es hacer que los fondos o activos obtenidos a través de actividades ilícitas aparezcan como el fruto de actividades legítimas y circulen sin problema en el ____.","a":"sistema financiero","o":["sistema de pagos","sistema financiero","comercio exterior","mercado de valores"],"x":"El texto dice «circulen sin problema en el sistema financiero». Las otras opciones son partes o ámbitos cercanos, pero no son las palabras del VSPP.","ref":"VSPP, concepto"},{"id":"C004","tema":"c_ld","tipo":"memoria","q":"De acuerdo con el VSPP, la operación de lavado de dinero generalmente se realiza…","a":"en varios niveles","o":["en una sola operación","en dos niveles","en varios niveles","en varios países"],"x":"El VSPP dice que la operación «generalmente se realiza en varios niveles». No limita el número a dos ni lo define por países.","ref":"VSPP, concepto"},{"id":"C005","tema":"c_ld","tipo":"memoria","q":"¿Cuál de estas actividades aparece en la lista del VSPP de las actividades ilegales más comunes cuyos fondos se lavan?","a":"Lenocinio","o":["Despojo","Secuestro","Lenocinio","Homicidio"],"x":"El VSPP cita tráfico de drogas o estupefacientes, contrabando de armas, corrupción, fraude, trata de personas, lenocinio, extorsión, piratería, evasión fiscal y terrorismo. Secuestro, homicidio y despojo no están en esa lista.","ref":"VSPP, concepto"},{"id":"C006","tema":"c_ld","tipo":"memoria","q":"¿Cuál es la etapa del lavado en la que, según el VSPP, «el lavador introduce sus ganancias ilícitas en el sistema financiero»?","a":"Colocación","o":["Estratificación","Colocación","Encubrimiento","Integración"],"x":"Introducir las ganancias ilícitas al sistema financiero es la colocación, la primera etapa. La estratificación ocurre después, cuando el dinero ya está dentro y se mueve para cambiar su forma.","ref":"VSPP, etapas"},{"id":"C007","tema":"c_ld","tipo":"memoria","q":"Según el VSPP, la estratificación implica el envío de dinero a través de diversas transacciones financieras para cambiar su ____, dificultando su rastreo.","a":"forma","o":["destino","forma","denominación","titular"],"x":"El VSPP dice «para cambiar su forma, dificultando su rastreo». Cambiar el titular o el destino puede ocurrir en la práctica, pero no es la redacción del VSPP.","ref":"VSPP, etapas"},{"id":"C008","tema":"c_ld","tipo":"memoria","q":"Según el VSPP, la integración es la reinserción de los fondos ilegales en la economía; los fondos aparecen como legítimos y pueden ser ____.","a":"reutilizados","o":["transferidos","rastreados","reutilizados","fraccionados"],"x":"En la integración los fondos «aparecen como legítimos y pueden ser reutilizados». Transferirlos es ejemplo de estratificación, no el rasgo de la integración.","ref":"VSPP, etapas"},{"id":"C009","tema":"c_ld","tipo":"memoria","q":"¿Cuál de estos es un ejemplo que el VSPP da de la etapa de colocación?","a":"Inversión en instrumentos financieros","o":["Red de empresas de fachada","Transferencias bancarias entre cuentas","Compra de bienes raíces o bienes de lujo","Inversión en instrumentos financieros"],"x":"El VSPP pone como ejemplos de colocación los depósitos bancarios en efectivo y la inversión en instrumentos financieros. Las transferencias y la compra de bienes raíces son estratificación; las empresas de fachada, integración.","ref":"VSPP, etapas"},{"id":"C010","tema":"c_ld","tipo":"memoria","q":"¿Cuál de estos es un ejemplo que el VSPP da de la etapa de estratificación?","a":"Transferencias bancarias","o":["Inversión en instrumentos financieros","Transferencias bancarias","Red de empresas de fachada","Depósitos bancarios en efectivo"],"x":"Las transferencias bancarias y la compra de bienes raíces o de lujo son los ejemplos de estratificación. El depósito en efectivo y la inversión en instrumentos son colocación.","ref":"VSPP, etapas"},{"id":"C011","tema":"c_ld","tipo":"memoria","q":"¿Cuál de estos es un ejemplo que el VSPP da de la etapa de integración?","a":"Red de empresas de fachada","o":["Depósitos bancarios en efectivo","Transferencias bancarias","Compra de bienes raíces o de lujo","Red de empresas de fachada"],"x":"Los ejemplos de integración son la red de empresas de fachada y la venta de un yate adquirido en la estratificación. La compra de bienes raíces o de lujo es estratificación.","ref":"VSPP, etapas"},{"id":"C012","tema":"c_ld","tipo":"trampa","q":"¿Cuál de estas operaciones NO es un ejemplo de estratificación según el VSPP?","a":"La venta de un yate adquirido antes","o":["Compra de bienes de lujo con fondos ya depositados","La venta de un yate adquirido antes","Transferencias bancarias entre cuentas de terceros","Compra de bienes raíces con fondos ya depositados"],"x":"La venta del yate que se adquirió en la estratificación es ejemplo de integración. La compra de bienes raíces o de lujo y las transferencias bancarias sí son estratificación.","ref":"VSPP, etapas"},{"id":"C013","tema":"c_ld","tipo":"memoria","q":"Según el VSPP, ¿dónde está previsto en México el tipo penal del delito de operaciones con recursos de procedencia ilícita?","a":"Art. 400 Bis del Código Penal Federal","o":["Art. 139 Quinquies del Código Penal Federal","Art. 139 Quáter del Código Penal Federal","Art. 400 Bis 1 del Código Penal Federal","Art. 400 Bis del Código Penal Federal"],"x":"El VSPP remite al art. 400 Bis del CPF. El 400 Bis 1 no tipifica la conducta: prevé sus agravantes; el 139 Quáter es el financiamiento al terrorismo.","ref":"VSPP, etapas (párrafo final)"},{"id":"C014","tema":"c_ld","tipo":"caso","q":"Rogelio deposita en efectivo en su cuenta bancaria el dinero que obtuvo de extorsiones. Según el VSPP, ¿en qué etapa del lavado está esta operación?","a":"Colocación","o":["Colocación","Encubrimiento","Integración","Estratificación"],"x":"Un depósito bancario en efectivo es el ejemplo típico de colocación: el dinero ilícito entra al sistema financiero. Aún no se ha movido entre transacciones, así que no es estratificación.","ref":"VSPP, etapas"},{"id":"C015","tema":"c_ld","tipo":"caso","q":"Una persona invierte en instrumentos financieros el efectivo que obtuvo del contrabando de armas. ¿En qué etapa del lavado está esta operación?","a":"Colocación","o":["Integración","Colocación","Estratificación","Diversificación"],"x":"La inversión en instrumentos financieros es uno de los dos ejemplos de colocación del VSPP. No es integración, porque los fondos apenas entran al sistema; todavía no aparecen como legítimos.","ref":"VSPP, etapas"},{"id":"C016","tema":"c_ld","tipo":"caso","q":"Mariana ya depositó en el banco el dinero de un fraude y ahora lo transfiere por varias cuentas para dificultar su rastreo. ¿En qué etapa está?","a":"Estratificación","o":["Ocultamiento","Integración","Estratificación","Colocación"],"x":"Las transferencias bancarias que cambian la forma del dinero y dificultan su rastreo son estratificación. La colocación ya ocurrió con el depósito.","ref":"VSPP, etapas"},{"id":"C017","tema":"c_ld","tipo":"caso","q":"Con fondos de trata de personas que ya movió entre varias cuentas, Julián compra un departamento. ¿En qué etapa del lavado está la compra?","a":"Estratificación","o":["Estratificación","Colocación","Integración","Simulación"],"x":"El VSPP pone la compra de bienes raíces como ejemplo de estratificación. Es tentador marcar integración, pero la integración sería la venta posterior del bien.","ref":"VSPP, etapas"},{"id":"C018","tema":"c_ld","tipo":"caso","q":"Una organización compra un yate con dinero de piratería que ya pasó por varias transferencias. ¿En qué etapa del lavado está la compra del yate?","a":"Estratificación","o":["Estratificación","Colocación","Ocultamiento","Integración"],"x":"Comprar bienes de lujo es ejemplo de estratificación. El VSPP ubica la venta de ese yate en la integración, no su compra.","ref":"VSPP, etapas"},{"id":"C019","tema":"c_ld","tipo":"caso","q":"Meses después, la misma organización vende el yate que había comprado con fondos ilícitos ya transferidos y recibe el pago como un ingreso legítimo. ¿En qué etapa está la venta?","a":"Integración","o":["Encubrimiento","Integración","Colocación","Estratificación"],"x":"La venta de un yate que se adquirió en la estratificación es el ejemplo de integración del VSPP: los fondos regresan a la economía como legítimos. La compra fue estratificación.","ref":"VSPP, etapas"},{"id":"C020","tema":"c_ld","tipo":"caso","q":"Un grupo opera una red de empresas de fachada cuyos ingresos, provenientes de evasión fiscal, aparecen como ventas legítimas que se reutilizan en nuevos negocios. ¿En qué etapa está?","a":"Integración","o":["Integración","Estratificación","Colocación","Diversificación"],"x":"La red de empresas de fachada es ejemplo de integración: los fondos aparecen como legítimos y pueden reutilizarse. No es colocación porque no se trata de introducir el dinero al sistema.","ref":"VSPP, etapas"},{"id":"C021","tema":"c_ld","tipo":"caso","q":"Con dinero de extorsión que ya transfirió entre cuentas, Óscar compra relojes y joyas de lujo. ¿En qué etapa del lavado está esta compra?","a":"Estratificación","o":["Simulación","Estratificación","Colocación","Integración"],"x":"La compra de bienes de lujo es ejemplo de estratificación en el VSPP. Sería integración si después vendiera esos bienes y presentara el pago como legítimo.","ref":"VSPP, etapas"},{"id":"C022","tema":"c_ld","tipo":"caso","q":"Un vendedor de mercancía pirata lleva al banco y deposita en efectivo, en su cuenta, los ingresos que obtuvo de la piratería. ¿En qué etapa del lavado está?","a":"Colocación","o":["Colocación","Estratificación","Ocultamiento","Integración"],"x":"Depositar en efectivo es introducir las ganancias ilícitas en el sistema financiero: es el ejemplo de colocación del VSPP. Todavía no hay transacciones para cambiar su forma (estratificación) ni fondos que ya aparezcan como legítimos (integración).","ref":"VSPP, etapas"},{"id":"C023","tema":"c_ld","tipo":"caso","q":"Fernando envía desde su cuenta en México a una cuenta en el extranjero los fondos de fraude que depositó la semana anterior. ¿En qué etapa del lavado está el envío?","a":"Estratificación","o":["Estratificación","Encubrimiento","Integración","Colocación"],"x":"Una transferencia bancaria posterior al depósito es estratificación: el dinero pasa por transacciones que cambian su forma y dificultan su rastreo.","ref":"VSPP, etapas"},{"id":"C024","tema":"c_ld","tipo":"caso","q":"Una persona vende el inmueble que compró con fondos de fraude previamente transferidos y presenta el pago recibido como ingreso legítimo. ¿En qué etapa está la venta?","a":"Integración","o":["Diversificación","Colocación","Integración","Estratificación"],"x":"La venta del bien adquirido en la estratificación reinserta los fondos en la economía como legítimos: integración. La compra del inmueble fue estratificación.","ref":"VSPP, etapas"},{"id":"C025","tema":"c_ld","tipo":"caso","q":"Un lavador deposita en efectivo, en varias sucursales bancarias, el dinero de la venta de estupefacientes. ¿En qué etapa del lavado está?","a":"Colocación","o":["Integración","Estratificación","Colocación","Diversificación"],"x":"Son depósitos bancarios en efectivo: el ejemplo de colocación del VSPP. Que se hagan en varias sucursales no los convierte en transferencias.","ref":"VSPP, etapas"},{"id":"C026","tema":"c_ld","tipo":"caso","q":"Bruno obtiene dinero del contrabando de armas y busca que parezca fruto de actividades legítimas y circule sin problema en el sistema financiero. Según los conceptos de esta sesión, ¿qué describe el caso?","a":"Lavado de dinero","o":["Desvío de fondos públicos","Corrupción a gran escala","Financiamiento al terrorismo","Lavado de dinero"],"x":"Encubrir el origen ilícito para que los fondos aparezcan legítimos y circulen en el sistema financiero es el concepto de lavado del VSPP. El FT se define por el destino de los fondos, no por encubrir su origen.","ref":"VSPP, concepto"},{"id":"C027","tema":"c_ld","tipo":"caso","q":"Ana deposita en efectivo el dinero de un fraude, lo transfiere a varias cuentas, compra un yate y meses después lo vende como ingreso legítimo. ¿Qué secuencia de etapas describe el caso, operación por operación?","a":"Colocación, estratificación, estratificación e integración","o":["Estratificación, estratificación, integración e integración","Colocación, estratificación, integración e integración","Colocación, colocación, estratificación e integración","Colocación, estratificación, estratificación e integración"],"x":"Depósito en efectivo = colocación; transferencias = estratificación; compra del yate = estratificación; venta del yate = integración. El error más común es poner la compra del yate en integración.","ref":"VSPP, etapas"},{"id":"C028","tema":"c_ld","tipo":"caso","q":"Ramiro realizó estas cuatro operaciones con dinero de un fraude. ¿Cuál corresponde a la etapa de integración?","a":"Vender el yate y usar el pago como ingreso legítimo","o":["Vender el yate y usar el pago como ingreso legítimo","Transferir los fondos a cuentas de varios terceros","Depositar en efectivo el dinero en su cuenta bancaria","Comprar un yate con los fondos que ya transfirió"],"x":"La venta del yate adquirido en la estratificación es el ejemplo de integración del VSPP. Comprar el yate es estratificación, aunque se trate del mismo bien.","ref":"VSPP, etapas"},{"id":"C029","tema":"c_ld","tipo":"caso","q":"Con dinero de una extorsión, Irene realizó estas cuatro operaciones. ¿Cuál corresponde a la etapa de colocación?","a":"Invertir el efectivo en instrumentos financieros","o":["Transferir los fondos a una cuenta en el extranjero","Comprar una casa con los fondos ya transferidos","Operar una red de empresas de fachada con esos fondos","Invertir el efectivo en instrumentos financieros"],"x":"La inversión en instrumentos financieros es ejemplo de colocación: introduce las ganancias ilícitas al sistema. La transferencia y la compra de la casa son estratificación; las empresas de fachada, integración.","ref":"VSPP, etapas"},{"id":"C030","tema":"c_ld","tipo":"caso","q":"Un analista observa que un cliente usa a su red de empresas de fachada para pagar proveedores con fondos que ya aparecen como legítimos. ¿En qué etapa del lavado se ubica?","a":"Integración","o":["Estratificación","Simulación","Colocación","Integración"],"x":"En la integración los fondos ilegales se reinsertan en la economía, aparecen como legítimos y se reutilizan; la red de empresas de fachada es el ejemplo del VSPP.","ref":"VSPP, etapas"},{"id":"C031","tema":"c_ft","tipo":"memoria","q":"Completa el art. 139 Quáter del CPF: «al que por cualquier medio que fuere ya sea directa o indirectamente, ____ fondos económicos o recursos de cualquier naturaleza…»","a":"aporte o recaude","o":["administre o custodie","oculte o encubra","aporte o recaude","transfiera o invierta"],"x":"Los verbos del FT son «aporte o recaude». «Oculte o encubra» son verbos de la fracción II del art. 400 Bis (lavado), un distractor de otro artículo.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C032","tema":"c_ft","tipo":"memoria","q":"Según el art. 139 Quáter del CPF, el financiamiento al terrorismo recae sobre «fondos económicos o recursos de ____».","a":"cualquier naturaleza","o":["valor relevante","cualquier naturaleza","procedencia ilícita","origen desconocido"],"x":"El texto dice «recursos de cualquier naturaleza»; no exige que sean de procedencia ilícita, que es un elemento del lavado (art. 400 Bis).","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C033","tema":"c_ft","tipo":"memoria","q":"Según el art. 139 Quáter, el sujeto actúa «con conocimiento de que serán destinados para ____ actividades de individuos u organizaciones terroristas».","a":"financiar o apoyar","o":["financiar o apoyar","promover o difundir","ocultar o encubrir","planear o ejecutar"],"x":"La redacción es «financiar o apoyar actividades de individuos u organizaciones terroristas». «Ocultar o encubrir» corresponde al lavado.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C034","tema":"c_ft","tipo":"memoria","q":"Según el art. 139 Quáter, ¿dónde deben cometerse los delitos enlistados para cuya comisión se aportan o recaudan los fondos?","a":"En territorio nacional o en el extranjero","o":["En territorio nacional o en el extranjero","Sólo en el extranjero, contra un Estado extranjero","Sólo en territorio nacional","En territorio nacional o en aguas y espacio aéreo mexicanos"],"x":"El artículo dice «para la comisión, en territorio nacional o en el extranjero». No se limita a México ni sólo al extranjero.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C035","tema":"c_ft","tipo":"memoria","q":"Completa el art. 139 Quáter: los fondos son «para ser utilizados, o pretendan ser utilizados, directa o indirectamente, ____, para la comisión… de cualquiera de los delitos previstos».","a":"total o parcialmente","o":["en forma organizada","en su totalidad únicamente","de forma reiterada o habitual","total o parcialmente"],"x":"El texto dice «total o parcialmente»: basta que una parte de los fondos se destine a los delitos enlistados. «En su totalidad únicamente» convierte en absoluto lo que la norma no limita.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C036","tema":"c_ft","tipo":"memoria","q":"En la lista de la fracción I del art. 139 Quáter, ¿en qué artículo del CPF está previsto el sabotaje?","a":"Art. 140","o":["Art. 139 Ter","Art. 368 Quinquies","Art. 148 Bis","Art. 140"],"x":"El numeral 2) de la fracción I remite al sabotaje del art. 140. El 368 Quinquies es el robo (numeral 5) y el 148 Bis, terrorismo internacional (numeral 3).","ref":"Art. 139 Quáter, fracción I, numeral 2"},{"id":"C037","tema":"c_ft","tipo":"memoria","q":"Según la fracción I del art. 139 Quáter, ¿en qué artículos del CPF está previsto el terrorismo internacional?","a":"Arts. 148 Bis, 148 Ter y 148 Quáter","o":["Arts. 139 Quáter y 139 Quinquies","Arts. 139, 139 Bis y 139 Ter","Arts. 148 Bis, 148 Ter y 148 Quáter","Arts. 167, fracción IX, y 170"],"x":"El numeral 3) remite al terrorismo internacional de los arts. 148 Bis, 148 Ter y 148 Quáter. Los arts. 139, 139 Bis y 139 Ter son el terrorismo (numeral 1).","ref":"Art. 139 Quáter, fracción I, numeral 3"},{"id":"C038","tema":"c_ft","tipo":"memoria","q":"Además de los delitos del CPF, ¿qué ordenamiento enlista la fracción II del art. 139 Quáter?","a":"Ley de reservas mineras de uranio y torio, arts. 10 y 13","o":["Ley de reservas mineras de uranio y torio, arts. 140 y 170","Ley de reservas mineras de uranio y torio, arts. 148 Bis y 148 Ter","Ley Federal de Armas de Fuego y Explosivos, arts. 10 y 13","Ley de reservas mineras de uranio y torio, arts. 10 y 13"],"x":"La fracción II remite a la Ley que Declara Reservas Mineras los Yacimientos de Uranio, Torio y las demás Substancias de las cuales se obtengan Isótopos Hendibles…, arts. 10 y 13. Los arts. 140, 170 y 148 Bis son del CPF.","ref":"Art. 139 Quáter, fracción II"},{"id":"C039","tema":"c_ft","tipo":"cifra","q":"¿Cuántos numerales de delitos del Código Penal Federal enlista la fracción I del art. 139 Quáter?","a":"Cinco","o":["Seis","Tres","Cuatro","Cinco"],"x":"Son cinco: terrorismo, sabotaje, terrorismo internacional, ataques a las vías de comunicación y robo (art. 368 Quinquies). La ley de reservas mineras va aparte, en la fracción II.","ref":"Art. 139 Quáter, fracción I"},{"id":"C040","tema":"c_ft","tipo":"caso","q":"Andrés dona parte de su sueldo, de origen lícito, a una organización sabiendo que lo destinará a apoyar actividades terroristas. ¿Encuadra en el art. 139 Quáter?","a":"Sí; el artículo abarca aportar recursos de cualquier naturaleza con conocimiento de su destino","o":["No; la conducta encuadra sólo en el lavado, porque los fondos entran al sistema financiero","Sí; el artículo abarca aportar recursos de cualquier naturaleza con conocimiento de su destino","No; sólo hay financiamiento al terrorismo si los fondos son de procedencia ilícita","Sólo si el acto terrorista llega a cometerse en territorio nacional y con esos mismos fondos"],"x":"El 139 Quáter castiga aportar fondos «de cualquier naturaleza» con conocimiento de que se destinarán a terroristas; no exige origen ilícito. El origen ilícito es elemento del lavado (art. 400 Bis), no del FT.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C041","tema":"c_ft","tipo":"caso","q":"Una fundación ficticia recauda donativos sabiendo que se usarán para cometer un sabotaje en otro país. ¿Qué delito describe el caso?","a":"Financiamiento al terrorismo, art. 139 Quáter","o":["Financiamiento al terrorismo, art. 139 Quáter","Terrorismo, art. 139, primer párrafo","Encubrimiento de quien financia, art. 139 Quinquies","Operaciones con recursos de procedencia ilícita, art. 400 Bis"],"x":"Recaudar fondos con conocimiento de que se usarán para un sabotaje (art. 140, numeral 2 de la lista) es FT, aunque el sabotaje se cometa en el extranjero.","ref":"Art. 139 Quáter, primer párrafo y fracción I"},{"id":"C042","tema":"c_ft","tipo":"caso","q":"Carla, a través de un intermediario, aporta una parte de los fondos que se usarán para un ataque a las vías de comunicación del art. 167, fracción IX, del CPF, y lo sabe. ¿Encuadra en el art. 139 Quáter?","a":"Sí; el artículo abarca aportar directa o indirectamente y para usarse total o parcialmente","o":["Sólo si el intermediario también sabe que el destino de los fondos es terrorista","Sí; el artículo abarca aportar directa o indirectamente y para usarse total o parcialmente","No; los ataques a las vías de comunicación no están en la lista del art. 139 Quáter","No; la ley exige que la persona aporte directamente y por la totalidad de los fondos"],"x":"El 139 Quáter dice «directa o indirectamente» y «total o parcialmente», y los ataques a las vías de comunicación (arts. 167, fr. IX, y 170) son el numeral 4) de la lista.","ref":"Art. 139 Quáter, primer párrafo y fracción I, numeral 4"},{"id":"C043","tema":"c_ft","tipo":"caso","q":"Pedro entrega una camioneta, no dinero, a una organización terrorista, sabiendo que la usará en sus actividades. Según el art. 139 Quáter, ¿por qué puede ser financiamiento al terrorismo?","a":"Porque abarca fondos económicos o recursos de cualquier naturaleza","o":["Porque todo apoyo material a terroristas se castiga como lavado de dinero","Porque los vehículos se consideran armas en el art. 139, fracción I","Porque abarca cualquier bien inmueble de acceso público usado por terroristas","Porque abarca fondos económicos o recursos de cualquier naturaleza"],"x":"La conducta recae en «fondos económicos o recursos de cualquier naturaleza», no sólo en dinero. Un vehículo es un recurso.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C044","tema":"c_ft","tipo":"caso","q":"Lorena aporta fondos a una asociación sin saber, ni tener cómo saber, que se usarán para financiar a una organización terrorista. ¿Qué elemento del art. 139 Quáter falta?","a":"El conocimiento de que serán destinados a financiar o apoyar terroristas","o":["Que los fondos provengan de una actividad ilícita previa y no se acredite su origen","Que el aporte se haga directamente y por la totalidad de los fondos","El conocimiento de que serán destinados a financiar o apoyar terroristas","Que el acto financiado se cometa dentro del territorio nacional"],"x":"El FT exige actuar «con conocimiento de que serán destinados» a esos fines. El origen ilícito, el territorio nacional y el aporte directo y total no son requisitos del 139 Quáter.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C045","tema":"c_ft","tipo":"caso","q":"Gilberto recauda fondos sabiendo que se usarán para cometer el robo previsto en el art. 368 Quinquies del CPF. Según el art. 139 Quáter, ¿qué califica su conducta?","a":"Ese robo está en la lista de la fracción I del art. 139 Quáter","o":["Ese robo está en la fracción II, con la ley de reservas mineras","Ese robo está en la lista de la fracción I del art. 139 Quáter","Ese robo se sanciona sólo como lavado de dinero, art. 400 Bis","Ese robo se sanciona sólo como encubrimiento, art. 139 Quinquies"],"x":"El robo del art. 368 Quinquies es el numeral 5) de la fracción I; financiar su comisión es FT. La fracción II sólo contiene la ley de reservas mineras (arts. 10 y 13).","ref":"Art. 139 Quáter, fracción I, numeral 5"},{"id":"C046","tema":"c_corr","tipo":"memoria","q":"Según la Guía Anticorrupción de la CNBV, Transparencia Internacional define la corrupción como «el abuso del ____ para beneficio propio».","a":"poder","o":["patrimonio","poder","cargo","servicio público"],"x":"La definición de TI es «el abuso del poder para beneficio propio». «Cargo» es tentador, pero no es la palabra de la definición.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C047","tema":"c_corr","tipo":"memoria","q":"Según Transparencia Internacional, citada en la Guía Anticorrupción, ¿con qué criterio se clasifica la corrupción en sus tres tipos?","a":"Según la cantidad de fondos perdidos y el sector en el que se cometa","o":["Según el nivel jerárquico del servidor público y el monto del soborno","Según el delito del Título Décimo del CPF y la pena aplicable","Según la cantidad de fondos perdidos y el sector en el que se cometa","Según la cantidad de personas involucradas y el país en el que se cometa"],"x":"La Guía dice que la corrupción «puede clasificarse… según la cantidad de fondos perdidos y el sector en el que se cometa». El nivel jerárquico aparece en la descripción de los tipos, no como criterio.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C048","tema":"c_corr","tipo":"trampa","q":"¿Cuál de estos NO es uno de los tres tipos de corrupción de Transparencia Internacional que recoge la Guía Anticorrupción?","a":"Corrupción empresarial","o":["Corrupción política","Corrupción empresarial","Actos de corrupción menores","Corrupción a gran escala"],"x":"Los tres tipos son corrupción a gran escala, actos de corrupción menores y corrupción política. «Corrupción empresarial» no está en la clasificación.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C049","tema":"c_corr","tipo":"memoria","q":"¿Qué tipo de corrupción consiste en actos cometidos en los niveles más altos del gobierno, que involucran la distorsión de políticas o de funciones centrales del Estado?","a":"Corrupción a gran escala","o":["Desvío de fondos públicos","Corrupción política","Corrupción a gran escala","Actos de corrupción menores"],"x":"La corrupción a gran escala se da en los niveles más altos del gobierno y permite a las PEP beneficiarse a expensas del bien común. La política se define por manipular políticas, instituciones y normas para conservar el poder.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C050","tema":"c_corr","tipo":"memoria","q":"¿Qué tipo de corrupción es «la manipulación de políticas, instituciones y normas de procedimiento en la asignación de recursos y financiamiento» por los responsables de las decisiones políticas?","a":"Corrupción política","o":["Corrupción a gran escala","Corrupción política","Actos de corrupción menores","Cohecho"],"x":"Es la corrupción política: quienes deciden políticamente abusan de su posición para conservar su poder, estatus y patrimonio. La de gran escala se define por el nivel más alto del gobierno y la distorsión de funciones centrales del Estado.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C051","tema":"c_corr","tipo":"memoria","q":"Según el glosario de Transparencia Internacional citado en la Guía, ¿qué término se define como ofrecer, prometer, dar, aceptar o solicitar una ventaja como un incentivo para una acción ilegal, poco ética o una falta de confianza?","a":"Cohecho","o":["Cohecho","Desvío de fondos públicos","Peculado","Corrupción política"],"x":"Es la definición de cohecho del glosario de TI; los incentivos pueden ser obsequios, préstamos, honorarios, recompensas u otras ventajas. El desvío de fondos públicos es apropiarse de recursos desde un cargo.","ref":"Guía Anticorrupción, I.1.3, nota 1"},{"id":"C052","tema":"c_corr","tipo":"caso","q":"Un empleado de bajo rango de un hospital público exige dinero a un paciente para darle una cita. Según la clasificación de Transparencia Internacional, ¿qué tipo de corrupción es?","a":"Actos de corrupción menores","o":["Corrupción a gran escala","Corrupción política","Corrupción institucional","Actos de corrupción menores"],"x":"Los actos menores son el abuso cotidiano de poder por PEP de bajo y mediano rango al tratar con ciudadanos que buscan bienes y servicios básicos, como en hospitales.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C053","tema":"c_corr","tipo":"caso","q":"Un servidor de mediano rango de una escuela pública cobra una cuota indebida a los padres para inscribir a sus hijos. ¿Qué tipo de corrupción describe el caso?","a":"Actos de corrupción menores","o":["Corrupción a gran escala","Actos de corrupción menores","Corrupción política","Corrupción administrativa"],"x":"Abuso cotidiano de poder de un servidor de bajo o mediano rango frente a ciudadanos que buscan un servicio básico (escuelas): actos de corrupción menores.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C054","tema":"c_corr","tipo":"caso","q":"Un alto funcionario del gobierno distorsiona una función central del Estado para beneficiarse a expensas del bien común. ¿Qué tipo de corrupción describe el caso?","a":"Corrupción a gran escala","o":["Corrupción política","Actos de corrupción menores","Corrupción a gran escala","Corrupción institucional"],"x":"Actos en los niveles más altos del gobierno que distorsionan funciones centrales del Estado en beneficio de las PEP: corrupción a gran escala.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C055","tema":"c_corr","tipo":"caso","q":"Un grupo de responsables de decisiones políticas manipula las normas de procedimiento para asignar financiamiento y así conservar su poder y su estatus. ¿Qué tipo de corrupción es?","a":"Corrupción política","o":["Corrupción política","Corrupción a gran escala","Actos de corrupción menores","Corrupción electoral"],"x":"Manipular políticas, instituciones y normas de procedimiento en la asignación de recursos para conservar poder, estatus y patrimonio es corrupción política.","ref":"Guía Anticorrupción, I.1.3"},{"id":"C056","tema":"c_corr","tipo":"caso","q":"El director de una empresa se apropia de recursos de la organización a su cargo para obtener beneficios privados. Según el glosario de TI citado en la Guía, ¿qué figura describe?","a":"Desvío de fondos públicos","o":["Corrupción política","Desvío de fondos públicos","Actos de corrupción menores","Cohecho"],"x":"El glosario de TI define el desvío de fondos públicos como cuando una persona que ocupa un cargo en una institución, organización o empresa se apropia con el fin de obtener beneficios privados. El cohecho requiere ofrecer o aceptar una ventaja como incentivo.","ref":"Guía Anticorrupción, I.1.3, nota 1"},{"id":"C057","tema":"c_corr","tipo":"caso","q":"Una empresa ofrece un préstamo a un inspector como incentivo para que omita una revisión. Según el glosario de TI citado en la Guía, ¿qué figura describe?","a":"Cohecho","o":["Corrupción política","Desvío de fondos públicos","Peculado","Cohecho"],"x":"Ofrecer una ventaja (aquí, un préstamo) como incentivo para una acción ilegal o poco ética es cohecho. El desvío de fondos públicos implica apropiarse de recursos desde un cargo.","ref":"Guía Anticorrupción, I.1.3, nota 1"},{"id":"C058","tema":"c_penas","tipo":"cifra","q":"¿Qué pena de prisión prevé el art. 400 Bis del CPF por operaciones con recursos de procedencia ilícita?","a":"De cinco a quince años","o":["De cinco a diez años","De quince a cuarenta años","De cinco a quince años","De uno a nueve años"],"x":"El 400 Bis impone de cinco a quince años de prisión. De quince a cuarenta es la pena del art. 139, que aplica al financiamiento al terrorismo.","ref":"Art. 400 Bis, primer párrafo"},{"id":"C059","tema":"c_penas","tipo":"cifra","q":"¿Qué multa prevé el art. 400 Bis del CPF por operaciones con recursos de procedencia ilícita?","a":"De mil a cinco mil días multa","o":["De cien a trescientos días multa","De mil a cinco mil veces el valor diario de la UMA","De cuatrocientas a mil doscientas veces la UMA","De mil a cinco mil días multa"],"x":"Son de mil a cinco mil días multa. Ojo con la unidad: el art. 139 (y por remisión el FT) usa veces el valor diario de la UMA.","ref":"Art. 400 Bis, primer párrafo"},{"id":"C060","tema":"c_penas","tipo":"cifra","q":"¿Qué pena de prisión corresponde al financiamiento al terrorismo del art. 139 Quáter?","a":"De quince a cuarenta años","o":["De uno a nueve años","De cinco a quince años","De quince a cuarenta años","De cinco a cuarenta años"],"x":"El 139 Quáter impone la misma pena del art. 139: de quince a cuarenta años de prisión. De cinco a quince es la del lavado (art. 400 Bis).","ref":"Arts. 139 Quáter y 139, primer párrafo"},{"id":"C061","tema":"c_penas","tipo":"cifra","q":"¿Qué multa corresponde al financiamiento al terrorismo, por remisión del art. 139 Quáter al art. 139?","a":"De 400 a 1,200 veces el valor diario de la UMA","o":["De 400 a 1,200 veces el salario mínimo general diario","De 400 a 1,200 veces el valor diario de la UMA","De 400 a 1,200 días multa","De 1,000 a 5,000 días multa"],"x":"Desde la reforma DOF 07-06-2024, el art. 139 fija multa de cuatrocientas a mil doscientas veces el valor diario de la UMA. Los distractores repiten la cifra 400 a 1,200 con otra unidad (días multa o salario mínimo); lo que cuenta es la unidad.","ref":"Arts. 139 Quáter y 139, primer párrafo"},{"id":"C062","tema":"c_penas","tipo":"cifra","q":"¿Qué pena prevé el art. 139 Quinquies del CPF?","a":"De uno a nueve años de prisión y de cien a trescientos días multa","o":["De uno a nueve años de prisión y de cien a trescientos días multa","De cinco a quince años de prisión y de doscientos a seiscientos días multa","De quince a cuarenta años de prisión y de 400 a 1,200 veces la UMA","De uno a nueve años de prisión y de cien a trescientas veces la UMA"],"x":"El 139 Quinquies: de uno a nueve años de prisión y de cien a trescientos días multa. La unidad es días multa, no veces la UMA.","ref":"Art. 139 Quinquies"},{"id":"C063","tema":"c_penas","tipo":"memoria","q":"¿Qué conducta sanciona el art. 139 Quinquies del CPF?","a":"Encubrir a una persona que haya participado en los delitos del art. 139 Quáter","o":["Amenazar con cometer el delito de terrorismo del párrafo primero del art. 139","Encubrir a una persona que haya participado en los delitos del art. 139 Quáter","Aportar o recaudar fondos sabiendo que se destinarán a apoyar a terroristas","Encubrir a un terrorista, teniendo conocimiento de sus actividades o de su identidad"],"x":"El 139 Quinquies castiga encubrir a quien participó en el financiamiento al terrorismo. Encubrir a un terrorista es el 139 Bis (misma pena), y amenazar es el 139 Ter.","ref":"Art. 139 Quinquies"},{"id":"C064","tema":"c_penas","tipo":"memoria","q":"Completa el art. 139 Quáter: «Se impondrá la misma pena señalada en el artículo ____ de este Código…»","a":"139","o":["400 Bis","139","139 Bis","139 Ter"],"x":"El FT remite a la pena del art. 139 (terrorismo). El 139 Bis y el 139 Ter tienen penas menores, y el 400 Bis es la pena del lavado.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C065","tema":"c_penas","tipo":"memoria","q":"Según el art. 139 Quáter, la pena del financiamiento al terrorismo se impone…","a":"Sin perjuicio de las penas que corresponden por los demás delitos que resulten","o":["Reducida a la mitad cuando el acto terrorista no llega a cometerse","Sólo si no se configura otro delito con una pena de prisión mayor","En sustitución de las penas que correspondan por los demás delitos que resulten","Sin perjuicio de las penas que corresponden por los demás delitos que resulten"],"x":"El texto dice «sin perjuicio de las penas que corresponden por los demás delitos que resulten»: se suman, no se sustituyen.","ref":"Art. 139 Quáter, primer párrafo"},{"id":"C066","tema":"c_penas","tipo":"memoria","q":"¿Cuál de estos verbos aparece en la fracción I del art. 400 Bis del CPF?","a":"Custodie","o":["Simule","Fraccione","Estructure","Custodie"],"x":"La fracción I enumera: adquiera, enajene, administre, custodie, posea, cambie, convierta, deposite, retire, dé o reciba, invierta, traspase, transporte o transfiera.","ref":"Art. 400 Bis, fracción I"},{"id":"C067","tema":"c_penas","tipo":"memoria","q":"Ocultar o encubrir la titularidad de bienes, sabiendo que proceden de una actividad ilícita, es una conducta prevista en…","a":"Art. 400 Bis, fracción II","o":["Art. 400 Bis, fracción I","Art. 400 Bis 1, primer párrafo","Art. 139 Quinquies","Art. 400 Bis, fracción II"],"x":"La fracción II castiga ocultar o encubrir la naturaleza, origen, ubicación, destino, movimiento, propiedad o titularidad de recursos. La fracción I se refiere a manejar los recursos (adquirir, depositar, transferir…).","ref":"Art. 400 Bis, fracción II"},{"id":"C068","tema":"c_penas","tipo":"memoria","q":"Según la fracción I del art. 400 Bis, ¿qué ámbito de las operaciones con recursos abarca la conducta?","a":"Dentro del territorio nacional, de éste hacia el extranjero o a la inversa","o":["Sólo dentro del territorio nacional, sin importar el destino final","Dentro del territorio nacional y hacia el extranjero, pero no a la inversa","Dentro del territorio nacional, de éste hacia el extranjero o a la inversa","Sólo del extranjero hacia el territorio nacional y dentro de él"],"x":"La fracción I dice «dentro del territorio nacional, de éste hacia el extranjero o a la inversa»: abarca las tres direcciones.","ref":"Art. 400 Bis, fracción I"},{"id":"C069","tema":"c_penas","tipo":"memoria","q":"Completa el art. 400 Bis: son producto de una actividad ilícita los recursos, derechos o bienes de cualquier naturaleza «cuando existan ____ de que provienen directa o indirectamente, o representan las ganancias derivadas de la comisión de algún delito».","a":"indicios fundados o certeza","o":["pruebas plenas y sentencia firme","indicios suficientes y certeza plena","indicios fundados o certeza","sospechas razonables o presunciones"],"x":"El texto dice «indicios fundados o certeza». Basta cualquiera de los dos; no exige sentencia firme ni que concurran ambos.","ref":"Art. 400 Bis, segundo párrafo"},{"id":"C070","tema":"c_penas","tipo":"memoria","q":"Al que, por sí o por ____, realice cualquiera de las conductas del art. 400 Bis se le impondrá de cinco a quince años de prisión.","a":"interpósita persona","o":["terceros obligados","apoderado legal","persona moral","interpósita persona"],"x":"El texto dice «por sí o por interpósita persona»: también responde quien actúa a través de otro.","ref":"Art. 400 Bis, primer párrafo"},{"id":"C071","tema":"c_penas","tipo":"memoria","q":"¿Cuánto aumentan las penas del lavado cuando quien realiza la conducta es consejero, administrador, funcionario, empleado, apoderado o prestador de servicios de una persona sujeta al régimen de prevención?","a":"Desde un tercio hasta en una mitad","o":["Se duplican","Desde un tercio hasta en una mitad","Hasta en una mitad","Desde una mitad hasta en dos terceras partes"],"x":"El primer párrafo del 400 Bis 1 dice «desde un tercio hasta en una mitad». «Hasta en una mitad» es el agravante por usar menores o incapaces, y «se duplican», el de servidores públicos.","ref":"Art. 400 Bis 1, primer párrafo"},{"id":"C072","tema":"c_penas","tipo":"cifra","q":"Según el art. 400 Bis 1, ¿dentro de cuánto tiempo después de haberse separado del cargo en un sujeto al régimen de prevención aún aplica el agravante?","a":"Dos años","o":["Un año","Dos años","Tres años","Cinco años"],"x":"El agravante alcanza a quien realice la conducta «dentro de los dos años siguientes de haberse separado» del cargo. El mismo plazo aplica a los ex servidores públicos.","ref":"Art. 400 Bis 1, primer párrafo"},{"id":"C073","tema":"c_penas","tipo":"memoria","q":"Según el art. 400 Bis 1, ¿a partir de cuándo comienza a correr la inhabilitación?","a":"A partir de que se haya cumplido la pena de prisión","o":["A partir de que se separe del cargo en el sujeto al régimen de prevención","A partir de la fecha de la denuncia de la SHCP","A partir de que se haya cumplido la pena de prisión","A partir de que la sentencia condenatoria quede firme"],"x":"El texto dice: «La inhabilitación comenzará a correr a partir de que se haya cumplido la pena de prisión». No corre desde la sentencia ni desde la separación del cargo.","ref":"Art. 400 Bis 1, segundo párrafo"},{"id":"C074","tema":"c_penas","tipo":"trampa","q":"¿Cuál de estas personas NO aparece en el primer párrafo del art. 400 Bis 1 como sujeto del agravante de un tercio hasta una mitad?","a":"Accionista","o":["Consejero","Prestador de servicios","Apoderado","Accionista"],"x":"El texto enumera consejero, administrador, funcionario, empleado, apoderado o prestador de servicios del sujeto al régimen de prevención. El accionista no está en la lista.","ref":"Art. 400 Bis 1, primer párrafo"},{"id":"C075","tema":"c_penas","tipo":"caso","q":"Laura, empleada de una entidad sujeta al régimen de prevención de operaciones con recursos de procedencia ilícita, deposita recursos sabiendo que son producto de un fraude. ¿Qué pasa con su pena?","a":"Aumenta desde un tercio hasta en una mitad","o":["Aumenta desde un tercio hasta en una mitad","Se aplica la pena base sin aumento","Se duplica, por ser personal de la entidad","Aumenta hasta en una mitad, sin mínimo"],"x":"Al empleado de un sujeto al régimen de prevención se le aumenta desde un tercio hasta en una mitad (y se le inhabilita). La duplicación es para servidores públicos encargados de prevenir, investigar o juzgar delitos.","ref":"Art. 400 Bis 1, primer párrafo"},{"id":"C076","tema":"c_penas","tipo":"caso","q":"Diego se separó hace 18 meses de su cargo de apoderado en un sujeto al régimen de prevención y ahora transfiere recursos sabiendo que son producto de una actividad ilícita. ¿Aplica el agravante del art. 400 Bis 1?","a":"Sí, porque actúa dentro de los dos años siguientes a su separación","o":["No, porque ya no tiene el cargo cuando realiza la conducta","No, porque el plazo que prevé la norma es de un año","Sí, pero sólo si lo hace con recursos de su exempleador","Sí, porque actúa dentro de los dos años siguientes a su separación"],"x":"El agravante alcanza a quien realice la conducta «dentro de los dos años siguientes de haberse separado» del cargo; 18 meses están dentro de ese plazo.","ref":"Art. 400 Bis 1, primer párrafo"},{"id":"C077","tema":"c_penas","tipo":"caso","q":"Un exconsejero de un sujeto al régimen de prevención, separado del cargo hace tres años, adquiere bienes sabiendo que son producto de una actividad ilícita. ¿Qué pena le corresponde?","a":"La del art. 400 Bis, sin el agravante del cargo","o":["La del 400 Bis duplicada, por haber sido consejero","La del 400 Bis aumentada de un tercio a una mitad","La del art. 400 Bis, sin el agravante del cargo","La del 400 Bis aumentada hasta en una mitad"],"x":"El agravante sólo cubre los dos años siguientes a la separación. A los tres años le corresponde la pena base: de cinco a quince años y de mil a cinco mil días multa.","ref":"Arts. 400 Bis y 400 Bis 1, primer párrafo"},{"id":"C078","tema":"c_penas","tipo":"caso","q":"Un agente del Ministerio Público encargado de investigar delitos oculta el origen de bienes sabiendo que provienen de una actividad ilícita. ¿Qué establece el art. 400 Bis 1?","a":"Las penas se duplican y hay inhabilitación","o":["Las penas aumentan desde un tercio hasta una mitad","Las penas aumentan hasta en una mitad, sin inhabilitación","Las penas se duplican y hay inhabilitación","Las penas se triplican y hay destitución inmediata"],"x":"Si lava un servidor público encargado de prevenir, detectar, denunciar, investigar o juzgar delitos, las penas «se duplicarán», más inhabilitación hasta por un tiempo igual al de la prisión.","ref":"Art. 400 Bis 1, tercer párrafo"},{"id":"C079","tema":"c_penas","tipo":"caso","q":"Un exjuez penal, un año después de terminar su encargo, invierte recursos sabiendo que son producto de una actividad ilícita. ¿Qué le aplica?","a":"Se duplican las penas, por actuar dentro de los dos años","o":["Aumento hasta en una mitad, por haber sido juez","Aumento de un tercio hasta en una mitad de las penas","La pena base, porque ya no es servidor público","Se duplican las penas, por actuar dentro de los dos años"],"x":"El tercer párrafo del 400 Bis 1 alcanza a los ex servidores encargados de juzgar delitos que cometan la conducta en los dos años posteriores a su terminación: las penas se duplican.","ref":"Art. 400 Bis 1, tercer párrafo"},{"id":"C080","tema":"c_penas","tipo":"caso","q":"Raúl utiliza a su sobrino de 16 años para depositar en efectivo recursos que sabe producto de una actividad ilícita. ¿Qué agravante prevé el art. 400 Bis 1?","a":"Las penas aumentan hasta en una mitad","o":["Las penas se duplican por usar a un menor","Las penas aumentan desde un tercio hasta en una mitad","Las penas aumentan hasta en un tercio","Las penas aumentan hasta en una mitad"],"x":"Usar a menores de dieciocho años (o a personas sin capacidad de comprender el hecho o de resistirlo) aumenta las penas «hasta en una mitad». El rango de un tercio a una mitad es para el personal de sujetos al régimen de prevención.","ref":"Art. 400 Bis 1, cuarto párrafo"},{"id":"C081","tema":"c_penas","tipo":"caso","q":"Un empleado de un sujeto al régimen de prevención es condenado por lavado a seis años de prisión. ¿Qué inhabilitación le puede imponer el art. 400 Bis 1?","a":"Hasta seis años, contados desde que cumpla la prisión","o":["Hasta tres años, contados desde que cumpla la prisión","Hasta seis años, contados desde que cumpla la prisión","Hasta doce años, contados desde la sentencia","Seis años exactos, contados desde la sentencia"],"x":"La inhabilitación es «hasta por un tiempo igual al de la pena de prisión impuesta» y corre a partir de que se haya cumplido la prisión. Con seis años de prisión, el máximo es de seis.","ref":"Art. 400 Bis 1, segundo párrafo"},{"id":"C082","tema":"c_penas","tipo":"caso","q":"Mario ya era dueño de un inmueble que sabe comprado con el producto de un delito. Ahora lo registra a nombre de otra persona para ocultar quién es su verdadero propietario. ¿Qué fracción del art. 400 Bis describe este acto de registro?","a":"Fracción II: ocultar la propiedad o titularidad","o":["Fracción I: adquirir o administrar los recursos","Fracción II del art. 139 Quáter: ocultar bienes","Art. 400 Bis 1: agravante por interpósita persona","Fracción II: ocultar la propiedad o titularidad"],"x":"Ocultar o encubrir la propiedad o titularidad de bienes con conocimiento de su origen ilícito es la fracción II del 400 Bis. El 400 Bis 1 no contiene un agravante por interpósita persona.","ref":"Art. 400 Bis, fracción II"},{"id":"C083","tema":"c_penas","tipo":"caso","q":"Sergio transporta del extranjero hacia México dinero en efectivo, sabiendo que es producto de una actividad ilícita. ¿Encuadra en la fracción I del art. 400 Bis?","a":"Sí; abarca transportar de México al extranjero o a la inversa","o":["No; la fracción I sólo abarca operaciones dentro de México","Sólo si después deposita el dinero en el sistema financiero","No; transportar no es una conducta de la fracción I","Sí; abarca transportar de México al extranjero o a la inversa"],"x":"La fracción I incluye transportar recursos «dentro del territorio nacional, de éste hacia el extranjero o a la inversa». Traerlo del extranjero es la dirección «a la inversa».","ref":"Art. 400 Bis, fracción I"},{"id":"C084","tema":"c_penas","tipo":"caso","q":"Elena pide a una amiga que compre a nombre propio un automóvil con dinero que Elena sabe producto de un fraude. Según el art. 400 Bis, ¿puede responder Elena?","a":"Sí; el tipo comprende actuar por sí o por interpósita persona","o":["Sí; el tipo comprende actuar por sí o por interpósita persona","Sólo si la amiga sabía el origen ilícito del dinero","Sólo si el bien adquirido es un inmueble o de lujo","No; sólo responde la amiga, que realizó la compra"],"x":"El 400 Bis castiga a quien «por sí o por interpósita persona» realice las conductas. Elena actúa a través de su amiga.","ref":"Art. 400 Bis, primer párrafo"},{"id":"C085","tema":"c_penas","tipo":"caso","q":"En una investigación hay indicios fundados de que los recursos de una cuenta provienen de la comisión de un delito, y su titular no puede acreditar su legítima procedencia. Para el art. 400 Bis, ¿cómo se consideran esos recursos?","a":"Producto de una actividad ilícita","o":["Producto de una actividad ilícita","Recursos de procedencia dudosa, sin efecto penal","Producto de una actividad ilícita sólo si hay certeza","Recursos de origen lícito hasta que haya sentencia"],"x":"Para el art. 400 Bis basta con «indicios fundados o certeza» de que provienen de un delito, siempre que no pueda acreditarse su legítima procedencia. No exige certeza ni sentencia.","ref":"Art. 400 Bis, segundo párrafo"},{"id":"C086","tema":"c_penas","tipo":"caso","q":"Se investiga un posible lavado en el que se usaron los servicios de un banco. Según el art. 400 Bis, ¿qué facultad tiene el Ministerio Público?","a":"Está en todo momento facultado para investigar","o":["Puede investigar sólo dentro de los dos años","Está en todo momento facultado para investigar","Sólo puede investigar si el banco lo solicita","Sólo investiga tras una sentencia del juez penal"],"x":"Cuando se utilizan servicios de instituciones del sistema financiero, «el Ministerio Público estará en todo momento facultado para investigarlas». El plazo de dos años es del 400 Bis 1 y no tiene que ver con esto.","ref":"Art. 400 Bis, tercer párrafo"},{"id":"C087","tema":"c_penas","tipo":"caso","q":"El Ministerio Público investigó una conducta del art. 400 Bis en la que se usaron servicios del sistema financiero y quiere ejercer la acción penal. ¿Qué requiere?","a":"La denuncia de la SHCP, que tiene el carácter de víctima u ofendida","o":["La denuncia de la SHCP, que actúa sólo como coadyuvante del Ministerio Público","Ningún requisito previo, porque está facultado en todo momento","La querella de la institución financiera, que tiene el carácter de víctima","La denuncia de la SHCP, que tiene el carácter de víctima u ofendida"],"x":"Para ejercer la acción penal se requiere la denuncia de la SHCP, «quien tendrá el carácter de víctima u ofendida» (párrafo reformado DOF 16-07-2025). Estar facultado para investigar no elimina ese requisito.","ref":"Art. 400 Bis, tercer párrafo"},{"id":"C088","tema":"c_penas","tipo":"caso","q":"Tomás esconde en su casa a una persona que participó en un financiamiento al terrorismo para evitar que la detengan. ¿Qué pena prevé el CPF para Tomás?","a":"De uno a nueve años y de cien a trescientos días multa","o":["De cinco a quince años y de mil a cinco mil días multa","De quince a cuarenta años y de 400 a 1,200 veces la UMA","De uno a nueve años y de cien a trescientos días multa","De cinco a diez años y de cien a trescientos días multa"],"x":"Encubrir a quien participó en los delitos del 139 Quáter es el art. 139 Quinquies: de uno a nueve años de prisión y de cien a trescientos días multa. Tomás no financió; encubrió.","ref":"Art. 139 Quinquies"},{"id":"C089","tema":"c_penas","tipo":"caso","q":"Un juez condena a Ana por aportar fondos sabiendo que se destinarían a una organización terrorista. ¿Dentro de qué rango debe fijar la multa?","a":"De 400 a 1,200 veces el valor diario de la UMA","o":["De 100 a 300 días multa","De 400 a 1,200 días multa","De 1,000 a 5,000 días multa","De 400 a 1,200 veces el valor diario de la UMA"],"x":"El FT lleva la pena del art. 139: multa de cuatrocientas a mil doscientas veces el valor diario de la UMA. Mil a cinco mil días multa es la del lavado.","ref":"Arts. 139 Quáter y 139, primer párrafo"},{"id":"C090","tema":"c_penas","tipo":"caso","q":"Luis es condenado por operaciones con recursos de procedencia ilícita, sin agravantes, y Raúl por financiamiento al terrorismo. ¿Cuál es la prisión máxima de cada uno?","a":"Luis, quince años; Raúl, cuarenta años","o":["Ambos, cuarenta años de prisión","Luis, quince años; Raúl, nueve años","Luis, cuarenta años; Raúl, quince años","Luis, quince años; Raúl, cuarenta años"],"x":"El 400 Bis llega a quince años; el 139 Quáter remite al 139, que llega a cuarenta. Nueve años es el máximo del encubrimiento del 139 Quinquies.","ref":"Arts. 400 Bis, 139 Quáter y 139"}],"sitio":{"nombre":"Módulo 1","raiz":"../","actual":"m1-s1-conceptos","paginas":[{"n":"1","carpeta":"m1-s1-conceptos","pregunta":"Conceptos básicos","estado":"integrada"},{"n":"2","carpeta":"m1-s2-organismos","pregunta":"Organismos y GAFI","estado":"integrada"},{"n":"3","carpeta":"m1-s3-recomendaciones","pregunta":"Las 40 Recomendaciones","estado":"integrada"},{"n":"4","carpeta":"m1-s4-autoridades","pregunta":"Autoridades nacionales","estado":"integrada"}],"integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m1-simulacro/index.html"}}
</script>
