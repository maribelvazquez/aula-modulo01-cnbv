 Acción Financiera de Latinoamérica","Grupo de Acción Financiera Internacional","Comité de Supervisión Bancaria de Basilea","Grupo Wolfsberg"],"x":"Es la definición de la CNBV del GAFI, que coincide con el objetivo del párr. 2 de su Mandato. El GAFILAT es el distractor tentador, pero su definición habla de una organización intergubernamental regional «para prevenir y combatir», no de «fijar estándares».","ref":"CNBV, Organismos Internacionales; Mandato párr. 2 · S2"},{"id":"O009","tema":"m1s2","tipo":"trampa","q":"De las seis definiciones de la CNBV, ¿cuál nombra expresamente el financiamiento de la proliferación de armas de destrucción masiva?","a":"La del Grupo de Acción Financiera de Latinoamérica","o":["La del Grupo de Acción Financiera Internacional (GAFI)","La del Grupo de Acción Financiera de Latinoamérica","La del Grupo Egmont","La del Grupo Wolfsberg"],"x":"Trampa clásica: en la página de la CNBV, la definición del GAFILAT termina en «el financiamiento de la proliferación de armas de destrucción masiva», mientras que la del GAFI termina en «y otras amenazas». No se trata de cuál organismo combate la proliferación, sino de qué dice literalmente cada definición.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O010","tema":"m1s2","tipo":"memoria","q":"¿Cuál es la única definición de la CNBV, entre los seis organismos internacionales, que menciona la corrupción?","a":"La del Grupo Wolfsberg","o":["La del Grupo Egmont","La de la Organización de las Naciones Unidas","La del Grupo Wolfsberg","La del Comité de Supervisión Bancaria de Basilea"],"x":"Wolfsberg desarrolla estándares para la lucha contra «el financiamiento del terrorismo, la corrupción y el lavado de dinero en instituciones financieras». La ONU menciona la paz, la seguridad, los derechos humanos, el desarme y el terrorismo, pero no la corrupción.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O011","tema":"m1s2","tipo":"memoria","q":"Completa la definición de la CNBV de la ONU: «Es un foro para que sus miembros puedan tomar medidas sobre los problemas que enfrenta la humanidad, como ______, los derechos humanos, el desarme, el terrorismo y mucho más.»","a":"la paz y la seguridad","o":["la estabilidad financiera internacional","la regulación prudencial de los bancos","la integridad del sistema financiero","la paz y la seguridad"],"x":"La redacción exacta es «la paz y la seguridad». La regulación prudencial pertenece a la definición de Basilea y la «integridad del sistema financiero internacional» aparece en el objetivo del GAFI (Mandato párr. 2), no en la definición de la ONU.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O012","tema":"m1s2","tipo":"caso","q":"Una oficial de cumplimiento prepara una lámina y debe describir al GAFILAT con la palabra que, en la definición de la CNBV, lo distingue del GAFI. ¿Qué palabra debe usar?","a":"Regional","o":["Regional","Supervisor","Bancario","Consultivo"],"x":"La CNBV define al GAFILAT como «organización intergubernamental regional». Al GAFI lo define como «entidad intergubernamental», sin el adjetivo regional. Ninguna de las dos definiciones usa supervisor, bancario o consultivo.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O013","tema":"m1s2","tipo":"memoria","q":"Según el Mandato 2012-2020 (párr. 14), ¿qué organismos se mencionan expresamente como ejemplos de quienes trabajan en estrecha colaboración con el GAFI y participan como observadores?","a":"Las Naciones Unidas y el Grupo Egmont","o":["El Fondo Monetario Internacional y el Banco Mundial","Las Naciones Unidas y el Grupo Egmont","El Grupo Wolfsberg y el Comité de Basilea","Los organismos regionales tipo GAFI (FSRB)"],"x":"El párr. 14 nombra a las Naciones Unidas y al Grupo Egmont de UIF como observadores. El FMI y el Banco Mundial tienen su propio párrafo (13), con un «papel especial»; los FSRB son Miembros Asociados (párr. 9). Wolfsberg no aparece en el Mandato.","ref":"Mandato párr. 14 · S2"},{"id":"O014","tema":"m1s2","tipo":"caso","q":"Un país revisa si su UIF cumple la Nota Interpretativa de la R.29 en lo relativo al Grupo Egmont. Además de tomar en cuenta sus documentos, ¿qué debe hacer la UIF?","a":"Solicitar la membresía del Grupo Egmont","o":["Esperar a que el Pleno del GAFI la designe observadora","Obtener autorización del Comité de Basilea para intercambiar información","Solicitar la membresía del Grupo Egmont","Adherirse como asociada al Grupo Wolfsberg de bancos"],"x":"La NI R.29 párr. 13 termina: «La UIF debe solicitar la Membresía del Grupo Egmont». La condición de observador del GAFI es para organismos (Mandato párr. 15), no para una UIF nacional, y Basilea no autoriza intercambios entre UIF.","ref":"NI R.29 párr. 13 · S2"},{"id":"O015","tema":"m1s2","tipo":"memoria","q":"Según la NI R.29 párr. 13, ¿qué documentos del Grupo Egmont deben asegurar los países que la UIF tome en cuenta?","a":"Su Declaración de Objetivos y sus Principios para el Intercambio de Información entre UIF","o":["Su Declaración de Objetivos y sus Principios para el Intercambio de Información entre UIF","Su Mandato de Objetivos y su Metodología de Evaluación Mutua entre unidades de inteligencia financiera","Sus Estándares de Debida Diligencia y sus Principios de Banca Corresponsal elaborados con bancos privados","Su Declaración de Principios Prudenciales y su Guía de Supervisión Bancaria aplicable a las UIF"],"x":"Son dos: la Declaración de Objetivos y los Principios para el Intercambio de Información entre las UIF para casos de lavado de activos y FT. Según la nota, establecen una guía sobre el papel y funciones de las UIF y los mecanismos de intercambio. Mandato y Metodología son documentos del GAFI, no de Egmont.","ref":"NI R.29 párr. 13 · S2"},{"id":"O016","tema":"m1s2","tipo":"memoria","q":"¿Cuál de los siguientes organismos figura en el Anexo C (Observadores) del Mandato 2012-2020?","a":"Comité de Supervisión Bancaria de Basilea","o":["Grupo Wolfsberg","Comité de Supervisión Bancaria de Basilea","Grupo de Acción Financiera de Sudamérica (GAFISUD)","Los organismos regionales tipo GAFI (FSRB) en conjunto"],"x":"El Anexo C enlista al Comité de Supervisión Bancaria de Basilea (BCBS) como observador, junto con el Grupo Egmont y Naciones Unidas, entre otros. GAFISUD aparece en el Anexo B, como Miembro Asociado (FSRB), y Wolfsberg no figura en ningún anexo.","ref":"Mandato, Anexos B y C · S2"},{"id":"O017","tema":"m1s2","tipo":"caso","q":"En una sesión abierta del Pleno del GAFI participa un representante del Grupo Egmont. Según el Mandato 2012-2020, ¿con qué calidad participa Egmont en la labor del GAFI?","a":"Como observador","o":["Como observador","Como Miembro Asociado (FSRB)","Como organización Miembro listada en el Anexo A","Como invitado ad hoc de una jurisdicción no Miembro"],"x":"El párr. 14 dice que las Naciones Unidas y el Grupo Egmont «participan como observadores» en la labor del GAFI, y Egmont figura en el Anexo C. Los Miembros Asociados son organismos regionales tipo GAFI; las invitaciones ad hoc son para jurisdicciones no Miembro (párr. 23).","ref":"Mandato párr. 14 y Anexo C · S2"},{"id":"O018","tema":"m1s2","tipo":"memoria","q":"Según la CNBV, ¿qué es el Grupo de Acción Financiera Internacional?","a":"Una entidad intergubernamental","o":["Una organización intergubernamental regional","Un foro de unidades de inteligencia financiera","Una asociación de bancos internacionales","Una entidad intergubernamental"],"x":"La CNBV lo define como «una entidad intergubernamental», lo mismo que el párr. 1 del Mandato. «Organización intergubernamental regional» es la definición del GAFILAT; el foro de UIF es Egmont y la asociación de bancos es Wolfsberg.","ref":"CNBV, Organismos Internacionales; Mandato párr. 1 · S2"},{"id":"O019","tema":"m1s2","tipo":"trampa","q":"La CNBV usa la palabra «foro» en las definiciones de la ONU, del Comité de Basilea y del Grupo Egmont. ¿Quiénes integran el foro del Grupo Egmont según su definición?","a":"Las unidades de inteligencia financiera","o":["Los supervisores bancarios de cada país","Las unidades de inteligencia financiera","Los bancos privados asociados","Los Estados y sus ministerios"],"x":"El foro del Grupo Egmont es para que «las unidades de inteligencia financiera alrededor del mundo» mejoren sus vínculos de cooperación. La trampa es la palabra «foro»: la ONU es un foro «para que sus miembros» tomen medidas, y Basilea es un «foro de cooperación en materia de supervisión bancaria». Los bancos asociados corresponden a Wolfsberg.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O020","tema":"m1s2","tipo":"caso","q":"En un simulacro aparece este fragmento: «...para combatir el lavado de activos, el financiamiento del terrorismo y otras amenazas.» Un participante debe identificar, según la CNBV, de qué organismo es la definición. ¿Cuál es?","a":"Grupo de Acción Financiera Internacional","o":["Grupo de Acción Financiera Internacional","Grupo de Acción Financiera de Latinoamérica","Grupo Egmont","Organización de las Naciones Unidas"],"x":"La definición de la CNBV del GAFI termina en «y otras amenazas». La del GAFILAT termina con el financiamiento de la proliferación de armas de destrucción masiva y usa «prevenir y combatir». Ese final es la pista para no confundirlos.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O021","tema":"m1s2","tipo":"memoria","q":"Completa el párr. 1 del Mandato del GAFI 2012-2020: «El Grupo de Acción Financiera Internacional (GAFI) es una entidad intergubernamental establecida en 1989 por ______.»","a":"los Ministerios y sus jurisdicciones Miembro","o":["el Consejo de Seguridad de las Naciones Unidas","el Fondo Monetario Internacional y el Banco Mundial","los Ministerios y sus jurisdicciones Miembro","la OCDE, desde su sede en París"],"x":"Según el Mandato, el GAFI fue establecido «por los Ministerios y sus jurisdicciones Miembro». El texto histórico de la CNBV dice que lo creó el G-7: si la pregunta cita el Mandato, la respuesta es la del Mandato. La OCDE sólo presta el servicio de la Secretaría (párr. 46).","ref":"Mandato párr. 1 · S2"},{"id":"O022","tema":"m1s2","tipo":"cifra","q":"Según el Mandato 2012-2020, ¿en qué año se estableció el GAFI?","a":"1989","o":["1990","1989","2001","1996"],"x":"El párr. 1 del Mandato dice «establecida en 1989». 1990 es el año de las 40 Recomendaciones originales, 1996 el de su primera revisión y 2001 el de la ampliación del mandato al financiamiento del terrorismo.","ref":"Mandato párr. 1 · S2"},{"id":"O023","tema":"m1s2","tipo":"trampa","q":"Según el texto histórico de la CNBV «Qué es GAFI», ¿quién creó el GAFI en 1989?","a":"El Grupo de los Siete (G-7)","o":["El G-20","El Consejo de Seguridad de la ONU","La OCDE","El Grupo de los Siete (G-7)"],"x":"El texto histórico de la CNBV dice que el GAFI «fue creado en 1989 por el Grupo de los Siete G-7». Ojo: el Mandato 2012-2020 dice que fue establecido «por los Ministerios y sus jurisdicciones Miembro». Responde según la fuente que cite la pregunta. El G-20 aparece en el Mandato párr. 3 f) como parte de la comunidad internacional, no como creador.","ref":"CNBV, «Qué es GAFI» (histórico) · S2"},{"id":"O024","tema":"m1s2","tipo":"memoria","q":"Completa el objetivo del GAFI según el párr. 2 del Mandato: «fijar estándares y promover la efectiva implementación de medidas legales, regulatorias y operativas para combatir el lavado de activos, el financiamiento del terrorismo y otras amenazas relacionadas con ______.»","a":"la integridad del sistema financiero internacional","o":["la integridad del sistema financiero internacional","la paz y la seguridad de la comunidad internacional","la estabilidad y el desarrollo financiero y económico","la proliferación de armas de destrucción masiva"],"x":"La redacción exacta es «la integridad del sistema financiero internacional». La «estabilidad y el desarrollo financiero y económico» es el mandato del FMI y el Banco Mundial (párr. 13); la paz y la seguridad aparecen en la definición de la CNBV de la ONU.","ref":"Mandato párr. 2 · S2"},{"id":"O025","tema":"m1s2","tipo":"caso","q":"Una jurisdicción Miembro del GAFI recibe a un equipo de evaluadores para su revisión entre pares. Según el Mandato 2012-2020, ¿qué compromiso asumió esa jurisdicción?","a":"Someterse a las evaluaciones mutuas, que el GAFI publicará","o":["Sólo apoyar las evaluaciones mutuas de sus jurisdicciones miembro, sin someterse a ellas","Someterse a las evaluaciones mutuas, que el GAFI publicará","Realizar ella misma las evaluaciones mutuas en su territorio y publicar los resultados","Someterse a la evaluación sólo cuando el FMI la incluya en su Programa de Evaluación"],"x":"Párr. 6 b): las jurisdicciones Miembro se comprometen a «someterse y participar activamente de forma sistemática» en las evaluaciones mutuas, y «las evaluaciones serán publicadas por el GAFI». Apoyarlas sin someterse es el compromiso de las organizaciones Miembro (párr. 7 b); realizarlas y publicarlas en sus jurisdicciones es de los Miembros Asociados (párr. 12 b).","ref":"Mandato párr. 6 b) · S2"},{"id":"O026","tema":"m1s2","tipo":"caso","q":"Una organización (no una jurisdicción) es Miembro del GAFI. Según el Mandato 2012-2020, ¿qué compromiso tiene respecto de las evaluaciones mutuas?","a":"Apoyarlas de forma sistemática con la metodología acordada","o":["Someterse a ellas y aceptar que el GAFI las publique","Decidir por consenso qué jurisdicciones se evalúan cada año","Apoyarlas de forma sistemática con la metodología acordada","Realizarlas en el Programa de Evaluación del Sector Financiero"],"x":"Párr. 7 b): las organizaciones Miembro se comprometen a «apoyar de forma sistemática» las evaluaciones mutuas y procesos de seguimiento. Someterse a ellas es el compromiso de las jurisdicciones Miembro (párr. 6 b); el Programa de Evaluación del Sector Financiero es del FMI y el Banco Mundial (párr. 13 b).","ref":"Mandato párr. 7 b) · S2"},{"id":"O027","tema":"m1s2","tipo":"caso","q":"Un organismo regional solicita que se le reconozca como organismo regional tipo GAFI (FSRB) para participar como Miembro Asociado. Según el Mandato 2012-2020, ¿quién toma esa decisión?","a":"El Pleno del GAFI","o":["El Pleno del GAFI","El Grupo Directivo, a propuesta del Presidente","El Presidente, previa consulta con los Miembros","El Secretario Ejecutivo, con el apoyo de la OCDE"],"x":"Párr. 11: la decisión de si un organismo califica como FSRB, y por tanto es elegible como Miembro Asociado, «se toma por el Pleno del GAFI». También el párr. 20 e) lo confirma: el Pleno decide sobre el estatus de los FSRB. El Grupo Directivo sólo aconseja.","ref":"Mandato párrs. 11 y 20 e) · S2"},{"id":"O028","tema":"m1s2","tipo":"memoria","q":"Según el Mandato 2012-2020 (párr. 9), ¿qué son los Miembros Asociados del GAFI?","a":"Organismos regionales tipo GAFI (FSRB) designados por el GAFI","o":["Instituciones financieras internacionales con un papel especial","Organismos internacionales que participan como observadores","Jurisdicciones no Miembro invitadas ad hoc por el Presidente","Organismos regionales tipo GAFI (FSRB) designados por el GAFI"],"x":"Párr. 9: «Los Miembros Asociados son organismos regionales tipo GAFI (FSRBs), designados por el GAFI, que participan en la labor del GAFI». El «papel especial» es del FMI y el Banco Mundial (párr. 13); los observadores son otros organismos internacionales (párr. 14).","ref":"Mandato párr. 9 · S2"},{"id":"O029","tema":"m1s2","tipo":"caso","q":"Un país es evaluado por el FMI con la metodología acordada, en el contexto del Programa de Evaluación del Sector Financiero. Según el Mandato 2012-2020, ¿cómo se describe el papel del FMI y del Banco Mundial?","a":"Instituciones financieras internacionales con un papel especial","o":["Organismos regionales tipo GAFI (FSRB) con evaluación propia","Organizaciones Miembro del GAFI listadas en el Anexo A","Instituciones financieras internacionales con un papel especial","Jurisdicciones no Miembro invitadas ad hoc a las Sesiones Plenarias"],"x":"El Mandato los coloca bajo «Instituciones financieras internacionales» y dice que juegan «un papel especial» por sus mandatos de promover la estabilidad y el desarrollo financiero y económico (párr. 13); ayudan a la implementación mediante evaluaciones en el Programa de Evaluación del Sector Financiero (párr. 13 b). No son FSRB ni figuran en el Anexo A.","ref":"Mandato párr. 13 · S2"},{"id":"O030","tema":"m1s2","tipo":"caso","q":"Entre una Sesión Plenaria y la siguiente, un órgano del GAFI proporciona asesoría para apoyar al Presidente y llevar adelante las instrucciones del GAFI. ¿Qué órgano es?","a":"El Grupo Directivo","o":["El Pleno","El Grupo Directivo","La Secretaría","El Vicepresidente"],"x":"Párr. 40: «El Grupo Directivo proporciona asesoría entre las Sesiones Plenarias para apoyar al Presidente». Es un órgano consultor (párr. 37). El Pleno decide; la Secretaría ejecuta según instrucciones del Presidente.","ref":"Mandato párrs. 37 y 40 · S2"},{"id":"O031","tema":"m1s2","tipo":"caso","q":"El GAFI elaboró un nuevo estándar y una guía que deben aprobarse. Según el Mandato 2012-2020, ¿qué órgano los aprueba?","a":"El Pleno, por consenso","o":["El Pleno, por consenso","El Grupo Directivo, entre sesiones plenarias","El Presidente, como principal portavoz del GAFI","La Secretaría, con el servicio de la OCDE"],"x":"Párr. 20 d): el Pleno «aprueba estándares, guías e informe elaborados por el GAFI», y sus decisiones se toman por consenso (párr. 19). Si suena a decidir o aprobar, es el Pleno; el Grupo Directivo sólo asesora.","ref":"Mandato párrs. 19 y 20 d) · S2"},{"id":"O032","tema":"m1s2","tipo":"memoria","q":"«Es el máximo órgano de decisión del GAFI. Sus decisiones se toman por consenso.» Según el Mandato 2012-2020, ¿a qué estructura interna se refiere?","a":"El Pleno","o":["El Grupo Directivo","La Secretaría","El Presidente","El Pleno"],"x":"Es el párr. 19, sobre el Pleno. El Grupo Directivo se parece porque también lo preside el Presidente y se reúne por lo menos tres veces al año, pero es «un órgano consultor» (párr. 37), no el que decide.","ref":"Mandato párr. 19 · S2"},{"id":"O033","tema":"m1s2","tipo":"memoria","q":"«...es un órgano consultor y es presidido por el Presidente.» Según el Mandato 2012-2020, ¿a qué estructura interna del GAFI corresponde este fragmento?","a":"El Grupo Directivo","o":["El Pleno","La Secretaría","El Grupo Directivo","El Grupo de Revisión de Cooperación Internacional"],"x":"Es el párr. 37: «El Grupo Directivo del GAFI es un órgano consultor y es presidido por el Presidente». El Pleno también lo preside el Presidente (párr. 21), pero es el máximo órgano de decisión. Los grupos de trabajo tienen presidentes propios designados por el Pleno (párr. 27).","ref":"Mandato párr. 37 · S2"},{"id":"O034","tema":"m1s2","tipo":"memoria","q":"Completa el párr. 19 del Mandato 2012-2020: «El Pleno es el ______ del GAFI. Sus decisiones se toman por ______.»","a":"máximo órgano de decisión / consenso","o":["órgano consultor / consenso","máximo órgano de decisión / consenso","máximo órgano de decisión / mayoría calificada","órgano ejecutivo / mayoría simple de los Miembros"],"x":"La redacción exacta es «máximo órgano de decisión» y «consenso». «Órgano consultor» es como el Mandato define al Grupo Directivo (párr. 37). El Mandato no prevé votaciones por mayoría para el Pleno.","ref":"Mandato párr. 19 · S2"},{"id":"O035","tema":"m1s2","tipo":"memoria","q":"Según el Mandato 2012-2020, la composición de cierta estructura del GAFI «se decide por el Pleno a propuesta del Presidente [...] teniendo en cuenta una representación equilibrada en términos de regiones geográficas» y «se revisa de forma anual». ¿De qué estructura se trata?","a":"El Grupo Directivo","o":["El Grupo Directivo","La Secretaría","Los grupos de trabajo","El Pleno"],"x":"Párrs. 38 y 39: la composición del Grupo Directivo la decide el Pleno a propuesta del Presidente, con representación geográfica equilibrada, y se revisa cada año. El Pleno consta de jurisdicciones Miembro y organizaciones (párr. 18). La participación en grupos de trabajo está abierta a todos los Miembros, Miembros Asociados, el FMI, el Banco Mundial y los observadores (párr. 28).","ref":"Mandato párrs. 38-39 · S2"},{"id":"O036","tema":"m1s2","tipo":"caso","q":"Hay que administrar los recursos financieros, materiales y humanos asignados al GAFI, mantener sus registros y ocuparse de su correspondencia. Según el Mandato 2012-2020, ¿a quién corresponden estas responsabilidades?","a":"A la Secretaría","o":["Al Grupo Directivo","Al Pleno","A la Secretaría","Al Vicepresidente"],"x":"Párr. 45 d) y e): administrar recursos y mantener registros, páginas web y correspondencia son responsabilidades de la Secretaría, que actúa según las instrucciones del Presidente (párr. 44). El Grupo Directivo supervisa y guía el progreso de la labor (párr. 42), lo que es distinto de administrar.","ref":"Mandato párrs. 44-45 · S2"},{"id":"O037","tema":"m1s2","tipo":"memoria","q":"Según el Mandato 2012-2020, ¿quién nombra al Secretario Ejecutivo del GAFI?","a":"El Pleno, a propuesta del Presidente","o":["El Presidente, previa consulta con el Grupo Directivo","El Pleno, a propuesta del Presidente","La OCDE, que presta el servicio de la Secretaría","El Grupo Directivo, con representación geográfica equilibrada"],"x":"Párr. 43: el Secretario Ejecutivo «es nombrado por el Pleno a propuesta del Presidente». El Presidente propone y dirige al Secretario Ejecutivo (párr. 44), pero no lo nombra; la OCDE sólo proporciona el servicio de la Secretaría (párr. 46).","ref":"Mandato párrs. 43-44 · S2"},{"id":"O038","tema":"m1s2","tipo":"memoria","q":"Según el Mandato 2012-2020, ¿dónde está ubicada la Secretaría del GAFI?","a":"En la sede de la OCDE en París","o":["En la sede de las Naciones Unidas en Nueva York","En Washington, D.C., donde se firmó el Mandato","En la sede del Banco Mundial","En la sede de la OCDE en París"],"x":"Párr. 46: «El servicio de la Secretaría es proporcionado por la OECD, y la Secretaría está ubicada en la Sede de la OECD en París». Washington, D.C. es el lugar donde se fechó el Mandato (20 de abril de 2012), no la sede de la Secretaría.","ref":"Mandato párr. 46 · S2"},{"id":"O039","tema":"m1s2","tipo":"caso","q":"El Pleno nombra Presidente del GAFI a un representante de una jurisdicción Miembro. Según el Mandato 2012-2020, ¿cuál es su periodo?","a":"Un año, del 1 de julio al 30 de junio del año siguiente","o":["Un año, del 1 de julio al 30 de junio del año siguiente","Un año calendario, del 1 de enero al 31 de diciembre siguiente","Dos años, del 20 de abril al 19 de abril del segundo año","De febrero a octubre, entre la primera y la última plenaria"],"x":"Párr. 31: el Presidente es nombrado por el Pleno de entre sus Miembros «por el término de un año»; su periodo «inicia el 1 de julio y termina el 30 de junio del año siguiente». El 20 de abril es la fecha de entrada en vigor del Mandato (párr. 49).","ref":"Mandato párr. 31 · S2"},{"id":"O040","tema":"m1s2","tipo":"caso","q":"Una persona acaba de ser nombrada Vicepresidente del GAFI. Según el Mandato 2012-2020, ¿qué implica ese nombramiento?","a":"Es también el Presidente designado, por el año previo a su presidencia","o":["Preside de forma permanente el Grupo Directivo, mientras el Presidente conduce el Pleno","Dirige al Secretario Ejecutivo conforme a las indicaciones que le dé el Pleno","Es también el Presidente designado, por el año previo a su presidencia","Lo nombra el Grupo Directivo por dos años y supervisa a la Secretaría"],"x":"Párr. 35: el Vicepresidente «es también el Presidente designado» y es nombrado por el Pleno por el año que precede a su periodo presidencial; apoya al Presidente y lo suple cuando sea necesario (párr. 36). Presidir el Grupo Directivo, dirigir al Secretario Ejecutivo y supervisar a la Secretaría son funciones del Presidente (párrs. 32 y 44).","ref":"Mandato párrs. 35-36 · S2"},{"id":"O041","tema":"m1s2","tipo":"cifra","q":"Completa el párr. 24 del Mandato 2012-2020: «El Presidente convoca por lo menos a ______ Sesiones Plenarias cada año calendario...»","a":"tres","o":["dos","tres","cuatro","seis"],"x":"Por lo menos tres Sesiones Plenarias al año, normalmente en febrero, junio y octubre. Además, pueden convocarse reuniones extraordinarias cuando las circunstancias lo requieran (párr. 25). El Grupo Directivo también tiene un mínimo de tres reuniones al año (párr. 41).","ref":"Mandato párr. 24 · S2"},{"id":"O042","tema":"m1s2","tipo":"trampa","q":"Un compañero afirma: «El Mandato obliga a celebrar las Sesiones Plenarias en febrero, junio y octubre». ¿Qué dice exactamente el párr. 24?","a":"Por lo menos tres sesiones cada año calendario, normalmente en febrero, junio y octubre","o":["Exactamente tres sesiones cada año calendario, obligatoriamente en febrero, junio y octubre","Por lo menos tres sesiones cada año calendario, normalmente en febrero, junio y octubre","Por lo menos dos sesiones cada año calendario, normalmente en enero y en julio","Las sesiones que acuerde el Grupo Directivo, sin un número mínimo anual"],"x":"La trampa está en los matices: «por lo menos» tres (no exactamente) y «normalmente» en febrero, junio y octubre (no obligatoriamente). Además pueden convocarse sesiones extraordinarias (párr. 25). Quien convoca es el Presidente, no el Grupo Directivo.","ref":"Mandato párrs. 24-25 · S2"},{"id":"O043","tema":"m1s2","tipo":"cifra","q":"Según el Mandato 2012-2020, ¿cuántas reuniones del Grupo Directivo convoca el Presidente cada año calendario?","a":"Por lo menos tres reuniones","o":["Por lo menos dos reuniones","Una reunión antes de cada Sesión Plenaria","Por lo menos tres reuniones","Por lo menos cuatro reuniones"],"x":"Párr. 41: el Presidente convoca «por lo menos tres reuniones del Grupo Directivo cada año calendario», en el tiempo y lugar que él indique. Es el mismo mínimo que el de las Sesiones Plenarias (párr. 24), por eso se confunden; lo que los distingue es que el Pleno decide y el Grupo Directivo aconseja.","ref":"Mandato párr. 41 · S2"},{"id":"O044","tema":"m1s2","tipo":"caso","q":"Un organismo observador pregunta si tiene derecho a asistir a una sesión cerrada del Pleno. Según el párr. 22 del Mandato 2012-2020, ¿quiénes tienen el derecho de asistir a las sesiones cerradas?","a":"Todos los Miembros y Miembros Asociados","o":["Todos los Miembros y Miembros Asociados","Todos los Miembros, Miembros Asociados y observadores","Sólo las jurisdicciones Miembro, sin las organizaciones","Sólo los integrantes del Grupo Directivo y el Presidente"],"x":"Párr. 22: a las sesiones abiertas tienen derecho Miembros, Miembros Asociados y observadores; a las cerradas, Miembros y Miembros Asociados. Según el párr. 23, el Presidente también puede invitar a organismos observadores a ciertas sesiones cerradas, pero eso es una invitación, no un derecho.","ref":"Mandato párrs. 22-23 · S2"},{"id":"O045","tema":"m1s2","tipo":"caso","q":"El Presidente del GAFI quiere que representantes de una jurisdicción no Miembro asistan a una Sesión Plenaria. Según el Mandato 2012-2020, ¿qué puede hacer?","a":"Extenderles invitaciones ad hoc a la totalidad o parte de las sesiones","o":["Sólo invitarlos si el Grupo Directivo lo aprueba por consenso previamente","Nada: sólo Miembros, Asociados y observadores asisten a las plenarias","Extenderles invitaciones ad hoc a la totalidad o parte de las sesiones","Invitarlos a todas las sesiones cerradas, previa consulta con la OCDE"],"x":"Párr. 23: «El Presidente puede extender invitaciones ad hoc a representantes de jurisdicciones no Miembro para asistir a la totalidad o parte de las Sesiones Plenarias». Es una facultad («puede»), no una obligación, y no requiere aprobación del Grupo Directivo.","ref":"Mandato párr. 23 · S2"},{"id":"O046","tema":"m1s2","tipo":"caso","q":"El Pleno crea un nuevo grupo de trabajo para apoyar la labor del GAFI. Según el Mandato 2012-2020, ¿quién selecciona y designa a su presidente?","a":"El Pleno, a recomendación del Presidente","o":["El Presidente, a recomendación del Pleno","El Pleno, a recomendación del Presidente","El Grupo Directivo, previa consulta con la Secretaría","El Secretario Ejecutivo, según instrucciones del Presidente"],"x":"Párr. 27: los presidentes de los grupos de trabajo y subgrupos «son seleccionados y designados por el Pleno a recomendación del Presidente», y le informan al Pleno sobre sus programas. El distractor invierte los papeles: el Presidente recomienda, el Pleno designa.","ref":"Mandato párrs. 26-27 · S2"},{"id":"O047","tema":"m1s2","tipo":"memoria","q":"Según el párr. 17 del Mandato 2012-2020, ¿cuáles son las estructuras internas del GAFI?","a":"Pleno; Presidente, asistido por un Vicepresidente; Grupo Directivo; y Secretaría","o":["Pleno; Presidente, asistido por un Vicepresidente; Grupo Directivo; y Secretaría","Pleno; Presidente, asistido por un Secretario Ejecutivo; Consejo Directivo; y Secretaría Técnica","Asamblea de Ministros; Presidente; Grupo Directivo; y Comité de Evaluaciones Mutuas","Pleno; Presidente; Grupo Directivo; y los grupos de trabajo listados en el Anexo D"],"x":"Son cuatro: a) el Pleno; b) el Presidente, asistido por un Vicepresidente; c) el Grupo Directivo; y d) la Secretaría. «Consejo Directivo» es un término del texto histórico, no del Mandato. Los grupos de trabajo existen (Anexo D), pero los crea el Pleno y no figuran entre las estructuras internas del párr. 17.","ref":"Mandato párr. 17 · S2"},{"id":"O048","tema":"m1s2","tipo":"cifra","q":"Según la Metodología del GAFI (dic-2025), ¿cuántos Resultados Inmediatos deben evaluar los evaluadores para calificar la efectividad?","a":"Once","o":["Nueve","Cuarenta","Once","Cuatro"],"x":"El GAFI evalúa la efectividad principalmente sobre la base de once Resultados Inmediatos, y cada uno recibe una de cuatro calificaciones de efectividad. Cuarenta es el número de Recomendaciones, que reciben la calificación de cumplimiento técnico.","ref":"Metodología párrs. 52 y 72 · S2"},{"id":"O049","tema":"m1s2","tipo":"trampa","q":"Una alumna sostiene que, como México figura en el Anexo A, el Mandato 2012-2020 le impone obligaciones legales. Según el propio Mandato, ¿qué efecto legal tiene?","a":"No está destinado a crear derechos u obligaciones legales","o":["Crea obligaciones legales vinculantes para las jurisdicciones Miembro","No está destinado a crear derechos u obligaciones legales","Crea obligaciones legales sólo para los Miembros Asociados (FSRB)","Tiene efecto legal una vez que lo aprueba el Grupo Directivo"],"x":"Párr. 48: «Este Mandato no está destinado a crear derechos u obligaciones legales». Los compromisos de los Miembros (párrs. 6-8) son compromisos asumidos, no obligaciones legales creadas por el Mandato.","ref":"Mandato párr. 48 · S2"},{"id":"O050","tema":"m1s2","tipo":"cifra","q":"Según su párr. 49, ¿cuál es la vigencia del Mandato del GAFI 2012-2020?","a":"Del 20 de abril de 2012 al 31 de diciembre de 2020","o":["Del 16 de febrero de 2012 al 31 de diciembre de 2020","Del 20 de abril de 2012 al 30 de junio de 2020","Del 20 de abril de 2012 al 31 de diciembre de 2020","Del 1 de julio de 2012 al 30 de junio de 2020"],"x":"Párr. 49: entra en vigor el 20 de abril de 2012 y está vigente hasta el 31 de diciembre de 2020, con una revisión a mediano plazo. El 16 de febrero de 2012 es la fecha de publicación de las Recomendaciones revisadas; el 1 de julio al 30 de junio es el periodo del Presidente.","ref":"Mandato párr. 49 · S2"},{"id":"O051","tema":"m1s2","tipo":"memoria","q":"Completa la tarea del párr. 3 c) del Mandato 2012-2020: «Evaluar y supervisar a sus Miembros, mediante ______ y procesos de seguimiento, para determinar el grado de cumplimiento, implementación y efectividad...»","a":"«revisiones entre pares» («evaluaciones mutuas»)","o":["«autoevaluaciones anuales» («ejercicios de autoevaluación»)","«visitas de supervisión prudencial» («inspecciones in situ»)","las evaluaciones del Programa de Evaluación del Sector Financiero","«revisiones entre pares» («evaluaciones mutuas»)"],"x":"El Mandato usa «revisiones entre pares» («evaluaciones mutuas») y procesos de seguimiento. El Programa de Evaluación del Sector Financiero es el contexto de las evaluaciones del FMI y el Banco Mundial (párr. 13 b), no la tarea del GAFI del párr. 3 c).","ref":"Mandato párr. 3 c) · S2"},{"id":"O052","tema":"m1s2","tipo":"trampa","q":"El Pleno y el Grupo Directivo se reúnen por lo menos tres veces al año y ambos los preside el Presidente. Según el Mandato 2012-2020, ¿qué los distingue?","a":"El Pleno es el máximo órgano de decisión; el Grupo Directivo es un órgano consultor","o":["El Grupo Directivo decide por consenso; el Pleno sólo asesora entre reuniones","El Pleno lo preside el Vicepresidente; el Grupo Directivo, el Secretario Ejecutivo","El Grupo Directivo aprueba el presupuesto; el Pleno aprueba sólo los estándares","El Pleno es el máximo órgano de decisión; el Grupo Directivo es un órgano consultor"],"x":"Párr. 19: el Pleno es el máximo órgano de decisión y decide por consenso; párr. 37: el Grupo Directivo es un órgano consultor. El presupuesto y los estándares los aprueba el Pleno (párr. 20 c y d). Gancho: el Pleno decide, el Grupo Directivo aconseja.","ref":"Mandato párrs. 19, 20 y 37 · S2"},{"id":"O053","tema":"m1s2","tipo":"caso","q":"Por sus características estructurales, legales o institucionales, en un país no se aplica ningún requisito de cierta Recomendación. Según la Metodología (dic-2025), ¿cómo puede calificarse?","a":"En circunstancias excepcionales, como no aplicable (N/A)","o":["Siempre como no cumplida (NC), por la falta del requisito","Como cumplida (C), porque no existe ni una deficiencia","En circunstancias excepcionales, como no aplicable (N/A)","Con nivel bajo de efectividad en su Resultado Inmediato"],"x":"Párr. 42: «En circunstancias excepcionales, una Recomendación también podrá calificarse como no aplicable», cuando no se aplica ningún requisito por las características estructurales, legales o institucionales del país. Respeta el matiz: es excepcional y potestativo («podrá»). El nivel de efectividad es otra escala, para Resultados Inmediatos.","ref":"Metodología párr. 42 · S2"},{"id":"O054","tema":"m1s2","tipo":"cifra","q":"Según la Introducción de las Recomendaciones del GAFI, ¿de qué año son las 40 Recomendaciones originales, dirigidas contra el lavado del dinero del tráfico ilícito de drogas?","a":"1990","o":["1989","1996","1990","2003"],"x":"Las 40 Recomendaciones originales son de 1990. En 1989 se estableció el GAFI; en 1996 se revisaron por primera vez y en 2003 por segunda vez.","ref":"Introducción Rec. GAFI · S2"},{"id":"O055","tema":"m1s2","tipo":"cifra","q":"Según la Introducción de las Recomendaciones del GAFI, ¿en qué año se amplió el mandato del GAFI para incluir el financiamiento de la proliferación de armas de destrucción masiva?","a":"2008","o":["2001","2004","2012","2008"],"x":"La Introducción dice que «en el 2008 el mandato del GAFI se expandió» a la proliferación, y que para ello adoptó la Recomendación 7. En 2001 se amplió al financiamiento del terrorismo (8 Recomendaciones Especiales; la 9ª llegó en 2004).","ref":"Introducción Rec. GAFI · S2"},{"id":"O056","tema":"m1s2","tipo":"caso","q":"Un equipo evaluador concluye que, en una Recomendación, el país sólo tiene deficiencias menores. Según la Metodología (dic-2025), ¿qué calificación de cumplimiento técnico corresponde?","a":"Mayoritariamente cumplida (MC)","o":["Mayoritariamente cumplida (MC)","Cumplida (C)","Parcialmente cumplida (PC)","Nivel alto de efectividad"],"x":"MC = sólo existen deficiencias menores. C exige que no exista ni una deficiencia; PC corresponde a deficiencias moderadas. El «nivel alto de efectividad» habla de mejoras menores, pero es la escala de los Resultados Inmediatos, no la de las Recomendaciones.","ref":"Metodología párr. 42 · S2"},{"id":"O057","tema":"m1s2","tipo":"caso","q":"En la evaluación de cumplimiento técnico, una Recomendación presenta deficiencias moderadas. Según la Metodología (dic-2025), ¿qué calificación recibe?","a":"Parcialmente cumplida (PC)","o":["Mayoritariamente cumplida (MC)","No cumplida (NC)","Nivel sustancial de efectividad","Parcialmente cumplida (PC)"],"x":"PC = existen deficiencias moderadas; NC = deficiencias importantes; MC = sólo deficiencias menores. El nivel sustancial de efectividad menciona «mejoras moderadas», pero pertenece a la escala de efectividad.","ref":"Metodología párr. 42 · S2"},{"id":"O058","tema":"m1s2","tipo":"caso","q":"Un Resultado Inmediato se ha logrado hasta cierto grado y se requieren mejoras considerables. Según la Metodología (dic-2025), ¿qué calificación de efectividad corresponde?","a":"Nivel moderado de efectividad","o":["Parcialmente cumplida (PC)","Nivel moderado de efectividad","Nivel sustancial de efectividad","Nivel bajo de efectividad"],"x":"Moderado = logrado hasta cierto grado; mejoras considerables. Sustancial = logrado en buena medida; mejoras moderadas. Bajo = no logrado o en grado insignificante; mejoras fundamentales. PC es una calificación técnica, no de efectividad.","ref":"Metodología párr. 72 · S2"},{"id":"O059","tema":"m1s2","tipo":"memoria","q":"La R.6, inciso (ii), se refiere a personas o entidades designadas en virtud de la resolución 1373 (2001). ¿Quién hace esa designación?","a":"El propio país","o":["El propio país","El Comité 1267, bajo el Capítulo VII","El Comité 1988, sobre el Talibán","El Consejo de Seguridad en anexos de la 1718"],"x":"La R.6 (ii) dice «designada por ese país en virtud de la resolución 1373 (2001)». En la 1267 y sus sucesoras, en cambio, designa el Consejo de Seguridad (Comités 1267 y 1988). Gancho: 1267 = lista del mundo; 1373 = lista de casa.","ref":"R.6 (ii); NI R.6 párr. 3 · S2"},{"id":"O060","tema":"m1s2","tipo":"caso","q":"La autoridad competente de un país quiere incluir en su lista, por iniciativa propia, a una persona respecto de la cual tiene una base razonable para creer que comete actos terroristas. ¿En virtud de qué resolución lo hace?","a":"Resolución 1373 (2001)","o":["Resolución 1267 (1999)","Resolución 1373 (2001)","Resolución 1718 (2006)","Resolución 1988 (2011), sobre el Talibán"],"x":"En la 1373 designa el país, a nivel nacional o supranacional, por iniciativa propia o a petición de otro país, con «motivos razonables» o «base razonable». En la 1267 y sus sucesoras (incluida la 1988) el país sólo puede proponer al Comité; la 1718 es de proliferación (RPDC).","ref":"R.6 (ii); NI R.6 párrs. 3 y 13 c) · S2"},{"id":"O061","tema":"m1s2","tipo":"caso","q":"Un país recibe de otro país una solicitud para designar a una persona conforme a la resolución 1373 (2001). Según la NI R.6, ¿qué debe hacer el país que la recibe?","a":"Determinar con prontitud si la petición tiene motivos razonables o base razonable","o":["Remitirla al Comité 1267 para que éste decida la designación bajo el Capítulo VII","Designar de inmediato y sin examen, por venir la solicitud de otro país Miembro","Determinar con prontitud si la petición tiene motivos razonables o base razonable","Esperar a que exista una sentencia penal firme contra la persona que se propone"],"x":"NI R.6 párr. 4 b): al recibir una solicitud, los países deben determinar con prontitud si están convencidos, según sus principios (supra-)nacionales, de que está fundamentada por motivos razonables o una base razonable. No es automática, no va al Comité 1267 y no depende de un proceso penal (párr. 4 d).","ref":"NI R.6 párr. 4 b) y d) · S2"},{"id":"O062","tema":"m1s2","tipo":"caso","q":"La autoridad de un país quiere que una persona que apoya actividades de Al-Qaida sea incluida en la Lista de Sanciones del Consejo de Seguridad. Según la NI R.6, ¿qué puede hacer el país?","a":"Proponer su designación al Comité 1267","o":["Incluirla ella misma en la Lista de Sanciones a Al-Qaida","Proponer su designación al Comité 1988","Solicitar su inclusión al Comité de Sanciones 1718","Proponer su designación al Comité 1267"],"x":"NI R.6 párr. 3: las designaciones relativas a Al-Qaida las hace el Comité 1267. El país no designa en esa lista: propone al Comité, si su autoridad decide hacerlo y cree tener suficiente evidencia (párr. 4 a i). El Comité 1988 es para el Talibán y el 1718 para la RPDC.","ref":"NI R.6 párrs. 3 y 4 a) i) · S2"},{"id":"O063","tema":"m1s2","tipo":"caso","q":"Una autoridad identifica a una persona que apoya actos del Talibán que amenazan la paz, la estabilidad y la seguridad de Afganistán y decide proponer su designación. Según la NI R.6, ¿a qué comité dirige la propuesta?","a":"Al Comité 1988","o":["Al Comité 1988","Al Comité 1267","Al Comité de Sanciones 1737","Al Comité de Sanciones 1718"],"x":"NI R.6 párr. 3: las designaciones sobre el Talibán y amenazas relacionadas con Afganistán las hace el Comité 1988; las de Al-Qaida, el Comité 1267. Ambos actúan bajo el Capítulo VII. Los Comités 1718 y 1737 son de proliferación (R.7).","ref":"NI R.6 párrs. 3 y 4 a) ii) · S2"},{"id":"O064","tema":"m1s2","tipo":"memoria","q":"¿En qué resolución se basa la R.6, inciso (i), relativo a personas o entidades designadas por, o bajo la autoridad de, el Consejo de Seguridad dentro del Capítulo VII?","a":"1267 (1999) y sus resoluciones sucesoras","o":["1373 (2001), con designación del propio país","1718 (2006) y sus resoluciones sucesoras","1267 (1999) y sus resoluciones sucesoras","1737 (2006) y sus resoluciones sucesoras"],"x":"R.6 (i): designada por, o bajo la autoridad de, el Consejo de Seguridad, «incluyendo, de conformidad con la resolución 1267 (1999) y sus resoluciones sucesoras». La 1373 es el inciso (ii); la 1718 y la 1737 son la base de las SFD de proliferación (R.7).","ref":"R.6 (i) · S2"},{"id":"O065","tema":"m1s2","tipo":"trampa","q":"Un alumno afirma que en la resolución 1373 (2001) el Consejo de Seguridad arma la lista. Según la NI R.6 párr. 3, ¿quién hace las designaciones de la 1373?","a":"Un país o países, a nivel nacional o supranacional","o":["El Comité 1267, actuando bajo el Capítulo VII de la Carta","Un país o países, a nivel nacional o supranacional","El Comité 1988, a propuesta del país que tenga suficiente evidencia","El Consejo de Seguridad en los anexos de la propia resolución 1373"],"x":"Para la 1373, las designaciones «las hace, a nivel nacional o supranacional, un país o países que actúan por iniciativa propia o a petición de otro país». Es la diferencia clave con la 1267, donde designan los Comités 1267 y 1988 bajo el Capítulo VII.","ref":"NI R.6 párr. 3 · S2"},{"id":"O066","tema":"m1s2","tipo":"cifra","q":"¿De qué año es la resolución 1373 del Consejo de Seguridad, base de la R.6 inciso (ii)?","a":"2001","o":["1999","2006","2011","2001"],"x":"La 1373 es de 2001; la 1267, de 1999. Orden: 99 → 01. 2006 es el año de la 1718 y la 1737 (proliferación) y 2011 el de la 1988 y la 1989.","ref":"R.6 (ii) · S2"},{"id":"O067","tema":"m1s2","tipo":"cifra","q":"¿De qué año es la resolución 1267 del Consejo de Seguridad, base de la R.6 inciso (i)?","a":"1999","o":["1989","1999","2001","2011"],"x":"La 1267 es de 1999. No la confundas con 1989, año en que se estableció el GAFI, ni con la resolución 1989 (2011), sucesora de la 1267 sobre Al-Qaida.","ref":"R.6 (i) · S2"},{"id":"O068","tema":"m1s2","tipo":"memoria","q":"Según la NI R.7 (dic-2025), ¿en qué resoluciones se basan las sanciones financieras dirigidas relacionadas con la proliferación?","a":"1718 (2006), RPDC, y 1737 (2006), Irán, con sus sucesoras","o":["1718 (2006), RPDC, y 1737 (2006), Irán, con sus sucesoras","1267 (1999) y 1373 (2001), con sus resoluciones sucesoras","1988 (2011) y 1989 (2011), sobre el Talibán y Al-Qaida","1373 (2001) y 1452 (2002), sobre designaciones nacionales"],"x":"La nota 22 de la NI R.7 (versión oct-2025) enlista la 1718 (2006) y sus sucesoras para la RPDC, y la 1737 (2006), 1747, 1803 y 1929 para Irán. La 1267 y la 1373 son la base de la R.6 (terrorismo).","ref":"NI R.7 nota 22 · S2"},{"id":"O069","tema":"m1s2","tipo":"caso","q":"Una institución financiera detecta que un cliente es una entidad designada por el Comité de Sanciones 1718. ¿A qué régimen corresponde esa designación?","a":"Proliferación: programas nucleares, de ADM y de misiles de la RPDC","o":["Terrorismo: Al-Qaida y sus células, grupos afiliados o derivados","Proliferación: actividades nucleares sensibles y sistemas vectores de Irán","Terrorismo: el Talibán y las amenazas a la paz de Afganistán","Proliferación: programas nucleares, de ADM y de misiles de la RPDC"],"x":"La 1718 (2006) es de la RPDC: sus criterios se refieren a programas nucleares, otros de ADM y de misiles balísticos (NI R.7 párr. 13 a). Irán corresponde a la 1737 y su Comité; Al-Qaida y Talibán son R.6 (Comités 1267 y 1988).","ref":"NI R.7 párrs. 5 a) y 13 a) · S2"},{"id":"O070","tema":"m1s2","tipo":"caso","q":"Un banco identifica a una entidad que presta apoyo a las actividades sensibles de proliferación nuclear de Irán. ¿Qué resolución y qué comité corresponden según la NI R.7?","a":"1737 (2006) y el Comité de Sanciones 1737","o":["1718 (2006) y el Comité de Sanciones 1718","1267 (1999) y el Comité 1267","1737 (2006) y el Comité de Sanciones 1737","1373 (2001) y la autoridad nacional competente"],"x":"Irán = 1737 (2006); la nota 22 enlista también la 1747, la 1803 y la 1929. Designa el Consejo de Seguridad en los anexos o el Comité de Sanciones 1737 (NI R.7 párr. 5 b). La 1718 es de la RPDC. Gancho: Corea 1718, Irán 1737, ambas de 2006.","ref":"NI R.7 párrs. 5 b) y 13 b) · S2"},{"id":"O071","tema":"m1s2","tipo":"memoria","q":"Según la nota 22 de la NI R.7, además de la 1737 (2006), ¿qué resoluciones del Consejo de Seguridad aplican sanciones financieras dirigidas relativas a Irán?","a":"1747 (2007), 1803 (2008) y 1929 (2010)","o":["1874 (2009), 2087 (2013) y 2094 (2013)","1747 (2007), 1803 (2008) y 1929 (2010)","1333 (2000), 1390 (2002), 1455 (2003) y 1526 (2004)","1904 (2009), 1988 (2011) y 1989 (2011)"],"x":"La nota 22 enlista para Irán las resoluciones 1737 (2006), 1747 (2007), 1803 (2008) y 1929 (2010). La 1874, la 2087 y la 2094 son sucesoras de la 1718, sobre la RPDC (nota 24); la 1333, la 1390 y la 1455 son sucesoras de la 1267, sobre terrorismo (NI R.6, nota 13).","ref":"NI R.7 nota 22 · S2"},{"id":"O072","tema":"m1s2","tipo":"caso","q":"Una institución financiera encuentra fondos de una persona designada en virtud de la R.6. Según la NI R.6 párr. 6 a), ¿cómo debe congelarlos?","a":"Sin demora y sin previa notificación","o":["Dentro de los diez días laborables siguientes, previa notificación","Sólo cuando exista orden judicial en un proceso penal","Sin demora y sin previa notificación","Sin demora, pero notificando antes a la persona designada"],"x":"Los países deben exigir a todas las personas naturales y jurídicas que congelen «sin demora y sin previa notificación». Las medidas de la R.6 no dependen de la existencia de procesos penales (NI R.6 párr. 2). Los diez días laborables aparecen en otro supuesto: la notificación previa al Comité 1737 de ciertos pagos (NI R.7 párr. 11 c).","ref":"NI R.6 párr. 6 a) · S2"},{"id":"O073","tema":"m1s2","tipo":"caso","q":"Una persona designada controla indirectamente una empresa cuyos fondos no están vinculados con ningún acto terrorista concreto. Según la NI R.6 párr. 6 a), ¿deben congelarse esos fondos?","a":"Sí: abarca fondos controlados directa o indirectamente, no sólo los ligados a un acto","o":["No: sólo se congelan los fondos ligados a un acto, complot o amenaza terrorista","Sí: abarca fondos controlados directa o indirectamente, no sólo los ligados a un acto","No: sólo se congelan los fondos registrados a nombre de la persona designada","Sólo si la empresa también aparece designada por su nombre en la lista del Comité"],"x":"La obligación se extiende a todos los fondos propiedad o bajo control del designado, «y no sólo aquellos que se pueden enlazar a un acto terrorista particular», incluidos los controlados directa o indirectamente y los de quienes actúan en su nombre o bajo su dirección.","ref":"NI R.6 párr. 6 a) · S2"},{"id":"O074","tema":"m1s2","tipo":"caso","q":"Un cliente con un nombre similar al de una persona designada ve congelados sus fondos por error (falso positivo). Según la NI R.6, ¿qué deben tener los países?","a":"Procedimientos públicos para descongelar a tiempo tras verificar que no es el designado","o":["Mantener el congelamiento hasta que el Consejo de Seguridad lo excluya de la lista","Un trámite ante el Comité 1988 para que el cliente solicite su remoción de la lista","Esperar a que un tribunal penal resuelva antes de liberar cualquier fondo congelado","Procedimientos públicos para descongelar a tiempo tras verificar que no es el designado"],"x":"NI R.6 párr. 9: para falsos positivos, los países deben tener procedimientos que se conozcan públicamente para descongelar a tiempo, a partir de la verificación de que la persona no es la designada. No hay que excluirla de ninguna lista, porque nunca estuvo en ella.","ref":"NI R.6 párr. 9 · S2"},{"id":"O075","tema":"m1s2","tipo":"caso","q":"El Comité 1267 remueve de su lista a una persona que estaba designada. Según la NI R.6, ¿qué ocurre con la obligación de congelar sus fondos?","a":"Deja de existir","o":["Deja de existir","Subsiste hasta que el país la designe por la 1373","Subsiste hasta que un tribunal nacional confirme la remoción","Se mantiene hasta la siguiente Sesión Plenaria del GAFI"],"x":"NI R.6 párr. 7: «En el caso de que el Comité 1267 o el Comité 1988 haya removido de una lista a una persona o entidad, la obligación de congelamiento deja de existir». La NI R.7 párr. 7 dice lo mismo para las listas de proliferación.","ref":"NI R.6 párr. 7 · S2"},{"id":"O076","tema":"m1s2","tipo":"caso","q":"Una persona designada por el país en virtud de la 1373 (2001) ya no satisface los criterios de designación. Según la NI R.6 párr. 8, ¿qué deben tener los países?","a":"Procedimientos para deslistar y descongelar, y revisión ante tribunal o autoridad independiente","o":["Sólo la vía de pedir al Consejo de Seguridad su exclusión, quien decide en definitiva","Un procedimiento para que el Comité 1267 la excluya, actuando bajo el Capítulo VII","Procedimientos para deslistar y descongelar, y revisión ante tribunal o autoridad independiente","La Oficina de Defensa del Pueblo de la ONU como única vía para solicitar su remoción"],"x":"Como en la 1373 designa el país, la salida también es nacional: autoridades y procedimientos para deslistar y descongelar, y para revisar la designación ante un tribunal u otra autoridad competente independiente. Las solicitudes al Consejo de Seguridad son para la 1267 (párr. 7) y la Oficina de Defensa del Pueblo, para la Lista de Al-Qaida (párr. 11).","ref":"NI R.6 párr. 8 · S2"},{"id":"O077","tema":"m1s2","tipo":"caso","q":"Una persona incluida en la Lista de Sanciones a Al-Qaida quiere pedir su remoción. Según la NI R.6 párr. 11, ¿sobre qué deben informarle los países?","a":"La Oficina de la ONU de Defensa del Pueblo, conforme a la 1904 (2009)","o":["El Grupo Egmont, que recibe las peticiones de remoción por medio de las UIF","La Oficina de la ONU de Defensa del Pueblo, conforme a la 1904 (2009)","El Comité de Sanciones 1718, que revisa las peticiones de todas las listas","La autoridad nacional que la designó en virtud de la resolución 1373 (2001)"],"x":"Para la Lista de Al-Qaida, los países deben informar sobre la disponibilidad de la Oficina de las Naciones Unidas de Defensa del Pueblo, en virtud de la 1904 (2009), para aceptar peticiones de remoción. La autoridad nacional es la vía para designaciones de la 1373, no para la lista del Consejo.","ref":"NI R.6 párr. 11 · S2"},{"id":"O078","tema":"m1s2","tipo":"caso","q":"Una persona designada por el Comité 1267 necesita acceder a parte de sus fondos congelados para cubrir gastos básicos. Según la NI R.6 párr. 10, ¿conforme a qué resolución deben autorizar el acceso los países?","a":"Resolución 1452 (2002) y sucesoras","o":["Resolución 1963 (2010)","Resolución 1904 (2009)","Resolución 1730 (2006)","Resolución 1452 (2002) y sucesoras"],"x":"Para designados por el Consejo de Seguridad o sus comités, el acceso para gastos básicos, honorarios o gastos extraordinarios se autoriza conforme a la 1452 (2002) y sucesoras. La 1963 (2010) es la referencia cuando el congelamiento deriva de una designación nacional en virtud de la 1373.","ref":"NI R.6 párr. 10 · S2"},{"id":"O079","tema":"m1s2","tipo":"memoria","q":"En materia de proliferación, ¿tienen los Estados Miembros de la ONU una obligación específica de presentar propuestas de designación al Consejo de Seguridad o a sus Comités, según la NI R.7 párr. 3?","a":"No existe obligación específica, aunque en la práctica el Consejo depende de esas peticiones","o":["Sí: deben presentarlas al Comité 1718 o al 1737 siempre que posean suficiente evidencia","Sí: deben designar ellos mismos, por iniciativa propia, como ocurre con la 1373","No existe obligación específica, aunque en la práctica el Consejo depende de esas peticiones","No: sólo el Consejo identifica a los designados y no recibe peticiones de los Estados"],"x":"NI R.7 párr. 3: «No existe una obligación específica» de presentar propuestas; «sin embargo, en la práctica», el Consejo o los Comités dependen fundamentalmente de las peticiones de los Estados Miembros. En proliferación designa el Consejo de Seguridad, no el país.","ref":"NI R.7 párr. 3 · S2"},{"id":"O080","tema":"m1s2","tipo":"caso","q":"Un país diseña su régimen para cumplir la R.7. Según la NI R.7 párr. 4, ¿qué prevé respecto de la autoridad y los procedimientos para proponer personas al Consejo de Seguridad?","a":"Que el país puede considerar establecerlos","o":["Que el país debe establecerlos, igual que en la R.6","Que el país debe designar directamente por iniciativa propia","Que el país puede considerar establecerlos","Que sólo el Grupo Directivo del GAFI puede proponerlos"],"x":"Respeta el modal: «Los países pueden considerar el establecimiento de la autoridad...» y «pudieran considerar» ciertos elementos. En la R.6, en cambio, los países «deben» contar con autoridad para proponer designaciones (NI R.6 párr. 4). Convertir el «pueden considerar» en «deben» es el error típico.","ref":"NI R.7 párr. 4 · S2"},{"id":"O081","tema":"m1s2","tipo":"trampa","q":"Un compañero sostiene que la resolución 1540 (2004) es la base de las sanciones financieras dirigidas de la R.7. Según la NI R.7, ¿qué es lo correcto respecto de la 1540?","a":"Es base de obligaciones de no proliferación independientes de la R.7 (nota 23)","o":["Es, junto con la 1718 (2006), la base de las SFD de la R.7 respecto de la RPDC","Es base de obligaciones de no proliferación independientes de la R.7 (nota 23)","Sustituyó a la 1737 (2006) como base de las SFD de la R.7 respecto de Irán","Es base de la R.6, junto con la 1267 (1999) y la 1373 (2001), contra el terrorismo"],"x":"La nota 23 de la NI R.7 menciona la 1540 (2004), junto con la 2235 (2016), el TNP y los convenios sobre armas biológicas y tóxicas y sobre armas químicas, como base de obligaciones de no proliferación que «existen con independencia» de la R.7 y su NI. Las SFD de la R.7 se basan en la 1718 y la 1737 y sus sucesoras (nota 22).","ref":"NI R.7 notas 22 y 23 · S2"},{"id":"O082","tema":"m1s2","tipo":"caso","q":"Al preparar un manual, una oficial de cumplimiento enlista los instrumentos que, según la nota 23 de la NI R.7, sustentan obligaciones de no proliferación que existen con independencia de la R.7. ¿Qué lista es la correcta?","a":"TNP, Convenios sobre Armas Biológicas y Tóxicas y sobre Armas Químicas, y resoluciones 1540 (2004) y 2235 (2016)","o":["Convención de Viena, Convención de Palermo y Convenio Internacional para la Represión de la Financiación del Terrorismo","Resoluciones 1718 (2006) y 1737 (2006), junto con todas sus resoluciones sucesoras sobre la RPDC y sobre Irán","Resoluciones 1267 (1999), 1373 (2001) y 1452 (2002), junto con sus resoluciones sucesoras sobre terrorismo","TNP, Convenios sobre Armas Biológicas y Tóxicas y sobre Armas Químicas, y resoluciones 1540 (2004) y 2235 (2016)"],"x":"La nota 23 cita, por ejemplo, el Tratado de No Proliferación Nuclear, el Convenio sobre Armas Biológicas y Tóxicas, el Convenio sobre las Armas Químicas y las resoluciones 1540 (2004) y 2235 (2016). Viena, Palermo y el Convenio de Financiación del Terrorismo son la nota 14 de la NI R.6; la 1718 y la 1737 son la base de las SFD de la R.7.","ref":"NI R.7 nota 23 · S2"},{"id":"O083","tema":"m1s2","tipo":"memoria","q":"El Glosario del GAFI, en la definición de «Designación», dice: «...incluyendo la determinación de que las sanciones acordes se aplicarán a la persona o entidad y la comunicación pública de esa determinación». ¿A qué resolución se refiere ese fragmento?","a":"Resolución 1373 (2001)","o":["Resolución 1267 (1999)","Resolución 1718 (2006) y sus sucesoras","Resolución 1373 (2001)","Resolución 1737 (2006)"],"x":"En el Glosario, la viñeta de la 1373 (2001) es la única que añade la determinación de aplicar sanciones y su comunicación pública, porque en la 1373 la designación la hace el país. Las viñetas de la 1267, 1718 y 1737 sólo dicen «y sus resoluciones sucesoras».","ref":"Glosario, «Designación» · S2"},{"id":"O084","tema":"m1s2","tipo":"caso","q":"Una autoridad analiza si una entidad controlada indirectamente por una persona que comete actos terroristas satisface los criterios de designación de la resolución 1373 (2001). Según la NI R.6 párr. 13 c), ¿qué concluye?","a":"Sí los satisface: la 1373 comprende entidades controladas directa o indirectamente","o":["No: la 1373 sólo comprende a quien comete o intenta cometer actos terroristas","No: esas entidades sólo pueden designarse por medio del Comité 1988","Sólo si la entidad además financia actos o actividades de Al-Qaida","Sí los satisface: la 1373 comprende entidades controladas directa o indirectamente"],"x":"Los criterios de la 1373 son tres: (i) quien comete o intenta cometer actos terroristas, o participa en ellos o facilita su comisión; (ii) toda entidad que le pertenezca o esté controlada, directa o indirectamente, por esa persona; y (iii) quien actúa en su nombre o bajo su dirección.","ref":"NI R.6 párr. 13 c) · S2"},{"id":"O085","tema":"m1s2","tipo":"caso","q":"Al decidir si designa a una persona conforme a la resolución 1373 (2001), ¿qué norma probatoria debe aplicar el país según la NI R.6 párr. 4 d)?","a":"Motivos razonables o base razonable, sin depender de un proceso penal","o":["Prueba más allá de toda duda razonable, con sentencia penal firme","Motivos razonables o base razonable, sin depender de un proceso penal","Motivos razonables, siempre que exista un proceso penal en curso","Base razonable, pero sólo si la designación la pide otro país"],"x":"Los países deben aplicar una norma de «motivos razonables» o «base razonable», según la norma legal de su propio sistema jurídico, independientemente de que la designación sea por iniciativa propia o a petición de otro país. Estas designaciones «no deben depender de la existencia de un proceso penal».","ref":"NI R.6 párr. 4 d) · S2"},{"id":"O086","tema":"m1s2","tipo":"caso","q":"Una autoridad acaba de designar a una persona. Según la NI R.6 párr. 6 c), ¿cuándo deben los países comunicar la designación al sector financiero y a las APNFD?","a":"Inmediatamente al tomar dicha acción","o":["Inmediatamente al tomar dicha acción","Dentro de los diez días laborables siguientes","En la siguiente Sesión Plenaria del GAFI","Una vez notificada la persona designada"],"x":"Los países deben contar con mecanismos para comunicar las designaciones al sector financiero y a las APNFD «inmediatamente al tomar dicha acción», con una guía clara sobre sus obligaciones. Esperar a notificar a la persona designada contradice el congelamiento sin previa notificación.","ref":"NI R.6 párr. 6 c) · S2"},{"id":"O087","tema":"m1s2","tipo":"caso","q":"Una institución congeló activos de un designado y además detectó una transacción que el designado intentó realizar. Según la NI R.6 y la NI R.7 (párr. 6 d), ¿qué deben exigir los países a la institución?","a":"Reportar a la autoridad los activos congelados y las acciones tomadas, incluidas las transacciones intentadas","o":["Reportar sólo los activos congelados, porque las transacciones intentadas no se reportan","Notificar directamente al Comité del Consejo de Seguridad, sin pasar por la autoridad nacional","Reportar a la autoridad los activos congelados y las acciones tomadas, incluidas las transacciones intentadas","Informar primero al cliente designado y después reportar los activos a la autoridad competente"],"x":"Párr. 6 d) de ambas notas: los países deben exigir a las instituciones financieras y APNFD que reporten a las autoridades competentes los activos congelados o las acciones tomadas, «incluyendo las transacciones intentadas». Avisar al designado contradice el congelamiento «sin previa notificación».","ref":"NI R.6 y NI R.7, párr. 6 d) · S2"},{"id":"O088","tema":"m1s2","tipo":"caso","q":"Una entidad designada en virtud de la 1737 (2006) debe hacer un pago vencido bajo un contrato celebrado antes de ser listada, y se cumplen las demás condiciones. Según la NI R.7 párr. 11 c), ¿con qué anticipación deben los países notificar al Comité de Sanciones 1737?","a":"Diez días laborables antes de la autorización","o":["Cinco días hábiles después de efectuado el pago","Treinta días naturales antes de celebrar el contrato","Inmediatamente después de autorizar el desbloqueo","Diez días laborables antes de la autorización"],"x":"La NI R.7 párr. 11 c) exige una notificación previa al Comité de Sanciones 1737 sobre la intención de hacer o recibir esos pagos o autorizar el desbloqueo, «diez días laborables antes de dicha autorización». Además, el contrato no debe estar relacionado con bienes o servicios prohibidos y el pago no debe recibirlo un designado.","ref":"NI R.7 párr. 11 · S2"},{"id":"O089","tema":"m1s2","tipo":"caso","q":"Una cuenta congelada conforme a la resolución 1718 (2006) genera intereses. Según la NI R.7 párr. 10, ¿qué deben hacer los países?","a":"Permitir que se añadan a la cuenta, siempre que sigan sujetos al congelamiento","o":["Entregarlos al titular, pues no forman parte de los fondos ya congelados","Permitir que se añadan a la cuenta, siempre que sigan sujetos al congelamiento","Transferirlos al Comité de Sanciones 1718 para su administración y custodia","Impedir cualquier abono, porque las cuentas congeladas no pueden recibir ingresos"],"x":"Los países deben permitir la adición a las cuentas congeladas (1718 o 1737) de intereses u otras ganancias, o de pagos vencidos por contratos anteriores, siempre que sigan sujetos a esas disposiciones y queden congelados.","ref":"NI R.7 párr. 10 · S2"},{"id":"O090","tema":"m1s2","tipo":"trampa","q":"En la NI R.7 (versión dic-2025), ¿en qué parte aparece mencionada la resolución 2231 (2015)?","a":"En el párr. 9, sobre las condiciones de exención para autorizar el acceso a fondos","o":["En el párr. 9, sobre las condiciones de exención para autorizar el acceso a fondos","En la nota 22, como base de las sanciones financieras dirigidas relativas a Irán","En el párr. 13, como resolución que fija los criterios de designación sobre Irán","En el párr. 5, como fuente de las designaciones que realiza el Comité de Sanciones 1737"],"x":"Trampa de la 2231: en la NI R.7 (dic-2025), las SFD relativas a Irán se basan en la 1737 (2006), junto con la 1747, la 1803 y la 1929 (nota 22 y párr. 13 b). La 2231 (2015) sólo aparece en el párr. 9, junto con la 1718 y la 1737, sobre las condiciones de exención para autorizar el acceso a fondos.","ref":"NI R.7 párr. 9; nota 22 · S2"},{"id":"G001","tema":"m1s3","tipo":"caso","q":"La evaluación nacional de riesgos de un país concluye que un tipo de microseguro de vida presenta un riesgo menor de LD/FT. Conforme a la R.1, ¿qué corresponde hacer al país respecto de ese producto?","a":"Permitir y alentar la aplicación de medidas simplificadas, según corresponda","o":["Exentarlo en automático de todas las Recomendaciones","Permitir y alentar la aplicación de medidas simplificadas, según corresponda","Obligar a las aseguradoras a aplicar medidas simplificadas a todos sus clientes, sin excepción ni análisis propio","Suspender la designación de la autoridad coordinadora hasta que concluya la siguiente evaluación nacional"],"x":"La R.1 dice que, ante riesgos menores, los países deben «permitir y alentar» medidas simplificadas «según corresponda»; no las impone ni exime en automático. Las exenciones son una decisión del país y exigen riesgo bajo, ya sea en circunstancias limitadas y justificadas para un tipo concreto de IF, actividad o APNFD, o por tratarse de una actividad financiera ocasional o muy limitada (INR.1, párr. 8).","ref":"R.1; INR.1, párrs. 7 y 8 · S3","d":{"Exentarlo en automático de todas las Recomendaciones":"Las exenciones no son automáticas: la INR.1 (párr. 8) las limita a riesgo bajo evaluado, circunstancias limitadas y justificadas, y a un tipo concreto de IF, actividad o APNFD.","Obligar a las aseguradoras a aplicar medidas simplificadas a todos sus clientes, sin excepción ni análisis propio":"Convierte en obligación lo que la R.1 deja como «permitir y alentar… según corresponda»; el país no impone medidas simplificadas sin análisis.","Suspender la designación de la autoridad coordinadora hasta que concluya la siguiente evaluación nacional":"El estándar no prevé suspender la designación; al contrario, la R.1 exige designar una autoridad o mecanismo que coordine la evaluación de riesgos."}},{"id":"G002","tema":"m1s3","tipo":"trampa","q":"Una IF aplica DDC simplificada a un cliente de riesgo bajo y detecta indicios de LD. La regla expresa de que las medidas simplificadas no se permiten cuando hay sospecha, ¿dónde se encuentra?","a":"En las Notas interpretativas de la R.1 y de la R.10","o":["En el Glosario, en «medidas razonables»","En las Notas interpretativas de la R.1 y de la R.10","En el texto de la R.20, junto con la obligación de reportar con prontitud a la UIF","En el texto de la R.1, en el párrafo dedicado a los riesgos menores del país"],"x":"El texto de la R.1 sólo dice que ante riesgos menores se permitan y alienten medidas simplificadas; la prohibición cuando hay sospecha de LD/FT aparece en la INR.1 (párr. 2) y se reitera en la INR.10 (párr. 21). No está en la R.20 ni en el Glosario.","ref":"INR.1, párr. 2; INR.10, párr. 21 · S3","d":{"En el Glosario, en «medidas razonables»":"El Glosario define «medidas razonables» como medidas apropiadas y proporcionales al riesgo; no contiene la prohibición de simplificar ante sospecha.","En el texto de la R.20, junto con la obligación de reportar con prontitud a la UIF":"El texto de la R.20 sólo obliga a reportar con prontitud a la UIF; no habla de medidas simplificadas.","En el texto de la R.1, en el párrafo dedicado a los riesgos menores del país":"El texto de la R.1 sólo dice que, ante riesgos menores, se permitan y alienten medidas simplificadas; la excepción por sospecha está en la Nota (INR.1, párr. 2)."}},{"id":"G003","tema":"m1s3","tipo":"memoria","q":"En el contexto de la R.1, ¿qué significa «riesgo de financiamiento a la proliferación»?","a":"Estricta y únicamente la posible violación, falta de implementación o evasión de las sanciones financieras dirigidas de la R.7","o":["Estricta y únicamente la posible violación, falta de implementación o evasión de las sanciones financieras dirigidas de la R.7","El riesgo de que se evadan los controles de exportación de bienes de uso dual previstos en los tratados internacionales de no proliferación","El riesgo de que se financien actos terroristas con armas de destrucción masiva conforme a la resolución 1373 (2001) del Consejo de Seguridad","Cualquier riesgo de que fondos se destinen a armas de destrucción masiva, incluidas las prohibiciones de viaje y las prohibiciones por actividad de la ONU"],"x":"La R.1 acota el riesgo de FP «estricta y únicamente» al incumplimiento o evasión de las sanciones financieras dirigidas de la R.7. No abarca otras medidas de las resoluciones de la ONU, como prohibiciones de viaje (INR.7, nota al pie 21).","ref":"R.1; INR.1, párr. 3 · S3","d":{"El riesgo de que se evadan los controles de exportación de bienes de uso dual previstos en los tratados internacionales de no proliferación":"Los tratados de no proliferación y resoluciones como la 1540 (2004) generan obligaciones que existen con independencia de la R.7 (INR.7, párr. 2 y su nota al pie). El riesgo de FP de la R.1 se limita a las sanciones financieras dirigidas de la R.7.","El riesgo de que se financien actos terroristas con armas de destrucción masiva conforme a la resolución 1373 (2001) del Consejo de Seguridad":"La resolución 1373 es de terrorismo y pertenece a la R.6, no al riesgo de FP de la R.1.","Cualquier riesgo de que fondos se destinen a armas de destrucción masiva, incluidas las prohibiciones de viaje y las prohibiciones por actividad de la ONU":"Demasiado amplio: el riesgo de FP se limita a las sanciones financieras dirigidas de la R.7; prohibiciones de viaje y por actividad quedan fuera (INR.7, nota al pie 21)."}},{"id":"G004","tema":"m1s3","tipo":"caso","q":"Un país determina que cierta categoría de APNFD presenta un riesgo bajo de FP y la exenta de identificar, evaluar y mitigar ese riesgo. Según la Nota a la R.1, ¿qué sigue siendo obligatorio para esa categoría?","a":"La plena implementación de las sanciones financieras dirigidas de la R.7","o":["Una autoevaluación trimestral de riesgo de FP","La DDC reforzada sobre todos los clientes que realizan operaciones con el extranjero","La plena implementación de las sanciones financieras dirigidas de la R.7","Nada adicional: la exención por riesgo bajo alcanza también al congelamiento previsto en la R.7"],"x":"La INR.1 permite exentar de la evaluación y mitigación del riesgo de FP a ciertas IF o APNFD de riesgo bajo, pero aclara que la plena implementación de las sanciones financieras dirigidas de la R.7 es obligatoria en todos los casos; esas obligaciones no se basan en riesgo.","ref":"INR.1, párrs. 3 y 4, y nota al pie 4 · S3","d":{"Una autoevaluación trimestral de riesgo de FP":"El estándar no prevé ninguna autoevaluación trimestral de riesgo de FP.","La DDC reforzada sobre todos los clientes que realizan operaciones con el extranjero":"El estándar no exige DDC reforzada a todos los clientes con operaciones con el extranjero; eso nada tiene que ver con la exención de FP de la INR.1.","Nada adicional: la exención por riesgo bajo alcanza también al congelamiento previsto en la R.7":"Error: la INR.1 (nota al pie 4) dice que la plena implementación de las sanciones de la R.7 es obligatoria en todos los casos; el congelamiento no se basa en riesgo."}},{"id":"G005","tema":"m1s3","tipo":"memoria","q":"Según la Nota a la R.1, los requisitos de los Estándares del GAFI relativos al financiamiento a la proliferación se limitan a:","a":"R.1, R.2, R.7 y R.15","o":["R.1, R.6, R.7 y R.16","R.1, R.7, R.10 y R.35","R.2, R.5, R.7 y R.20","R.1, R.2, R.7 y R.15"],"x":"La nota al pie 3 de la INR.1 dice que los requisitos sobre FP se limitan a las R.1, 2, 7 y 15. La R.6 trata de sanciones por terrorismo, no de proliferación, y la R.16 no forma parte de esa lista.","ref":"INR.1, nota al pie 3 · S3","d":{"R.1, R.6, R.7 y R.16":"La R.6 es de sanciones por terrorismo, no de proliferación, y la R.16 tampoco está en la lista de la nota al pie 3 de la INR.1.","R.1, R.7, R.10 y R.35":"Las R.10 (DDC) y R.35 (sanciones) no forman parte de la lista; la nota al pie 3 de la INR.1 menciona las R.1, 2, 7 y 15.","R.2, R.5, R.7 y R.20":"Omite la R.1 y la R.15; la R.5 tipifica el FT y la R.20 regula el reporte de operaciones sospechosas, no el FP."}},{"id":"G006","tema":"m1s3","tipo":"memoria","q":"¿Qué recomendación pide que la cooperación entre las autoridades del propio país asegure que los requisitos PLD/FT/CFP sean compatibles con las reglas de protección de datos y privacidad?","a":"R.2 (Cooperación y coordinación nacional)","o":["R.9 (Leyes de secreto de las instituciones financieras)","R.40 (Otras formas de cooperación internacional)","R.2 (Cooperación y coordinación nacional)","R.21 (Revelación y confidencialidad)"],"x":"La R.2 incluye expresamente la cooperación y coordinación entre autoridades para que los requisitos PLD/FT/CFP sean compatibles con la protección de datos y privacidad. La R.9 trata de que el secreto financiero no impida aplicar las Recomendaciones, no de esa coordinación interna.","ref":"R.2 · S3","d":{"R.9 (Leyes de secreto de las instituciones financieras)":"La R.9 pide que el secreto financiero no impida aplicar las Recomendaciones; no trata de la coordinación interna con las reglas de protección de datos.","R.40 (Otras formas de cooperación internacional)":"La R.40 regula la cooperación internacional entre autoridades, no la coordinación dentro del propio país.","R.21 (Revelación y confidencialidad)":"La R.21 regula la protección de quien reporta y la prohibición de revelar un reporte, no la compatibilidad con la protección de datos."}},{"id":"G007","tema":"m1s3","tipo":"cifra","q":"Un país aplica un enfoque de umbral para definir los delitos precedentes y su sistema jurídico se basa en penas máximas. Según la Nota a la R.3, como mínimo deben incluirse los delitos castigados con pena máxima de prisión de:","a":"Más de un año","o":["Más de dos años","Más de seis meses","Más de un año","Más de tres años"],"x":"Con enfoque de umbral basado en penas máximas, la INR.3 exige incluir, al menos, los delitos con pena máxima de más de un año de prisión (o los delitos graves de la ley nacional). «Más de seis meses» es el mínimo cuando el sistema se basa en penas mínimas.","ref":"INR.3, párr. 3 · S3","d":{"Más de dos años":"El estándar no fija «más de dos años»; con penas máximas, la INR.3 habla de más de un año.","Más de seis meses":"Seis meses es el mínimo para sistemas basados en penas mínimas, no en penas máximas (INR.3, párr. 3).","Más de tres años":"El estándar no fija «más de tres años»; con penas máximas, la INR.3 habla de más de un año."}},{"id":"G008","tema":"m1s3","tipo":"cifra","q":"Ahora el sistema jurídico del país fija penas mínimas para los delitos. Con el enfoque de umbral de la Nota a la R.3, ¿qué delitos deben comprenderse, como mínimo, como precedentes?","a":"Los castigados con pena mínima de más de seis meses de prisión","o":["Los castigados con pena mínima de más de un año de prisión","Los castigados con pena mínima de más de dos años de prisión","Los castigados con pena mínima de más de seis meses de prisión","Los castigados con pena mínima de más de tres meses de prisión"],"x":"Para los países con umbral mínimo de penas, la INR.3 exige incluir todos los delitos castigados con pena mínima de más de seis meses. El año corresponde a los sistemas basados en penas máximas.","ref":"INR.3, párr. 3 · S3","d":{"Los castigados con pena mínima de más de un año de prisión":"Un año es el umbral para sistemas basados en penas máximas, no en penas mínimas (INR.3, párr. 3).","Los castigados con pena mínima de más de dos años de prisión":"El estándar no fija «más de dos años» en ningún supuesto de umbral de la INR.3.","Los castigados con pena mínima de más de tres meses de prisión":"El estándar no prevé «tres meses»; para penas mínimas, la INR.3 exige más de seis meses."}},{"id":"G009","tema":"m1s3","tipo":"caso","q":"En un juicio por LD contra Andrés, su defensa alega que no puede acreditarse que el dinero sea producto de un fraude porque nadie ha sido condenado por ese fraude. Conforme a la Nota a la R.3, ¿qué aplica?","a":"Para probar que los bienes son producto del delito no debe ser necesaria una condena por el delito precedente","o":["Para probar que los bienes son producto del delito no debe ser necesaria una condena por el delito precedente","La condena por el delito precedente sólo se exige cuando el valor de los bienes supera el umbral de USD/EUR 15,000","La condena previa por el delito precedente es indispensable, salvo que el fraude se haya cometido en otro país","El delito de LD sólo se configura si una sentencia firme declara antes el origen ilícito de cada bien involucrado"],"x":"La INR.3 dice que, al probar que los bienes son producto del delito, no debe ser necesario que alguien haya sido condenado por el delito precedente. Además, el delito de LD se extiende a cualquier bien sin importar su valor, por lo que no hay umbral de monto.","ref":"INR.3, párr. 4 · S3","d":{"La condena por el delito precedente sólo se exige cuando el valor de los bienes supera el umbral de USD/EUR 15,000":"La INR.3 (párr. 4) extiende el LD a cualquier bien sin importar su valor; USD/EUR 15,000 es el umbral de operaciones ocasionales de la R.10.","La condena previa por el delito precedente es indispensable, salvo que el fraude se haya cometido en otro país":"La INR.3 no exige condena previa en ningún caso; además, el delito precedente puede haberse cometido en otro país (párr. 5).","El delito de LD sólo se configura si una sentencia firme declara antes el origen ilícito de cada bien involucrado":"Contradice la INR.3 (párr. 4): no hace falta condena por el delito precedente para probar que los bienes son producto del delito."}},{"id":"G010","tema":"m1s3","tipo":"memoria","q":"Según la R.3, ¿con base en qué instrumentos deben los países tipificar el delito de LD?","a":"Las Convenciones de las Naciones Unidas de Viena (1988) y de Palermo (2000)","o":["La Convención contra la Corrupción (2003) y el Convenio sobre Financiación del Terrorismo (1999)","La Convención de Palermo (2000) y la Convención Interamericana contra el Terrorismo (2002)","Las Convenciones de las Naciones Unidas de Viena (1988) y de Palermo (2000)","La Convención de Viena (1988) y el Convenio sobre Ciberdelincuencia (2001)"],"x":"La R.3 y su Nota fundan el delito de LD en las Convenciones de Viena (1988) y de Palermo (2000). El Convenio sobre Financiación del Terrorismo es la base del delito de FT (R.5), y los demás instrumentos aparecen en la R.36.","ref":"R.3; INR.3, párr. 1 · S3","d":{"La Convención contra la Corrupción (2003) y el Convenio sobre Financiación del Terrorismo (1999)":"Esos instrumentos aparecen en la R.4 y la R.36; el Convenio sobre Financiación del Terrorismo es la base del delito de FT (R.5), no del de LD.","La Convención de Palermo (2000) y la Convención Interamericana contra el Terrorismo (2002)":"Mezcla Palermo con la Convención Interamericana contra el Terrorismo, que la R.36 sólo alienta a ratificar «cuando proceda».","La Convención de Viena (1988) y el Convenio sobre Ciberdelincuencia (2001)":"Mezcla Viena con el Convenio sobre Ciberdelincuencia, que la R.36 sólo alienta a ratificar «cuando proceda»."}},{"id":"G011","tema":"m1s3","tipo":"memoria","q":"¿Qué recomendación pide a los países políticas y marcos operativos que prioricen la recuperación de activos, tanto en el contexto nacional como en el internacional?","a":"R.4 (Decomiso y medidas provisionales)","o":["R.36 (Instrumentos internacionales)","R.38 (Asistencia legal mutua: congelamiento y decomiso)","R.4 (Decomiso y medidas provisionales)","R.30 (Responsabilidades de las autoridades de investigación)"],"x":"La R.4 abre con la obligación de priorizar la recuperación de activos en ambos contextos. La R.38 trata de responder a solicitudes extranjeras de congelamiento y decomiso, no de fijar esa prioridad general.","ref":"R.4 · S3","d":{"R.36 (Instrumentos internacionales)":"La R.36 pide adherirse a las convenciones internacionales; no fija la prioridad de recuperar activos.","R.38 (Asistencia legal mutua: congelamiento y decomiso)":"La R.38 regula cómo responder a solicitudes extranjeras de congelamiento y decomiso, no la prioridad general nacional e internacional.","R.30 (Responsabilidades de las autoridades de investigación)":"La R.30 asigna a las autoridades de investigación la responsabilidad de investigar y rastrear bienes, pero la prioridad de
