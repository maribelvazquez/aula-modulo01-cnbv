tegoría en ambos países","Procede concederla sin revisar la doble incriminación, porque la extradición no es coercitiva","Procede negarla, salvo que la Nota interpretativa a la R.39 amplíe la definición de LD","El requisito se tiene por satisfecho, porque ambos países tipifican la conducta subyacente"],"x":"La R.39 dice que, cuando se exija doble incriminación para extraditar, el requisito se tiene por satisfecho aunque los países ubiquen o nombren distinto el delito, siempre que ambos tipifiquen la conducta subyacente. La regla de prestar ayuda sin doble incriminación cuando no hay acciones coercitivas es de la R.37 (asistencia legal mutua), no de la extradición, y la R.39 no tiene Nota.","ref":"R.39 · S3","d":{"Procede negarla, porque el delito debe tener la misma denominación y categoría en ambos países":"La R.39 tiene por satisfecha la doble incriminación aunque cambien el nombre o la categoría del delito, si ambos tipifican la conducta.","Procede concederla sin revisar la doble incriminación, porque la extradición no es coercitiva":"Prestar ayuda sin doble incriminación cuando no hay acciones coercitivas es regla de la R.37 (asistencia legal mutua), no de la extradición.","Procede negarla, salvo que la Nota interpretativa a la R.39 amplíe la definición de LD":"La R.39 no tiene Nota interpretativa; la regla está en su propio texto."}},{"id":"G318","tema":"m1s3","tipo":"memoria","q":"¿Qué recomendación pide asegurar que el LD y el FT sean delitos extraditables y no ofrecer refugios seguros a personas acusadas de FT, actos terroristas u organizaciones terroristas?","a":"R.39 · Extradición","o":["R.39 · Extradición","R.5 · Delito de financiamiento al terrorismo","R.37 · Asistencia legal mutua","R.6 · Sanciones financieras dirigidas: terrorismo y FT"],"x":"La R.39, inciso (a), pide que el LD y el FT sean delitos extraditables, y su párrafo inicial pide no dar refugio seguro a personas acusadas de FT, actos terroristas u organizaciones terroristas. La R.5 obliga a tipificar el FT, pero no regula la extradición.","ref":"R.39, párrafo inicial e inciso (a) · S3","d":{"R.5 · Delito de financiamiento al terrorismo":"La R.5 obliga a tipificar el FT, pero no regula la extradición.","R.37 · Asistencia legal mutua":"La R.37 regula la asistencia legal mutua; los delitos extraditables y los refugios seguros son de la R.39.","R.6 · Sanciones financieras dirigidas: terrorismo y FT":"La R.6 trata del congelamiento de fondos de personas designadas, no de la extradición."}},{"id":"G319","tema":"m1s3","tipo":"caso","q":"La UIF del país A pide a la UIF del país B información sobre la empresa Tornavía. En B ya existe una investigación penal abierta sobre esa misma empresa. Según la Nota a la R.40, B:","a":"No debe negarse por ese solo motivo, salvo que la asistencia obstaculice esa investigación","o":["Debe negarse siempre, porque compartir información pondría en riesgo la investigación abierta","Puede negarse sin más, porque la Nota a la R.40 sólo prohíbe negarse por asuntos fiscales o secreto","No debe negarse por ese solo motivo, salvo que la asistencia obstaculice esa investigación","Debe remitirla a asistencia legal mutua, porque la R.40 no aplica si hay investigaciones abiertas"],"x":"La INR.40, párr. 2(c), prohíbe negar la asistencia porque haya una investigación o procedimiento en curso en el país requerido, salvo que la asistencia lo obstaculice. La misma lista incluye, además de los asuntos fiscales y el secreto de IF o APNFD, la distinta naturaleza de la contraparte, así que no se limita a esos dos motivos.","ref":"INR.40, párr. 2(c) · S3","d":{"Debe negarse siempre, porque compartir información pondría en riesgo la investigación abierta":"La INR.40, párr. 2(c), prohíbe negarse por ese solo motivo, salvo que la asistencia obstaculice la investigación.","Puede negarse sin más, porque la Nota a la R.40 sólo prohíbe negarse por asuntos fiscales o secreto":"La lista de la INR.40, párr. 2, también incluye investigaciones en curso y la distinta naturaleza de la contraparte.","Debe remitirla a asistencia legal mutua, porque la R.40 no aplica si hay investigaciones abiertas":"El estándar no prevé remitirla a asistencia legal mutua; la INR.40, párr. 2(c), regula precisamente este supuesto."}},{"id":"G320","tema":"m1s3","tipo":"trampa","q":"¿Dónde se establece que la información intercambiada en la cooperación internacional sólo debe usarse para el fin con que se pidió, y que difundirla a otras autoridades o terceros requiere autorización previa de la autoridad requerida?","a":"En la Nota interpretativa a la R.40, entre las salvaguardas de la información","o":["En la Nota interpretativa a la R.40, entre las salvaguardas de la información","En la R.37, inciso (e), que regula la autorización previa para difundirla","En el texto de la R.40, que detalla usos permitidos y la autorización previa","En la Nota interpretativa a la R.39, sobre el manejo de solicitudes de extradición"],"x":"La limitación de uso y la autorización previa para difundir están en la INR.40, párr. 3. El texto de la R.40 sólo pide procesos para resguardar la información recibida, sin esos detalles; la R.37, inciso (e), trata la confidencialidad de las solicitudes de asistencia legal mutua, y la R.39 no tiene Nota.","ref":"INR.40, párr. 3; R.40 · S3","d":{"En la R.37, inciso (e), que regula la autorización previa para difundirla":"La R.37, inciso (e), trata de la confidencialidad de las solicitudes de asistencia legal mutua, no de la autorización previa para difundir.","En el texto de la R.40, que detalla usos permitidos y la autorización previa":"El texto de la R.40 sólo pide procesos para resguardar la información; el uso limitado y la autorización previa están en la INR.40, párr. 3.","En la Nota interpretativa a la R.39, sobre el manejo de solicitudes de extradición":"La R.39 no tiene Nota interpretativa."}},{"id":"G321","tema":"m1s3","tipo":"caso","q":"El supervisor financiero del país A necesita información que conserva la UIF del país B; no son autoridades homólogas. Según la Nota a la R.40:","a":"Deben permitir el intercambio indirecto; quien pide debe aclarar el fin y por cuenta de quién lo hace","o":["No procede ningún intercambio, porque la Nota a la R.40 sólo regula la cooperación entre autoridades homólogas","Deben permitir el intercambio directo; el indirecto sólo se alienta cuando proceda","Sólo procede si la UIF de B obtiene una orden judicial y canaliza la información por asistencia legal mutua","Deben permitir el intercambio indirecto; quien pide debe aclarar el fin y por cuenta de quién lo hace"],"x":"La INR.40, párr. 21, dice que los países deben permitir el intercambio indirecto con autoridades no homólogas, y que la autoridad que pide siempre debe aclarar el fin y por cuenta de quién lo hace. El intercambio directo con no homólogas sólo «se alienta» (párr. 22): la opción que invierte los modales es falsa.","ref":"INR.40, párrs. 21 y 22 · S3","d":{"No procede ningún intercambio, porque la Nota a la R.40 sólo regula la cooperación entre autoridades homólogas":"La INR.40, párrs. 21 y 22, regula también el intercambio con autoridades no homólogas.","Deben permitir el intercambio directo; el indirecto sólo se alienta cuando proceda":"Invierte los modales: el indirecto «deben» permitirlo (párr. 21) y el directo sólo se alienta (párr. 22).","Sólo procede si la UIF de B obtiene una orden judicial y canaliza la información por asistencia legal mutua":"El estándar no prevé orden judicial ni asistencia legal mutua para esto; la INR.40 prevé el intercambio indirecto."}},{"id":"G401","tema":"m1s3","tipo":"caso","q":"El supervisor financiero de un país inspecciona a todos los bancos con la misma frecuencia e intensidad, sin atender a su perfil de riesgo. Según la Nota interpretativa a la R.26, la frecuencia e intensidad de la supervisión deben basarse en:","a":"Los riesgos de LD/FT, las políticas y controles de cada IF o grupo según su perfil de riesgo y los del país","o":["El análisis estratégico que la UIF le disemine sobre tendencias y patrones, como fija la Nota a la R.29","El tamaño de los activos de cada IF, criterio que el texto de la R.26 fija para las sujetas a los Principios Básicos","Los riesgos de LD/FT, las políticas y controles de cada IF o grupo según su perfil de riesgo y los del país","Un calendario idéntico para todas las IF, porque la Nota a la R.26 exige igualdad de trato entre supervisadas"],"x":"La INR.26 pide que la frecuencia e intensidad de la supervisión in situ y extra situ se basen en los riesgos de LD/FT, en las políticas, controles y procedimientos de la IF o grupo según el perfil de riesgo que evalúa el supervisor, y en los riesgos del país. El análisis estratégico es una función de la UIF que describe la INR.29, no un criterio para programar la supervisión.","ref":"INR.26, párr. 2 · S3","d":{"El análisis estratégico que la UIF le disemine sobre tendencias y patrones, como fija la Nota a la R.29":"El análisis estratégico es una función de la UIF (INR.29), no un criterio para fijar la frecuencia de la supervisión.","El tamaño de los activos de cada IF, criterio que el texto de la R.26 fija para las sujetas a los Principios Básicos":"Ni la R.26 ni su Nota usan el tamaño de los activos como criterio; la INR.26, párr. 2, atiende a riesgos y controles.","Un calendario idéntico para todas las IF, porque la Nota a la R.26 exige igualdad de trato entre supervisadas":"La INR.26 pide lo contrario: dirigir los recursos a donde el riesgo es mayor, según el perfil de cada IF o grupo."}},{"id":"G402","tema":"m1s3","tipo":"trampa","q":"La regla de que los supervisores financieros cuenten con recursos financieros, humanos y técnicos adecuados, y con independencia operativa y autonomía suficientes para estar libres de influencia o interferencia indebida, ¿dónde se establece?","a":"En la Nota interpretativa a la R.26, en su apartado sobre recursos","o":["En la Nota interpretativa a la R.26, en su apartado sobre recursos","En el texto de la R.27, junto a las facultades del supervisor","En la Nota interpretativa a la R.29, sobre la independencia operativa","En el texto de la R.26, junto a la prohibición de bancos pantalla"],"x":"El párrafo 6 de la INR.26 exige recursos adecuados e independencia operativa y autonomía para los supervisores financieros. La INR.29 también habla de independencia operativa, pero de la UIF, no del supervisor; y la R.27, que no tiene Nota, se limita a las facultades.","ref":"INR.26, párr. 6 · S3","d":{"En el texto de la R.27, junto a las facultades del supervisor":"La R.27, que no tiene Nota, regula las facultades del supervisor, no sus recursos ni su independencia.","En la Nota interpretativa a la R.29, sobre la independencia operativa":"La INR.29 trata de la independencia operativa de la UIF, no del supervisor financiero.","En el texto de la R.26, junto a la prohibición de bancos pantalla":"El texto de la R.26 trata de bancos pantalla y de regulación, pero los recursos y la independencia están en la INR.26, párr. 6."}},{"id":"G403","tema":"m1s3","tipo":"caso","q":"Unos inversionistas piden al país Gamma licencia para un banco que se constituirá ahí, donde sólo tendrá un agente local y personal de bajo nivel, sin afiliación a un grupo financiero regulado sujeto a supervisión consolidada efectiva. Según la R.26, Gamma debe:","a":"No aprobar su establecimiento ni su operación continua, por tratarse de un banco pantalla","o":["Aprobarlo si el agente local aplica debida diligencia reforzada a todos los clientes del banco","Aprobarlo y exigir a sus bancos corresponsales que lo monitoreen conforme al texto de la R.13","Aprobarlo como IF sujeta a los Principios Básicos, con supervisión consolidada de grupo","No aprobar su establecimiento ni su operación continua, por tratarse de un banco pantalla"],"x":"Sin mente y dirección significativas en el país y sin afiliación a un grupo regulado, es un banco pantalla (Glosario: un agente local o personal de bajo nivel no constituye presencia física), y la R.26 dice que los países no deben aprobar su establecimiento ni su operación continua. La R.13 no permite monitorearlo: prohíbe a las IF entrar o seguir en relaciones de corresponsalía con bancos pantalla.","ref":"R.26; Glosario (banco pantalla); R.13 · S3","d":{"Aprobarlo si el agente local aplica debida diligencia reforzada a todos los clientes del banco":"Un agente local no da presencia física, y la R.26 prohíbe aprobar bancos pantalla; la DDC reforzada no lo remedia.","Aprobarlo y exigir a sus bancos corresponsales que lo monitoreen conforme al texto de la R.13":"La R.13 prohíbe a las IF relaciones de corresponsalía con bancos pantalla; no prevé monitorearlos.","Aprobarlo como IF sujeta a los Principios Básicos, con supervisión consolidada de grupo":"Sin presencia física ni afiliación a un grupo supervisado es banco pantalla, y la R.26 prohíbe aprobarlo; los Principios Básicos no cambian eso."}},{"id":"G404","tema":"m1s3","tipo":"trampa","q":"De las siguientes afirmaciones sobre el enfoque basado en riesgo, ¿cuál proviene de la Nota interpretativa a la R.26 y NO del texto de la R.1?","a":"El supervisor, según su comprensión de los riesgos, asigna sus recursos a la supervisión PLD/FT","o":["Los países deben identificar, evaluar y entender sus riesgos de LD/FT y designar un mecanismo coordinador","El supervisor, según su comprensión de los riesgos, asigna sus recursos a la supervisión PLD/FT","Los países deben exigir a las IF y APNFD identificar, evaluar y mitigar sus riesgos de LD, FT y FP","Donde identifiquen riesgos menores, los países deben permitir y alentar medidas simplificadas, según corresponda"],"x":"La INR.26 define el enfoque basado en riesgo de la supervisión como el proceso general por el que el supervisor asigna sus recursos a la supervisión PLD/FT según su comprensión de los riesgos. Las otras tres afirmaciones están en el texto de la R.1, que regula el enfoque basado en riesgo del país y de las instituciones, no el del supervisor.","ref":"INR.26, párr. 1; R.1 · S3","d":{"Los países deben identificar, evaluar y entender sus riesgos de LD/FT y designar un mecanismo coordinador":"Está en el texto de la R.1: identificar, evaluar y entender riesgos y designar una autoridad o mecanismo coordinador.","Los países deben exigir a las IF y APNFD identificar, evaluar y mitigar sus riesgos de LD, FT y FP":"Está en el último párrafo del texto de la R.1, que regula el enfoque basado en riesgo de IF y APNFD.","Donde identifiquen riesgos menores, los países deben permitir y alentar medidas simplificadas, según corresponda":"Está en el texto de la R.1: ante riesgos menores, los países deben permitir y alentar medidas simplificadas."}},{"id":"G405","tema":"m1s3","tipo":"trampa","q":"Un instructor afirma que la facultad del supervisor para obligar a una IF a entregar cualquier información relevante para vigilar su cumplimiento PLD/FT está en la Nota interpretativa a la R.27. ¿Qué es lo correcto?","a":"Está en el texto de la R.27, recomendación que no tiene Nota interpretativa","o":["Está en la Nota a la R.27, que detalla las facultades de inspección y requerimiento","Está en la Nota a la R.26, en el párrafo sobre los recursos de los supervisores","Está en el texto de la R.27, recomendación que no tiene Nota interpretativa","Está en la Nota a la R.29, donde se regula la información adicional de los sujetos obligados"],"x":"La R.27 no tiene Nota interpretativa: la facultad de obligar a entregar información, junto con la de inspeccionar y sancionar, está en su propio texto. La INR.29 permite a la UIF, no al supervisor, obtener información adicional de los sujetos obligados, y la INR.26 trata de recursos e independencia, no de esta facultad.","ref":"R.27 · S3","d":{"Está en la Nota a la R.27, que detalla las facultades de inspección y requerimiento":"La R.27 no tiene Nota interpretativa: la facultad de inspeccionar, requerir información y sancionar está en el propio texto de la Recomendación.","Está en la Nota a la R.26, en el párrafo sobre los recursos de los supervisores":"La INR.26 trata del enfoque basado en riesgo de la supervisión y de los recursos e independencia del supervisor, no de la facultad de requerir información.","Está en la Nota a la R.29, donde se regula la información adicional de los sujetos obligados":"La INR.29 faculta a la UIF, no al supervisor, a obtener información adicional de los sujetos obligados para su análisis."}},{"id":"G406","tema":"m1s3","tipo":"caso","q":"Durante una inspección PLD/FT, una compañía de seguros se niega a entregar al supervisor sus expedientes de clientes, alegando que sólo los dará si antes existe un reporte de operación sospechosa sobre ellos. Según la R.27:","a":"El supervisor debe estar facultado para obligarla a entregar toda información relevante para vigilar el cumplimiento","o":["El supervisor debe estar facultado para obligarla a entregar toda información relevante para vigilar el cumplimiento","La compañía tiene razón, porque la R.27 limita los requerimientos a clientes que ya fueron reportados a la UIF","Sólo la UIF puede pedir esos expedientes, pues la Nota a la R.29 le reserva la obtención de información adicional","El supervisor sólo puede pedirlos con autorización previa del organismo autorregulador del sector de seguros"],"x":"La R.27 dice que los supervisores deben estar autorizados para obligar a las IF a entregar cualquier información relevante para vigilar el cumplimiento, sin condicionarlo a un reporte previo. La INR.29 faculta a la UIF a obtener información adicional para su análisis, pero no le reserva esa información ni limita las facultades del supervisor.","ref":"R.27 · S3","d":{"La compañía tiene razón, porque la R.27 limita los requerimientos a clientes que ya fueron reportados a la UIF":"La R.27 habla de «cualquier información» relevante para vigilar el cumplimiento; no condiciona el requerimiento a un reporte previo a la UIF.","Sólo la UIF puede pedir esos expedientes, pues la Nota a la R.29 le reserva la obtención de información adicional":"La INR.29 permite a la UIF obtener información adicional para su análisis, pero no le reserva esa información ni recorta las facultades del supervisor de la R.27.","El supervisor sólo puede pedirlos con autorización previa del organismo autorregulador del sector de seguros":"El estándar no prevé esa autorización previa; además, los organismos autorreguladores son figura de la R.28 para ciertas APNFD, no de la supervisión de IF."}},{"id":"G407","tema":"m1s3","tipo":"memoria","q":"La R.27 dice que los supervisores deben poder imponer sanciones por incumplir los requisitos PLD/FT «en línea con» otra recomendación. ¿Cuál es y qué pide?","a":"La R.35, que pide una gama de sanciones eficaces, proporcionales y disuasivas","o":["La R.26, que pide sanciones graduadas según el perfil de riesgo de cada IF supervisada","La R.34, que pide dar guías y retroalimentación a la IF antes de poder sancionarla","La R.28, que pide que las sanciones las imponga un organismo autorregulador del sector","La R.35, que pide una gama de sanciones eficaces, proporcionales y disuasivas"],"x":"La R.27 remite a la R.35 para las sanciones del supervisor, y la R.35 exige una gama de sanciones eficaces, proporcionales y disuasivas, penales, civiles o administrativas. La R.34 trata de guías y retroalimentación, pero no las pone como condición previa para sancionar.","ref":"R.27; R.35 · S3","d":{"La R.26, que pide sanciones graduadas según el perfil de riesgo de cada IF supervisada":"La R.26 regula y supervisa a las IF; la gradación según riesgo está en su Nota (INR.26). Para sanciones, la R.27 remite a la R.35.","La R.34, que pide dar guías y retroalimentación a la IF antes de poder sancionarla":"La R.34 trata de guías y retroalimentación, pero no las pone como condición previa para sancionar; la R.27 remite a la R.35.","La R.28, que pide que las sanciones las imponga un organismo autorregulador del sector":"La R.28 es para APNFD y sólo a ellas (no casinos) les permite un organismo autorregulador; la R.27, sobre supervisores de IF, remite a la R.35."}},{"id":"G408","tema":"m1s3","tipo":"trampa","q":"¿Dónde se prevé que el supervisor u organismo autorregulador impida que delincuentes sean acreditados profesionalmente o controlen una APNFD, por ejemplo evaluando a las personas con un criterio de idoneidad («fit and proper»)?","a":"En el texto de la R.28, dentro del inciso (b)","o":["En la Nota a la R.28","En el texto de la R.28, dentro del inciso (b)","En el texto de la R.26, primer párrafo","En la Nota a las R.22 y 23"],"x":"El texto de la R.28 pide al supervisor u organismo autorregulador impedir que delincuentes sean acreditados profesionalmente o tengan el control o funciones de dirección, por ejemplo con una prueba de idoneidad. La INR.28 se ocupa del enfoque basado en riesgo, las facultades y los recursos; la R.26 impide el control de IF por delincuentes, pero no habla de acreditación profesional ni de APNFD.","ref":"R.28, inciso (b), segundo párrafo · S3","d":{"En la Nota a la R.28":"Está en el texto de la R.28, no en su Nota; la INR.28 trata del enfoque basado en riesgo, las facultades y los recursos del supervisor u organismo autorregulador.","En el texto de la R.26, primer párrafo":"La R.26 impide que delincuentes controlen o dirijan IF, pero no habla de acreditación profesional, de APNFD ni de la prueba «fit and proper».","En la Nota a las R.22 y 23":"La INR.22/23 fija umbrales y aplica a las APNFD las Notas de las IF; no trata de su supervisión ni de la prueba de idoneidad."}},{"id":"G409","tema":"m1s3","tipo":"caso","q":"Un país permite operar casinos sin licencia, siempre que un organismo autorregulador de la industria del juego los vigile con un enfoque basado en riesgo. Según la R.28, este esquema:","a":"Es insuficiente, porque los casinos, como mínimo, deben tener licencia y estar efectivamente supervisados","o":["Es suficiente, porque la Nota a la R.28 permite que un organismo autorregulador supervise a cualquier APNFD","Es suficiente si el organismo exige DDC desde USD/EUR 3,000, umbral de la Nota a las R.22 y 23","Es insuficiente, porque los casinos, como mínimo, deben tener licencia y estar efectivamente supervisados","Es insuficiente, porque la Nota a la R.29 exige que los casinos sean supervisados directamente por la UIF"],"x":"La R.28, inciso (a), somete a los casinos a un régimen integral de regulación y supervisión que, como mínimo, incluye licencia y supervisión efectiva garantizada por autoridades competentes. La opción del organismo autorregulador está en el inciso (b) y sólo aplica a las demás APNFD; el umbral de USD/EUR 3,000 de la INR.22/23 es de DDC y no sustituye la licencia.","ref":"R.28, inciso (a) · S3","d":{"Es suficiente, porque la Nota a la R.28 permite que un organismo autorregulador supervise a cualquier APNFD":"La opción del organismo autorregulador está en el texto de la R.28, inciso (b), y sólo para las demás APNFD; los casinos (inciso a) requieren licencia y supervisión efectiva.","Es suficiente si el organismo exige DDC desde USD/EUR 3,000, umbral de la Nota a las R.22 y 23":"USD/EUR 3,000 es el umbral de DDC para casinos de la INR.22/23; un umbral de DDC no sustituye la licencia que exige la R.28, inciso (a).","Es insuficiente, porque la Nota a la R.29 exige que los casinos sean supervisados directamente por la UIF":"La INR.29 no asigna a la UIF la supervisión de casinos; la R.28 la encarga a autoridades competentes que garanticen licencia y supervisión efectiva."}},{"id":"G410","tema":"m1s3","tipo":"caso","q":"Un organismo autorregulador de contadores públicos va a decidir con qué frecuencia e intensidad revisa a sus miembros en materia PLD/FT. Según la Nota interpretativa a la R.28, debe basarse en:","a":"Su comprensión de los riesgos de LD/FT y las características de las APNFD, en particular su diversidad y número","o":["Su comprensión de los riesgos de LD/FT y las características de las APNFD, en particular su diversidad y número","Un mismo calendario para todos, porque el enfoque basado en riesgo de la supervisión sólo se exige en la Nota a la R.26","El análisis operativo que la UIF le disemine sobre cada despacho, según la Nota interpretativa a la R.29","El umbral de USD/EUR 15,000 de la R.10, para revisar sólo a los despachos con operaciones ocasionales mayores"],"x":"La INR.28 pide a supervisores y organismos autorreguladores fijar la frecuencia e intensidad de su supervisión o monitoreo con base en su comprensión de los riesgos de LD/FT, considerando las características de las APNFD, en particular su diversidad y número. El enfoque basado en riesgo de la supervisión no es exclusivo de la INR.26: la INR.28 lo replica para las APNFD.","ref":"INR.28, párr. 2 · S3","d":{"Un mismo calendario para todos, porque el enfoque basado en riesgo de la supervisión sólo se exige en la Nota a la R.26":"La INR.28, párr. 2, replica para las APNFD el enfoque basado en riesgo de la supervisión; no es exclusivo de la INR.26 ni admite un calendario uniforme.","El análisis operativo que la UIF le disemine sobre cada despacho, según la Nota interpretativa a la R.29":"El análisis operativo de la INR.29 sirve a la UIF para identificar objetivos y vínculos con delitos, no para fijar la intensidad de la supervisión.","El umbral de USD/EUR 15,000 de la R.10, para revisar sólo a los despachos con operaciones ocasionales mayores":"USD/EUR 15,000 es el umbral de DDC para operaciones ocasionales de la R.10; la INR.28 pide basarse en los riesgos, no en un umbral monetario."}},{"id":"G412","tema":"m1s3","tipo":"trampa","q":"Según la Nota interpretativa a la R.29, respecto de un sistema en el que las IF y APNFD reporten todas las operaciones en efectivo, nacionales e internacionales, por encima de un monto fijo, los países:","a":"Deben considerar la viabilidad y utilidad de un sistema de ese tipo","o":["Deben implementarlo con un umbral máximo de USD/EUR 15,000","Deben considerar la viabilidad y utilidad de un sistema de ese tipo","Tienen prohibido adoptarlo, porque la UIF sólo recibe reportes de operaciones sospechosas","Deben implementarlo, porque el texto de la R.29 lo incluye en la función de recepción"],"x":"El párrafo 14 de la INR.29 sólo pide considerar la viabilidad y utilidad de reportar operaciones en efectivo por encima de un monto fijo; no lo impone. El umbral máximo de USD/EUR 15,000 es el de la declaración de efectivo en frontera de la INR.32, y el párrafo 2 de la INR.29 prevé que la UIF reciba los reportes de efectivo que exija la legislación nacional.","ref":"INR.29, párrs. 14 y 2 · S3","d":{"Deben implementarlo con un umbral máximo de USD/EUR 15,000":"La INR.29 no lo impone ni fija umbral; USD/EUR 15,000 es el umbral máximo del sistema de declaración de efectivo en frontera (INR.32).","Tienen prohibido adoptarlo, porque la UIF sólo recibe reportes de operaciones sospechosas":"No hay prohibición: la INR.29, párr. 2, prevé que la UIF reciba también reportes de efectivo y otros basados en umbral cuando la ley nacional los exija.","Deben implementarlo, porque el texto de la R.29 lo incluye en la función de recepción":"El texto de la R.29 no menciona reportes de efectivo; la idea está en la Nota (INR.29, párr. 14) y sólo como algo a considerar, no obligatorio."}},{"id":"G413","tema":"m1s3","tipo":"caso","q":"Un país decide ubicar su UIF dentro de la estructura de la fiscalía. Según la Nota interpretativa a la R.29:","a":"Es posible, siempre que las funciones centrales de la UIF sean distintas de las de la fiscalía","o":["No es posible, porque la Nota exige un modelo único de UIF administrativa fuera de cualquier autoridad","Es posible, y entonces la UIF puede fusionar su análisis con la investigación penal de la fiscalía","Es posible, siempre que las funciones centrales de la UIF sean distintas de las de la fiscalía","No es posible, porque el texto de la R.29 exige que la UIF dependa del supervisor financiero"],"x":"La INR.29 permite establecer la UIF como parte de una autoridad existente, pero sus funciones centrales deben ser distintas de las de esa autoridad (párr. 9), y aclara que la R.29 no prejuzga el modelo de UIF (párr. 1). Fusionar funciones rompería esa separación y la independencia operativa.","ref":"INR.29, párrs. 1 y 9 · S3","d":{"No es posible, porque la Nota exige un modelo único de UIF administrativa fuera de cualquier autoridad":"La INR.29 dice que la R.29 no prejuzga el modelo de UIF (párr. 1) y admite ubicarla dentro de una autoridad existente (párr. 9).","Es posible, y entonces la UIF puede fusionar su análisis con la investigación penal de la fiscalía":"Invierte la condición del párr. 9 de la INR.29: dentro de otra autoridad, las funciones centrales de la UIF deben ser distintas, no fusionarse con las de ella.","No es posible, porque el texto de la R.29 exige que la UIF dependa del supervisor financiero":"El texto de la R.29 no exige que la UIF dependa del supervisor financiero; el estándar no impone ningún modelo de UIF."}},{"id":"G414","tema":"m1s3","tipo":"trampa","q":"La definición de «investigación financiera» como la indagación de los asuntos financieros vinculados a una actividad delictiva, para dimensionar redes, rastrear bienes y desarrollar pruebas, ¿dónde se encuentra?","a":"En la Nota interpretativa a la R.30","o":["En la Nota interpretativa a la R.30","En el Glosario general de las Recomendaciones","En la Nota interpretativa a la R.31","En el texto de la R.30"],"x":"El párrafo 2 de la INR.30 define la investigación financiera y el párrafo 3, la investigación financiera paralela. El texto de la R.30 usa el término pero no lo define, el Glosario general no lo incluye y la R.31 no tiene Nota interpretativa.","ref":"INR.30, párr. 2 · S3","d":{"En el Glosario general de las Recomendaciones":"El Glosario general no define «investigación financiera»; la definición está en la Nota a la R.30 (INR.30, párr. 2).","En la Nota interpretativa a la R.31":"La R.31 no tiene Nota interpretativa; la definición está en la INR.30.","En el texto de la R.30":"El texto de la R.30 usa la expresión «investigación financiera paralela», pero no la define: eso lo hace su Nota."}},{"id":"G415","tema":"m1s3","tipo":"caso","q":"Una agencia anticorrupción con facultades de aplicación de la ley detecta que un funcionario lavó sobornos. Según la Nota interpretativa a la R.30, esa agencia:","a":"Podrá ser designada para investigar ese LD, con facultades para rastrear e iniciar el congelamiento e incautación","o":["Debe limitarse a remitir el caso a la UIF, que según la Nota a la R.29 decide si abre la investigación penal por LD","Debe abstenerse, porque la R.30 reserva la investigación de LD y FT exclusivamente a la policía designada del país","Sólo puede actuar como supervisor, con las facultades de inspección y sanción que le otorga el texto de la R.27","Podrá ser designada para investigar ese LD, con facultades para rastrear e iniciar el congelamiento e incautación"],"x":"La INR.30, párr. 6, dice que las autoridades anticorrupción con facultades de aplicación de la ley pueden ser designadas para investigar el LD y FT derivados de delitos de corrupción, con facultades suficientes para identificar, rastrear e iniciar el congelamiento e incautación de bienes. La UIF analiza y disemina, pero no abre investigaciones penales.","ref":"INR.30, párr. 6 · S3","d":{"Debe limitarse a remitir el caso a la UIF, que según la Nota a la R.29 decide si abre la investigación penal por LD":"La UIF analiza y disemina; la INR.29 no le da facultad de abrir investigaciones penales por LD.","Debe abstenerse, porque la R.30 reserva la investigación de LD y FT exclusivamente a la policía designada del país":"La INR.30, párr. 6, admite designar autoridades anticorrupción con facultades de aplicación de la ley para investigar el LD; no es exclusivo de la policía.","Sólo puede actuar como supervisor, con las facultades de inspección y sanción que le otorga el texto de la R.27":"La R.27 trata de las facultades de los supervisores de IF; una autoridad anticorrupción con facultades de aplicación de la ley encaja en la R.30, no en la R.27."}},{"id":"G416","tema":"m1s3","tipo":"caso","q":"Un investigador de un fraude descubre que las ganancias se lavaron, pero su agencia no investiga LD. Según la Nota interpretativa a la R.30, quien investiga delitos precedentes debe:","a":"Estar autorizado para investigar el LD relacionado o poder remitir el caso a otra agencia que lo continúe","o":["Esperar a que exista condena firme por el fraude antes de iniciar cualquier investigación por el LD relacionado","Estar autorizado para investigar el LD relacionado o poder remitir el caso a otra agencia que lo continúe","Remitir el caso a la UIF, que conforme a la Nota a la R.29 se encarga de investigar el lavado","Cerrar la línea financiera si el fraude se cometió en el extranjero, fuera de su jurisdicción"],"x":"La INR.30, párr. 3, pide que los investigadores de delitos precedentes puedan investigar el LD o FT relacionado durante una investigación paralela, o remitir el caso a otra agencia que le dé seguimiento. El texto de la R.30 incluye los casos en que el delito precedente ocurre fuera de la jurisdicción, y la UIF no investiga: analiza y disemina.","ref":"INR.30, párr. 3; R.30 · S3","d":{"Esperar a que exista condena firme por el fraude antes de iniciar cualquier investigación por el LD relacionado":"El estándar no condiciona la investigación del LD a una condena; la INR.3, párr. 4, ni siquiera exige condena por el delito precedente para probar el origen ilícito.","Remitir el caso a la UIF, que conforme a la Nota a la R.29 se encarga de investigar el lavado":"La UIF no investiga: analiza y disemina (INR.29). La INR.30, párr. 3, habla de remitir el caso a otra agencia que continúe la investigación.","Cerrar la línea financiera si el fraude se cometió en el extranjero, fuera de su jurisdicción":"El texto de la R.30 incluye expresamente los casos en que el delito precedente ocurre fuera de la jurisdicción."}},{"id":"G417","tema":"m1s3","tipo":"trampa","q":"Las operaciones encubiertas, la intervención de comunicaciones, el acceso a sistemas informáticos y la entrega vigilada, como lista de técnicas de investigación, ¿dónde se enumeran?","a":"En el texto de la R.31, que carece de Nota interpretativa propia","o":["En la Nota interpretativa a la R.31, sobre técnicas especiales","En el texto de la R.30, dentro de la investigación financiera paralela","En el texto de la R.31, que carece de Nota interpretativa propia","En la Nota a la R.29, dentro del análisis operativo de la UIF"],"x":"Las cuatro técnicas se enumeran en el texto de la R.31, que carece de Nota interpretativa. El análisis operativo de la INR.29 es una función de la UIF, no una lista de técnicas; y aunque la INR.30, párr. 4, menciona entregas vigiladas y operaciones encubiertas, sólo lo hace para pedir que se consideren medidas para posponer detenciones o incautaciones.","ref":"R.31 · S3","d":{"En la Nota interpretativa a la R.31, sobre técnicas especiales":"La R.31 no tiene Nota interpretativa; las cuatro técnicas se enumeran en su propio texto.","En el texto de la R.30, dentro de la investigación financiera paralela":"El texto de la R.30 regula la investigación financiera paralela, no enumera técnicas; la INR.30, párr. 4, sólo menciona entregas vigiladas al hablar de posponer detenciones.","En la Nota a la R.29, dentro del análisis operativo de la UIF":"El análisis operativo de la INR.29 es una función de análisis de la UIF, no una lista de técnicas de investigación."}},{"id":"G418","tema":"m1s3","tipo":"caso","q":"Para rastrear bienes de una investigada por LD, una fiscalía pide acceso a la información de la autoridad fiscal y de los registros de inmuebles, vehículos y acciones. Según la R.31:","a":"Los países deben garantizar acceso oportuno a una amplia gama de información, que puede incluir la fiscal y la de registros de bienes","o":["Los países deben garantizar acceso oportuno a una amplia gama de información, que puede incluir la fiscal y la de registros de bienes","Sólo puede consultar información de beneficiario final, porque la Nota a la R.31 excluye la información en poder de la autoridad fiscal","Debe pedirla a la UIF, que según la Nota a la R.30 decide si la disemina a las autoridades de investigación","Sólo puede acceder a esos registros cuando exista sentencia condenatoria firme por el delito precedente"],"x":"La R.31 pide acceso oportuno a una amplia gama de información para identificar y rastrear bienes, que puede incluir, sin limitarse a ella, la información básica y de beneficiario final, la fiscal y la de registros de bienes, ciudadanía, residencia o prestaciones sociales. La R.31 no tiene Nota, y la decisión de diseminar de la UIF está en la INR.29, no en la INR.30.","ref":"R.31 · S3","d":{"Sólo puede consultar información de beneficiario final, porque la Nota a la R.31 excluye la información en poder de la autoridad fiscal":"La R.31 no tiene Nota, y su texto incluye expresamente la información de la autoridad fiscal y la de registros de bienes.","Debe pedirla a la UIF, que según la Nota a la R.30 decide si la disemina a las autoridades de investigación":"La decisión de diseminar de la UIF está en la INR.29, no en la INR.30; la R.31 pide que quien investiga tenga acceso oportuno a esa información.","Sólo puede acceder a esos registros cuando exista sentencia condenatoria firme por el delito precedente":"El estándar no condiciona ese acceso a una condena: la R.31 lo vincula a la investigación y al rastreo de bienes."}},{"id":"G419","tema":"m1s3","tipo":"caso","q":"En una investigación por LD, los fiscales necesitan que una agencia inmobiliaria entregue sus expedientes de una compraventa, catear las oficinas de una empresa y tomar declaración a dos empleados. Según la R.31, las autoridades competentes:","a":"Deben poder usar medidas obligatorias para exigir registros a IF, APNFD y otras personas, catear lugares y tomar declaraciones","o":["Sólo pueden exigir registros a las IF, porque las APNFD entregan información únicamente a su supervisor u organismo autorregulador","Sólo pueden obtener los expedientes a través del supervisor de la agencia, que los requiere con las facultades de la R.27","Necesitan que la agencia haya enviado antes un reporte de operación sospechosa sobre esa compraventa a la UIF","Deben poder usar medidas obligatorias para exigir registros a IF, APNFD y otras personas, catear lugares y tomar declaraciones"],"x":"La R.31 incluye facultades para usar medidas obligatorias para la presentación de registros en poder de IF, APNFD y otras personas físicas o morales, para catear personas y lugares, para tomar declaraciones de testigos y para incautar y obtener pruebas. Las facultades de la R.27 son del supervisor y no sustituyen las de quien investiga.","ref":"R.31 · S3","d":{"Sólo pueden exigir registros a las IF, porque las APNFD entregan información únicamente a su supervisor u organismo autorregulador":"La R.31 incluye expresamente los registros en poder de APNFD y de otras personas físicas o morales, no sólo de IF.","Sólo pueden obtener los expedientes a través del supervisor de la agencia, que los requiere con las facultades de la R.27":"Las facultades de la R.27 son del supervisor para vigilar el cumplimiento; quien investiga tiene sus propias medidas obligatorias por la R.31.","Necesitan que la agencia haya enviado antes un reporte de operación sospechosa sobre esa compraventa a la UIF":"La R.31 no condiciona las medidas obligatorias a un reporte de operación sospechosa previo; el estándar no prevé ese requisito."}},{"id":"G420","tema":"m1s3","tipo":"trampa","q":"¿Dónde se establece que las autoridades que investigan LD, delitos precedentes y FT deben poder pedir toda la información relevante que tenga la UIF?","a":"En el texto de la R.31, último párrafo","o":["En la Nota interpretativa a la R.31","En el texto de la R.31, último párrafo","En el texto de la R.29, sobre el acceso de la UIF","En la Nota interpretativa a la R.30"],"x":"La última oración de la R.31 dice que, al investigar LD, delitos precedentes y FT, las autoridades competentes deben poder pedir toda la información relevante en poder de la UIF. La R.31 no tiene Nota; el texto de la R.29 regula el acceso de la UIF a información, no el de quien investiga; y la INR.30 no lo contiene.","ref":"R.31 · S3","d":{"En la Nota interpretativa a la R.31":"La R.31 no tiene Nota interpretativa; la facultad está en la última oración de su texto.","En el texto de la R.29, sobre el acceso de la UIF":"El texto de la R.29 regula el acceso de la UIF a la información, no el acceso de quienes investigan a la información de la UIF.","En la Nota interpretativa a la R.30":"La INR.30 trata de la investigación financiera, la remisión de casos y las autoridades anticorrupción; no contiene esta facultad."}},{"id":"G421","tema":"m1s3","tipo":"caso","q":"Una policía detecta un envío de dinero ilícito y, en vez de detener al mensajero, deja que continúe bajo vigilancia para identificar a los receptores. ¿Qué afirmación es correcta según los estándares?","a":"La entrega vigilada figura en la R.31, y la Nota a la R.30 pide considerar medidas para posponer la detención que la hacen posible","o":["La entrega vigilada está regulada en la Nota interpretativa a la R.31, que la limita a los casos de financiamiento al terrorismo","La R.30 obliga a detener de inmediato a todo sospechoso, por lo que la entrega vigilada contraviene los estándares del GAFI en todos los casos","La entrega vigilada figura en la R.31, y la Nota a la R.30 pide considerar medidas para posponer la detención que la hacen posible","La entrega vigilada sólo es válida si la UIF la autoriza previamente, conforme a su independencia operativa de la Nota a la R.29"],"x":"La R.31 enumera la entrega vigilada entre las técnicas de investigación. La INR.30, párr. 4, pide a los países considerar medidas para posponer o no realizar la detención o la incautación con el fin de identificar a los involucrados o reunir pruebas, pues sin ellas no pueden usarse entregas vigiladas ni operaciones encubiertas. La R.31 no tiene Nota.","ref":"R.31; INR.30, párr. 4 · S3","d":{"La entrega vigilada está regulada en la Nota interpretativa a la R.31, que la limita a los casos de financiamiento al terrorismo":"La R.31 no tiene Nota; la entrega vigilada está en su texto y no se limita al FT: abarca investigaciones de LD, delitos precedentes y FT.","La R.30 obliga a detener de inmediato a todo sospechoso, por lo que la entrega vigilada contraviene los estándares del GAFI en todos los casos":"Al contrario: la INR.30, párr. 4, pide considerar medidas para posponer o no realizar la detención, precisamente para permitir entregas vigiladas.","La entrega vigilada sólo es válida si la UIF la autoriza previamente, conforme a su independencia operativa de la Nota a la R.29":"El estándar no prevé esa autorización; la independencia operativa de la INR.29 se refiere a las funciones propias de la UIF, no a técnicas policiales."}},{"id":"G422","tema":"m1s3","tipo":"caso","q":"En un país, los viajeros no presentan por adelantado ninguna declaración, escrita ni oral, pero deben dar información veraz sobre el efectivo que llevan cuando la autoridad se la pide. Según la Nota interpretativa a la R.32, se trata de:","a":"Un sistema de revelación, que la Nota admite para cumplir la R.32","o":["Un sistema de revelación, que la Nota admite para cumplir la R.32","Un sistema de declaración oral, como el de canal rojo y canal verde","Un sistema inválido, porque la R.32 exige siempre una declaración escrita","Un sistema de declaración escrita para quienes superan el umbral"],"x":"La INR.32, párr. 4, describe el sistema de revelación: no hay declaración previa, escrita ni oral, pero el viajero debe responder con veracidad cuando la autoridad lo pide. En la declaración oral, en cambio, el viajero debe declarar activamente (usualmente, eligiendo el canal rojo o el verde); y la R.32 admite un sistema de declaración y/o de revelación.","ref":"INR.32, párr. 4; R.32 · S3","d":{"Un sistema de declaración oral, como el de canal rojo y canal verde":"En la declaración oral el viajero debe declarar activamente, p. ej. eligiendo canal rojo o verde (INR.32, párr. 3(c)); aquí no hay declaración previa.","Un sistema inválido, porque la R.32 exige siempre una declaración escrita":"La R.32 admite un sistema de declaración y/o de revelación; no exige siempre una declaración escrita.","Un sistema de declaración escrita para quienes superan el umbral":"En la declaración escrita con umbral el viajero llena un formulario por adelantado; aquí sólo responde cuando la autoridad le pregunta."}},{"id":"G423","tema":"m1s3","tipo":"caso","q":"Un país aplica un sistema de declaración escrita a quienes entran con efectivo y un sistema de revelación a quienes salen. Según los estándares:","a":"Es válido, porque la Nota a la R.32 dice que no tienen que usar el mismo tipo de sistema para entrar y para salir","o":["No es válido, porque el texto de la R.32 exige usar el mismo tipo de sistema para la entrada y para la salida","No es válido, porque la Nota a la R.32 exige controlar sólo la entrada de efectivo e instrumentos al portador","Es válido sólo si ambos sistemas usan el umbral de USD/EUR 15,000 que fija el texto de la R.10 para la DDC","Es válido, porque la Nota a la R.32 dice que no tienen que usar el mismo tipo de sistema para entrar y para salir"],"x":"La INR.32, párr. 2, dice que los países no tienen que usar el mismo tipo de sistema para el transporte entrante y el saliente, siempre que tanto la entrada como la salida queden cubiertas (párr. 5a). El umbral máximo de USD/EUR 15,000 del sistema de declaración está en la INR.32, no en la R.10.","ref":"INR.32, párrs. 2 y 5(a) · S3","d":{"No es válido, porque el texto de la R.32 exige usar el mismo tipo de sistema para la entrada y para la salida":"Ni la R.32 ni su Nota lo exigen: la INR.32, párr. 2, dice expresamente que no hace falta el mismo tipo de sistema para entrada y salida.","No es válido, porque la Nota a la R.32 exige controlar sólo la entrada de efectivo e instrumentos al portador":"Invierte la Nota: la INR.32, párr. 5(a), exige que el sistema cubra tanto la entrada como la salida.","Es válido sólo si ambos sistemas usan el umbral de USD/EUR 15,000 que fija el texto de la R.10 para la DDC":"El USD/EUR 15,000 de la R.10 es para DDC en operaciones ocasionales; el umbral máximo del sistema de declaración de efectivo está en la INR.32, párr. 3."}},{"id":"G424","tema":"m1s3","tipo":"caso","q":"Un viajero cruza la frontera con efectivo por encima del umbral y no lo declara, como exige el sistema de declaración del país. No hay otro indicio de LD o FT. Según la Nota a la R.32, las autoridades:","a":"Deben poder detener o retener el efectivo por un tiempo razonable para determinar si hay pruebas de LD o FT","o":["Deben devolverlo de inmediato, porque sin sospecha de LD o FT la Nota a la R.32 no permite retenerlo","Deben poder detener o retener el efectivo por un tiempo razonable para determinar si hay pruebas de LD o FT","Deben decomisarlo en el acto, porque según la R.32 toda declaración falsa conlleva el decomiso inmediato del efectivo","Sólo pueden multarlo, porque omitir la declaración no se considera declaración falsa según la Nota a la R.32"],"x":"La INR.32, párr. 5(e), prevé detener o retener efectivo por un tiempo razonable cuando hay sospecha de LD/FT o cuando hay declaración falsa, y su glosario incluye en la declaración falsa no declarar cuando se debe. El decomiso de la R.32 se prevé para el efectivo relacionado con FT, LD o delitos precedentes; la declaración falsa, por sí sola, lleva a sanciones.","ref":"INR.32, párr. 5(e) y glosario de la INR.32; R.32 · S3","d":{"Deben devolverlo de inmediato, porque sin sospecha de LD o FT la Nota a la R.32 no permite retenerlo":"No declarar cuando se debe es «declaración falsa» (glosario de la INR.32), y el párr. 5(e) permite retener el efectivo en ese caso aun sin otra sospecha.","Deben decomisarlo en el acto, porque según la R.32 toda declaración falsa conlleva el decomiso inmediato del efectivo":"La R.32 prevé el decomiso para efectivo relacionado con FT, LD o delitos precedentes; la declaración falsa por sí sola lleva a sanciones y a retención temporal.","Sólo pueden multarlo, porque omitir la declaración no se considera declaración falsa según la Nota a la R.32":"El glosario de la INR.32 incluye en la declaración falsa el no declarar cuando se debe; y las sanciones no excluyen la retención del párr. 5(e)."}},{"id":"G425","tema":"m1s3","tipo":"trampa","q":"Un manual afirma que los rubros de estadísticas (reportes de operaciones sospechosas, investigaciones, procesos y condenas, bienes congelados, incautados y decomisados, y solicitudes de cooperación) se enumeran en la Nota interpretativa a la R.33. ¿Qué es lo correcto?","a":"Se enumeran en el propio texto de la R.33, que no tiene Nota interpretativa","o":["Se enumeran en la Nota a la R.33, que desglosa los rubros estadísticos mínimos","Se enumeran en la Nota a la R.29, dentro de la función de recepción de la UIF","Se enumeran en el propio texto de la R.33, que no tiene Nota interpretativa","Se enumeran en la Nota a la R.1, como insumo de la evaluación de riesgos"],"x":"La R.33 no tiene Nota interpretativa: los rubros de estadísticas están en su propio texto. La INR.29 describe la recepción de reportes por la UIF y la INR.1 la evaluación de riesgos, pero ninguna enumera estadísticas.","ref":"R.33 · S3","d":{"Se enumeran en la Nota a la R.33, que desglosa los rubros estadísticos mínimos":"La R.33 no tiene Nota interpretativa; los rubros de estadísticas están en su propio texto.","Se enumeran en la Nota a la R.29, dentro de la función de recepción de la UIF":"La INR.29 describe la recepción de reportes por la UIF, pero no enumera rubros estadísticos.","Se enumeran en la Nota a la R.1, como insumo de la evaluación de riesgos":"La INR.1 trata de la evaluación de riesgos y el enfoque basado en riesgo; no contiene la lista de estadísticas."}},{"id":"G426","tema":"m1s3","tipo":"caso","q":"Un país lleva estadísticas de investigaciones, procesos y condenas por LD, pero no por FT, porque considera que el terrorismo se mide con otros indicadores. Según la R.33:","a":"Debe llevarlas también por FT, porque la R.33 incluye investigaciones, procesos y condenas de LD y de FT","o":["Debe llevarlas también por FT, porque la R.33 incluye investigaciones, procesos y condenas de LD y de FT","Cumple, porque las estadísticas de FT se regulan por separado en la Nota interpretativa a la R.5, no en la R.33","Cumple, porque la R.33 sólo cubre LD y el FT se mide con los congelamientos de la R.6","Incumple sólo en condenas; las investigaciones de FT se contabilizan según la Nota a la R.30"],"x":"La R.33 pide estadísticas sobre investigaciones, procesos y condenas tanto de LD como de FT. Ni la INR.5 ni la INR.30 contienen reglas estadísticas: la obligación completa está en el texto de la R.33, que no tiene Nota.","ref":"R.33 · S3","d":{"Cumple, porque las estadísticas de FT se regulan por separado en la Nota interpretativa a la R.5, no en la R.33":"La INR.5 trata del delito de FT, no de estadísticas; la obligación completa está en el texto de la R.33, que no tiene Nota.","Cumple, porque la R.33 sólo cubre LD y el FT se mide con los congelamientos de la R.6":"La R.33 cubre expresamente investigaciones, procesos y condenas de LD y de FT; los bienes congelados son otro rubro, no un sustituto.","Incumple sólo en condenas; las investigaciones de FT se contabilizan según la Nota a la R.30":"La INR.30 no regula estadísticas, y la R.33 pide investigaciones, procesos y condenas tanto de LD como de FT."}},{"id":"G427","tema":"m1s3","tipo":"memoria","q":"Según la R.33, las estadísticas sobre reportes de operaciones sospechosas deben abarcar:","a":"Tanto los recibidos como los diseminados","o":["Sólo los reportes que derivaron en condena","Sólo los recibidos por la UIF, por sector","Los reportes que las IF analizaron y descartaron","Tanto los recibidos como los diseminados"],"x":"La R.33 pide estadísticas sobre los reportes de operaciones sospechosas recibidos y diseminados, y aparte sobre investigaciones, procesos y condenas por LD y FT. No limita la medición a los que terminan en condena ni a lo que recibe la UIF.","ref":"R.33 · S3","d":{"Sólo los reportes que derivaron en condena":"La R.33 pide estadísticas de reportes recibidos y diseminados; las condenas son un rubro aparte, no un filtro de los reportes.","Sólo los recibidos por la UIF, por sector":"Se queda corta: la R.33 incluye también los reportes diseminados, y no habla de un desglose por sector.","Los reportes que las IF analizaron y descartaron":"El estándar no prevé estadísticas de reportes analizados y descartados por las IF; la R.33 habla de los recibidos y diseminados."}},{"id":"G428","tema":"m1s3","tipo":"trampa","q":"La obligación de establecer guías y dar retroalimentación que ayuden a las IF y APNFD, en particular a detectar y reportar operaciones sospechosas, ¿dónde se establece?","a":"En el texto de la R.34","o":["En la Nota a la R.34","En el texto de la R.34","En la Nota interpretativa a la R.20","En la Nota interpretativa a la R.29"],"x":"La guía y la retroalimentación a IF y APNFD están en el texto de la R.34, que no tiene Nota interpretativa. La INR.20 regula el reporte (intentadas, sin importar el monto) y la INR.29 las funciones de la UIF, pero ninguna contiene esta obligación.","ref":"R.34 · S3","d":{"En la Nota a la R.34":"La R.34 no tiene Nota interpretativa; la obligación está en su texto.","En la Nota interpretativa a la R.20":"La INR.20 trata del reporte de operaciones sospechosas que hacen las IF, no de las guías y retroalimentación que deben dar las autoridades.","En la Nota interpretativa a la R.29":"La INR.29 regula las funciones de la UIF; no contiene la obligación de establecer guías y dar retroalimentación."}},{"id":"G429","tema":"m1s3","tipo":"caso","q":"Un colegio de notarios, que actúa como organismo autorregulador, se niega a emitir guías PLD/FT para sus miembros porque, según el Glosario, no es una autoridad competente. Según la R.34:","a":"Debe hacerlo: la R.34 incluye expresamente a los organismos autorreguladores, junto con autoridades competentes y supervisores","o":["Tiene razón: la R.34 sólo obliga a las autoridades competentes, y el Glosario excluye de ellas a los organismos autorreguladores","Tiene razón: dar guías y retroalimentación sobre reportes corresponde en exclusiva a la UIF que recibe esos reportes","Debe hacerlo: la R.34 incluye expresamente a los organismos autorreguladores, junto con autoridades competentes y supervisores","Debe hacerlo sólo si el país lo designó supervisor de notarios bajo la R.28; si no, la obligación recae en la UIF"],"x":"El Glosario aclara que los organismos autorreguladores no son autoridades competentes, pero la R.34 nombra por separado a las autoridades competentes, los supervisores y los organismos autorreguladores como obligados a establecer guías y dar retroalimentación. No es tarea exclusiva de la UIF.","ref":"R.34; Glosario · S3","d":{"Tiene razón: la R.34 sólo obliga a las autoridades competentes, y el Glosario excluye de ellas a los organismos autorreguladores":"Aunque el Glosario no los considera autoridades competentes, la R.34 nombra por separado a los organismos autorreguladores como obligados.","Tiene razón: dar guías y retroalimentación sobre reportes corresponde en exclusiva a la UIF que recibe esos reportes":"La R.34 obliga a autoridades competentes, supervisores y organismos autorreguladores; no es tarea exclusiva de la UIF.","Debe hacerlo sólo si el país lo designó supervisor de notarios bajo la R.28; si no, la obligación recae en la UIF":"La R.34 no condiciona la obligación a una designación bajo la R.28 ni la traslada a la UIF: nombra directamente a los organismos autorreguladores."}},{"id":"G430","tema":"m1s3","tipo":"caso","q":"Las autoridades de un país publican guías para detectar operaciones sospechosas dirigidas sólo a bancos y casas de bolsa, y nunca a joyerías, agentes inmobiliarios ni contadores. A la luz de la R.34:","a":"Es insuficiente, porque las guías y la retroalimentación deben asistir tanto a las IF como a las APNFD","o":["Es insuficiente, porque las guías y la retroalimentación deben asistir tanto a las IF como a las APNFD","Es suficiente, porque las guías a las APNFD las regula la Nota interpretativa a las R.22 y 23 y no la R.34","Es suficiente, porque la R.34 sólo pide guías para las IF sujetas a los Principios Básicos","Es insuficiente, pero sólo para joyerías, pues son las únicas APNFD con umbral en efectivo"],"x":"La R.34 pide guías y retroalimentación que asistan a las IF y a las APNFD en la aplicación de las medidas nacionales PLD/FT, en particular para detectar y reportar operaciones sospechosas. No distingue entre sectores ni remite a los Principios Básicos, que son materia de la R.26.","ref":"R.34 · S3","d":{"Es suficiente, porque las guías a las APNFD las regula la Nota interpretativa a las R.22 y 23 y no la R.34":"La INR.22/23 fija umbrales y aplica a las APNFD las Notas de las IF; no regula las guías de las autoridades. La R.34 cubre expresamente a las APNFD.","Es suficiente, porque la R.34 sólo pide guías para las IF sujetas a los Principios Básicos":"La R.34 no menciona los Principios Básicos (eso es de la R.26) y cubre tanto a IF como a APNFD.","Es insuficiente, pero sólo para joyerías, pues son las únicas APNFD con umbral en efectivo":"La R.34 no distingue entre APNFD; además, no sólo las joyerías tienen umbral: los casinos tienen el de USD/EUR 3,000 (INR.22/23)."}},{"id":"G431","tema":"m1s3","tipo":"memoria","q":"Según la R.35, las sanciones deben poder aplicarse a las personas físicas o morales que incumplan los requisitos PLD/FT y que estén cubiertas por:","a":"Las R.6 y 8 a 23","o":["Las R.10 a 23","Las R.6 a 23, incluida la R.7","Las R.1 a 40","Las R.6 y 8 a 23"],"x":"La R.35 se refiere a las personas cubiertas por las R.6 y 8 a 23: incluye las sanciones financieras dirigidas por terrorismo (R.6), las OSFL (R.8) y las medidas preventivas (R.9 a 23), y deja fuera la R.7. Limitarla a las R.10 a 23 omitiría las R.6, 8 y 9.","ref":"R.35 · S3","d":{"Las R.10 a 23":"Omite las R.6, 8 y 9: la R.35 se refiere a las personas cubiertas por las R.6 y 8 a 23.","Las R.6 a 23, incluida la R.7":"La R.35 se salta la R.7: dice «R.6 y 8 a 23», no «6 a 23».","Las R.1 a 40":"La R.35 no abarca todo el estándar; se limita a las personas cubiertas por las R.6 y 8 a 23."}},{"id":"G432","tema":"m1s3","tipo":"trampa","q":"¿Dónde se establece que las sanciones PLD/FT pueden ser penales, civiles o administrativas y deben poder aplicarse no sólo a las IF y APNFD, sino también a sus directivos y alta dirección?","a":"En el texto de la R.35","o":["En la Nota a la R.35","En el texto de la R.35","En el texto de la R.27, sobre facultades","En la Nota interpretativa a la R.28"],"x":"Ambos elementos están en el texto de la R.35, que no tiene Nota interpretativa. La R.27 da al supervisor la facultad de sancionar y remite a la R.35, y la INR.28 habla de facultades para sancionar de supervisores y organismos autorreguladores, pero ninguna menciona a directivos y alta dirección.","ref":"R.35 · S3","d":{"En la Nota a la R.35":"La R.35 no tiene Nota interpretativa; ambos elementos están en su texto.","En el texto de la R.27, sobre facultades":"La R.27 da al supervisor la facultad de sancionar y remite a la R.35, pero no menciona a directivos ni alta dirección.","En la Nota interpretativa a la R.28":"La INR.28 menciona facultades para sancionar de supervisores u organismos autorreguladores, pero no los tipos de sanción ni a directivos y alta dirección."}},{"id":"G433","tema":"m1s3","tipo":"caso","q":"La ley de un país sólo permite al supervisor revocar la licencia de una IF, sea cual sea la gravedad del incumplimiento PLD/FT; no prevé multas, amonestaciones ni otras medidas. Según la R.35:","a":"Es insuficiente, porque debe existir una gama de sanciones eficaces, proporcionales y disuasivas, no una sola","o":["Es suficiente, porque la R.35 sólo pide que las sanciones sean disuasivas y revocar la licencia lo es","Es suficiente, siempre que la Nota interpretativa a la R.35 admita la revocación como sanción única","Es insuficiente, porque debe existir una gama de sanciones eficaces, proporcionales y disuasivas, no una sola","Es insuficiente, porque sólo la Nota a la R.26 permite retirar licencias y la R.35 no lo admite"],"x":"La R.35 exige una gama de sanciones eficaces, proporcionales y disuasivas; una única sanción máxima no es proporcional a incumplimientos menores. La R.35 no tiene Nota, y la facultad de retirar, restringir o suspender la licencia está en el texto de la R.27, no en la INR.26.","ref":"R.35; R.27 · S3","d":{"Es suficiente, porque la R.35 sólo pide que las sanciones sean disuasivas y revocar la licencia lo es":"La R.35 pide una gama de sanciones eficaces, proporcionales y disuasivas; que una sola sea disuasiva no basta.","Es suficiente, siempre que la Nota interpretativa a la R.35 admita la revocación como sanción única":"La R.35 no tiene Nota interpretativa.","Es insuficiente, porque sólo la Nota a la R.26 permite retirar licencias y la R.35 no lo admite":"La facultad de retirar, restringir o suspender la licencia está en el texto de la R.27, no en la INR.26, y es compatible con la R.35."}},{"id":"E001","tema":"m1s3","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.1?","a":"Las IF y APNFD deberían considerar diferenciar el alcance de las medidas por factor de riesgo; p. ej., DDC normal al aceptar al cliente y simplificada o reforzada en el monitoreo","o":["Las IF y APNFD deberían considerar diferenciar el alcance de las medidas por factor de riesgo; p. ej., DDC normal al aceptar al cliente y simplificada o reforzada en el monitoreo","Entre las medidas simplificadas posibles están reducir la frecuencia de actualización de la identificación del cliente y el grado de monitoreo continuo, con base en un umbral monetario razonable","La evaluación del perfil de riesgo de LD/FT de una IF o de un grupo debe revisarse periódicamente y también cuando haya eventos o cambios importantes en su administración y operaciones","Las IF deben evaluar los riesgos de LD/FT de nuevos productos, prácticas comerciales y tecnologías antes de su lanzamiento, y tomar medidas apropiadas para gestionarlos y mitigarlos"],"x":"La INR.1, párr. 16, pide a las IF y APNFD considerar diferenciar el alcance de las medidas según el tipo y nivel de riesgo de cada factor, con el ejemplo de DDC normal en la aceptación y simplificada o reforzada en el monitoreo. Las demás afirmaciones son ciertas pero de otras disposiciones: los ejemplos de medidas simplificadas están en la INR.10 (párr. 21), la revisión del perfil de riesgo en la INR.26 (párr. 3) y la evaluación previa al lanzamiento en la R.15.","ref":"INR.1, párr. 16 · S3","d":{"Entre las medidas simplificadas posibles están reducir la frecuencia de actualización de la identificación del cliente y el grado de monitoreo continuo, con base en un umbral monetario razonable":"Es un ejemplo de DDC simplificada de la INR.10, párr. 21, no de la INR.1.","La evaluación del perfil de riesgo de LD/FT de una IF o de un grupo debe revisarse periódicamente y también cuando haya eventos o cambios importantes en su administración y operaciones":"Es de la INR.26, párr. 3, sobre la supervisión de IF basada en riesgo.","Las IF deben evaluar los riesgos de LD/FT de nuevos productos, prácticas comerciales y tecnologías antes de su lanzamiento, y tomar medidas apropiadas para gestionarlos y mitigarlos":"Está en el texto de la R.15 (nuevas tecnologías), no en la INR.1."}},{"id":"E002","tema":"m1s3","tipo":"trampa","q":"¿Cuál de estos enunciados aparece en el texto de la R.1 y no sólo en su Nota interpretativa?","a":"Los países deben designar una autoridad o mecanismo que coordine las acciones para evaluar los riesgos de LD/FT","o":["Si un país detecta sectores en riesgo de LD/FT que no son IF ni APNFD, debería considerar aplicarles requisitos PLD/FT","Las autoridades competentes o los organismos autorreguladores pueden determinar que no se requieren evaluaciones de riesgo documentadas individuales si los riesgos del sector están claramente identificados y entendidos","La evaluación nacional de riesgos debe mantenerse actualizada y servir, entre otros fines, para informar posibles cambios a las leyes y reglamentos del país","Los países deben designar una autoridad o mecanismo que coordine las acciones para evaluar los riesgos de LD/FT"],"x":"El texto de la R.1 pide identificar, evaluar y entender los riesgos y tomar acción, «incluida la designación de una autoridad o mecanismo para coordinar las acciones de evaluación de riesgos». La extensión a sectores no cubiertos, la dispensa de evaluaciones documentadas y la actualización y fines de la evaluación nacional sólo aparecen en la Nota (INR.1, párrs. 2, 12 y 5).","ref":"R.1; INR.1, párrs. 2, 5 y 12 · S3","d":{"Si un país detecta sectores en riesgo de LD/FT que no son IF ni APNFD, debería considerar aplicarles requisitos PLD/FT":"Está sólo en la Nota (INR.1, párr. 2), no en el texto de la R.1.","Las autoridades competentes o los organismos autorreguladores pueden determinar que no se requieren evaluaciones de riesgo documentadas individuales si los riesgos del sector están claramente identificados y entendidos":"Está sólo en la Nota (INR.1, párr. 12), no en el texto de la R.1.","La evaluación nacional de riesgos debe mantenerse actualizada y servir, entre otros fines, para informar posibles cambios a las leyes y reglamentos del país":"Está sólo en la Nota (INR.1, párr. 5); el texto de la R.1 no habla de mantener actualizada la evaluación ni de sus fines."}},{"id":"E003","tema":"m1s3","tipo":"caso","q":"La evaluación nacional de riesgos de un país concluye que sus relaciones con PEP extranjeras presentan un riesgo sólo moderado, y el regulador propone que las IF apliquen únicamente algunas de las medidas reforzadas que exige la R.12. Según la Nota a la R.1, ¿qué procede?","a":"Aplicar todas las medidas reforzadas que exige la R.12, aunque su alcance pueda variar según el nivel concreto de riesgo","o":["Permitir que el regulador elija qué medidas de la R.12 se aplican, siempre que lo documente en la evaluación nacional de riesgos","Sustituir las medidas reforzadas por DDC simplificada, porque el riesgo identificado por el país no es alto sino moderado","Aplicar todas las medidas reforzadas que exige la R.12, aunque su alcance pueda variar según el nivel concreto de riesgo","Exentar a las IF de la R.12 en circunstancias limitadas y justificadas, ya que la evaluación nacional respalda un riesgo menor"],"x":"La INR.1, párr. 6, dice que cuando las Recomendaciones identifican actividades de mayor riesgo que exigen medidas reforzadas o específicas, todas esas medidas deben aplicarse, aunque su alcance puede variar según el nivel concreto de riesgo. La exención del párr. 8 exige un riesgo bajo evaluado, no moderado, y no permite escoger sólo una parte de las medidas.","ref":"INR.1, párrs. 6 y 8 · S3","d":{"Permitir que el regulador elija qué medidas de la R.12 se aplican, siempre que lo documente en la evaluación nacional de riesgos":"La INR.1, párr. 6, exige aplicar todas las medidas reforzadas que pide la Recomendación; el regulador no puede escoger sólo algunas.","Sustituir las medidas reforzadas por DDC simplificada, porque el riesgo identificado por el país no es alto sino moderado":"Riesgo moderado no es riesgo bajo, y la R.12 es actividad de mayor riesgo: sus medidas reforzadas deben aplicarse todas (INR.1, párr. 6).","Exentar a las IF de la R.12 en circunstancias limitadas y justificadas, ya que la evaluación nacional respalda un riesgo menor":"La exención de la INR.1, párr. 8, exige un riesgo bajo evaluado, no moderado, y en circunstancias limitadas y justificadas."}},{"id":"E004","tema":"m1s3","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.2?","a":"Los mecanismos de cooperación operativa entre autoridades nacionales pueden incluir medidas prácticas como equipos conjuntos o plataformas de datos compartidas","o":["Los países deben revisar su régimen de recuperación de activos para asegurar su eficacia continua y darle recursos suficientes para perseguirla","La unidad debe ser operativamente independiente y autónoma, con el derecho propio de remitir o diseminar información a las autoridades competentes","Las autoridades de aplicación de la ley deben poder formar equipos conjuntos de investigación con contrapartes extranjeras para realizar investigaciones cooperativas","Los mecanismos de cooperación operativa entre autoridades nacionales pueden incluir medidas prácticas como equipos conjuntos o plataformas de datos compartidas"],"x":"La INR.2, párr. 4(c), menciona como mecanismos prácticos para facilitar el trabajo interinstitucional los equipos conjuntos o las plataformas de datos compartidas. La revisión del régimen de recuperación de activos es de la INR.4 (párr. 1), la independencia operativa de la UIF de la INR.29 (párr. 8) y los equipos conjuntos con contrapartes extranjeras de la INR.40 (párr. 17), que es cooperación internacional, no nacional.","ref":"INR.2, párr. 4(c) · S3","d":{"Los países deben revisar su régimen de recuperación de activos para asegurar su eficacia continua y darle recursos suficientes para perseguirla":"Es de la INR.4, párr. 1, sobre recuperación de activos.","La unidad debe ser operativamente independiente y autónoma, con el derecho propio de remitir o diseminar información a las autoridades competentes":"Es de la INR.29, párr. 8, sobre la independencia operativa de la UIF.","Las autoridades de aplicación de la ley deben poder formar equipos conjuntos de investigación con contrapartes extranjeras para realizar investigaciones cooperativas":"Es de la INR.40 (párr. 17): los equipos conjuntos con contrapartes extranjeras son cooperación internacional, no nacional."}},{"id":"E005","tema":"m1s3","tipo":"caso","q":"En un proceso por LD no hay confesión ni documento que pruebe que Arturo sabía que el dinero provenía de un delito; sólo hay circunstancias como operaciones fraccionadas, pagos en efectivo sin justificación y uso de terceros. Según la Nota a la R.3, ¿cómo puede acreditarse el conocimiento?","a":"Puede inferirse de circunstancias fácticas objetivas","o":["Puede inferirse de circunstancias fácticas objetivas","Sólo con prueba directa, como una confesión o un documento firmado, porque el LD exige un dolo plenamente acreditado","Sólo si antes se obtuvo una condena por el delito precedente que generó los fondos y se probó su participación en él","Mediante la presunción legal de que todo uso de efectivo fraccionado constituye LD, salvo prueba en contrario a cargo de Arturo"],"x":"La INR.3, párr. 7(a), pide asegurar que la intención y el conocimiento requeridos para probar el LD puedan inferirse de circunstancias fácticas objetivas. No exige prueba directa ni condena previa por el delito precedente (párr. 4), y tampoco establece presunciones automáticas de culpabilidad.","ref":"INR.3, párr. 7(a) · S3","d":{"Sólo con prueba directa, como una confesión o un documento firmado, porque el LD exige un dolo plenamente acreditado":"La INR.3, párr. 7(a), permite inferir intención y conocimiento de circunstancias fácticas objetivas; no exige prueba directa.","Sólo si antes se obtuvo una condena por el delito precedente que generó los fondos y se probó su participación en él":"La INR.3, párr. 4, dice que no es necesaria una condena por el delito precedente para probar que los bienes son producto del delito.","Mediante la presunción legal de que todo uso de efectivo fraccionado constituye LD, salvo prueba en contrario a cargo de Arturo":"El estándar no prevé presunciones automáticas de LD; la inversión de carga de la INR.4, párr. 12, es para el decomiso, no para probar el delito."}},{"id":"E006","tema":"m1s3","tipo":"caso","q":"La defensa de una persona procesada por LD alega que los bienes lavados valen apenas USD 800 y que sólo una parte proviene, de forma indirecta, de un robo. De acuerdo con la Nota a la R.3, ¿qué alcance debe tener el delito de LD?","a":"Debe extenderse a cualquier tipo de bien que represente directa o indirectamente el producto del delito, sin importar su valor","o":["Debe aplicarse sólo a bienes cuyo valor supere el umbral designado de USD/EUR 15,000, para concentrar los recursos en casos relevantes","Debe abarcar únicamente los bienes que representan directamente el producto del delito; los indirectos corresponden al decomiso por valor equivalente","Debe extenderse a cualquier tipo de bien que represente directa o indirectamente el producto del delito, sin importar su valor","Puede limitarse a efectivo y valores, siempre que el país incluya una gama de delitos dentro de cada una de las categorías designadas"],"x":"La INR.3, párr. 4, dice que el delito de LD debe extenderse a cualquier tipo de bien, independientemente de su valor, que represente directa o indirectamente el producto del delito. El umbral de USD/EUR 15,000 es el de la DDC para operaciones ocasionales (R.10), no un límite del tipo penal.","ref":"INR.3, párr. 4 · S3","d":{"Debe aplicarse sólo a bienes cuyo valor supere el umbral designado de USD/EUR 15,000, para concentrar los recursos en casos relevantes":"USD/EUR 15,000 es el umbral de DDC para operaciones ocasionales (R.10); el delito de LD aplica sin importar el valor (INR.3, párr. 4).","Debe abarcar únicamente los bienes que representan directamente el producto del delito; los indirectos corresponden al decomiso por valor equivalente":"La INR.3, párr. 4, incluye bienes que representen directa o indirectamente el producto; el valor equivalente es figura del decomiso (R.4), no un límite del delito.","Puede limitarse a efectivo y valores, siempre que el país incluya una gama de delitos dentro de cada una de las categorías designadas":"Mezcla dos reglas del párr. 4 de la INR.3: la «gama de delitos por categoría» se refiere a los delitos precedentes; los bienes pueden ser de cualquier tipo."}},{"id":"E007","tema":"m1s3","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.3?","a":"Debe haber delitos accesorios, como conspiración, tentativa, complicidad, facilitación y asesoramiento, salvo que lo impidan principios fundamentales del derecho interno","o":["Tipificar el delito únicamente con base en la complicidad, la tentativa o la conspiración no es suficiente para cumplir con la Recomendación","El delito no debe exigir que los fondos u otros activos se hayan usado efectivamente ni que estén vinculados a uno o más actos específicos","El decomiso puede extenderse a otros bienes de la persona condenada por LD, delitos precedentes o FT cuando el tribunal esté convencido de que provienen de una conducta delictiva","Debe haber delitos accesorios, como conspiración, tentativa, complicidad, facilitación y asesoramiento, salvo que lo impidan principios fundamentales del derecho interno"],"x":"La INR.3, párr. 7(d), exige delitos accesorios al LD (participación, asociación o conspiración, tentativa, complicidad, facilitación y asesoramiento), salvo que no lo permitan los principios fundamentales del derecho interno. Las afirmaciones sobre tipificar sólo con figuras accesorias y sobre no exigir vínculo con un acto específico son de la INR.5 (FT, párrs. 4 y 6), y el decomiso ampliado es de la INR.4 (párr. 10).","ref":"INR.3, párr. 7(d) · S3","d":{"Tipificar el delito únicamente con base en la complicidad, la tentativa o la conspiración no es suficiente para cumplir con la Recomendación":"Es de la INR.5, párr. 4, sobre el delito de FT, no de la INR.3.","El delito no debe exigir que los fondos u otros activos se hayan usado efectivamente ni que estén vinculados a uno o más actos específicos":"Es de la INR.5, párr. 6, sobre el delito de FT, no de la INR.3.","El decomiso puede extenderse a otros bienes de la persona condenada por LD, delitos precedentes o FT cuando el tribunal esté convencido de que provienen de una conducta delictiva":"Es el decomiso ampliado de la INR.4, párr. 10, no de la INR.3."}},{"id":"E008","tema":"m1s3","tipo":"memoria","q":"¿Qué recomendación, en su Nota interpretativa, pide a los países considerar la creación de un fondo de recuperación de activos al que se deposite todo o parte de lo decomisado, para fines de aplicación de la ley, salud, educación u otros apropiados?","a":"R.4 · Decomiso y medidas provisionales","o":["R.4 · Decomiso y medidas provisionales","R.38 · Asistencia legal mutua: congelamiento y decomiso","R.30 · Responsabilidades de las autoridades de investigación","R.33 · Estadísticas"],"x":"La INR.4, párr. 15, dice que los países deberían considerar establecer un fondo de recuperación de activos con todo o parte de lo decomisado. La INR.38 trata de compartir lo decomisado con otros países y de deducir o compartir costos extraordinarios, no de un fondo nacional.","ref":"INR.4, párr. 15 · S3","d":{"R.38 · Asistencia legal mutua: congelamiento y decomiso":"La INR.38 trata de compartir lo decomisado con otros países y de deducir o compartir costos extraordinarios, no de un fondo nacional.","R.30 · Responsabilidades de las autoridades de investigación":"La INR.30 trata de la investigación financiera y las autoridades investigadoras; no menciona un fondo de recuperación de activos.","R.33 · Estadísticas":"La R.33 no tiene Nota interpretativa; pide estadísticas de bienes decomisados, no un fondo."}},{"id":"E009","tema":"m1s3","tipo":"caso","q":"Raúl lleva la contabilidad de un grupo que, como él sabe, pretende financiar a una organización terrorista. No aporta ni recauda fondos, pero contribuye intencionalmente a la operación del grupo. Conforme a la Nota a la R.5, su conducta:","a":"Debe ser delito, como contribución intencional a la comisión de un delito de FT por un grupo que actúa con un propósito común","o":["No es delito de FT, porque éste exige que la persona aporte o recaude directamente fondos u otros activos destinados al terrorismo","Debe ser delito, como contribución intencional a la comisión de un delito de FT por un grupo que actúa con un propósito común","Sólo es delito si los fondos llegan a usarse en un acto terrorista concreto que pueda atribuirse al grupo del que forma parte","Debe tratarse sólo como delito precedente de LD, ya que Raúl no tuvo la intención directa de financiar el terrorismo"],"x":"La INR.5, párr. 11(c), exige tipificar la contribución a la comisión de un delito de FT por un grupo con propósito común, si es intencional y se hace para promover su actividad delictiva o con conocimiento de la intención del grupo. No se requiere aportar fondos directamente ni que éstos se usen en un acto concreto (párr. 6).","ref":"INR.5, párrs. 6 y 11(c) · S3","d":{"No es delito de FT, porque éste exige que la persona aporte o recaude directamente fondos u otros activos destinados al terrorismo":"La INR.5, párr. 11(c), tipifica también la contribución intencional al delito de FT de un grupo; no hace falta aportar ni recaudar fondos.","Sólo es delito si los fondos llegan a usarse en un acto terrorista concreto que pueda atribuirse al grupo del que forma parte":"La INR.5, párr. 6, dice que el FT no requiere que los fondos se usen ni se vinculen a un acto terrorista concreto.","Debe tratarse sólo como delito precedente de LD, ya que Raúl no tuvo la intención directa de financiar el terrorismo":"Raúl conoce la intención del grupo, supuesto previsto en la INR.5, párr. 11(c)(ii): es delito de FT, no sólo un delito precedente de LD."}},{"id":"E010","tema":"m1s3","tipo":"trampa","q":"Respecto de la tentativa de cometer el delito de FT, ¿qué establece la Nota interpretativa a la R.5?","
