<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulador con los bancos de las sesiones del Módulo 1 (Área 1 del temario CNBV PLD/FT, agosto 2026), en proporción a su peso en el examen.">
<title>Simulacro mixto del Módulo 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}

},{"k":"m1s3","l":"Sólo S3 · Las 40 Recomendaciones","tema":"m1s3"},{"k":"m1s4","l":"Sólo S4 · Autoridades nacionales","tema":"m1s4"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"C001","tema":"m1s1","tipo":"memoria","q":"Según el VSPP de la CNBV, el lavado de dinero es «el proceso a través del cual es ____ el origen de los fondos generados mediante el ejercicio de algunas actividades ilegales».","a":"encubierto","o":["encubierto","justificado","transformado","transferido"],"x":"El VSPP usa «encubierto»: el lavado oculta el origen de los fondos. «Transformado» se parece a la estratificación (cambiar la forma), pero no es la palabra de la definición.","ref":"VSPP, concepto · S1"},{"id":"C002","tema":"m1s1","tipo":"memoria","q":"En el concepto del VSPP, ¿qué es lo que se encubre en el lavado de dinero?","a":"El origen de los fondos generados por actividades ilegales","o":["La titularidad de las cuentas que reciben los fondos de actividades ilegales","La identidad de las personas que participan en las actividades ilegales","El origen de los fondos generados por actividades ilegales","El destino de los fondos que se aportarán a actividades ilegales"],"x":"La definición del VSPP habla de encubrir «el origen de los fondos». La opción del destino de fondos que «se aportarán» a actividades ilegales describe la redacción del financiamiento al terrorismo. Ojo: el art. 400 Bis, fr. II, sí menciona destino y titularidad, pero la pregunta es sobre el concepto del VSPP.","ref":"VSPP, concepto · S1"},{"id":"C003","tema":"m1s1","tipo":"memoria","q":"Según el VSPP, el objetivo del lavado es hacer que los fondos o activos obtenidos a través de actividades ilícitas aparezcan como el fruto de actividades legítimas y circulen sin problema en el ____.","a":"sistema financiero","o":["sistema de pagos","sistema financiero","comercio exterior","mercado de valores"],"x":"El texto dice «circulen sin problema en el sistema financiero». Las otras opciones son partes o ámbitos cercanos, pero no son las palabras del VSPP.","ref":"VSPP, concepto · S1"},{"id":"C004","tema":"m1s1","tipo":"memoria","q":"De acuerdo con el VSPP, la operación de lavado de dinero generalmente se realiza…","a":"en varios niveles","o":["en una sola operación","en dos niveles","en varios niveles","en varios países"],"x":"El VSPP dice que la operación «generalmente se realiza en varios niveles». No limita el número a dos ni lo define por países.","ref":"VSPP, concepto · S1"},{"id":"C005","tema":"m1s1","tipo":"memoria","q":"¿Cuál de estas actividades aparece en la lista del VSPP de las actividades ilegales más comunes cuyos fondos se lavan?","a":"Lenocinio","o":["Despojo","Secuestro","Lenocinio","Homicidio"],"x":"El VSPP cita tráfico de drogas o estupefacientes, contrabando de armas, corrupción, fraude, trata de personas, lenocinio, extorsión, piratería, evasión fiscal y terrorismo. Secuestro, homicidio y despojo no están en esa lista.","ref":"VSPP, concepto · S1"},{"id":"C006","tema":"m1s1","tipo":"memoria","q":"¿Cuál es la etapa del lavado en la que, según el VSPP, «el lavador introduce sus ganancias ilícitas en el sistema financiero»?","a":"Colocación","o":["Estratificación","Colocación","Encubrimiento","Integración"],"x":"Introducir las ganancias ilícitas al sistema financiero es la colocación, la primera etapa. La estratificación ocurre después, cuando el dinero ya está dentro y se mueve para cambiar su forma.","ref":"VSPP, etapas · S1"},{"id":"C007","tema":"m1s1","tipo":"memoria","q":"Según el VSPP, la estratificación implica el envío de dinero a través de diversas transacciones financieras para cambiar su ____, dificultando su rastreo.","a":"forma","o":["destino","forma","denominación","titular"],"x":"El VSPP dice «para cambiar su forma, dificultando su rastreo». Cambiar el titular o el destino puede ocurrir en la práctica, pero no es la redacción del VSPP.","ref":"VSPP, etapas · S1"},{"id":"C008","tema":"m1s1","tipo":"memoria","q":"Según el VSPP, la integración es la reinserción de los fondos ilegales en la economía; los fondos aparecen como legítimos y pueden ser ____.","a":"reutilizados","o":["transferidos","rastreados","reutilizados","fraccionados"],"x":"En la integración los fondos «aparecen como legítimos y pueden ser reutilizados». Transferirlos es ejemplo de estratificación, no el rasgo de la integración.","ref":"VSPP, etapas · S1"},{"id":"C009","tema":"m1s1","tipo":"memoria","q":"¿Cuál de estos es un ejemplo que el VSPP da de la etapa de colocación?","a":"Inversión en instrumentos financieros","o":["Red de empresas de fachada","Transferencias bancarias entre cuentas","Compra de bienes raíces o bienes de lujo","Inversión en instrumentos financieros"],"x":"El VSPP pone como ejemplos de colocación los depósitos bancarios en efectivo y la inversión en instrumentos financieros. Las transferencias y la compra de bienes raíces son estratificación; las empresas de fachada, integración.","ref":"VSPP, etapas · S1"},{"id":"C010","tema":"m1s1","tipo":"memoria","q":"¿Cuál de estos es un ejemplo que el VSPP da de la etapa de estratificación?","a":"Transferencias bancarias","o":["Inversión en instrumentos financieros","Transferencias bancarias","Red de empresas de fachada","Depósitos bancarios en efectivo"],"x":"Las transferencias bancarias y la compra de bienes raíces o de lujo son los ejemplos de estratificación. El depósito en efectivo y la inversión en instrumentos son colocación.","ref":"VSPP, etapas · S1"},{"id":"C011","tema":"m1s1","tipo":"memoria","q":"¿Cuál de estos es un ejemplo que el VSPP da de la etapa de integración?","a":"Red de empresas de fachada","o":["Depósitos bancarios en efectivo","Transferencias bancarias","Compra de bienes raíces o de lujo","Red de empresas de fachada"],"x":"Los ejemplos de integración son la red de empresas de fachada y la venta de un yate adquirido en la estratificación. La compra de bienes raíces o de lujo es estratificación.","ref":"VSPP, etapas · S1"},{"id":"C012","tema":"m1s1","tipo":"trampa","q":"¿Cuál de estas operaciones NO es un ejemplo de estratificación según el VSPP?","a":"La venta de un yate adquirido antes","o":["Compra de bienes de lujo con fondos ya depositados","La venta de un yate adquirido antes","Transferencias bancarias entre cuentas de terceros","Compra de bienes raíces con fondos ya depositados"],"x":"La venta del yate que se adquirió en la estratificación es ejemplo de integración. La compra de bienes raíces o de lujo y las transferencias bancarias sí son estratificación.","ref":"VSPP, etapas · S1"},{"id":"C013","tema":"m1s1","tipo":"memoria","q":"Según el VSPP, ¿dónde está previsto en México el tipo penal del delito de operaciones con recursos de procedencia ilícita?","a":"Art. 400 Bis del Código Penal Federal","o":["Art. 139 Quinquies del Código Penal Federal","Art. 139 Quáter del Código Penal Federal","Art. 400 Bis 1 del Código Penal Federal","Art. 400 Bis del Código Penal Federal"],"x":"El VSPP remite al art. 400 Bis del CPF. El 400 Bis 1 no tipifica la conducta: prevé sus agravantes; el 139 Quáter es el financiamiento al terrorismo.","ref":"VSPP, etapas (párrafo final) · S1"},{"id":"C014","tema":"m1s1","tipo":"caso","q":"Rogelio deposita en efectivo en su cuenta bancaria el dinero que obtuvo de extorsiones. Según el VSPP, ¿en qué etapa del lavado está esta operación?","a":"Colocación","o":["Colocación","Encubrimiento","Integración","Estratificación"],"x":"Un depósito bancario en efectivo es el ejemplo típico de colocación: el dinero ilícito entra al sistema financiero. Aún no se ha movido entre transacciones, así que no es estratificación.","ref":"VSPP, etapas · S1"},{"id":"C015","tema":"m1s1","tipo":"caso","q":"Una persona invierte en instrumentos financieros el efectivo que obtuvo del contrabando de armas. ¿En qué etapa del lavado está esta operación?","a":"Colocación","o":["Integración","Colocación","Estratificación","Diversificación"],"x":"La inversión en instrumentos financieros es uno de los dos ejemplos de colocación del VSPP. No es integración, porque los fondos apenas entran al sistema; todavía no aparecen como legítimos.","ref":"VSPP, etapas · S1"},{"id":"C016","tema":"m1s1","tipo":"caso","q":"Mariana ya depositó en el banco el dinero de un fraude y ahora lo transfiere por varias cuentas para dificultar su rastreo. ¿En qué etapa está?","a":"Estratificación","o":["Ocultamiento","Integración","Estratificación","Colocación"],"x":"Las transferencias bancarias que cambian la forma del dinero y dificultan su rastreo son estratificación. La colocación ya ocurrió con el depósito.","ref":"VSPP, etapas · S1"},{"id":"C017","tema":"m1s1","tipo":"caso","q":"Con fondos de trata de personas que ya movió entre varias cuentas, Julián compra un departamento. ¿En qué etapa del lavado está la compra?","a":"Estratificación","o":["Estratificación","Colocación","Integración","Simulación"],"x":"El VSPP pone la compra de bienes raíces como ejemplo de estratificación. Es tentador marcar integración, pero la integración sería la venta posterior del bien.","ref":"VSPP, etapas · S1"},{"id":"C018","tema":"m1s1","tipo":"caso","q":"Una organización compra un yate con dinero de piratería que ya pasó por varias transferencias. ¿En qué etapa del lavado está la compra del yate?","a":"Estratificación","o":["Estratificación","Colocación","Ocultamiento","Integración"],"x":"Comprar bienes de lujo es ejemplo de estratificación. El VSPP ubica la venta de ese yate en la integración, no su compra.","ref":"VSPP, etapas · S1"},{"id":"C019","tema":"m1s1","tipo":"caso","q":"Meses después, la misma organización vende el yate que había comprado con fondos ilícitos ya transferidos y recibe el pago como un ingreso legítimo. ¿En qué etapa está la venta?","a":"Integración","o":["Encubrimiento","Integración","Colocación","Estratificación"],"x":"La venta de un yate que se adquirió en la estratificación es el ejemplo de integración del VSPP: los fondos regresan a la economía como legítimos. La compra fue estratificación.","ref":"VSPP, etapas · S1"},{"id":"C020","tema":"m1s1","tipo":"caso","q":"Un grupo opera una red de empresas de fachada cuyos ingresos, provenientes de evasión fiscal, aparecen como ventas legítimas que se reutilizan en nuevos negocios. ¿En qué etapa está?","a":"Integración","o":["Integración","Estratificación","Colocación","Diversificación"],"x":"La red de empresas de fachada es ejemplo de integración: los fondos aparecen como legítimos y pueden reutilizarse. No es colocación porque no se trata de introducir el dinero al sistema.","ref":"VSPP, etapas · S1"},{"id":"C021","tema":"m1s1","tipo":"caso","q":"Con dinero de extorsión que ya transfirió entre cuentas, Óscar compra relojes y joyas de lujo. ¿En qué etapa del lavado está esta compra?","a":"Estratificación","o":["Simulación","Estratificación","Colocación","Integración"],"x":"La compra de bienes de lujo es ejemplo de estratificación en el VSPP. Sería integración si después vendiera esos bienes y presentara el pago como legítimo.","ref":"VSPP, etapas · S1"},{"id":"C022","tema":"m1s1","tipo":"caso","q":"Un vendedor de mercancía pirata lleva al banco y deposita en efectivo, en su cuenta, los ingresos que obtuvo de la piratería. ¿En qué etapa del lavado está?","a":"Colocación","o":["Colocación","Estratificación","Ocultamiento","Integración"],"x":"Depositar en efectivo es introducir las ganancias ilícitas en el sistema financiero: es el ejemplo de colocación del VSPP. Todavía no hay transacciones para cambiar su forma (estratificación) ni fondos que ya aparezcan como legítimos (integración).","ref":"VSPP, etapas · S1"},{"id":"C023","tema":"m1s1","tipo":"caso","q":"Fernando envía desde su cuenta en México a una cuenta en el extranjero los fondos de fraude que depositó la semana anterior. ¿En qué etapa del lavado está el envío?","a":"Estratificación","o":["Estratificación","Encubrimiento","Integración","Colocación"],"x":"Una transferencia bancaria posterior al depósito es estratificación: el dinero pasa por transacciones que cambian su forma y dificultan su rastreo.","ref":"VSPP, etapas · S1"},{"id":"C024","tema":"m1s1","tipo":"caso","q":"Una persona vende el inmueble que compró con fondos de fraude previamente transferidos y presenta el pago recibido como ingreso legítimo. ¿En qué etapa está la venta?","a":"Integración","o":["Diversificación","Colocación","Integración","Estratificación"],"x":"La venta del bien adquirido en la estratificación reinserta los fondos en la economía como legítimos: integración. La compra del inmueble fue estratificación.","ref":"VSPP, etapas · S1"},{"id":"C025","tema":"m1s1","tipo":"caso","q":"Un lavador deposita en efectivo, en varias sucursales bancarias, el dinero de la venta de estupefacientes. ¿En qué etapa del lavado está?","a":"Colocación","o":["Integración","Estratificación","Colocación","Diversificación"],"x":"Son depósitos bancarios en efectivo: el ejemplo de colocación del VSPP. Que se hagan en varias sucursales no los convierte en transferencias.","ref":"VSPP, etapas · S1"},{"id":"C026","tema":"m1s1","tipo":"caso","q":"Bruno obtiene dinero del contrabando de armas y busca que parezca fruto de actividades legítimas y circule sin problema en el sistema financiero. Según los conceptos de esta sesión, ¿qué describe el caso?","a":"Lavado de dinero","o":["Desvío de fondos públicos","Corrupción a gran escala","Financiamiento al terrorismo","Lavado de dinero"],"x":"Encubrir el origen ilícito para que los fondos aparezcan legítimos y circulen en el sistema financiero es el concepto de lavado del VSPP. El FT se define por el destino de los fondos, no por encubrir su origen.","ref":"VSPP, concepto · S1"},{"id":"C027","tema":"m1s1","tipo":"caso","q":"Ana deposita en efectivo el dinero de un fraude, lo transfiere a varias cuentas, compra un yate y meses después lo vende como ingreso legítimo. ¿Qué secuencia de etapas describe el caso, operación por operación?","a":"Colocación, estratificación, estratificación e integración","o":["Estratificación, estratificación, integración e integración","Colocación, estratificación, integración e integración","Colocación, colocación, estratificación e integración","Colocación, estratificación, estratificación e integración"],"x":"Depósito en efectivo = colocación; transferencias = estratificación; compra del yate = estratificación; venta del yate = integración. El error más común es poner la compra del yate en integración.","ref":"VSPP, etapas · S1"},{"id":"C028","tema":"m1s1","tipo":"caso","q":"Ramiro realizó estas cuatro operaciones con dinero de un fraude. ¿Cuál corresponde a la etapa de integración?","a":"Vender el yate y usar el pago como ingreso legítimo","o":["Vender el yate y usar el pago como ingreso legítimo","Transferir los fondos a cuentas de varios terceros","Depositar en efectivo el dinero en su cuenta bancaria","Comprar un yate con los fondos que ya transfirió"],"x":"La venta del yate adquirido en la estratificación es el ejemplo de integración del VSPP. Comprar el yate es estratificación, aunque se trate del mismo bien.","ref":"VSPP, etapas · S1"},{"id":"C029","tema":"m1s1","tipo":"caso","q":"Con dinero de una extorsión, Irene realizó estas cuatro operaciones. ¿Cuál corresponde a la etapa de colocación?","a":"Invertir el efectivo en instrumentos financieros","o":["Transferir los fondos a una cuenta en el extranjero","Comprar una casa con los fondos ya transferidos","Operar una red de empresas de fachada con esos fondos","Invertir el efectivo en instrumentos financieros"],"x":"La inversión en instrumentos financieros es ejemplo de colocación: introduce las ganancias ilícitas al sistema. La transferencia y la compra de la casa son estratificación; las empresas de fachada, integración.","ref":"VSPP, etapas · S1"},{"id":"C030","tema":"m1s1","tipo":"caso","q":"Un analista observa que un cliente usa a su red de empresas de fachada para pagar proveedores con fondos que ya aparecen como legítimos. ¿En qué etapa del lavado se ubica?","a":"Integración","o":["Estratificación","Simulación","Colocación","Integración"],"x":"En la integración los fondos ilegales se reinsertan en la economía, aparecen como legítimos y se reutilizan; la red de empresas de fachada es el ejemplo del VSPP.","ref":"VSPP, etapas · S1"},{"id":"C031","tema":"m1s1","tipo":"memoria","q":"Completa el art. 139 Quáter del CPF: «al que por cualquier medio que fuere ya sea directa o indirectamente, ____ fondos económicos o recursos de cualquier naturaleza…»","a":"aporte o recaude","o":["administre o custodie","oculte o encubra","aporte o recaude","transfiera o invierta"],"x":"Los verbos del FT son «aporte o recaude». «Oculte o encubra» son verbos de la fracción II del art. 400 Bis (lavado), un distractor de otro artículo.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C032","tema":"m1s1","tipo":"memoria","q":"Según el art. 139 Quáter del CPF, el financiamiento al terrorismo recae sobre «fondos económicos o recursos de ____».","a":"cualquier naturaleza","o":["valor relevante","cualquier naturaleza","procedencia ilícita","origen desconocido"],"x":"El texto dice «recursos de cualquier naturaleza»; no exige que sean de procedencia ilícita, que es un elemento del lavado (art. 400 Bis).","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C033","tema":"m1s1","tipo":"memoria","q":"Según el art. 139 Quáter, el sujeto actúa «con conocimiento de que serán destinados para ____ actividades de individuos u organizaciones terroristas».","a":"financiar o apoyar","o":["financiar o apoyar","promover o difundir","ocultar o encubrir","planear o ejecutar"],"x":"La redacción es «financiar o apoyar actividades de individuos u organizaciones terroristas». «Ocultar o encubrir» corresponde al lavado.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C034","tema":"m1s1","tipo":"memoria","q":"Según el art. 139 Quáter, ¿dónde deben cometerse los delitos enlistados para cuya comisión se aportan o recaudan los fondos?","a":"En territorio nacional o en el extranjero","o":["En territorio nacional o en el extranjero","Sólo en el extranjero, contra un Estado extranjero","Sólo en territorio nacional","En territorio nacional o en aguas y espacio aéreo mexicanos"],"x":"El artículo dice «para la comisión, en territorio nacional o en el extranjero». No se limita a México ni sólo al extranjero.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C035","tema":"m1s1","tipo":"memoria","q":"Completa el art. 139 Quáter: los fondos son «para ser utilizados, o pretendan ser utilizados, directa o indirectamente, ____, para la comisión… de cualquiera de los delitos previstos».","a":"total o parcialmente","o":["en forma organizada","en su totalidad únicamente","de forma reiterada o habitual","total o parcialmente"],"x":"El texto dice «total o parcialmente»: basta que una parte de los fondos se destine a los delitos enlistados. «En su totalidad únicamente» convierte en absoluto lo que la norma no limita.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C036","tema":"m1s1","tipo":"memoria","q":"En la lista de la fracción I del art. 139 Quáter, ¿en qué artículo del CPF está previsto el sabotaje?","a":"Art. 140","o":["Art. 139 Ter","Art. 368 Quinquies","Art. 148 Bis","Art. 140"],"x":"El numeral 2) de la fracción I remite al sabotaje del art. 140. El 368 Quinquies es el robo (numeral 5) y el 148 Bis, terrorismo internacional (numeral 3).","ref":"Art. 139 Quáter, fracción I, numeral 2 · S1"},{"id":"C037","tema":"m1s1","tipo":"memoria","q":"Según la fracción I del art. 139 Quáter, ¿en qué artículos del CPF está previsto el terrorismo internacional?","a":"Arts. 148 Bis, 148 Ter y 148 Quáter","o":["Arts. 139 Quáter y 139 Quinquies","Arts. 139, 139 Bis y 139 Ter","Arts. 148 Bis, 148 Ter y 148 Quáter","Arts. 167, fracción IX, y 170"],"x":"El numeral 3) remite al terrorismo internacional de los arts. 148 Bis, 148 Ter y 148 Quáter. Los arts. 139, 139 Bis y 139 Ter son el terrorismo (numeral 1).","ref":"Art. 139 Quáter, fracción I, numeral 3 · S1"},{"id":"C038","tema":"m1s1","tipo":"memoria","q":"Además de los delitos del CPF, ¿qué ordenamiento enlista la fracción II del art. 139 Quáter?","a":"Ley de reservas mineras de uranio y torio, arts. 10 y 13","o":["Ley de reservas mineras de uranio y torio, arts. 140 y 170","Ley de reservas mineras de uranio y torio, arts. 148 Bis y 148 Ter","Ley Federal de Armas de Fuego y Explosivos, arts. 10 y 13","Ley de reservas mineras de uranio y torio, arts. 10 y 13"],"x":"La fracción II remite a la Ley que Declara Reservas Mineras los Yacimientos de Uranio, Torio y las demás Substancias de las cuales se obtengan Isótopos Hendibles…, arts. 10 y 13. Los arts. 140, 170 y 148 Bis son del CPF.","ref":"Art. 139 Quáter, fracción II · S1"},{"id":"C039","tema":"m1s1","tipo":"cifra","q":"¿Cuántos numerales de delitos del Código Penal Federal enlista la fracción I del art. 139 Quáter?","a":"Cinco","o":["Seis","Tres","Cuatro","Cinco"],"x":"Son cinco: terrorismo, sabotaje, terrorismo internacional, ataques a las vías de comunicación y robo (art. 368 Quinquies). La ley de reservas mineras va aparte, en la fracción II.","ref":"Art. 139 Quáter, fracción I · S1"},{"id":"C040","tema":"m1s1","tipo":"caso","q":"Andrés dona parte de su sueldo, de origen lícito, a una organización sabiendo que lo destinará a apoyar actividades terroristas. ¿Encuadra en el art. 139 Quáter?","a":"Sí; el artículo abarca aportar recursos de cualquier naturaleza con conocimiento de su destino","o":["No; la conducta encuadra sólo en el lavado, porque los fondos entran al sistema financiero","Sí; el artículo abarca aportar recursos de cualquier naturaleza con conocimiento de su destino","No; sólo hay financiamiento al terrorismo si los fondos son de procedencia ilícita","Sólo si el acto terrorista llega a cometerse en territorio nacional y con esos mismos fondos"],"x":"El 139 Quáter castiga aportar fondos «de cualquier naturaleza» con conocimiento de que se destinarán a terroristas; no exige origen ilícito. El origen ilícito es elemento del lavado (art. 400 Bis), no del FT.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C041","tema":"m1s1","tipo":"caso","q":"Una fundación ficticia recauda donativos sabiendo que se usarán para cometer un sabotaje en otro país. ¿Qué delito describe el caso?","a":"Financiamiento al terrorismo, art. 139 Quáter","o":["Financiamiento al terrorismo, art. 139 Quáter","Terrorismo, art. 139, primer párrafo","Encubrimiento de quien financia, art. 139 Quinquies","Operaciones con recursos de procedencia ilícita, art. 400 Bis"],"x":"Recaudar fondos con conocimiento de que se usarán para un sabotaje (art. 140, numeral 2 de la lista) es FT, aunque el sabotaje se cometa en el extranjero.","ref":"Art. 139 Quáter, primer párrafo y fracción I · S1"},{"id":"C042","tema":"m1s1","tipo":"caso","q":"Carla, a través de un intermediario, aporta una parte de los fondos que se usarán para un ataque a las vías de comunicación del art. 167, fracción IX, del CPF, y lo sabe. ¿Encuadra en el art. 139 Quáter?","a":"Sí; el artículo abarca aportar directa o indirectamente y para usarse total o parcialmente","o":["Sólo si el intermediario también sabe que el destino de los fondos es terrorista","Sí; el artículo abarca aportar directa o indirectamente y para usarse total o parcialmente","No; los ataques a las vías de comunicación no están en la lista del art. 139 Quáter","No; la ley exige que la persona aporte directamente y por la totalidad de los fondos"],"x":"El 139 Quáter dice «directa o indirectamente» y «total o parcialmente», y los ataques a las vías de comunicación (arts. 167, fr. IX, y 170) son el numeral 4) de la lista.","ref":"Art. 139 Quáter, primer párrafo y fracción I, numeral 4 · S1"},{"id":"C043","tema":"m1s1","tipo":"caso","q":"Pedro entrega una camioneta, no dinero, a una organización terrorista, sabiendo que la usará en sus actividades. Según el art. 139 Quáter, ¿por qué puede ser financiamiento al terrorismo?","a":"Porque abarca fondos económicos o recursos de cualquier naturaleza","o":["Porque todo apoyo material a terroristas se castiga como lavado de dinero","Porque los vehículos se consideran armas en el art. 139, fracción I","Porque abarca cualquier bien inmueble de acceso público usado por terroristas","Porque abarca fondos económicos o recursos de cualquier naturaleza"],"x":"La conducta recae en «fondos económicos o recursos de cualquier naturaleza», no sólo en dinero. Un vehículo es un recurso.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C044","tema":"m1s1","tipo":"caso","q":"Lorena aporta fondos a una asociación sin saber, ni tener cómo saber, que se usarán para financiar a una organización terrorista. ¿Qué elemento del art. 139 Quáter falta?","a":"El conocimiento de que serán destinados a financiar o apoyar terroristas","o":["Que los fondos provengan de una actividad ilícita previa y no se acredite su origen","Que el aporte se haga directamente y por la totalidad de los fondos","El conocimiento de que serán destinados a financiar o apoyar terroristas","Que el acto financiado se cometa dentro del territorio nacional"],"x":"El FT exige actuar «con conocimiento de que serán destinados» a esos fines. El origen ilícito, el territorio nacional y el aporte directo y total no son requisitos del 139 Quáter.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C045","tema":"m1s1","tipo":"caso","q":"Gilberto recauda fondos sabiendo que se usarán para cometer el robo previsto en el art. 368 Quinquies del CPF. Según el art. 139 Quáter, ¿qué califica su conducta?","a":"Ese robo está en la lista de la fracción I del art. 139 Quáter","o":["Ese robo está en la fracción II, con la ley de reservas mineras","Ese robo está en la lista de la fracción I del art. 139 Quáter","Ese robo se sanciona sólo como lavado de dinero, art. 400 Bis","Ese robo se sanciona sólo como encubrimiento, art. 139 Quinquies"],"x":"El robo del art. 368 Quinquies es el numeral 5) de la fracción I; financiar su comisión es FT. La fracción II sólo contiene la ley de reservas mineras (arts. 10 y 13).","ref":"Art. 139 Quáter, fracción I, numeral 5 · S1"},{"id":"C046","tema":"m1s1","tipo":"memoria","q":"Según la Guía Anticorrupción de la CNBV, Transparencia Internacional define la corrupción como «el abuso del ____ para beneficio propio».","a":"poder","o":["patrimonio","poder","cargo","servicio público"],"x":"La definición de TI es «el abuso del poder para beneficio propio». «Cargo» es tentador, pero no es la palabra de la definición.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C047","tema":"m1s1","tipo":"memoria","q":"Según Transparencia Internacional, citada en la Guía Anticorrupción, ¿con qué criterio se clasifica la corrupción en sus tres tipos?","a":"Según la cantidad de fondos perdidos y el sector en el que se cometa","o":["Según el nivel jerárquico del servidor público y el monto del soborno","Según el delito del Título Décimo del CPF y la pena aplicable","Según la cantidad de fondos perdidos y el sector en el que se cometa","Según la cantidad de personas involucradas y el país en el que se cometa"],"x":"La Guía dice que la corrupción «puede clasificarse… según la cantidad de fondos perdidos y el sector en el que se cometa». El nivel jerárquico aparece en la descripción de los tipos, no como criterio.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C048","tema":"m1s1","tipo":"trampa","q":"¿Cuál de estos NO es uno de los tres tipos de corrupción de Transparencia Internacional que recoge la Guía Anticorrupción?","a":"Corrupción empresarial","o":["Corrupción política","Corrupción empresarial","Actos de corrupción menores","Corrupción a gran escala"],"x":"Los tres tipos son corrupción a gran escala, actos de corrupción menores y corrupción política. «Corrupción empresarial» no está en la clasificación.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C049","tema":"m1s1","tipo":"memoria","q":"¿Qué tipo de corrupción consiste en actos cometidos en los niveles más altos del gobierno, que involucran la distorsión de políticas o de funciones centrales del Estado?","a":"Corrupción a gran escala","o":["Desvío de fondos públicos","Corrupción política","Corrupción a gran escala","Actos de corrupción menores"],"x":"La corrupción a gran escala se da en los niveles más altos del gobierno y permite a las PEP beneficiarse a expensas del bien común. La política se define por manipular políticas, instituciones y normas para conservar el poder.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C050","tema":"m1s1","tipo":"memoria","q":"¿Qué tipo de corrupción es «la manipulación de políticas, instituciones y normas de procedimiento en la asignación de recursos y financiamiento» por los responsables de las decisiones políticas?","a":"Corrupción política","o":["Corrupción a gran escala","Corrupción política","Actos de corrupción menores","Cohecho"],"x":"Es la corrupción política: quienes deciden políticamente abusan de su posición para conservar su poder, estatus y patrimonio. La de gran escala se define por el nivel más alto del gobierno y la distorsión de funciones centrales del Estado.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C051","tema":"m1s1","tipo":"memoria","q":"Según el glosario de Transparencia Internacional citado en la Guía, ¿qué término se define como ofrecer, prometer, dar, aceptar o solicitar una ventaja como un incentivo para una acción ilegal, poco ética o una falta de confianza?","a":"Cohecho","o":["Cohecho","Desvío de fondos públicos","Peculado","Corrupción política"],"x":"Es la definición de cohecho del glosario de TI; los incentivos pueden ser obsequios, préstamos, honorarios, recompensas u otras ventajas. El desvío de fondos públicos es apropiarse de recursos desde un cargo.","ref":"Guía Anticorrupción, I.1.3, nota 1 · S1"},{"id":"C052","tema":"m1s1","tipo":"caso","q":"Un empleado de bajo rango de un hospital público exige dinero a un paciente para darle una cita. Según la clasificación de Transparencia Internacional, ¿qué tipo de corrupción es?","a":"Actos de corrupción menores","o":["Corrupción a gran escala","Corrupción política","Corrupción institucional","Actos de corrupción menores"],"x":"Los actos menores son el abuso cotidiano de poder por PEP de bajo y mediano rango al tratar con ciudadanos que buscan bienes y servicios básicos, como en hospitales.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C053","tema":"m1s1","tipo":"caso","q":"Un servidor de mediano rango de una escuela pública cobra una cuota indebida a los padres para inscribir a sus hijos. ¿Qué tipo de corrupción describe el caso?","a":"Actos de corrupción menores","o":["Corrupción a gran escala","Actos de corrupción menores","Corrupción política","Corrupción administrativa"],"x":"Abuso cotidiano de poder de un servidor de bajo o mediano rango frente a ciudadanos que buscan un servicio básico (escuelas): actos de corrupción menores.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C054","tema":"m1s1","tipo":"caso","q":"Un alto funcionario del gobierno distorsiona una función central del Estado para beneficiarse a expensas del bien común. ¿Qué tipo de corrupción describe el caso?","a":"Corrupción a gran escala","o":["Corrupción política","Actos de corrupción menores","Corrupción a gran escala","Corrupción institucional"],"x":"Actos en los niveles más altos del gobierno que distorsionan funciones centrales del Estado en beneficio de las PEP: corrupción a gran escala.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C055","tema":"m1s1","tipo":"caso","q":"Un grupo de responsables de decisiones políticas manipula las normas de procedimiento para asignar financiamiento y así conservar su poder y su estatus. ¿Qué tipo de corrupción es?","a":"Corrupción política","o":["Corrupción política","Corrupción a gran escala","Actos de corrupción menores","Corrupción electoral"],"x":"Manipular políticas, instituciones y normas de procedimiento en la asignación de recursos para conservar poder, estatus y patrimonio es corrupción política.","ref":"Guía Anticorrupción, I.1.3 · S1"},{"id":"C056","tema":"m1s1","tipo":"caso","q":"El director de una empresa se apropia de recursos de la organización a su cargo para obtener beneficios privados. Según el glosario de TI citado en la Guía, ¿qué figura describe?","a":"Desvío de fondos públicos","o":["Corrupción política","Desvío de fondos públicos","Actos de corrupción menores","Cohecho"],"x":"El glosario de TI define el desvío de fondos públicos como cuando una persona que ocupa un cargo en una institución, organización o empresa se apropia con el fin de obtener beneficios privados. El cohecho requiere ofrecer o aceptar una ventaja como incentivo.","ref":"Guía Anticorrupción, I.1.3, nota 1 · S1"},{"id":"C057","tema":"m1s1","tipo":"caso","q":"Una empresa ofrece un préstamo a un inspector como incentivo para que omita una revisión. Según el glosario de TI citado en la Guía, ¿qué figura describe?","a":"Cohecho","o":["Corrupción política","Desvío de fondos públicos","Peculado","Cohecho"],"x":"Ofrecer una ventaja (aquí, un préstamo) como incentivo para una acción ilegal o poco ética es cohecho. El desvío de fondos públicos implica apropiarse de recursos desde un cargo.","ref":"Guía Anticorrupción, I.1.3, nota 1 · S1"},{"id":"C058","tema":"m1s1","tipo":"cifra","q":"¿Qué pena de prisión prevé el art. 400 Bis del CPF por operaciones con recursos de procedencia ilícita?","a":"De cinco a quince años","o":["De cinco a diez años","De quince a cuarenta años","De cinco a quince años","De uno a nueve años"],"x":"El 400 Bis impone de cinco a quince años de prisión. De quince a cuarenta es la pena del art. 139, que aplica al financiamiento al terrorismo.","ref":"Art. 400 Bis, primer párrafo · S1"},{"id":"C059","tema":"m1s1","tipo":"cifra","q":"¿Qué multa prevé el art. 400 Bis del CPF por operaciones con recursos de procedencia ilícita?","a":"De mil a cinco mil días multa","o":["De cien a trescientos días multa","De mil a cinco mil veces el valor diario de la UMA","De cuatrocientas a mil doscientas veces la UMA","De mil a cinco mil días multa"],"x":"Son de mil a cinco mil días multa. Ojo con la unidad: el art. 139 (y por remisión el FT) usa veces el valor diario de la UMA.","ref":"Art. 400 Bis, primer párrafo · S1"},{"id":"C060","tema":"m1s1","tipo":"cifra","q":"¿Qué pena de prisión corresponde al financiamiento al terrorismo del art. 139 Quáter?","a":"De quince a cuarenta años","o":["De uno a nueve años","De cinco a quince años","De quince a cuarenta años","De cinco a cuarenta años"],"x":"El 139 Quáter impone la misma pena del art. 139: de quince a cuarenta años de prisión. De cinco a quince es la del lavado (art. 400 Bis).","ref":"Arts. 139 Quáter y 139, primer párrafo · S1"},{"id":"C061","tema":"m1s1","tipo":"cifra","q":"¿Qué multa corresponde al financiamiento al terrorismo, por remisión del art. 139 Quáter al art. 139?","a":"De 400 a 1,200 veces el valor diario de la UMA","o":["De 400 a 1,200 veces el salario mínimo general diario","De 400 a 1,200 veces el valor diario de la UMA","De 400 a 1,200 días multa","De 1,000 a 5,000 días multa"],"x":"Desde la reforma DOF 07-06-2024, el art. 139 fija multa de cuatrocientas a mil doscientas veces el valor diario de la UMA. Los distractores repiten la cifra 400 a 1,200 con otra unidad (días multa o salario mínimo); lo que cuenta es la unidad.","ref":"Arts. 139 Quáter y 139, primer párrafo · S1"},{"id":"C062","tema":"m1s1","tipo":"cifra","q":"¿Qué pena prevé el art. 139 Quinquies del CPF?","a":"De uno a nueve años de prisión y de cien a trescientos días multa","o":["De uno a nueve años de prisión y de cien a trescientos días multa","De cinco a quince años de prisión y de doscientos a seiscientos días multa","De quince a cuarenta años de prisión y de 400 a 1,200 veces la UMA","De uno a nueve años de prisión y de cien a trescientas veces la UMA"],"x":"El 139 Quinquies: de uno a nueve años de prisión y de cien a trescientos días multa. La unidad es días multa, no veces la UMA.","ref":"Art. 139 Quinquies · S1"},{"id":"C063","tema":"m1s1","tipo":"memoria","q":"¿Qué conducta sanciona el art. 139 Quinquies del CPF?","a":"Encubrir a una persona que haya participado en los delitos del art. 139 Quáter","o":["Amenazar con cometer el delito de terrorismo del párrafo primero del art. 139","Encubrir a una persona que haya participado en los delitos del art. 139 Quáter","Aportar o recaudar fondos sabiendo que se destinarán a apoyar a terroristas","Encubrir a un terrorista, teniendo conocimiento de sus actividades o de su identidad"],"x":"El 139 Quinquies castiga encubrir a quien participó en el financiamiento al terrorismo. Encubrir a un terrorista es el 139 Bis (misma pena), y amenazar es el 139 Ter.","ref":"Art. 139 Quinquies · S1"},{"id":"C064","tema":"m1s1","tipo":"memoria","q":"Completa el art. 139 Quáter: «Se impondrá la misma pena señalada en el artículo ____ de este Código…»","a":"139","o":["400 Bis","139","139 Bis","139 Ter"],"x":"El FT remite a la pena del art. 139 (terrorismo). El 139 Bis y el 139 Ter tienen penas menores, y el 400 Bis es la pena del lavado.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C065","tema":"m1s1","tipo":"memoria","q":"Según el art. 139 Quáter, la pena del financiamiento al terrorismo se impone…","a":"Sin perjuicio de las penas que corresponden por los demás delitos que resulten","o":["Reducida a la mitad cuando el acto terrorista no llega a cometerse","Sólo si no se configura otro delito con una pena de prisión mayor","En sustitución de las penas que correspondan por los demás delitos que resulten","Sin perjuicio de las penas que corresponden por los demás delitos que resulten"],"x":"El texto dice «sin perjuicio de las penas que corresponden por los demás delitos que resulten»: se suman, no se sustituyen.","ref":"Art. 139 Quáter, primer párrafo · S1"},{"id":"C066","tema":"m1s1","tipo":"memoria","q":"¿Cuál de estos verbos aparece en la fracción I del art. 400 Bis del CPF?","a":"Custodie","o":["Simule","Fraccione","Estructure","Custodie"],"x":"La fracción I enumera: adquiera, enajene, administre, custodie, posea, cambie, convierta, deposite, retire, dé o reciba, invierta, traspase, transporte o transfiera.","ref":"Art. 400 Bis, fracción I · S1"},{"id":"C067","tema":"m1s1","tipo":"memoria","q":"Ocultar o encubrir la titularidad de bienes, sabiendo que proceden de una actividad ilícita, es una conducta prevista en…","a":"Art. 400 Bis, fracción II","o":["Art. 400 Bis, fracción I","Art. 400 Bis 1, primer párrafo","Art. 139 Quinquies","Art. 400 Bis, fracción II"],"x":"La fracción II castiga ocultar o encubrir la naturaleza, origen, ubicación, destino, movimiento, propiedad o titularidad de recursos. La fracción I se refiere a manejar los recursos (adquirir, depositar, transferir…).","ref":"Art. 400 Bis, fracción II · S1"},{"id":"C068","tema":"m1s1","tipo":"memoria","q":"Según la fracción I del art. 400 Bis, ¿qué ámbito de las operaciones con recursos abarca la conducta?","a":"Dentro del territorio nacional, de éste hacia el extranjero o a la inversa","o":["Sólo dentro del territorio nacional, sin importar el destino final","Dentro del territorio nacional y hacia el extranjero, pero no a la inversa","Dentro del territorio nacional, de éste hacia el extranjero o a la inversa","Sólo del extranjero hacia el territorio nacional y dentro de él"],"x":"La fracción I dice «dentro del territorio nacional, de éste hacia el extranjero o a la inversa»: abarca las tres direcciones.","ref":"Art. 400 Bis, fracción I · S1"},{"id":"C069","tema":"m1s1","tipo":"memoria","q":"Completa el art. 400 Bis: son producto de una actividad ilícita los recursos, derechos o bienes de cualquier naturaleza «cuando existan ____ de que provienen directa o indirectamente, o representan las ganancias derivadas de la comisión de algún delito».","a":"indicios fundados o certeza","o":["pruebas plenas y sentencia firme","indicios suficientes y certeza plena","indicios fundados o certeza","sospechas razonables o presunciones"],"x":"El texto dice «indicios fundados o certeza». Basta cualquiera de los dos; no exige sentencia firme ni que concurran ambos.","ref":"Art. 400 Bis, segundo párrafo · S1"},{"id":"C070","tema":"m1s1","tipo":"memoria","q":"Al que, por sí o por ____, realice cualquiera de las conductas del art. 400 Bis se le impondrá de cinco a quince años de prisión.","a":"interpósita persona","o":["terceros obligados","apoderado legal","persona moral","interpósita persona"],"x":"El texto dice «por sí o por interpósita persona»: también responde quien actúa a través de otro.","ref":"Art. 400 Bis, primer párrafo · S1"},{"id":"C071","tema":"m1s1","tipo":"memoria","q":"¿Cuánto aumentan las penas del lavado cuando quien realiza la conducta es consejero, administrador, funcionario, empleado, apoderado o prestador de servicios de una persona sujeta al régimen de prevención?","a":"Desde un tercio hasta en una mitad","o":["Se duplican","Desde un tercio hasta en una mitad","Hasta en una mitad","Desde una mitad hasta en dos terceras partes"],"x":"El primer párrafo del 400 Bis 1 dice «desde un tercio hasta en una mitad». «Hasta en una mitad» es el agravante por usar menores o incapaces, y «se duplican», el de servidores públicos.","ref":"Art. 400 Bis 1, primer párrafo · S1"},{"id":"C072","tema":"m1s1","tipo":"cifra","q":"Según el art. 400 Bis 1, ¿dentro de cuánto tiempo después de haberse separado del cargo en un sujeto al régimen de prevención aún aplica el agravante?","a":"Dos años","o":["Un año","Dos años","Tres años","Cinco años"],"x":"El agravante alcanza a quien realice la conducta «dentro de los dos años siguientes de haberse separado» del cargo. El mismo plazo aplica a los ex servidores públicos.","ref":"Art. 400 Bis 1, primer párrafo · S1"},{"id":"C073","tema":"m1s1","tipo":"memoria","q":"Según el art. 400 Bis 1, ¿a partir de cuándo comienza a correr la inhabilitación?","a":"A partir de que se haya cumplido la pena de prisión","o":["A partir de que se separe del cargo en el sujeto al régimen de prevención","A partir de la fecha de la denuncia de la SHCP","A partir de que se haya cumplido la pena de prisión","A partir de que la sentencia condenatoria quede firme"],"x":"El texto dice: «La inhabilitación comenzará a correr a partir de que se haya cumplido la pena de prisión». No corre desde la sentencia ni desde la separación del cargo.","ref":"Art. 400 Bis 1, segundo párrafo · S1"},{"id":"C074","tema":"m1s1","tipo":"trampa","q":"¿Cuál de estas personas NO aparece en el primer párrafo del art. 400 Bis 1 como sujeto del agravante de un tercio hasta una mitad?","a":"Accionista","o":["Consejero","Prestador de servicios","Apoderado","Accionista"],"x":"El texto enumera consejero, administrador, funcionario, empleado, apoderado o prestador de servicios del sujeto al régimen de prevención. El accionista no está en la lista.","ref":"Art. 400 Bis 1, primer párrafo · S1"},{"id":"C075","tema":"m1s1","tipo":"caso","q":"Laura, empleada de una entidad sujeta al régimen de prevención de operaciones con recursos de procedencia ilícita, deposita recursos sabiendo que son producto de un fraude. ¿Qué pasa con su pena?","a":"Aumenta desde un tercio hasta en una mitad","o":["Aumenta desde un tercio hasta en una mitad","Se aplica la pena base sin aumento","Se duplica, por ser personal de la entidad","Aumenta hasta en una mitad, sin mínimo"],"x":"Al empleado de un sujeto al régimen de prevención se le aumenta desde un tercio hasta en una mitad (y se le inhabilita). La duplicación es para servidores públicos encargados de prevenir, investigar o juzgar delitos.","ref":"Art. 400 Bis 1, primer párrafo · S1"},{"id":"C076","tema":"m1s1","tipo":"caso","q":"Diego se separó hace 18 meses de su cargo de apoderado en un sujeto al régimen de prevención y ahora transfiere recursos sabiendo que son producto de una actividad ilícita. ¿Aplica el agravante del art. 400 Bis 1?","a":"Sí, porque actúa dentro de los dos años siguientes a su separación","o":["No, porque ya no tiene el cargo cuando realiza la conducta","No, porque el plazo que prevé la norma es de un año","Sí, pero sólo si lo hace con recursos de su exempleador","Sí, porque actúa dentro de los dos años siguientes a su separación"],"x":"El agravante alcanza a quien realice la conducta «dentro de los dos años siguientes de haberse separado» del cargo; 18 meses están dentro de ese plazo.","ref":"Art. 400 Bis 1, primer párrafo · S1"},{"id":"C077","tema":"m1s1","tipo":"caso","q":"Un exconsejero de un sujeto al régimen de prevención, separado del cargo hace tres años, adquiere bienes sabiendo que son producto de una actividad ilícita. ¿Qué pena le corresponde?","a":"La del art. 400 Bis, sin el agravante del cargo","o":["La del 400 Bis duplicada, por haber sido consejero","La del 400 Bis aumentada de un tercio a una mitad","La del art. 400 Bis, sin el agravante del cargo","La del 400 Bis aumentada hasta en una mitad"],"x":"El agravante sólo cubre los dos años siguientes a la separación. A los tres años le corresponde la pena base: de cinco a quince años y de mil a cinco mil días multa.","ref":"Arts. 400 Bis y 400 Bis 1, primer párrafo · S1"},{"id":"C078","tema":"m1s1","tipo":"caso","q":"Un agente del Ministerio Público encargado de investigar delitos oculta el origen de bienes sabiendo que provienen de una actividad ilícita. ¿Qué establece el art. 400 Bis 1?","a":"Las penas se duplican y hay inhabilitación","o":["Las penas aumentan desde un tercio hasta una mitad","Las penas aumentan hasta en una mitad, sin inhabilitación","Las penas se duplican y hay inhabilitación","Las penas se triplican y hay destitución inmediata"],"x":"Si lava un servidor público encargado de prevenir, detectar, denunciar, investigar o juzgar delitos, las penas «se duplicarán», más inhabilitación hasta por un tiempo igual al de la prisión.","ref":"Art. 400 Bis 1, tercer párrafo · S1"},{"id":"C079","tema":"m1s1","tipo":"caso","q":"Un exjuez penal, un año después de terminar su encargo, invierte recursos sabiendo que son producto de una actividad ilícita. ¿Qué le aplica?","a":"Se duplican las penas, por actuar dentro de los dos años","o":["Aumento hasta en una mitad, por haber sido juez","Aumento de un tercio hasta en una mitad de las penas","La pena base, porque ya no es servidor público","Se duplican las penas, por actuar dentro de los dos años"],"x":"El tercer párrafo del 400 Bis 1 alcanza a los ex servidores encargados de juzgar delitos que cometan la conducta en los dos años posteriores a su terminación: las penas se duplican.","ref":"Art. 400 Bis 1, tercer párrafo · S1"},{"id":"C080","tema":"m1s1","tipo":"caso","q":"Raúl utiliza a su sobrino de 16 años para depositar en efectivo recursos que sabe producto de una actividad ilícita. ¿Qué agravante prevé el art. 400 Bis 1?","a":"Las penas aumentan hasta en una mitad","o":["Las penas se duplican por usar a un menor","Las penas aumentan desde un tercio hasta en una mitad","Las penas aumentan hasta en un tercio","Las penas aumentan hasta en una mitad"],"x":"Usar a menores de dieciocho años (o a personas sin capacidad de comprender el hecho o de resistirlo) aumenta las penas «hasta en una mitad». El rango de un tercio a una mitad es para el personal de sujetos al régimen de prevención.","ref":"Art. 400 Bis 1, cuarto párrafo · S1"},{"id":"C081","tema":"m1s1","tipo":"caso","q":"Un empleado de un sujeto al régimen de prevención es condenado por lavado a seis años de prisión. ¿Qué inhabilitación le puede imponer el art. 400 Bis 1?","a":"Hasta seis años, contados desde que cumpla la prisión","o":["Hasta tres años, contados desde que cumpla la prisión","Hasta seis años, contados desde que cumpla la prisión","Hasta doce años, contados desde la sentencia","Seis años exactos, contados desde la sentencia"],"x":"La inhabilitación es «hasta por un tiempo igual al de la pena de prisión impuesta» y corre a partir de que se haya cumplido la prisión. Con seis años de prisión, el máximo es de seis.","ref":"Art. 400 Bis 1, segundo párrafo · S1"},{"id":"C082","tema":"m1s1","tipo":"caso","q":"Mario ya era dueño de un inmueble que sabe comprado con el producto de un delito. Ahora lo registra a nombre de otra persona para ocultar quién es su verdadero propietario. ¿Qué fracción del art. 400 Bis describe este acto de registro?","a":"Fracción II: ocultar la propiedad o titularidad","o":["Fracción I: adquirir o administrar los recursos","Fracción II del art. 139 Quáter: ocultar bienes","Art. 400 Bis 1: agravante por interpósita persona","Fracción II: ocultar la propiedad o titularidad"],"x":"Ocultar o encubrir la propiedad o titularidad de bienes con conocimiento de su origen ilícito es la fracción II del 400 Bis. El 400 Bis 1 no contiene un agravante por interpósita persona.","ref":"Art. 400 Bis, fracción II · S1"},{"id":"C083","tema":"m1s1","tipo":"caso","q":"Sergio transporta del extranjero hacia México dinero en efectivo, sabiendo que es producto de una actividad ilícita. ¿Encuadra en la fracción I del art. 400 Bis?","a":"Sí; abarca transportar de México al extranjero o a la inversa","o":["No; la fracción I sólo abarca operaciones dentro de México","Sólo si después deposita el dinero en el sistema financiero","No; transportar no es una conducta de la fracción I","Sí; abarca transportar de México al extranjero o a la inversa"],"x":"La fracción I incluye transportar recursos «dentro del territorio nacional, de éste hacia el extranjero o a la inversa». Traerlo del extranjero es la dirección «a la inversa».","ref":"Art. 400 Bis, fracción I · S1"},{"id":"C084","tema":"m1s1","tipo":"caso","q":"Elena pide a una amiga que compre a nombre propio un automóvil con dinero que Elena sabe producto de un fraude. Según el art. 400 Bis, ¿puede responder Elena?","a":"Sí; el tipo comprende actuar por sí o por interpósita persona","o":["Sí; el tipo comprende actuar por sí o por interpósita persona","Sólo si la amiga sabía el origen ilícito del dinero","Sólo si el bien adquirido es un inmueble o de lujo","No; sólo responde la amiga, que realizó la compra"],"x":"El 400 Bis castiga a quien «por sí o por interpósita persona» realice las conductas. Elena actúa a través de su amiga.","ref":"Art. 400 Bis, primer párrafo · S1"},{"id":"C085","tema":"m1s1","tipo":"caso","q":"En una investigación hay indicios fundados de que los recursos de una cuenta provienen de la comisión de un delito, y su titular no puede acreditar su legítima procedencia. Para el art. 400 Bis, ¿cómo se consideran esos recursos?","a":"Producto de una actividad ilícita","o":["Producto de una actividad ilícita","Recursos de procedencia dudosa, sin efecto penal","Producto de una actividad ilícita sólo si hay certeza","Recursos de origen lícito hasta que haya sentencia"],"x":"Para el art. 400 Bis basta con «indicios fundados o certeza» de que provienen de un delito, siempre que no pueda acreditarse su legítima procedencia. No exige certeza ni sentencia.","ref":"Art. 400 Bis, segundo párrafo · S1"},{"id":"C086","tema":"m1s1","tipo":"caso","q":"Se investiga un posible lavado en el que se usaron los servicios de un banco. Según el art. 400 Bis, ¿qué facultad tiene el Ministerio Público?","a":"Está en todo momento facultado para investigar","o":["Puede investigar sólo dentro de los dos años","Está en todo momento facultado para investigar","Sólo puede investigar si el banco lo solicita","Sólo investiga tras una sentencia del juez penal"],"x":"Cuando se utilizan servicios de instituciones del sistema financiero, «el Ministerio Público estará en todo momento facultado para investigarlas». El plazo de dos años es del 400 Bis 1 y no tiene que ver con esto.","ref":"Art. 400 Bis, tercer párrafo · S1"},{"id":"C087","tema":"m1s1","tipo":"caso","q":"El Ministerio Público investigó una conducta del art. 400 Bis en la que se usaron servicios del sistema financiero y quiere ejercer la acción penal. ¿Qué requiere?","a":"La denuncia de la SHCP, que tiene el carácter de víctima u ofendida","o":["La denuncia de la SHCP, que actúa sólo como coadyuvante del Ministerio Público","Ningún requisito previo, porque está facultado en todo momento","La querella de la institución financiera, que tiene el carácter de víctima","La denuncia de la SHCP, que tiene el carácter de víctima u ofendida"],"x":"Para ejercer la acción penal se requiere la denuncia de la SHCP, «quien tendrá el carácter de víctima u ofendida» (párrafo reformado DOF 16-07-2025). Estar facultado para investigar no elimina ese requisito.","ref":"Art. 400 Bis, tercer párrafo · S1"},{"id":"C088","tema":"m1s1","tipo":"caso","q":"Tomás esconde en su casa a una persona que participó en un financiamiento al terrorismo para evitar que la detengan. ¿Qué pena prevé el CPF para Tomás?","a":"De uno a nueve años y de cien a trescientos días multa","o":["De cinco a quince años y de mil a cinco mil días multa","De quince a cuarenta años y de 400 a 1,200 veces la UMA","De uno a nueve años y de cien a trescientos días multa","De cinco a diez años y de cien a trescientos días multa"],"x":"Encubrir a quien participó en los delitos del 139 Quáter es el art. 139 Quinquies: de uno a nueve años de prisión y de cien a trescientos días multa. Tomás no financió; encubrió.","ref":"Art. 139 Quinquies · S1"},{"id":"C089","tema":"m1s1","tipo":"caso","q":"Un juez condena a Ana por aportar fondos sabiendo que se destinarían a una organización terrorista. ¿Dentro de qué rango debe fijar la multa?","a":"De 400 a 1,200 veces el valor diario de la UMA","o":["De 100 a 300 días multa","De 400 a 1,200 días multa","De 1,000 a 5,000 días multa","De 400 a 1,200 veces el valor diario de la UMA"],"x":"El FT lleva la pena del art. 139: multa de cuatrocientas a mil doscientas veces el valor diario de la UMA. Mil a cinco mil días multa es la del lavado.","ref":"Arts. 139 Quáter y 139, primer párrafo · S1"},{"id":"C090","tema":"m1s1","tipo":"caso","q":"Luis es condenado por operaciones con recursos de procedencia ilícita, sin agravantes, y Raúl por financiamiento al terrorismo. ¿Cuál es la prisión máxima de cada uno?","a":"Luis, quince años; Raúl, cuarenta años","o":["Ambos, cuarenta años de prisión","Luis, quince años; Raúl, nueve años","Luis, cuarenta años; Raúl, quince años","Luis, quince años; Raúl, cuarenta años"],"x":"El 400 Bis llega a quince años; el 139 Quáter remite al 139, que llega a cuarenta. Nueve años es el máximo del encubrimiento del 139 Quinquies.","ref":"Arts. 400 Bis, 139 Quáter y 139 · S1"},{"id":"O001","tema":"m1s2","tipo":"memoria","q":"«Es el principal organismo normativo internacional para la regulación prudencial de los bancos y constituye un foro de cooperación en materia de supervisión bancaria.» Según la CNBV, ¿a qué organismo corresponde esta definición?","a":"Comité de Supervisión Bancaria de Basilea","o":["Grupo Wolfsberg, asociación reunida para desarrollar estándares","Comité de Supervisión Bancaria de Basilea","Grupo Egmont de Unidades de Inteligencia Financiera","Grupo de Acción Financiera Internacional (GAFI)"],"x":"Las palabras clave son «regulación prudencial de los bancos» y «supervisión bancaria»: así define la CNBV al Comité de Basilea. Wolfsberg también se relaciona con bancos, pero la CNBV lo define como una asociación de bancos que desarrolla estándares contra el FT, la corrupción y el lavado, no como organismo normativo prudencial.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O002","tema":"m1s2","tipo":"memoria","q":"«Es una asociación de bancos reunidos con la finalidad de desarrollar estándares para la lucha contra el financiamiento del terrorismo, la corrupción y el lavado de dinero en instituciones financieras.» Según la CNBV, ¿a qué organismo corresponde?","a":"Grupo Wolfsberg","o":["Comité de Supervisión Bancaria de Basilea","Grupo Egmont de Unidades de Inteligencia Financiera","Grupo de Acción Financiera de Latinoamérica (GAFILAT)","Grupo Wolfsberg"],"x":"«Asociación de bancos» es la marca del Grupo Wolfsberg: es el único de los seis organismos que la CNBV define así. Basilea es un organismo normativo para la regulación prudencial de los bancos (piensa en supervisores, no en bancos asociados).","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O003","tema":"m1s2","tipo":"memoria","q":"Completa la definición de la CNBV del Grupo Egmont: «Es un foro para que las unidades de inteligencia financiera alrededor del mundo mejoren sus ______ en la lucha contra el lavado de dinero y el financiamiento al terrorismo.»","a":"vínculos de cooperación","o":["vínculos de cooperación","mecanismos de supervisión prudencial","estándares de debida diligencia bancaria","procesos de evaluación mutua entre pares"],"x":"La redacción exacta es «mejoren sus vínculos de cooperación». La supervisión prudencial corresponde a la definición de Basilea; las evaluaciones mutuas («revisiones entre pares») son tarea del GAFI según su Mandato, no del Grupo Egmont.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O004","tema":"m1s2","tipo":"memoria","q":"Completa la definición de la CNBV del GAFILAT: «Es una organización intergubernamental ______ para prevenir y combatir el lavado de activos, el financiamiento del terrorismo y el financiamiento de la proliferación de armas de destrucción masiva.»","a":"regional","o":["mundial","regional","de unidades de inteligencia","sudamericana"],"x":"La palabra exacta es «regional», y es la que separa al GAFILAT del GAFI, que la CNBV define como «entidad intergubernamental» sin calificativo regional. «Sudamericana» no aparece en la definición de la CNBV.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O005","tema":"m1s2","tipo":"caso","q":"La unidad de inteligencia financiera de un país quiere estrechar su cooperación con las UIF de otros países en la lucha contra el lavado de dinero y el financiamiento al terrorismo. Según la definición de la CNBV, ¿qué foro existe precisamente para ello?","a":"Grupo Egmont","o":["Comité de Supervisión Bancaria de Basilea","Grupo Wolfsberg","Grupo Egmont","Organización de las Naciones Unidas"],"x":"La CNBV define al Grupo Egmont como el foro para que las UIF de todo el mundo mejoren sus vínculos de cooperación. Gancho: Egmont = las UIF. Basilea reúne la supervisión bancaria y Wolfsberg es una asociación de bancos.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O006","tema":"m1s2","tipo":"caso","q":"Varios bancos internacionales se reúnen para desarrollar estándares contra el financiamiento del terrorismo, la corrupción y el lavado de dinero en instituciones financieras. ¿Qué organismo de los que cita la CNBV responde a esa descripción?","a":"Grupo Wolfsberg","o":["Grupo Wolfsberg","Grupo Egmont","Comité de Supervisión Bancaria de Basilea","Grupo de Acción Financiera de Latinoamérica"],"x":"Quien se sienta a la mesa son los bancos: eso es Wolfsberg, «una asociación de bancos». Además, su definición es la única que menciona la corrupción. Basilea es un organismo normativo para la regulación prudencial, no una asociación de bancos.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O007","tema":"m1s2","tipo":"caso","q":"El área de supervisión de una autoridad financiera busca el foro de cooperación en materia de supervisión bancaria que, según la CNBV, es además el principal organismo normativo para la regulación prudencial de los bancos. ¿Cuál es?","a":"Comité de Supervisión Bancaria de Basilea","o":["Grupo Wolfsberg","Grupo Egmont","Grupo de Acción Financiera de Latinoamérica","Comité de Supervisión Bancaria de Basilea"],"x":"Regulación prudencial y supervisión bancaria son las dos ideas de la definición del Comité de Basilea. Wolfsberg, en cambio, es una asociación de bancos que desarrolla estándares; Egmont es el foro de las UIF.","ref":"CNBV, Organismos Internacionales · S2"},{"id":"O008","tema":"m1s2","tipo":"memoria","q":"«...cuyos objetivos son fijar estándares y promover la efectiva implementación de medidas legales, regulatorias y operativas...» Según la CNBV, ¿a qué organismo pertenece este fragmento?","a":"Grupo de Acción Financiera Internacional","o":["Grupo de
