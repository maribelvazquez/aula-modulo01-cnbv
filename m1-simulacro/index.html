o son sujetos obligados, y actuar no depende de una designación.","ref":"INR.8, párr. 5(d) · S3","d":{"Esperar a que concluyan los programas de ayuda en curso, para no afectar a los beneficiarios legítimos de la OSFL":"La INR.8 (párr. 5d) dice que proteger a los beneficiarios no excusa aplazar acciones inmediatas para detener el FT.","Exigir a la OSFL que aplique DDC a sus beneficiarios y presente reportes de operaciones sospechosas":"La INR.8 (párr. 5e) dice que las OSFL no son sujetos obligados y no debe exigírseles DDC; reportar sospechas tampoco es su obligación.","Actuar sólo después de que el Consejo de Seguridad designe a la OSFL conforme a la R.6":"Actuar contra el FT no depende de una designación del Consejo de Seguridad; la primera prioridad es investigar y detenerlo de inmediato."}},{"id":"G125","tema":"m1s3","tipo":"trampa","q":"Según la Nota a la R.8, la identificación de las OSFL y la evaluación de sus riesgos de FT que realiza el país:","a":"Pueden adoptar diversas formas, ser o no un producto escrito, y deben revisarse periódicamente","o":["Pueden adoptar diversas formas, ser o no un producto escrito, y deben revisarse periódicamente","Deben constar siempre en un documento escrito y publicado, que se actualice cada año","Pueden ser o no un producto escrito y, una vez concluidas, no necesitan volver a revisarse","Deben documentarse por escrito, igual que las evaluaciones que la Nota a la R.1 exige a IF y APNFD"],"x":"La INR.8 (párr. 6d) dice que esos ejercicios deben usar todas las fuentes pertinentes y confiables, incluido el diálogo con las OSFL, pueden adoptar diversas formas, «pueden o no» ser un producto escrito y deben revisarse periódicamente. La documentación de evaluaciones que pide la INR.1 (párr. 12) es para IF y APNFD, no para este ejercicio del país.","ref":"INR.8, párr. 6(d); INR.1, párr. 12 · S3","d":{"Deben constar siempre en un documento escrito y publicado, que se actualice cada año":"La INR.8 (párr. 6d) dice que «pueden o no» ser un producto escrito y pide revisión periódica, sin fijar publicación ni periodicidad anual.","Pueden ser o no un producto escrito y, una vez concluidas, no necesitan volver a revisarse":"Acierta en la forma, pero la INR.8 (párr. 6d) exige revisar esos ejercicios periódicamente.","Deben documentarse por escrito, igual que las evaluaciones que la Nota a la R.1 exige a IF y APNFD":"La documentación que pide la INR.1 (párr. 12) es para las evaluaciones de IF y APNFD; la del país sobre OSFL «puede o no» ser escrita."}},{"id":"G126","tema":"m1s3","tipo":"trampa","q":"Según la Nota a la R.8, las sanciones que las autoridades pueden aplicar por violaciones de las OSFL o de quienes actúan en su nombre pueden incluir:","a":"Congelamiento de cuentas, remoción de fiduciarios, multas y retiro de certificación, licencia o registro","o":["Sólo multas administrativas, sin afectar su registro ni sus cuentas, para no desalentar las actividades legítimas","Sólo sanciones penales, que excluyen cualquier procedimiento civil o administrativo paralelo","Congelamiento de cuentas, remoción de fiduciarios, multas y retiro de certificación, licencia o registro","Únicamente su designación conforme a la R.6 y el decomiso sin condena de todos sus bienes"],"x":"La nota al pie 35 de la INR.8 dice que la gama de sanciones podría incluir congelamiento de cuentas, remoción de fiduciarios, multas, retiro de certificación, de licencia o de registro, sin excluir procedimientos civiles, administrativos o penales paralelos. El párr. 7(b)(iii) pide que sean eficaces, proporcionales y disuasivas.","ref":"INR.8, párr. 7(b)(iii) y nota al pie 35 · S3","d":{"Sólo multas administrativas, sin afectar su registro ni sus cuentas, para no desalentar las actividades legítimas":"La nota al pie 35 de la INR.8 incluye también congelamiento de cuentas, remoción de fiduciarios y retiro de registro o licencia.","Sólo sanciones penales, que excluyen cualquier procedimiento civil o administrativo paralelo":"La nota al pie 35 de la INR.8 no excluye procedimientos civiles, administrativos o penales paralelos.","Únicamente su designación conforme a la R.6 y el decomiso sin condena de todos sus bienes":"La designación (R.6) y el decomiso sin condena (R.4) son regímenes distintos; no aparecen en la gama de sanciones de la INR.8."}},{"id":"G201","tema":"m1s3","tipo":"trampa","q":"¿Cuál de estas afirmaciones sobre la R.9 (Leyes de secreto de las instituciones financieras) es correcta?","a":"Obliga a los países y es de las recomendaciones que no tienen Nota interpretativa","o":["Obliga directamente a las IF, y su Nota interpretativa fija las excepciones aplicables","Obliga a los países, y su Nota interpretativa fija las excepciones por secreto profesional","Obliga a los países y es de las recomendaciones que no tienen Nota interpretativa","Obliga a los países, pero sólo respecto de la cooperación internacional (R.37 a R.40)"],"x":"La R.9 dice que los países deben asegurar que las leyes de secreto de las IF no inhiban la implementación de las Recomendaciones, y es una de las que no tienen Nota interpretativa. Los distractores más tentadores le atribuyen una Nota inexistente con excepciones; la salvedad del secreto profesional legal aparece en otras partes, como la R.37, inciso (d).","ref":"R.9 (sin Nota interpretativa) · S3","d":{"Obliga directamente a las IF, y su Nota interpretativa fija las excepciones aplicables":"La R.9 se dirige a los países, no a las IF, y no tiene Nota interpretativa.","Obliga a los países, y su Nota interpretativa fija las excepciones por secreto profesional":"La R.9 no tiene Nota interpretativa; la salvedad del secreto profesional legal aparece en otras partes, como la R.37, inciso (d).","Obliga a los países, pero sólo respecto de la cooperación internacional (R.37 a R.40)":"La R.9 se refiere a la implementación de todas las Recomendaciones del GAFI, no sólo a las de cooperación internacional."}},{"id":"G202","tema":"m1s3","tipo":"caso","q":"En el país Alfa, una ley de secreto bancario impide que las IF compartan información en supuestos que exigen las Recomendaciones del GAFI. ¿Qué establece el estándar al respecto?","a":"El país debe asegurar que esas leyes no inhiban la implementación de las Recomendaciones","o":["Se alienta enfáticamente al país a revisarlas, pero la R.9 no le impone una obligación","El país podrá mantenerlas mientras lo justifique la Nota interpretativa a la R.9","Las IF deben invocar el secreto y considerar un reporte, según la Nota interpretativa a la R.20","El país debe asegurar que esas leyes no inhiban la implementación de las Recomendaciones"],"x":"La R.9 usa «should»: los países deben asegurar que las leyes de secreto de las IF no inhiban la implementación de las Recomendaciones. No es una simple invitación («se alienta enfáticamente») y no existe Nota interpretativa a la R.9 que permita mantener esas leyes.","ref":"R.9 · S3","d":{"Se alienta enfáticamente al país a revisarlas, pero la R.9 no le impone una obligación":"La R.9 usa «should» (deben); «se alienta enfáticamente» es lenguaje de otras disposiciones, como la R.23(a).","El país podrá mantenerlas mientras lo justifique la Nota interpretativa a la R.9":"No existe Nota interpretativa a la R.9; el estándar no prevé ninguna justificación para mantener esas leyes.","Las IF deben invocar el secreto y considerar un reporte, según la Nota interpretativa a la R.20":"La INR.20 trata del alcance del reporte de operaciones sospechosas, no de leyes de secreto; ese tema es de la R.9."}},{"id":"G203","tema":"m1s3","tipo":"trampa","q":"¿Dónde se establece que los registros de operaciones de una IF deben permitir reconstruir operaciones individuales, incluidos los montos y el tipo de moneda, para servir de prueba si fuera necesario?","a":"En el propio texto de la R.11, que no tiene Nota interpretativa","o":["En la Nota interpretativa a la R.11, que desarrolla ese requisito","En la Nota interpretativa a la R.10, sobre DDC continua","En la Nota interpretativa a la R.16, sobre las IF intermediarias","En el propio texto de la R.11, que no tiene Nota interpretativa"],"x":"El requisito de reconstruir operaciones individuales (montos y tipo de moneda) está en el propio texto de la R.11, que no tiene Nota. La INR.16 sí pide a la IF intermediaria conservar cinco años la información recibida cuando hay limitaciones técnicas, y la INR.10 habla de mantener actualizada la información de DDC, pero ninguna contiene esta regla.","ref":"R.11 (sin Nota interpretativa) · S3","d":{"En la Nota interpretativa a la R.11, que desarrolla ese requisito":"La R.11 no tiene Nota interpretativa; el requisito está en el propio texto de la Recomendación.","En la Nota interpretativa a la R.10, sobre DDC continua":"La INR.10 regula aspectos de DDC, no la conservación de registros que permita reconstruir operaciones (texto de la R.11).","En la Nota interpretativa a la R.16, sobre las IF intermediarias":"La INR.16 pide conservar cinco años la información recibida por la IF intermediaria ante limitaciones técnicas; no fija esta regla general."}},{"id":"G204","tema":"m1s3","tipo":"caso","q":"Con la autorización apropiada, una autoridad nacional competente pide a una IF los registros de las operaciones de un cliente. La IF sólo conserva los de operaciones internacionales, porque las nacionales «ya quedan en el sistema de pagos». Conforme a la R.11:","a":"Incumple: la obligación abarca registros de operaciones tanto nacionales como internacionales","o":["Cumple: la Nota interpretativa a la R.11 limita la conservación a operaciones transfronterizas","Incumple: la obligación abarca registros de operaciones tanto nacionales como internacionales","Cumple, porque la Nota a la R.16 exime a las transferencias nacionales de conservar información","Incumple sólo respecto de las operaciones nacionales por encima de USD/EUR 15,000"],"x":"La R.11 exige conservar al menos cinco años todos los registros necesarios de operaciones, «tanto nacionales como internacionales», sin umbral. La R.11 no tiene Nota, y la INR.16 no exime de conservar: pide mantener la información de ordenante y beneficiario conforme a la R.11.","ref":"R.11; INR.16, párr. 22 · S3","d":{"Cumple: la Nota interpretativa a la R.11 limita la conservación a operaciones transfronterizas":"La R.11 no tiene Nota interpretativa, y su texto exige registros de operaciones «tanto nacionales como internacionales».","Cumple, porque la Nota a la R.16 exime a las transferencias nacionales de conservar información":"La INR.16 no exime de conservar: pide mantener la información de ordenante y beneficiario conforme a la R.11.","Incumple sólo respecto de las operaciones nacionales por encima de USD/EUR 15,000":"La R.11 no fija umbral; USD/EUR 15,000 es el umbral de DDC para operaciones ocasionales de la R.10."}},{"id":"G205","tema":"m1s3","tipo":"trampa","q":"La obligación de tomar medidas razonables para determinar si los beneficiarios de una póliza de seguro de vida son PEP, a más tardar al momento del pago, ¿dónde se establece?","a":"En la Nota interpretativa a la R.12, sobre seguros de vida","o":["En la Nota interpretativa a la R.10, sobre beneficiarios de seguros","En la Nota interpretativa a la R.12, sobre seguros de vida","En el texto de la R.12, junto con sus medidas (a) a (d)","En el Glosario, en la definición de personas expuestas políticamente"],"x":"La INR.12 pide determinar si los beneficiarios de un seguro de vida (y, cuando se requiera, su beneficiario final) son PEP, a más tardar al momento del pago. El distractor más tentador es la INR.10, que regula la DDC de esos beneficiarios y su verificación al pago, pero no la detección de PEP.","ref":"INR.12 · S3","d":{"En la Nota interpretativa a la R.10, sobre beneficiarios de seguros":"La INR.10 regula la DDC de los beneficiarios de seguros y su verificación al pago, pero no la detección de PEP.","En el texto de la R.12, junto con sus medidas (a) a (d)":"Trampa texto/Nota: los incisos (a) a (d) de la R.12 son para PEP extranjeras; los seguros de vida sólo aparecen en la INR.12.","En el Glosario, en la definición de personas expuestas políticamente":"El Glosario define quiénes son PEP, pero no impone obligaciones sobre beneficiarios de seguros de vida."}},{"id":"G206","tema":"m1s3","tipo":"caso","q":"Una IF abre una cuenta a un familiar de un jefe de Estado extranjero en funciones. El familiar no ocupa ningún cargo público. Conforme a la R.12, además de la DDC normal:","a":"Aplican los requisitos de PEP extranjera, porque la R.12 los extiende a familiares y allegados","o":["Nada más: la Nota a la R.12 limita las medidas adicionales a quien ejerce la función pública","Aplican las medidas (b) a (d) sólo si la relación es de riesgo mayor, como con las PEP nacionales","Nada más, porque el Glosario excluye a las personas de rango medio o de menor jerarquía","Aplican los requisitos de PEP extranjera, porque la R.12 los extiende a familiares y allegados"],"x":"El texto de la R.12 dice que los requisitos para todos los tipos de PEP se aplican también a sus familiares y allegados; como la PEP es extranjera, rigen las medidas (a) a (d). La condición de «riesgo mayor» es propia de las PEP nacionales y de organismos internacionales, y la INR.12 sólo trata de seguros de vida.","ref":"R.12 · S3","d":{"Nada más: la Nota a la R.12 limita las medidas adicionales a quien ejerce la función pública":"La INR.12 sólo trata de seguros de vida; es el texto de la R.12 el que extiende los requisitos a familiares y allegados.","Aplican las medidas (b) a (d) sólo si la relación es de riesgo mayor, como con las PEP nacionales":"El «riesgo mayor» condiciona las medidas para PEP nacionales y de organismos internacionales; para PEP extranjeras aplican siempre (a) a (d).","Nada más, porque el Glosario excluye a las personas de rango medio o de menor jerarquía":"La exclusión de rangos medios o inferiores del Glosario se refiere a la jerarquía del cargo, no a familiares de un jefe de Estado."}},{"id":"G207","tema":"m1s3","tipo":"trampa","q":"Para saber si un cliente o su beneficiario final es una PEP extranjera, el texto de la R.12 exige a las IF:","a":"Tener sistemas apropiados de gestión de riesgos que permitan determinarlo","o":["Tener sistemas apropiados de gestión de riesgos que permitan determinarlo","Tomar medidas razonables para determinarlo, como con las PEP nacionales","Consultar la lista oficial de PEP extranjeras que prevé la Nota a la R.12","Obtener la aprobación de la alta dirección antes de hacer esa determinación"],"x":"Para PEP extranjeras, el inciso (a) de la R.12 pide sistemas apropiados de gestión de riesgos; las «medidas razonables» son la fórmula para PEP nacionales y de organismos internacionales. La aprobación de la alta dirección es para establecer o continuar la relación, y la INR.12 no prevé ninguna lista.","ref":"R.12, inciso (a) · S3","d":{"Tomar medidas razonables para determinarlo, como con las PEP nacionales":"Las «medidas razonables» son la fórmula de la R.12 para PEP nacionales y de organismos internacionales, no para las extranjeras.","Consultar la lista oficial de PEP extranjeras que prevé la Nota a la R.12":"La INR.12 sólo trata de seguros de vida; el estándar no prevé una lista oficial de PEP extranjeras.","Obtener la aprobación de la alta dirección antes de hacer esa determinación":"La aprobación de la alta dirección (inciso b) es para establecer o continuar la relación, no para determinar si es PEP."}},{"id":"G208","tema":"m1s3","tipo":"caso","q":"Un banco abre una relación transfronteriza a una casa de bolsa extranjera para liquidar operaciones con valores por cuenta de los clientes de ésta. ¿Debe aplicar los criterios (a) a (e) de la R.13?","a":"Sí: la Nota a la R.13 incluye relaciones similares establecidas para operaciones con valores","o":["No: el Glosario define la corresponsalía como servicios entre bancos, así que la R.13 no aplica","Sí, pero sólo cuando la casa de bolsa actúa como principal y no por cuenta de sus clientes","Sí: la Nota a la R.13 incluye relaciones similares establecidas para operaciones con valores","No, salvo que la casa de bolsa sea de un país para el que el GAFI pida DDC reforzada"],"x":"La R.13 abarca la corresponsalía transfronteriza «y otras relaciones similares», y la INR.13 da como ejemplo las establecidas para operaciones con valores o transferencias de fondos, ya sea que la institución actúe como principal o por cuenta de sus clientes. La definición de corresponsalía bancaria del Glosario no limita ese alcance.","ref":"INR.13; R.13 · S3","d":{"No: el Glosario define la corresponsalía como servicios entre bancos, así que la R.13 no aplica":"La R.13 abarca la corresponsalía «y otras relaciones similares»; la INR.13 incluye las de operaciones con valores.","Sí, pero sólo cuando la casa de bolsa actúa como principal y no por cuenta de sus clientes":"La INR.13 aplica los criterios ya sea que la institución actúe como principal o por cuenta de sus clientes.","No, salvo que la casa de bolsa sea de un país para el que el GAFI pida DDC reforzada":"La R.13 aplica a toda relación transfronteriza similar; la DDC reforzada para países señalados por el GAFI es otra regla, la de la R.19."}},{"id":"G209","tema":"m1s3","tipo":"trampa","q":"La definición de «cuentas de transferencia de pagos» (payable-through accounts) como cuentas corresponsales que usan directamente terceros para realizar negocios por cuenta propia, ¿dónde se encuentra?","a":"En la Nota interpretativa a la R.13; el Glosario general sólo remite a ella","o":["En el Glosario general, dentro de la definición de corresponsalía bancaria","En el texto de la R.13, inciso (e), junto con la obligación de DDC","En la Nota interpretativa a la R.16, en su glosario de términos específicos","En la Nota interpretativa a la R.13; el Glosario general sólo remite a ella"],"x":"La definición está en la INR.13; el Glosario general sólo remite a esa Nota. El inciso (e) de la R.13 menciona estas cuentas y pide verificar la DDC del banco respondiente, pero no las define, y la corresponsalía bancaria del Glosario sólo las enlista entre los servicios.","ref":"INR.13; Glosario (cuentas de transferencia de pagos) · S3","d":{"En el Glosario general, dentro de la definición de corresponsalía bancaria":"La corresponsalía bancaria del Glosario sólo enlista estas cuentas entre los servicios; no las define.","En el texto de la R.13, inciso (e), junto con la obligación de DDC":"El inciso (e) de la R.13 menciona estas cuentas y pide verificar la DDC del respondiente, pero no las define.","En la Nota interpretativa a la R.16, en su glosario de términos específicos":"La INR.16 tiene su propio glosario, pero no define las cuentas de transferencia de pagos; la definición es de la INR.13."}},{"id":"G210","tema":"m1s3","tipo":"caso","q":"Un proveedor de servicios de transferencia de dinero o valores opera con una red de agentes, todos con registro propio ante una autoridad competente. Conforme a la R.14, ¿qué deben asegurar los países respecto de esos agentes?","a":"Que el proveedor los incluya en sus programas PLD/FT y vigile que cumplan con ellos","o":["Nada más: con registro propio, la Nota a la R.14 exime al proveedor de vigilarlos","Que el proveedor los incluya en sus programas PLD/FT y vigile que cumplan con ellos","Que el proveedor los trate como terceros en quienes se apoya, conforme a la Nota a la R.17","Que los incluya en su programa sólo si son filiales de propiedad mayoritaria (Nota a la R.18)"],"x":"El texto de la R.14 pide que los proveedores que usan agentes los incluyan en sus programas PLD/FT y los monitoreen, con independencia de que el agente tenga licencia o registro propio. La INR.14 sólo trata de no duplicar licencias para IF ya autorizadas, y la INR.17 excluye las relaciones de agencia del apoyo en terceros.","ref":"R.14; INR.14; INR.17, párr. 1 · S3","d":{"Nada más: con registro propio, la Nota a la R.14 exime al proveedor de vigilarlos":"La INR.14 sólo evita duplicar licencias a IF ya autorizadas; el texto de la R.14 pide incluir y monitorear a los agentes aunque tengan registro propio.","Que el proveedor los trate como terceros en quienes se apoya, conforme a la Nota a la R.17":"La INR.17, párr. 1, excluye expresamente las relaciones de agencia y de subcontratación del apoyo en terceros.","Que los incluya en su programa sólo si son filiales de propiedad mayoritaria (Nota a la R.18)":"Las «filiales de propiedad mayoritaria» son de la R.18 (grupos financieros); la R.14 no condiciona la inclusión de agentes a la propiedad."}},{"id":"G211","tema":"m1s3","tipo":"trampa","q":"Respecto de las personas físicas o morales que prestan servicios de transferencia de dinero o valores sin licencia ni registro, el texto de la R.14 establece que los países:","a":"Deben tomar acciones para identificarlas y aplicarles sanciones apropiadas","o":["Podrán tomar acciones para identificarlas, si su marco legal lo permite","Deben identificarlas, aunque las sanciones se precisan sólo en la Nota a la R.14","Deben tomar acciones para identificarlas y aplicarles sanciones apropiadas","Deben incorporarlas a la lista vigente de agentes accesible a las autoridades"],"x":"La R.14 usa «should»: los países deben tomar acciones para identificar a quienes prestan estos servicios sin licencia o registro y aplicarles sanciones apropiadas; ambas cosas están en el texto. La INR.14 no habla de sanciones, sino de no imponer una licencia separada a IF ya autorizadas.","ref":"R.14; INR.14 · S3","d":{"Podrán tomar acciones para identificarlas, si su marco legal lo permite":"La R.14 usa «should» (deben), no «podrán», y no condiciona la acción a lo que permita el marco legal.","Deben identificarlas, aunque las sanciones se precisan sólo en la Nota a la R.14":"Las sanciones apropiadas están en el texto de la R.14; la INR.14 no habla de sanciones, sólo de no duplicar licencias.","Deben incorporarlas a la lista vigente de agentes accesible a las autoridades":"La lista vigente de agentes es una alternativa al registro de los agentes del proveedor, no una medida para quienes operan sin licencia."}},{"id":"G212","tema":"m1s3","tipo":"caso","q":"Un PSAV ordenante obtiene y conserva la información requerida del ordenante y del beneficiario, y la envía de inmediato y de forma segura al PSAV beneficiario por un canal distinto, sin adjuntarla directamente a la transferencia de activos virtuales. Según la Nota a la R.15:","a":"Es válido: puede enviarse directa o indirectamente, sin ir adjunta a la transferencia","o":["Es válido: puede enviarse directa o indirectamente, sin ir adjunta a la transferencia","No es válido: el texto de la R.16 exige que la información viaje con la transferencia en toda la cadena","Es válido sólo si la transferencia no supera USD/EUR 1,000, umbral de la Nota a la R.15","No es válido: debe enviarse en los tres días hábiles previstos en la Nota a la R.16"],"x":"La INR.15, párr. 7(b), exige enviar la información de inmediato y de forma segura, y su nota al pie 49 aclara que puede hacerse directa o indirectamente, sin adjuntarla a la transferencia de activos virtuales. El distractor más tentador traslada la regla general del texto de la R.16; los USD/EUR 1,000 son el umbral de DDC para operaciones ocasionales de PSAV.","ref":"INR.15, párr. 7(b) y nota al pie 49 · S3","d":{"No es válido: el texto de la R.16 exige que la información viaje con la transferencia en toda la cadena":"Para PSAV manda la INR.15, párr. 7(b), y su nota al pie 49: la información puede enviarse directa o indirectamente, sin ir adjunta.","Es válido sólo si la transferencia no supera USD/EUR 1,000, umbral de la Nota a la R.15":"USD/EUR 1,000 es el umbral de DDC para operaciones ocasionales de PSAV (INR.15, párr. 7(a)), no una condición para el envío de la información.","No es válido: debe enviarse en los tres días hábiles previstos en la Nota a la R.16":"Los tres días hábiles de la INR.16 son para entregar información a petición de la IF beneficiaria o intermediaria; la INR.15 pide envío inmediato."}},{"id":"G213","tema":"m1s3","tipo":"memoria","q":"Según la Nota a la R.15, en materia de medidas preventivas, ¿qué requisitos se aplican a los PSAV?","a":"Los de las R.10 a R.21, con precisiones de la Nota para las R.10 y R.16","o":["Los de las R.10 a R.21, con precisiones de la Nota para las R.10 y R.16","Los de las R.10 a R.23, incluidos los de APNFD, con las mismas precisiones","Sólo los de las R.10 y R.11, porque la R.15 remite a DDC y registros","Los de las R.10 a R.21, salvo la R.16, que no aplica a activos virtuales"],"x":"La INR.15, párr. 7, aplica a los PSAV los requisitos de las R.10 a R.21, con dos precisiones: el umbral de USD/EUR 1,000 para operaciones ocasionales (R.10) y la información de ordenante y beneficiario en transferencias de activos virtuales (R.16). La R.16 sí aplica; las R.22 y 23 son para APNFD.","ref":"INR.15, párr. 7 · S3","d":{"Los de las R.10 a R.23, incluidos los de APNFD, con las mismas precisiones":"La INR.15, párr. 7, remite a las R.10 a R.21; las R.22 y R.23 son las medidas para APNFD.","Sólo los de las R.10 y R.11, porque la R.15 remite a DDC y registros":"La INR.15, párr. 7, aplica todo el bloque de las R.10 a R.21, no sólo DDC y registros.","Los de las R.10 a R.21, salvo la R.16, que no aplica a activos virtuales":"Al revés: la R.16 sí aplica y es una de las dos que la INR.15 precisa, junto con la R.10."}},{"id":"G214","tema":"m1s3","tipo":"caso","q":"Una empresa no cubierta en otra parte de las Recomendaciones custodia y administra, como negocio, activos virtuales por cuenta de sus clientes, sin cambiarlos por moneda fiduciaria. ¿Es PSAV?","a":"Sí: la custodia o administración de activos virtuales es una actividad de la definición","o":["No: el Glosario sólo considera PSAV a quien cambia activos virtuales por moneda fiduciaria","No: la Nota a la R.15 sólo considera PSAV a quien opera por encima de USD/EUR 1,000","Sí: la custodia o administración de activos virtuales es una actividad de la definición","Sí, pero sólo por ser persona moral; la Nota a la R.15 no pide licencia a personas físicas"],"x":"La definición de PSAV del Glosario incluye cinco actividades, entre ellas la custodia o administración de activos virtuales, no sólo el cambio por moneda fiduciaria. Los USD/EUR 1,000 de la INR.15 son el umbral de DDC en operaciones ocasionales, no un requisito de la definición, y la INR.15, párr. 3, también pide licencia o registro a los PSAV personas físicas.","ref":"R.15; Glosario (proveedor de servicios de activos virtuales); INR.15, párr. 3 · S3","d":{"No: el Glosario sólo considera PSAV a quien cambia activos virtuales por moneda fiduciaria":"El Glosario enumera cinco actividades de PSAV; el cambio por moneda fiduciaria es sólo la primera, y la custodia o administración es la cuarta.","No: la Nota a la R.15 sólo considera PSAV a quien opera por encima de USD/EUR 1,000":"USD/EUR 1,000 es el umbral de DDC en operaciones ocasionales (INR.15, párr. 7(a)), no un elemento de la definición de PSAV.","Sí, pero sólo por ser persona moral; la Nota a la R.15 no pide licencia a personas físicas":"La definición abarca personas físicas o morales, y la INR.15, párr. 3, también pide licencia o registro al PSAV persona física."}},{"id":"G215","tema":"m1s3","tipo":"caso","q":"Un país adoptó un umbral de minimis de USD/EUR 1,000. Una IF ordena una transferencia transfronteriza de USD 600 con nombre y número de cuenta del ordenante y del beneficiario, sin indicios de LD/FT. Según la Nota a la R.16, ¿debe verificarse la exactitud de esa información?","a":"No; sólo debe verificar la información de su cliente si surge sospecha de LD/FT","o":["Sí: el texto de la R.16 pide información exacta del ordenante en toda transferencia, sin excepción","No; sólo debe verificar la información de su cliente si surge sospecha de LD/FT","Sí, porque toda transferencia ocasional exige DDC completa conforme a la Nota a la R.10","No, y bajo el umbral puede omitir también el número de cuenta del beneficiario"],"x":"Bajo el umbral de minimis, la INR.16 (párr. 8) pide incluir nombres y números de cuenta, pero esa información no necesita verificarse salvo sospecha de LD/FT, caso en el que la IF verifica la de su cliente. El distractor más tentador lee el «exacta» del texto de la R.16 como absoluto e ignora la precisión de la Nota.","ref":"INR.16, párr. 8 · S3","d":{"Sí: el texto de la R.16 pide información exacta del ordenante en toda transferencia, sin excepción":"El «exacta» del texto de la R.16 lo matiza la INR.16, párr. 8: bajo el umbral de minimis no se verifica salvo sospecha de LD/FT.","Sí, porque toda transferencia ocasional exige DDC completa conforme a la Nota a la R.10":"La R.10 pide DDC en transferencias sólo en las circunstancias de la INR.16; el umbral general de operaciones ocasionales es USD/EUR 15,000.","No, y bajo el umbral puede omitir también el número de cuenta del beneficiario":"La INR.16, párr. 8(b), exige incluir el número de cuenta de ordenante y beneficiario aun bajo el umbral."}},{"id":"G216","tema":"m1s3","tipo":"memoria","q":"Cuando una IF se apoya en un tercero de su mismo grupo financiero, las «autoridades competentes relevantes» pueden considerar que aplica ciertos criterios mediante el programa del grupo. Según la Nota a la R.17, ¿quiénes son esas autoridades?","a":"La de origen, para las políticas del grupo, y las anfitrionas, para sucursales y filiales","o":["Sólo la autoridad del país donde está el tercero, como lo precisa el texto de la R.17","La UIF del país de origen, que según la Nota a la R.20 vigila los programas de grupo","Sólo el supervisor de origen, al que la Nota a la R.18 manda informar sobre el grupo","La de origen, para las políticas del grupo, y las anfitrionas, para sucursales y filiales"],"x":"La INR.17, párr. 2, define «autoridades competentes relevantes» como la autoridad de origen, para entender las políticas y controles del grupo, y las autoridades anfitrionas, para las sucursales y filiales. El distractor más tentador toma de la INR.18 el deber de informar al supervisor de origen, que es otra regla y no excluye a las anfitrionas.","ref":"INR.17, párr. 2 · S3","d":{"Sólo la autoridad del país donde está el tercero, como lo precisa el texto de la R.17":"El texto de la R.17 no define a esas autoridades; la INR.17, párr. 2, incluye a la de origen y a las anfitrionas.","La UIF del país de origen, que según la Nota a la R.20 vigila los programas de grupo":"La INR.17 no menciona a la UIF, y la INR.20 trata del reporte de operaciones sospechosas, no de supervisar programas de grupo.","Sólo el supervisor de origen, al que la Nota a la R.18 manda informar sobre el grupo":"Informar al supervisor de origen es otra regla de la INR.18, párr. 5; la INR.17 incluye también a las autoridades anfitrionas."}},{"id":"G217","tema":"m1s3","tipo":"caso","q":"Una IF acepta a un cliente que le presenta un tercero regulado y supervisado, que ya le aplicó su propia DDC. Según los criterios de la R.17, ¿qué debe obtener la IF de inmediato?","a":"La información necesaria sobre los elementos (a) a (c) de las medidas de DDC de la R.10","o":["Copias de todos los documentos de identificación, que el tercero debe entregarle ya","La información necesaria sobre los elementos (a) a (c) de las medidas de DDC de la R.10","Nada de inmediato: la Nota a la R.17 le permite recabar la información en la primera operación","La información sobre los elementos (a) a (d) de la DDC, incluida la debida diligencia continua"],"x":"El criterio (a) de la R.17 pide obtener de inmediato la información sobre los elementos (a) a (c) de la DDC. Las copias de la documentación no se obtienen en ese momento: basta asegurarse de que el tercero las entregará sin demora cuando se le pidan (criterio b), y la debida diligencia continua (d) no está entre los elementos en que la R.17 permite apoyarse.","ref":"R.17, criterios (a) y (b) · S3","d":{"Copias de todos los documentos de identificación, que el tercero debe entregarle ya":"Las copias no se piden de inmediato: el criterio (b) sólo exige asegurarse de que el tercero las entregará sin demora cuando se le pidan.","Nada de inmediato: la Nota a la R.17 le permite recabar la información en la primera operación":"El criterio (a) de la R.17 exige obtener la información «de inmediato», y la INR.17 no prevé ningún aplazamiento.","La información sobre los elementos (a) a (d) de la DDC, incluida la debida diligencia continua":"La R.17 permite apoyarse sólo en los elementos (a) a (c) de la DDC; la debida diligencia continua (d) queda a cargo de la IF."}},{"id":"G218","tema":"m1s3","tipo":"caso","q":"El programa PLD/FT de un banco incluye políticas y controles, capacitación continua del personal y auditoría independiente; sin embargo, contrata personal sin ninguna revisión previa. Según la Nota a la R.18, ¿qué le falta?","a":"Procedimientos adecuados de selección que aseguren altos estándares al contratar","o":["Procedimientos adecuados de selección que aseguren altos estándares al contratar","Nada: el texto de la R.18 sólo exige implementar programas, sin detallar su contenido","Un registro de sus empleados conservado al menos cinco años, conforme a la R.11","La aprobación previa de la UIF para cada contratación en el área de cumplimiento"],"x":"La INR.18, párr. 1(a), incluye en el programa procedimientos adecuados de selección para asegurar altos estándares al contratar empleados. El texto de la R.18 exige implementar programas, pero es la Nota la que enumera sus componentes (controles internos, selección de personal, capacitación continua y auditoría independiente), y la pregunta se refiere a la Nota.","ref":"INR.18, párr. 1(a) · S3","d":{"Nada: el texto de la R.18 sólo exige implementar programas, sin detallar su contenido":"El texto de la R.18 no detalla el contenido, pero la INR.18, párr. 1, sí lo enumera, incluida la selección de personal.","Un registro de sus empleados conservado al menos cinco años, conforme a la R.11":"La conservación por cinco años de la R.11 es de registros de operaciones y DDC, no de empleados ni de selección de personal.","La aprobación previa de la UIF para cada contratación en el área de cumplimiento":"El estándar no prevé ninguna aprobación de la UIF para contrataciones de la IF."}},{"id":"G219","tema":"m1s3","tipo":"caso","q":"Frente a un país con deficiencias en sus sistemas PLD/FT, el país Beta decide prohibir que sus IF se apoyen en terceros ubicados ahí para realizar elementos de la DDC. ¿Cómo se ubica esta medida en los estándares?","a":"Es un ejemplo de contramedida que los países podrían aplicar, según la Nota a la R.19","o":["Contradice la R.17, que sólo permite tomar en cuenta el riesgo país, no prohibir el apoyo","Sólo sería válida si el GAFI la pidió, porque un país no aplica contramedidas por su cuenta","Es una medida de DDC reforzada de las que enumera la Nota a la R.10 en su párrafo 20","Es un ejemplo de contramedida que los países podrían aplicar, según la Nota a la R.19"],"x":"La INR.19, párr. 2(f), da como ejemplo de contramedida prohibir que las IF se apoyen en terceros ubicados en el país de que se trate. La R.19 permite aplicar contramedidas también sin llamado del GAFI, y el párrafo 20 de la INR.10 enumera medidas de DDC reforzada de las IF, no contramedidas de los países.","ref":"INR.19, párr. 2(f); R.19 · S3","d":{"Contradice la R.17, que sólo permite tomar en cuenta el riesgo país, no prohibir el apoyo":"La R.19 permite contramedidas proporcionales al riesgo, y la INR.19, párr. 2(f), pone esta prohibición como ejemplo; la R.17 no lo impide.","Sólo sería válida si el GAFI la pidió, porque un país no aplica contramedidas por su cuenta":"La R.19 dice que los países también deben poder aplicar contramedidas sin llamado del GAFI.","Es una medida de DDC reforzada de las que enumera la Nota a la R.10 en su párrafo 20":"El párrafo 20 de la INR.10 trata de DDC reforzada que aplican las IF, no de contramedidas que adopta un país."}},{"id":"G220","tema":"m1s3","tipo":"memoria","q":"Según la Nota a la R.19, ¿qué medidas de debida diligencia reforzada podrían aplicar las IF en sus relaciones con personas de países de mayor riesgo?","a":"Las del párrafo 20 de la Nota a la R.10 y otras de efecto similar para mitigar riesgos","o":["Sólo las contramedidas de los incisos (a) a (i) que enumera la propia Nota a la R.19","Sólo las medidas (b), (c) y (d) de la R.12, que la Nota a la R.19 vuelve obligatorias","Las del párrafo 20 de la Nota a la R.10 y otras de efecto similar para mitigar riesgos","Sólo las que detalle el GAFI en su llamado, sin otras medidas de efecto similar"],"x":"La INR.19, párr. 1, remite a las medidas de DDC reforzada del párrafo 20 de la INR.10 y a cualquier otra con efecto similar para mitigar riesgos. Los incisos (a) a (i) de la misma Nota son ejemplos de contramedidas que aplican los países, no medidas de DDC de las IF.","ref":"INR.19, párr. 1; INR.10, párr. 20 · S3","d":{"Sólo las contramedidas de los incisos (a) a (i) que enumera la propia Nota a la R.19":"Los incisos (a) a (i) de la INR.19, párr. 2, son ejemplos de contramedidas de los países, no medidas de DDC reforzada de las IF.","Sólo las medidas (b), (c) y (d) de la R.12, que la Nota a la R.19 vuelve obligatorias":"Las medidas de la R.12 son para PEP; la INR.19 remite al párrafo 20 de la INR.10, no a la R.12.","Sólo las que detalle el GAFI en su llamado, sin otras medidas de efecto similar":"La INR.19, párr. 1, admite expresamente «cualquier otra medida» con efecto similar para mitigar riesgos."}},{"id":"G221","tema":"m1s3","tipo":"trampa","q":"Para la R.20, «actividad delictiva» puede entenderse como todos los actos delictivos que constituirían delito precedente de LD o, como mínimo, los delitos precedentes que exige la R.3. Según la Nota a la R.20, ¿cuál es la postura del GAFI?","a":"Se alienta enfáticamente a los países a adoptar la primera alternativa","o":["Los países deben adoptar la primera; la segunda es sólo una opción transitoria","Los países podrán elegir cualquiera, sin que el GAFI exprese preferencia","Se alienta enfáticamente a los países a adoptar la primera alternativa","Se alienta enfáticamente a los países a adoptar la segunda, más acotada"],"x":"La INR.20, párr. 1, dice «strongly encouraged»: se alienta enfáticamente a adoptar la primera alternativa (todos los actos que constituirían delito precedente). No es una obligación («deben») ni una elección neutra; la segunda alternativa es el mínimo aceptable.","ref":"INR.20, párr. 1 · S3","d":{"Los países deben adoptar la primera; la segunda es sólo una opción transitoria":"La INR.20 dice «strongly encouraged», no «deben»; la segunda alternativa es el mínimo aceptable, no algo transitorio.","Los países podrán elegir cualquiera, sin que el GAFI exprese preferencia":"El GAFI sí expresa preferencia: alienta enfáticamente a adoptar la primera alternativa.","Se alienta enfáticamente a los países a adoptar la segunda, más acotada":"Invierte la preferencia: la alternativa acotada (delitos precedentes de la R.3) es el mínimo; la alentada es la amplia."}},{"id":"G222","tema":"m1s3","tipo":"caso","q":"Una IF sospecha que un cliente envía fondos a un terrorista individual, pero no logra vincularlos con ningún acto terrorista específico. Conforme a la R.20 y su Nota, la IF:","a":"Debe reportar: el FT abarca a terroristas individuales aun sin vínculo con un acto específico","o":["No debe reportar mientras no identifique el acto terrorista concreto que se pretende financiar","Sólo debe congelar los fondos, pues en estos casos la R.6 desplaza la obligación de reportar","Debe reportar sólo si el monto supera USD/EUR 15,000, umbral de DDC fijado en la R.10","Debe reportar: el FT abarca a terroristas individuales aun sin vínculo con un acto específico"],"x":"La INR.20, párr. 2, precisa que la referencia al FT de la R.20 abarca el financiamiento de actos terroristas y también de organizaciones terroristas o terroristas individuales, aun sin vínculo con un acto específico. El reporte no depende de un monto ni lo sustituye el congelamiento de la R.6.","ref":"INR.20, párrs. 2 y 3 · S3","d":{"No debe reportar mientras no identifique el acto terrorista concreto que se pretende financiar":"La INR.20, párr. 2, incluye terroristas individuales aun sin vínculo con un acto terrorista específico.","Sólo debe congelar los fondos, pues en estos casos la R.6 desplaza la obligación de reportar":"El estándar no prevé que el congelamiento de la R.6 sustituya el reporte; la R.20 obliga a reportar la sospecha de FT.","Debe reportar sólo si el monto supera USD/EUR 15,000, umbral de DDC fijado en la R.10":"La INR.20, párr. 3, pide reportar sin importar el monto; los USD/EUR 15,000 son el umbral de DDC para operaciones ocasionales."}},{"id":"G223","tema":"m1s3","tipo":"trampa","q":"Durante el monitoreo, una IF advierte motivos razonables para sospechar que los fondos de un cliente, cuya DDC está completa y actualizada, provienen de un fraude. ¿Qué exige la R.20?","a":"Reportar su sospecha con prontitud a la UIF; bastan los motivos razonables para sospechar","o":["Reportar su sospecha con prontitud a la UIF; bastan los motivos razonables para sospechar","Sólo considerar un reporte, como prevé la R.10 cuando no puede completarse la DDC","Reportar hasta tener certeza del delito precedente, según precisa la Nota a la R.20","Terminar la relación y reportar en los tres días hábiles que fija la Nota a la R.16"],"x":"La R.20 obliga a reportar con prontitud cuando la IF sospecha o tiene motivos razonables para sospechar que los fondos son producto de una actividad delictiva. «Considerar» un reporte es la fórmula de la R.10 para cuando no se puede completar la DDC, y la INR.20 no exige certeza del delito.","ref":"R.20; R.10 · S3","d":{"Sólo considerar un reporte, como prevé la R.10 cuando no puede completarse la DDC":"«Considerar» un reporte es la fórmula de la R.10 para cuando no se completa la DDC; la R.20 obliga a reportar.","Reportar hasta tener certeza del delito precedente, según precisa la Nota a la R.20":"La R.20 se activa con sospecha o motivos razonables para sospechar; ni la R.20 ni su Nota exigen certeza.","Terminar la relación y reportar en los tres días hábiles que fija la Nota a la R.16":"Los tres días hábiles de la INR.16 son para entregar información de transferencias, y la R.20 no exige terminar la relación."}},{"id":"G224","tema":"m1s3","tipo":"trampa","q":"La protección legal frente a la responsabilidad penal y civil para quien reporta de buena fe a la UIF, aun sin saber con precisión cuál era la actividad delictiva subyacente, ¿dónde se establece?","a":"En el texto de la R.21, inciso (a); esa recomendación no tiene Nota","o":["En la Nota interpretativa a la R.21, que desarrolla la protección legal","En el texto de la R.21, inciso (a); esa recomendación no tiene Nota","En la Nota interpretativa a la R.20, junto con las operaciones intentadas","En la Nota interpretativa a la R.23, junto con el secreto profesional"],"x":"La protección por reportar de buena fe, aunque no se conozca con precisión la actividad delictiva y sin importar si ocurrió, está en el inciso (a) de la R.21, que no tiene Nota. La INR.20 trata de operaciones intentadas y sin importar el monto, y la INR.23 del secreto profesional de abogados y contadores.","ref":"R.21, inciso (a) (sin Nota interpretativa) · S3","d":{"En la Nota interpretativa a la R.21, que desarrolla la protección legal":"La R.21 no tiene Nota interpretativa; la protección está en su inciso (a).","En la Nota interpretativa a la R.20, junto con las operaciones intentadas":"La INR.20 trata de operaciones intentadas, el monto y el reporte directo, no de la protección legal.","En la Nota interpretativa a la R.23, junto con el secreto profesional":"La INR.23 trata del secreto profesional de abogados y contadores; la protección legal está en la R.21, inciso (a)."}},{"id":"G225","tema":"m1s3","tipo":"caso","q":"Un empleado de un banco, con la intención de disuadir a un cliente de seguir con una actividad ilegal, le cuenta que el área de cumplimiento está presentando un reporte de operación sospechosa sobre él. Conforme a los estándares:","a":"Incurre en revelación prohibida: la R.21 alcanza a los directivos, funcionarios y empleados","o":["No hay revelación: la Nota a la R.23 dice que intentar disuadir al cliente no es tipping-off","No hay falta: la prohibición de la R.21 obliga a la institución, pero no a sus empleados","No hay falta, porque la R.21 no pretende inhibir el intercambio de información de la R.18","Incurre en revelación prohibida: la R.21 alcanza a los directivos, funcionarios y empleados"],"x":"La R.21, inciso (b), prohíbe por ley a las IF, sus directivos, funcionarios y empleados revelar que se presenta un reporte de operación sospechosa. La excepción de disuadir al cliente de la INR.23, párr. 4, es sólo para abogados, notarios, otros profesionales jurídicos independientes y contadores que actúan como profesionales jurídicos independientes, no para empleados de un banco.","ref":"R.21, inciso (b); INR.23, párr. 4 · S3","d":{"No hay revelación: la Nota a la R.23 dice que intentar disuadir al cliente no es tipping-off":"La excepción de disuadir (INR.23, párr. 4) es sólo para abogados, notarios, otros profesionales jurídicos y contadores que actúan como profesionales jurídicos independientes.","No hay falta: la prohibición de la R.21 obliga a la institución, pero no a sus empleados":"La R.21, inciso (b), alcanza expresamente a las IF y a sus directivos, funcionarios y empleados.","No hay falta, porque la R.21 no pretende inhibir el intercambio de información de la R.18":"La salvedad de la R.18 protege el intercambio dentro del grupo, no avisar al cliente que se presenta un reporte."}},{"id":"G226","tema":"m1s3","tipo":"caso","q":"Un casino identifica a cada cliente en la entrada. Después, un cliente cambia USD 4,000 en fichas y el casino no puede relacionar esa operación con los datos que tomó en la puerta. Según la Nota a la R.22:","a":"Incumple: identificar en la entrada puede no bastar y debe poder vincular la DDC con las operaciones","o":["Incumple: identificar en la entrada puede no bastar y debe poder vincular la DDC con las operaciones","Cumple: la Nota a la R.22 considera suficiente, en todos los casos, la identificación en la entrada","Cumple, porque en casinos la DDC sólo se exige por encima de USD/EUR 15,000, como en la R.10","Incumple sólo si el casino opera por internet o en un barco, según la nota al pie del Glosario"],"x":"La INR.22, párr. 2, pide DDC en operaciones iguales o superiores a USD/EUR 3,000 y aclara que identificar en la entrada podría bastar, pero no necesariamente; el casino debe poder vincular la DDC de cada cliente con sus operaciones. Los USD/EUR 15,000 son el umbral de la R.10 y el de metales y piedras preciosas en efectivo, y los casinos por internet o en barcos están incluidos, no son un requisito.","ref":"INR.22, párr. 2; INR.22/23, párr. 1 · S3","d":{"Cumple: la Nota a la R.22 considera suficiente, en todos los casos, la identificación en la entrada":"La INR.22, párr. 2, dice que identificar en la entrada «podría bastar, pero no necesariamente».","Cumple, porque en casinos la DDC sólo se exige por encima de USD/EUR 15,000, como en la R.10":"En casinos el umbral es USD/EUR 3,000 (INR.22/23, párr. 1); los 15,000 son de la R.10 y de metales y piedras preciosas.","Incumple sólo si el casino opera por internet o en un barco, según la nota al pie del Glosario":"La nota al pie del Glosario aclara que «casinos» incluye los de internet y en barcos; no es una condición del incumplimiento."}},{"id":"G227","tema":"m1s3","tipo":"caso","q":"Una red de despachos contables opera con la misma estructura que un grupo financiero: una matriz controla y coordina a sus filiales, sujetas a políticas PLD/FT a nivel de grupo. Para efectos de la R.23, ¿se le aplican los requisitos de la R.18 para grupos financieros?","a":"Sí: la Nota a las R.22 y 23 los aplica a grupos de APNFD con esa misma estructura","o":["No: la R.18 y su Nota se refieren a grupos financieros, por lo que no alcanzan a APNFD","Sólo se alienta enfáticamente a aplicarlos, según el párrafo 3 de la Nota a la R.23","Sí: la Nota a las R.22 y 23 los aplica a grupos de APNFD con esa misma estructura","Sí, pero sólo si alguna filial está en un país señalado por el GAFI conforme a la R.19"],"x":"La INR.22/23, párr. 2, dice que, para la R.23, los requisitos de la R.18 sobre «grupos financieros» se aplican a los grupos de APNFD que operan con la misma estructura; para otras estructuras con propiedad, dirección o control de cumplimiento comunes, los países deben considerar aplicarlos. El párrafo 3 de la INR.23 trata del envío de reportes a organismos autorreguladores.","ref":"R.23; INR.22/23, párr. 2 · S3","d":{"No: la R.18 y su Nota se refieren a grupos financieros, por lo que no alcanzan a APNFD":"La INR.22/23, párr. 2, extiende expresamente a la R.23 los requisitos de «grupos financieros» de la R.18 para APNFD con esa estructura.","Sólo se alienta enfáticamente a aplicarlos, según el párrafo 3 de la Nota a la R.23":"El párrafo 3 de la INR.23 trata del envío de reportes a organismos autorreguladores, y para esta estructura la regla es obligatoria, no sólo alentada.","Sí, pero sólo si alguna filial está en un país señalado por el GAFI conforme a la R.19":"La INR.22/23 no condiciona esa aplicación a la R.19 ni a países señalados por el GAFI."}},{"id":"G228","tema":"m1s3","tipo":"trampa","q":"Respecto del resto de las actividades profesionales de los contadores, incluida la auditoría, el texto de la R.23 establece que se alienta enfáticamente a los países a:","a":"Extenderles también la obligación de reportar operaciones sospechosas","o":["Excluirlas del reporte, por estar cubiertas por el secreto profesional de la Nota a la R.23","Extenderles también la obligación de reportar operaciones sospechosas","Aplicarles el umbral de USD/EUR 15,000 de la Nota a las R.22 y 23 antes de reportar","Someterlas sólo a DDC conforme a la R.22, sin obligación de reportar"],"x":"El inciso (a) de la R.23 alienta enfáticamente a los países a extender la obligación de reportar al resto de las actividades profesionales de los contadores, incluida la auditoría. El secreto profesional de la INR.23 exime de reportar cierta información, no excluye actividades completas, y el umbral de USD/EUR 15,000 es para metales y piedras preciosas en efectivo.","ref":"R.23, inciso (a) · S3","d":{"Excluirlas del reporte, por estar cubiertas por el secreto profesional de la Nota a la R.23":"El secreto profesional de la INR.23 exime de reportar cierta información, no excluye actividades completas; la R.23 alienta incluir la auditoría.","Aplicarles el umbral de USD/EUR 15,000 de la Nota a las R.22 y 23 antes de reportar":"USD/EUR 15,000 es el umbral para metales y piedras preciosas en efectivo; nada tiene que ver con contadores.","Someterlas sólo a DDC conforme a la R.22, sin obligación de reportar":"La R.23, inciso (a), alienta precisamente a extender el reporte, no a limitarlas a la DDC."}},{"id":"G301","tema":"m1s3","tipo":"trampa","q":"¿En qué parte de los estándares del GAFI se establece que los países deben seguir un enfoque de múltiples vías para que la autoridad competente pueda determinar oportunamente quién es el beneficiario final de una sociedad?","a":"En la Nota interpretativa a la R.24, sección de información de beneficiario final","o":["En el texto de la R.24, junto con la prohibición de emitir nuevas acciones al portador","En la Nota interpretativa a la R.10, dentro de la DDC de clientes que son personas morales","En la Nota interpretativa a la R.24, sección de información de beneficiario final","En el Glosario, como parte de la definición de beneficiario final de personas morales"],"x":"El enfoque de múltiples vías está en la INR.24, párr. 7 (sociedad que obtiene y conserva la información, autoridad u organismo público que la conserva o mecanismo alternativo, y medidas complementarias). El texto de la R.24 sólo habla de «un registro de beneficiarios finales o un mecanismo alternativo»; la INR.10 regula la DDC de la IF, no el diseño del sistema del país.","ref":"INR.24, párr. 7; R.24 · S3","d":{"En el texto de la R.24, junto con la prohibición de emitir nuevas acciones al portador":"El texto de la R.24 sólo habla de «un registro de beneficiarios finales o un mecanismo alternativo»; el enfoque de múltiples vías está en la INR.24, párr. 7.","En la Nota interpretativa a la R.10, dentro de la DDC de clientes que son personas morales":"La INR.10 regula la DDC que aplica la IF a sus clientes, no el diseño del sistema del país para ubicar al beneficiario final.","En el Glosario, como parte de la definición de beneficiario final de personas morales":"El Glosario define qué es beneficiario final, pero no cómo debe el país asegurar el acceso a esa información."}},{"id":"G302","tema":"m1s3","tipo":"caso","q":"La sociedad Ferrocal, que no cotiza en bolsa, tiene acciones al portador emitidas hace años. Su país eligió convertirlas a forma nominativa dentro de un plazo razonable. Antes de que concluya la conversión, un tenedor quiere votar en la asamblea. Según la Nota a la R.24:","a":"El tenedor debe notificar a la sociedad y ésta registrar su identidad antes de que pueda ejercer sus derechos","o":["El tenedor puede votar libremente hasta que venza el plazo, porque las acciones existentes conservan plena validez","El tenedor debe entregar sus títulos para cancelarlos de inmediato, porque la R.24 exige eliminar las acciones existentes","El tenedor sólo debe identificarse ante la sociedad si su participación supera el 25 % del capital social","El tenedor debe notificar a la sociedad y ésta registrar su identidad antes de que pueda ejercer sus derechos"],"x":"La INR.24, párr. 12(c), exige que, mientras no concluya la conversión o la inmovilización, el tenedor notifique a la sociedad y ésta registre su identidad antes de ejercer cualquier derecho. La R.24 prohíbe emitir nuevas acciones al portador, pero para las existentes pide prevenir su mal uso, no cancelarlas de inmediato; el 25 % de la nota al pie 64 es el tope del umbral para accionistas controladores, no una condición para identificar al tenedor.","ref":"INR.24, párr. 12(c); R.24 · S3","d":{"El tenedor puede votar libremente hasta que venza el plazo, porque las acciones existentes conservan plena validez":"La INR.24, párr. 12(c), exige que, mientras dure la conversión, el tenedor notifique y la sociedad registre su identidad antes de ejercer cualquier derecho.","El tenedor debe entregar sus títulos para cancelarlos de inmediato, porque la R.24 exige eliminar las acciones existentes":"La R.24 sólo prohíbe emitir nuevas acciones al portador; para las existentes pide prevenir su mal uso (conversión o inmovilización), no cancelarlas de inmediato.","El tenedor sólo debe identificarse ante la sociedad si su participación supera el 25 % del capital social":"El 25 % de la nota al pie 64 es el tope del umbral de accionista controlador; la INR.24, párr. 12(c), no fija umbral para identificar al tenedor."}},{"id":"G303","tema":"m1s3","tipo":"caso","q":"Una sociedad constituida en el país X opera en el país Y con sucursal, empleados y relaciones de negocios significativas con IF locales. Conforme a los criterios de Y, tiene vínculos suficientes con ese país y presenta riesgos de LD. Según la Nota a la R.24, el país Y:","a":"Debe asegurar que sus autoridades puedan obtener o acceder oportunamente a la información de su beneficiario final","o":["Queda liberado, porque la R.24 sólo abarca a las personas morales que se constituyen dentro del propio país","Debe asegurar que sus autoridades puedan obtener o acceder oportunamente a la información de su beneficiario final","Sólo puede pedir esa información al país X por asistencia legal mutua, sin exigir ningún mecanismo propio","Debe obligar a la sociedad a constituirse de nuevo en Y como condición para seguir operando en su territorio"],"x":"La INR.24, párr. 1, extiende el acceso oportuno a la información de beneficiario final a las personas morales no constituidas en el país que presenten riesgos de LD/FT y tengan vínculos suficientes con él, y la nota al pie 66 da como ejemplos la sucursal, el personal y las relaciones significativas con IF. El texto de la R.24 no hace esa distinción, pero su Nota sí: no se limita a las sociedades locales.","ref":"INR.24, párr. 1 y notas al pie 66 y 67 · S3","d":{"Queda liberado, porque la R.24 sólo abarca a las personas morales que se constituyen dentro del propio país":"La INR.24, párr. 1, alcanza también a personas morales extranjeras con riesgos de LD/FT y vínculos suficientes con el país.","Sólo puede pedir esa información al país X por asistencia legal mutua, sin exigir ningún mecanismo propio":"La INR.24, párr. 1, pide que las autoridades de Y puedan obtener o acceder a la información, no sólo pedirla por asistencia legal mutua.","Debe obligar a la sociedad a constituirse de nuevo en Y como condición para seguir operando en su territorio":"El estándar no prevé exigir una nueva constitución; la nota al pie 67 menciona medidas como exigir que se conserve la información."}},{"id":"G304","tema":"m1s3","tipo":"cifra","q":"Según la Nota a la R.25, ¿durante cuánto tiempo, como mínimo, deben conservar los fiduciarios la información de beneficiario final del fideicomiso?","a":"Al menos cinco años después de que cese su participación en el fideicomiso","o":["Al menos cinco años después de que cese su participación en el fideicomiso","Al menos cinco años después de que el fideicomiso deje de ser cliente de la IF","Al menos diez años después de que cese su participación en el fideicomiso","Al menos cinco años contados a partir de la constitución del fideicomiso"],"x":"La INR.25, párr. 8, fija al menos cinco años desde que cesa la participación del fiduciario en el fideicomiso. El plazo que corre desde que el cliente deja de serlo de la IF o del intermediario (o desde la disolución) está en la Nota vecina, la INR.24, párr. 8, para personas morales.","ref":"INR.25, párr. 8; INR.24, párr. 8 · S3","d":{"Al menos cinco años después de que el fideicomiso deje de ser cliente de la IF":"Cinco años desde que se deja de ser cliente de la IF o del intermediario es el plazo de la INR.24, párr. 8, para personas morales.","Al menos diez años después de que cese su participación en el fideicomiso":"La INR.25, párr. 8, fija al menos cinco años, no diez.","Al menos cinco años contados a partir de la constitución del fideicomiso":"El plazo corre desde que cesa la participación del fiduciario, no desde la constitución del fideicomiso."}},{"id":"G305","tema":"m1s3","tipo":"trampa","q":"Respecto del protector de un fideicomiso expreso (si lo hay) y de cualquier otra persona física que ejerza el control efectivo último sobre él, ¿cuál afirmación es correcta sobre dónde se exige la información de su identidad?","a":"No figuran en el texto de la R.25; los incorporan su Nota interpretativa y el Glosario","o":["Figuran en el texto de la R.25, en la misma lista que el fideicomitente y el fiduciario","No figuran en el texto de la R.25; los incorporan su Nota interpretativa y el Glosario","Sólo se exigen respecto de las personas morales, conforme a la Nota interpretativa a la R.24","No se exigen en ningún documento del GAFI; son una buena práctica sugerida para fiduciarios"],"x":"El texto de la R.25 sólo enumera fideicomitente(s), fiduciario(s) y beneficiario(s); el protector y la persona física con control efectivo último aparecen en la INR.25, párr. 1, y en la definición de beneficiario final del Glosario. La INR.24 trata personas morales y no menciona al protector.","ref":"R.25; INR.25, párr. 1; Glosario (beneficiario final) · S3","d":{"Figuran en el texto de la R.25, en la misma lista que el fideicomitente y el fiduciario":"El texto de la R.25 sólo enumera fideicomitente(s), fiduciario(s) y beneficiario(s); el protector aparece en la INR.25, párr. 1.","Sólo se exigen respecto de las personas morales, conforme a la Nota interpretativa a la R.24":"La INR.24 trata de personas morales y no menciona al protector; la INR.25 y el Glosario sí lo exigen para fideicomisos.","No se exigen en ningún documento del GAFI; son una buena práctica sugerida para fiduciarios":"Sí se exigen: la INR.25, párr. 1, los incluye con «should», y el Glosario los integra en la definición de beneficiario final."}},{"id":"G306","tema":"m1s3","tipo":"caso","q":"En el país Z no existe la figura del fideicomiso. Ramiro, residente en Z, es fiduciario de un fideicomiso expreso regido por la ley del país W. Según la Nota a la R.25:","a":"Z no está obligado a reconocer los fideicomisos, pero debe exigir a Ramiro la información de beneficiario final","o":["Z queda fuera de la R.25, que sólo aplica a países cuyo derecho regula los fideicomisos expresos","Z debe reformar su legislación para reconocer legalmente los fideicomisos antes de poder exigirle cualquier dato a Ramiro","Z no está obligado a reconocer los fideicomisos, pero debe exigir a Ramiro la información de beneficiario final","Sólo el país W, cuya ley rige el fideicomiso, puede exigir a Ramiro que obtenga y conserve la información de beneficiario final"],"x":"La INR.25, párr. 1, obliga a exigir la información a los fiduciarios residentes en el país o que administren ahí fideicomisos, sin importar la ley que los rija, y el párr. 11 aclara que los países no están obligados a dar reconocimiento legal a los fideicomisos. Por eso Z no queda fuera ni necesita reformar su ley para exigírsela a Ramiro.","ref":"INR.25, párrs. 1 y 11 · S3","d":{"Z queda fuera de la R.25, que sólo aplica a países cuyo derecho regula los fideicomisos expresos":"La INR.25, párr. 1, alcanza a fiduciarios residentes en el país o que ahí administren fideicomisos, sin importar la ley que los rija.","Z debe reformar su legislación para reconocer legalmente los fideicomisos antes de poder exigirle cualquier dato a Ramiro":"La INR.25, párr. 11, aclara que los países no están obligados a dar reconocimiento legal a los fideicomisos.","Sólo el país W, cuya ley rige el fideicomiso, puede exigir a Ramiro que obtenga y conserve la información de beneficiario final":"La obligación es del país donde reside o administra el fiduciario (INR.25, párr. 1), no sólo del país cuya ley rige el fideicomiso."}},{"id":"G307","tema":"m1s3","tipo":"trampa","q":"¿En qué parte de los estándares del GAFI se pide a los países tomar medidas inmediatas para ser parte de la Convención de Viena, la Convención de Palermo, la Convención contra la Corrupción y el Convenio sobre Financiamiento del Terrorismo, e implementarlos plenamente?","a":"En el texto de la R.36, la cual no tiene Nota interpretativa propia","o":["En la Nota interpretativa a la R.36, sección de instrumentos de la ONU","En el texto de la R.36, la cual no tiene Nota interpretativa propia","En la Nota interpretativa a la R.37, como condición para la asistencia","En el Glosario, en la definición de «instrumentos internacionales»"],"x":"La obligación está en el texto mismo de la R.36, que carece de Nota interpretativa; por eso cualquier opción que cite «la Nota a la R.36» o «la Nota a la R.37» es falsa, pues ninguna de las dos existe. El Glosario no define «instrumentos internacionales».","ref":"R.36 · S3","d":{"En la Nota interpretativa a la R.36, sección de instrumentos de la ONU":"La R.36 no tiene Nota interpretativa; la obligación está en su propio texto.","En la Nota interpretativa a la R.37, como condición para la asistencia":"La R.37 tampoco tiene Nota interpretativa, y la ratificación de convenciones es materia de la R.36.","En el Glosario, en la definición de «instrumentos internacionales»":"El Glosario no define «instrumentos internacionales»; la lista de convenciones está en el texto de la R.36."}},{"id":"G308","tema":"m1s3","tipo":"trampa","q":"Respecto del Convenio del Consejo de Europa sobre Ciberdelincuencia (2001), ¿qué establece la R.36 para los países?","a":"Los alienta a ratificarlo y a implementarlo, cuando aplique en su caso","o":["Los alienta a ratificarlo y a implementarlo, cuando aplique en su caso","Les exige ratificarlo sólo si son miembros del Consejo de Europa, según la Nota a la R.36","Les exige tomar medidas inmediatas para ser parte de él e implementarlo plenamente","No lo menciona, porque la R.36 se limita a las convenciones de las Naciones Unidas"],"x":"La R.36 distingue dos niveles: «deben» tomar medidas inmediatas para ser parte de Viena, Palermo, la Convención contra la Corrupción y el Convenio sobre FT, mientras que «se alienta» a ratificar, cuando aplique, otras como el Convenio sobre Ciberdelincuencia, la Convención Interamericana contra el Terrorismo y el Convenio del Consejo de Europa de 2005. La R.36 no tiene Nota.","ref":"R.36 · S3","d":{"Les exige ratificarlo sólo si son miembros del Consejo de Europa, según la Nota a la R.36":"La R.36 no tiene Nota interpretativa ni condiciona nada a ser miembro del Consejo de Europa; sólo «alienta», cuando aplique.","Les exige tomar medidas inmediatas para ser parte de él e implementarlo plenamente":"Las medidas inmediatas son para las cuatro convenciones obligatorias (Viena, Palermo, Corrupción y FT), no para la de Ciberdelincuencia.","No lo menciona, porque la R.36 se limita a las convenciones de las Naciones Unidas":"La R.36 sí la menciona, entre otras convenciones que alienta a ratificar, además de las de la ONU."}},{"id":"G309","tema":"m1s3","tipo":"caso","q":"El país Q es parte de la Convención de Viena y del Convenio sobre Financiamiento del Terrorismo, pero no de la Convención de Palermo ni de la Convención contra la Corrupción. Su equipo jurídico sostiene que con eso ya cumple la R.36. Según la R.36, Q:","a":"Debe tomar medidas inmediatas para ser parte de las cuatro convenciones e implementarlas plenamente","o":["Cumple, porque la R.36 pide ser parte de al menos dos de las cuatro convenciones que enumera como obligatorias","Sólo se le alienta a ratificar Palermo y la Convención contra la Corrupción, cuando aplique","Cumple si incorpora a su derecho interno el contenido de ambas convenciones, aunque nunca llegue a ser parte de ellas","Debe tomar medidas inmediatas para ser parte de las cuatro convenciones e implementarlas plenamente"],"x":"La R.36 pide tomar medidas inmediatas para ser parte de las cuatro convenciones (Viena 1988, Palermo 2000, contra la Corrupción 2003 y FT 1999) y aplicarlas plenamente; no basta con dos ni con copiar su contenido sin ser parte. El «aliento» cuando aplique es sólo para otras convenciones, como la de Ciberdelincuencia.","ref":"R.36 · S3","d":{"Cumple, porque la R.36 pide ser parte de al menos dos de las cuatro convenciones que enumera como obligatorias":"La R.36 pide ser parte de las cuatro convenciones obligatorias; no prevé ningún mínimo de dos.","Sólo se le alienta a ratificar Palermo y la Convención contra la Corrupción, cuando aplique":"El «aliento», cuando aplique, es para otras convenciones; Palermo y la Convención contra la Corrupción son obligatorias.","Cumple si incorpora a su derecho interno el contenido de ambas convenciones, aunque nunca llegue a ser parte de ellas":"La R.36 pide tomar medidas para ser parte de las convenciones e implementarlas; copiar su contenido sin ser parte no basta."}},{"id":"G310","tema":"m1s3","tipo":"caso","q":"El país A pide asistencia legal mutua al país B en una investigación de LD. La solicitud no implica acciones coercitivas, pero la conducta investigada no es delito en B. Según la R.37, B:","a":"Debe prestar la asistencia aunque no haya doble incriminación, porque no implica acciones coercitivas","o":["Puede negarla, porque sin doble incriminación la R.37 sólo pide considerar medidas para ampliar la asistencia","Debe negarla, porque la doble incriminación es requisito indispensable de toda asistencia legal mutua","Debe prestar la asistencia aunque no haya doble incriminación, porque no implica acciones coercitivas","Debe prestarla sólo si la Nota interpretativa a la R.37 incluye esa conducta en su lista de delitos"],"x":"La R.37 dice que los países deben prestar asistencia legal mutua a pesar de la falta de doble incriminación si no implica acciones coercitivas. El «considerar» se refiere a adoptar medidas para dar un alcance amplio a la asistencia sin doble incriminación en los demás casos, no a este. La R.37 no tiene Nota interpretativa.","ref":"R.37 · S3","d":{"Puede negarla, porque sin doble incriminación la R.37 sólo pide considerar medidas para ampliar la asistencia":"El «considerar» de la R.37 es para ampliar la asistencia sin doble incriminación en los demás casos; sin acciones coercitivas, se debe prestar.","Debe negarla, porque la doble incriminación es requisito indispensable de toda asistencia legal mutua":"La R.37 dice lo contrario: sin acciones coercitivas, la asistencia se presta a pesar de la falta de doble incriminación.","Debe prestarla sólo si la Nota interpretativa a la R.37 incluye esa conducta en su lista de delitos":"La R.37 no tiene Nota interpretativa, y el estándar no prevé ninguna lista de delitos para esto."}},{"id":"G311","tema":"m1s3","tipo":"trampa","q":"¿Dónde se establece que los países deben usar una autoridad central u otro mecanismo oficial establecido para transmitir y ejecutar las solicitudes de asistencia legal mutua, y mantener un sistema de gestión de casos?","a":"En el texto de la R.37, inciso (b), sobre la priorización y ejecución de solicitudes","o":["En la Nota interpretativa a la R.37, en su sección sobre autoridades centrales","En el texto de la R.37, inciso (b), sobre la priorización y ejecución de solicitudes","En la Nota interpretativa a la R.40, entre los principios del intercambio entre UIF","En el texto de la R.39, que exige esa autoridad central para las extradiciones"],"x":"La autoridad central y el sistema de gestión de casos están en la R.37, inciso (b); la R.37 no tiene Nota interpretativa. La R.39 pide un sistema de gestión de casos para la extradición, pero no menciona una autoridad central, y la INR.40, que regula las otras formas de cooperación, no prevé esa figura.","ref":"R.37, inciso (b) · S3","d":{"En la Nota interpretativa a la R.37, en su sección sobre autoridades centrales":"La R.37 no tiene Nota interpretativa; la autoridad central está en su inciso (b).","En la Nota interpretativa a la R.40, entre los principios del intercambio entre UIF":"La INR.40 regula las otras formas de cooperación y no prevé una autoridad central; esa figura es de la R.37.","En el texto de la R.39, que exige esa autoridad central para las extradiciones":"La R.39 pide un sistema de gestión de casos para extradición, pero no menciona una autoridad central."}},{"id":"G312","tema":"m1s3","tipo":"caso","q":"El país B recibe una solicitud de asistencia legal mutua por LD que pide registros que un banco resguarda bajo la ley de secreto bancario de B, e información que un abogado conserva en circunstancias amparadas por el secreto profesional legal. Según la R.37:","a":"B no puede negarse por el secreto bancario; la salvedad se limita a lo amparado por el secreto profesional legal","o":["B no puede negarse por el secreto bancario; la salvedad se limita a lo amparado por el secreto profesional legal","B debe entregar ambas, porque la R.37 no admite ninguna salvedad por secreto o confidencialidad profesional","B puede negarse respecto de ambas, porque las leyes de secreto de IF y APNFD prevalecen sobre la asistencia","B puede negarse respecto de los registros bancarios, porque la Nota interpretativa a la R.37 exceptúa el secreto bancario"],"x":"La R.37, inciso (d), prohíbe negar la asistencia porque las leyes exijan a IF o APNFD guardar secreto, salvo cuando la información está amparada por el privilegio o el secreto profesional legal. Esa salvedad no incluye el secreto bancario, y la R.37 no tiene Nota interpretativa que lo exceptúe.","ref":"R.37, inciso (d) · S3","d":{"B debe entregar ambas, porque la R.37 no admite ninguna salvedad por secreto o confidencialidad profesional":"La R.37, inciso (d), sí admite la salvedad de lo amparado por el privilegio o secreto profesional legal.","B puede negarse respecto de ambas, porque las leyes de secreto de IF y APNFD prevalecen sobre la asistencia":"La R.37, inciso (d), prohíbe negar la asistencia por las leyes de secreto de IF y APNFD; no prevalecen.","B puede negarse respecto de los registros bancarios, porque la Nota interpretativa a la R.37 exceptúa el secreto bancario":"La R.37 no tiene Nota interpretativa, y su inciso (d) impide precisamente negarse por el secreto bancario."}},{"id":"G313","tema":"m1s3","tipo":"caso","q":"El país A obtuvo una orden de decomiso sin condena sobre un inmueble ubicado en el país B, porque el presunto responsable murió antes del juicio. B responde que sólo coopera con decomisos basados en una condena. Según la Nota a la R.38, B:","a":"Debe poder asistir, al menos cuando el responsable no está disponible por muerte, fuga o ausencia, en la medida compatible con sus principios fundamentales","o":["Puede negarse, porque la R.38 y su Nota sólo abarcan las órdenes de decomiso derivadas de una sentencia condenatoria firme en el país requirente","Debe poder asistir, al menos cuando el responsable no está disponible por muerte, fuga o ausencia, en la medida compatible con sus principios fundamentales","Debe exigir que A obtenga antes una condena en rebeldía, porque el decomiso sin condena sólo opera en el ámbito interno regulado por la R.4","Sólo puede congelar el inmueble como medida provisional, pero nunca ejecutar un decomiso sin condena que haya sido ordenado por otro país"],"x":"La INR.38, párr. 1, incluye las solicitudes basadas en decomiso con y sin condena, como en la R.4, y su nota al pie 93 exige, como mínimo, poder asistir cuando el responsable no está disponible por muerte, fuga o ausencia, o es desconocido, en la medida compatible con los principios fundamentales del derecho interno. El texto de la R.38 no distingue el tipo de decomiso; la precisión está en su Nota.","ref":"INR.38, párr. 1 y nota al pie 93 · S3","d":{"Puede negarse, porque la R.38 y su Nota sólo abarcan las órdenes de decomiso derivadas de una sentencia condenatoria firme en el país requirente":"La INR.38, párr. 1, incluye expresamente las solicitudes basadas en decomiso sin condena.","Debe exigir que A obtenga antes una condena en rebeldía, porque el decomiso sin condena sólo opera en el ámbito interno regulado por la R.4":"El estándar no prevé exigir una condena en rebeldía; la INR.38 extiende a la cooperación el decomiso sin condena de la R.4.","Sólo puede congelar el inmueble como medida provisional, pero nunca ejecutar un decomiso sin condena que haya sido ordenado por otro país":"La R.38 pide poder reconocer y ejecutar órdenes extranjeras de decomiso, y la INR.38 incluye las de decomiso sin condena."}},{"id":"G314","tema":"m1s3","tipo":"trampa","q":"¿Dónde se precisa que los países deben poder compartir bienes decomisados con otros países, en particular cuando el decomiso resulta de acciones coordinadas de las autoridades de orden público, y acordar, cuando proceda, cómo descontar o compartir costos sustanciales o extraordinarios?","a":"En la Nota interpretativa a la R.38, dedicada a congelamiento y decomiso","o":["En el texto de la R.38, que detalla las acciones coordinadas y los costos","En la Nota interpretativa a la R.4, junto con la devolución a propietarios","En la Nota interpretativa a la R.38, dedicada a congelamiento y decomiso","En la Nota interpretativa a la R.40, sobre autoridades de orden público"],"x":"La precisión sobre compartir bienes, en particular tras acciones coordinadas, y sobre los costos sustanciales o extraordinarios está en la INR.38, párr. 6. El texto de la R.38 sólo dice «compartir o devolver» los bienes decomisados, sin esos detalles; la INR.4, párr. 17, habla de devolver bienes a sus legítimos propietarios o compensar a las víctimas, no de compartirlos con otros países.","ref":"INR.38, párr. 6; R.38; INR.4, párr. 17 · S3","d":{"En el texto de la R.38, que detalla las acciones coordinadas y los costos":"El texto de la R.38 sólo dice «compartir o devolver» los bienes; las acciones coordinadas y los costos están en la INR.38, párr. 6.","En la Nota interpretativa a la R.4, junto con la devolución a propietarios":"La INR.4, párr. 17, trata de devolver bienes a sus legítimos propietarios o compensar a víctimas, no de compartirlos con otros países.","En la Nota interpretativa a la R.40, sobre autoridades de orden público":"La INR.40 trata de otras formas de cooperación, no de compartir bienes decomisados."}},{"id":"G315","tema":"m1s3","tipo":"memoria","q":"La obligación de contar con medidas que permitan reconocer y ejecutar órdenes extranjeras de congelamiento, incautación o decomiso corresponde a:","a":"R.38 · Asistencia legal mutua: congelamiento y decomiso","o":["Nota interpretativa a la R.4 · Decomiso y medidas provisionales","R.40 · Otras formas de cooperación internacional","Nota interpretativa a la R.37 · Asistencia legal mutua","R.38 · Asistencia legal mutua: congelamiento y decomiso"],"x":"La R.38 pide que las medidas permitan reconocer y ejecutar órdenes extranjeras de congelamiento, incautación o decomiso; es el espejo internacional de la R.4, que regula las facultades internas. La R.37 no tiene Nota interpretativa y la R.40 cubre otras formas de cooperación distintas de la asistencia legal mutua.","ref":"R.38; R.4 · S3","d":{"Nota interpretativa a la R.4 · Decomiso y medidas provisionales":"La R.4 y su Nota regulan las facultades internas de decomiso; reconocer órdenes extranjeras es de la R.38.","R.40 · Otras formas de cooperación internacional":"La R.40 cubre otras formas de cooperación distintas de la asistencia legal mutua, no la ejecución de órdenes de decomiso.","Nota interpretativa a la R.37 · Asistencia legal mutua":"La R.37 no tiene Nota interpretativa; las órdenes extranjeras de decomiso son materia de la R.38."}},{"id":"G316","tema":"m1s3","tipo":"trampa","q":"¿Dónde se establece que los países deben contar con mecanismos simplificados de extradición, como la transmisión directa de solicitudes de detención provisional y la extradición simplificada de quien renuncia al procedimiento formal?","a":"En el texto de la R.39, conforme a los principios fundamentales del derecho interno","o":["En el texto de la R.39, conforme a los principios fundamentales del derecho interno","En la Nota interpretativa a la R.38, junto con la ejecución de órdenes extranjeras","En la Nota interpretativa a la R.39, que desarrolla los procedimientos simplificados","En la Nota interpretativa a la R.40, en la cooperación entre autoridades de orden público"],"x":"Los mecanismos simplificados de extradición están en el texto de la R.39, «de conformidad con los principios fundamentales del derecho interno». La R.39 no tiene Nota interpretativa, y las Notas a las R.38 y R.40 no tratan la extradición.","ref":"R.39 · S3","d":{"En la Nota interpretativa a la R.38, junto con la ejecución de órdenes extranjeras":"La INR.38 trata de congelamiento y decomiso, no de extradición.","En la Nota interpretativa a la R.39, que desarrolla los procedimientos simplificados":"La R.39 no tiene Nota interpretativa; los mecanismos simplificados están en su propio texto.","En la Nota interpretativa a la R.40, en la cooperación entre autoridades de orden público":"La INR.40 trata de otras formas de cooperación, no de extradición."}},{"id":"G317","tema":"m1s3","tipo":"caso","q":"El país A pide al país B extraditar a Óscar por LD. B exige doble incriminación. En B la conducta sí es delito, pero tiene otro nombre y está en otro capítulo de su código penal. La defensa de Óscar pide negar la extradición por esa diferencia. Según la R.39:","a":"El requisito se tiene por satisfecho, porque ambos países tipifican la conducta subyacente","o":["Procede negarla, porque el delito debe tener la misma denominación y ca
