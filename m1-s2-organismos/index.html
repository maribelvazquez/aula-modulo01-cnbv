,{"id":"O043","tema":"o_gafi","tipo":"cifra","q":"Según el Mandato 2012-2020, ¿cuántas reuniones del Grupo Directivo convoca el Presidente cada año calendario?","a":"Por lo menos tres reuniones","o":["Por lo menos dos reuniones","Una reunión antes de cada Sesión Plenaria","Por lo menos tres reuniones","Por lo menos cuatro reuniones"],"x":"Párr. 41: el Presidente convoca «por lo menos tres reuniones del Grupo Directivo cada año calendario», en el tiempo y lugar que él indique. Es el mismo mínimo que el de las Sesiones Plenarias (párr. 24), por eso se confunden; lo que los distingue es que el Pleno decide y el Grupo Directivo aconseja.","ref":"Mandato párr. 41"},{"id":"O044","tema":"o_gafi","tipo":"caso","q":"Un organismo observador pregunta si tiene derecho a asistir a una sesión cerrada del Pleno. Según el párr. 22 del Mandato 2012-2020, ¿quiénes tienen el derecho de asistir a las sesiones cerradas?","a":"Todos los Miembros y Miembros Asociados","o":["Todos los Miembros y Miembros Asociados","Todos los Miembros, Miembros Asociados y observadores","Sólo las jurisdicciones Miembro, sin las organizaciones","Sólo los integrantes del Grupo Directivo y el Presidente"],"x":"Párr. 22: a las sesiones abiertas tienen derecho Miembros, Miembros Asociados y observadores; a las cerradas, Miembros y Miembros Asociados. Según el párr. 23, el Presidente también puede invitar a organismos observadores a ciertas sesiones cerradas, pero eso es una invitación, no un derecho.","ref":"Mandato párrs. 22-23"},{"id":"O045","tema":"o_gafi","tipo":"caso","q":"El Presidente del GAFI quiere que representantes de una jurisdicción no Miembro asistan a una Sesión Plenaria. Según el Mandato 2012-2020, ¿qué puede hacer?","a":"Extenderles invitaciones ad hoc a la totalidad o parte de las sesiones","o":["Sólo invitarlos si el Grupo Directivo lo aprueba por consenso previamente","Nada: sólo Miembros, Asociados y observadores asisten a las plenarias","Extenderles invitaciones ad hoc a la totalidad o parte de las sesiones","Invitarlos a todas las sesiones cerradas, previa consulta con la OCDE"],"x":"Párr. 23: «El Presidente puede extender invitaciones ad hoc a representantes de jurisdicciones no Miembro para asistir a la totalidad o parte de las Sesiones Plenarias». Es una facultad («puede»), no una obligación, y no requiere aprobación del Grupo Directivo.","ref":"Mandato párr. 23"},{"id":"O046","tema":"o_gafi","tipo":"caso","q":"El Pleno crea un nuevo grupo de trabajo para apoyar la labor del GAFI. Según el Mandato 2012-2020, ¿quién selecciona y designa a su presidente?","a":"El Pleno, a recomendación del Presidente","o":["El Presidente, a recomendación del Pleno","El Pleno, a recomendación del Presidente","El Grupo Directivo, previa consulta con la Secretaría","El Secretario Ejecutivo, según instrucciones del Presidente"],"x":"Párr. 27: los presidentes de los grupos de trabajo y subgrupos «son seleccionados y designados por el Pleno a recomendación del Presidente», y le informan al Pleno sobre sus programas. El distractor invierte los papeles: el Presidente recomienda, el Pleno designa.","ref":"Mandato párrs. 26-27"},{"id":"O047","tema":"o_gafi","tipo":"memoria","q":"Según el párr. 17 del Mandato 2012-2020, ¿cuáles son las estructuras internas del GAFI?","a":"Pleno; Presidente, asistido por un Vicepresidente; Grupo Directivo; y Secretaría","o":["Pleno; Presidente, asistido por un Vicepresidente; Grupo Directivo; y Secretaría","Pleno; Presidente, asistido por un Secretario Ejecutivo; Consejo Directivo; y Secretaría Técnica","Asamblea de Ministros; Presidente; Grupo Directivo; y Comité de Evaluaciones Mutuas","Pleno; Presidente; Grupo Directivo; y los grupos de trabajo listados en el Anexo D"],"x":"Son cuatro: a) el Pleno; b) el Presidente, asistido por un Vicepresidente; c) el Grupo Directivo; y d) la Secretaría. «Consejo Directivo» es un término del texto histórico, no del Mandato. Los grupos de trabajo existen (Anexo D), pero los crea el Pleno y no figuran entre las estructuras internas del párr. 17.","ref":"Mandato párr. 17"},{"id":"O048","tema":"o_gafi","tipo":"cifra","q":"Según la Metodología del GAFI (dic-2025), ¿cuántos Resultados Inmediatos deben evaluar los evaluadores para calificar la efectividad?","a":"Once","o":["Nueve","Cuarenta","Once","Cuatro"],"x":"El GAFI evalúa la efectividad principalmente sobre la base de once Resultados Inmediatos, y cada uno recibe una de cuatro calificaciones de efectividad. Cuarenta es el número de Recomendaciones, que reciben la calificación de cumplimiento técnico.","ref":"Metodología párrs. 52 y 72"},{"id":"O049","tema":"o_gafi","tipo":"trampa","q":"Una alumna sostiene que, como México figura en el Anexo A, el Mandato 2012-2020 le impone obligaciones legales. Según el propio Mandato, ¿qué efecto legal tiene?","a":"No está destinado a crear derechos u obligaciones legales","o":["Crea obligaciones legales vinculantes para las jurisdicciones Miembro","No está destinado a crear derechos u obligaciones legales","Crea obligaciones legales sólo para los Miembros Asociados (FSRB)","Tiene efecto legal una vez que lo aprueba el Grupo Directivo"],"x":"Párr. 48: «Este Mandato no está destinado a crear derechos u obligaciones legales». Los compromisos de los Miembros (párrs. 6-8) son compromisos asumidos, no obligaciones legales creadas por el Mandato.","ref":"Mandato párr. 48"},{"id":"O050","tema":"o_gafi","tipo":"cifra","q":"Según su párr. 49, ¿cuál es la vigencia del Mandato del GAFI 2012-2020?","a":"Del 20 de abril de 2012 al 31 de diciembre de 2020","o":["Del 16 de febrero de 2012 al 31 de diciembre de 2020","Del 20 de abril de 2012 al 30 de junio de 2020","Del 20 de abril de 2012 al 31 de diciembre de 2020","Del 1 de julio de 2012 al 30 de junio de 2020"],"x":"Párr. 49: entra en vigor el 20 de abril de 2012 y está vigente hasta el 31 de diciembre de 2020, con una revisión a mediano plazo. El 16 de febrero de 2012 es la fecha de publicación de las Recomendaciones revisadas; el 1 de julio al 30 de junio es el periodo del Presidente.","ref":"Mandato párr. 49"},{"id":"O051","tema":"o_gafi","tipo":"memoria","q":"Completa la tarea del párr. 3 c) del Mandato 2012-2020: «Evaluar y supervisar a sus Miembros, mediante ______ y procesos de seguimiento, para determinar el grado de cumplimiento, implementación y efectividad...»","a":"«revisiones entre pares» («evaluaciones mutuas»)","o":["«autoevaluaciones anuales» («ejercicios de autoevaluación»)","«visitas de supervisión prudencial» («inspecciones in situ»)","las evaluaciones del Programa de Evaluación del Sector Financiero","«revisiones entre pares» («evaluaciones mutuas»)"],"x":"El Mandato usa «revisiones entre pares» («evaluaciones mutuas») y procesos de seguimiento. El Programa de Evaluación del Sector Financiero es el contexto de las evaluaciones del FMI y el Banco Mundial (párr. 13 b), no la tarea del GAFI del párr. 3 c).","ref":"Mandato párr. 3 c)"},{"id":"O052","tema":"o_gafi","tipo":"trampa","q":"El Pleno y el Grupo Directivo se reúnen por lo menos tres veces al año y ambos los preside el Presidente. Según el Mandato 2012-2020, ¿qué los distingue?","a":"El Pleno es el máximo órgano de decisión; el Grupo Directivo es un órgano consultor","o":["El Grupo Directivo decide por consenso; el Pleno sólo asesora entre reuniones","El Pleno lo preside el Vicepresidente; el Grupo Directivo, el Secretario Ejecutivo","El Grupo Directivo aprueba el presupuesto; el Pleno aprueba sólo los estándares","El Pleno es el máximo órgano de decisión; el Grupo Directivo es un órgano consultor"],"x":"Párr. 19: el Pleno es el máximo órgano de decisión y decide por consenso; párr. 37: el Grupo Directivo es un órgano consultor. El presupuesto y los estándares los aprueba el Pleno (párr. 20 c y d). Gancho: el Pleno decide, el Grupo Directivo aconseja.","ref":"Mandato párrs. 19, 20 y 37"},{"id":"O053","tema":"o_gafi","tipo":"caso","q":"Por sus características estructurales, legales o institucionales, en un país no se aplica ningún requisito de cierta Recomendación. Según la Metodología (dic-2025), ¿cómo puede calificarse?","a":"En circunstancias excepcionales, como no aplicable (N/A)","o":["Siempre como no cumplida (NC), por la falta del requisito","Como cumplida (C), porque no existe ni una deficiencia","En circunstancias excepcionales, como no aplicable (N/A)","Con nivel bajo de efectividad en su Resultado Inmediato"],"x":"Párr. 42: «En circunstancias excepcionales, una Recomendación también podrá calificarse como no aplicable», cuando no se aplica ningún requisito por las características estructurales, legales o institucionales del país. Respeta el matiz: es excepcional y potestativo («podrá»). El nivel de efectividad es otra escala, para Resultados Inmediatos.","ref":"Metodología párr. 42"},{"id":"O054","tema":"o_gafi","tipo":"cifra","q":"Según la Introducción de las Recomendaciones del GAFI, ¿de qué año son las 40 Recomendaciones originales, dirigidas contra el lavado del dinero del tráfico ilícito de drogas?","a":"1990","o":["1989","1996","1990","2003"],"x":"Las 40 Recomendaciones originales son de 1990. En 1989 se estableció el GAFI; en 1996 se revisaron por primera vez y en 2003 por segunda vez.","ref":"Introducción Rec. GAFI"},{"id":"O055","tema":"o_gafi","tipo":"cifra","q":"Según la Introducción de las Recomendaciones del GAFI, ¿en qué año se amplió el mandato del GAFI para incluir el financiamiento de la proliferación de armas de destrucción masiva?","a":"2008","o":["2001","2004","2012","2008"],"x":"La Introducción dice que «en el 2008 el mandato del GAFI se expandió» a la proliferación, y que para ello adoptó la Recomendación 7. En 2001 se amplió al financiamiento del terrorismo (8 Recomendaciones Especiales; la 9ª llegó en 2004).","ref":"Introducción Rec. GAFI"},{"id":"O056","tema":"o_gafi","tipo":"caso","q":"Un equipo evaluador concluye que, en una Recomendación, el país sólo tiene deficiencias menores. Según la Metodología (dic-2025), ¿qué calificación de cumplimiento técnico corresponde?","a":"Mayoritariamente cumplida (MC)","o":["Mayoritariamente cumplida (MC)","Cumplida (C)","Parcialmente cumplida (PC)","Nivel alto de efectividad"],"x":"MC = sólo existen deficiencias menores. C exige que no exista ni una deficiencia; PC corresponde a deficiencias moderadas. El «nivel alto de efectividad» habla de mejoras menores, pero es la escala de los Resultados Inmediatos, no la de las Recomendaciones.","ref":"Metodología párr. 42"},{"id":"O057","tema":"o_gafi","tipo":"caso","q":"En la evaluación de cumplimiento técnico, una Recomendación presenta deficiencias moderadas. Según la Metodología (dic-2025), ¿qué calificación recibe?","a":"Parcialmente cumplida (PC)","o":["Mayoritariamente cumplida (MC)","No cumplida (NC)","Nivel sustancial de efectividad","Parcialmente cumplida (PC)"],"x":"PC = existen deficiencias moderadas; NC = deficiencias importantes; MC = sólo deficiencias menores. El nivel sustancial de efectividad menciona «mejoras moderadas», pero pertenece a la escala de efectividad.","ref":"Metodología párr. 42"},{"id":"O058","tema":"o_gafi","tipo":"caso","q":"Un Resultado Inmediato se ha logrado hasta cierto grado y se requieren mejoras considerables. Según la Metodología (dic-2025), ¿qué calificación de efectividad corresponde?","a":"Nivel moderado de efectividad","o":["Parcialmente cumplida (PC)","Nivel moderado de efectividad","Nivel sustancial de efectividad","Nivel bajo de efectividad"],"x":"Moderado = logrado hasta cierto grado; mejoras considerables. Sustancial = logrado en buena medida; mejoras moderadas. Bajo = no logrado o en grado insignificante; mejoras fundamentales. PC es una calificación técnica, no de efectividad.","ref":"Metodología párr. 72"},{"id":"O059","tema":"o_onu","tipo":"memoria","q":"La R.6, inciso (ii), se refiere a personas o entidades designadas en virtud de la resolución 1373 (2001). ¿Quién hace esa designación?","a":"El propio país","o":["El propio país","El Comité 1267, bajo el Capítulo VII","El Comité 1988, sobre el Talibán","El Consejo de Seguridad en anexos de la 1718"],"x":"La R.6 (ii) dice «designada por ese país en virtud de la resolución 1373 (2001)». En la 1267 y sus sucesoras, en cambio, designa el Consejo de Seguridad (Comités 1267 y 1988). Gancho: 1267 = lista del mundo; 1373 = lista de casa.","ref":"R.6 (ii); NI R.6 párr. 3"},{"id":"O060","tema":"o_onu","tipo":"caso","q":"La autoridad competente de un país quiere incluir en su lista, por iniciativa propia, a una persona respecto de la cual tiene una base razonable para creer que comete actos terroristas. ¿En virtud de qué resolución lo hace?","a":"Resolución 1373 (2001)","o":["Resolución 1267 (1999)","Resolución 1373 (2001)","Resolución 1718 (2006)","Resolución 1988 (2011), sobre el Talibán"],"x":"En la 1373 designa el país, a nivel nacional o supranacional, por iniciativa propia o a petición de otro país, con «motivos razonables» o «base razonable». En la 1267 y sus sucesoras (incluida la 1988) el país sólo puede proponer al Comité; la 1718 es de proliferación (RPDC).","ref":"R.6 (ii); NI R.6 párrs. 3 y 13 c)"},{"id":"O061","tema":"o_onu","tipo":"caso","q":"Un país recibe de otro país una solicitud para designar a una persona conforme a la resolución 1373 (2001). Según la NI R.6, ¿qué debe hacer el país que la recibe?","a":"Determinar con prontitud si la petición tiene motivos razonables o base razonable","o":["Remitirla al Comité 1267 para que éste decida la designación bajo el Capítulo VII","Designar de inmediato y sin examen, por venir la solicitud de otro país Miembro","Determinar con prontitud si la petición tiene motivos razonables o base razonable","Esperar a que exista una sentencia penal firme contra la persona que se propone"],"x":"NI R.6 párr. 4 b): al recibir una solicitud, los países deben determinar con prontitud si están convencidos, según sus principios (supra-)nacionales, de que está fundamentada por motivos razonables o una base razonable. No es automática, no va al Comité 1267 y no depende de un proceso penal (párr. 4 d).","ref":"NI R.6 párr. 4 b) y d)"},{"id":"O062","tema":"o_onu","tipo":"caso","q":"La autoridad de un país quiere que una persona que apoya actividades de Al-Qaida sea incluida en la Lista de Sanciones del Consejo de Seguridad. Según la NI R.6, ¿qué puede hacer el país?","a":"Proponer su designación al Comité 1267","o":["Incluirla ella misma en la Lista de Sanciones a Al-Qaida","Proponer su designación al Comité 1988","Solicitar su inclusión al Comité de Sanciones 1718","Proponer su designación al Comité 1267"],"x":"NI R.6 párr. 3: las designaciones relativas a Al-Qaida las hace el Comité 1267. El país no designa en esa lista: propone al Comité, si su autoridad decide hacerlo y cree tener suficiente evidencia (párr. 4 a i). El Comité 1988 es para el Talibán y el 1718 para la RPDC.","ref":"NI R.6 párrs. 3 y 4 a) i)"},{"id":"O063","tema":"o_onu","tipo":"caso","q":"Una autoridad identifica a una persona que apoya actos del Talibán que amenazan la paz, la estabilidad y la seguridad de Afganistán y decide proponer su designación. Según la NI R.6, ¿a qué comité dirige la propuesta?","a":"Al Comité 1988","o":["Al Comité 1988","Al Comité 1267","Al Comité de Sanciones 1737","Al Comité de Sanciones 1718"],"x":"NI R.6 párr. 3: las designaciones sobre el Talibán y amenazas relacionadas con Afganistán las hace el Comité 1988; las de Al-Qaida, el Comité 1267. Ambos actúan bajo el Capítulo VII. Los Comités 1718 y 1737 son de proliferación (R.7).","ref":"NI R.6 párrs. 3 y 4 a) ii)"},{"id":"O064","tema":"o_onu","tipo":"memoria","q":"¿En qué resolución se basa la R.6, inciso (i), relativo a personas o entidades designadas por, o bajo la autoridad de, el Consejo de Seguridad dentro del Capítulo VII?","a":"1267 (1999) y sus resoluciones sucesoras","o":["1373 (2001), con designación del propio país","1718 (2006) y sus resoluciones sucesoras","1267 (1999) y sus resoluciones sucesoras","1737 (2006) y sus resoluciones sucesoras"],"x":"R.6 (i): designada por, o bajo la autoridad de, el Consejo de Seguridad, «incluyendo, de conformidad con la resolución 1267 (1999) y sus resoluciones sucesoras». La 1373 es el inciso (ii); la 1718 y la 1737 son la base de las SFD de proliferación (R.7).","ref":"R.6 (i)"},{"id":"O065","tema":"o_onu","tipo":"trampa","q":"Un alumno afirma que en la resolución 1373 (2001) el Consejo de Seguridad arma la lista. Según la NI R.6 párr. 3, ¿quién hace las designaciones de la 1373?","a":"Un país o países, a nivel nacional o supranacional","o":["El Comité 1267, actuando bajo el Capítulo VII de la Carta","Un país o países, a nivel nacional o supranacional","El Comité 1988, a propuesta del país que tenga suficiente evidencia","El Consejo de Seguridad en los anexos de la propia resolución 1373"],"x":"Para la 1373, las designaciones «las hace, a nivel nacional o supranacional, un país o países que actúan por iniciativa propia o a petición de otro país». Es la diferencia clave con la 1267, donde designan los Comités 1267 y 1988 bajo el Capítulo VII.","ref":"NI R.6 párr. 3"},{"id":"O066","tema":"o_onu","tipo":"cifra","q":"¿De qué año es la resolución 1373 del Consejo de Seguridad, base de la R.6 inciso (ii)?","a":"2001","o":["1999","2006","2011","2001"],"x":"La 1373 es de 2001; la 1267, de 1999. Orden: 99 → 01. 2006 es el año de la 1718 y la 1737 (proliferación) y 2011 el de la 1988 y la 1989.","ref":"R.6 (ii)"},{"id":"O067","tema":"o_onu","tipo":"cifra","q":"¿De qué año es la resolución 1267 del Consejo de Seguridad, base de la R.6 inciso (i)?","a":"1999","o":["1989","1999","2001","2011"],"x":"La 1267 es de 1999. No la confundas con 1989, año en que se estableció el GAFI, ni con la resolución 1989 (2011), sucesora de la 1267 sobre Al-Qaida.","ref":"R.6 (i)"},{"id":"O068","tema":"o_onu","tipo":"memoria","q":"Según la NI R.7 (dic-2025), ¿en qué resoluciones se basan las sanciones financieras dirigidas relacionadas con la proliferación?","a":"1718 (2006), RPDC, y 1737 (2006), Irán, con sus sucesoras","o":["1718 (2006), RPDC, y 1737 (2006), Irán, con sus sucesoras","1267 (1999) y 1373 (2001), con sus resoluciones sucesoras","1988 (2011) y 1989 (2011), sobre el Talibán y Al-Qaida","1373 (2001) y 1452 (2002), sobre designaciones nacionales"],"x":"La nota 22 de la NI R.7 (versión oct-2025) enlista la 1718 (2006) y sus sucesoras para la RPDC, y la 1737 (2006), 1747, 1803 y 1929 para Irán. La 1267 y la 1373 son la base de la R.6 (terrorismo).","ref":"NI R.7 nota 22"},{"id":"O069","tema":"o_onu","tipo":"caso","q":"Una institución financiera detecta que un cliente es una entidad designada por el Comité de Sanciones 1718. ¿A qué régimen corresponde esa designación?","a":"Proliferación: programas nucleares, de ADM y de misiles de la RPDC","o":["Terrorismo: Al-Qaida y sus células, grupos afiliados o derivados","Proliferación: actividades nucleares sensibles y sistemas vectores de Irán","Terrorismo: el Talibán y las amenazas a la paz de Afganistán","Proliferación: programas nucleares, de ADM y de misiles de la RPDC"],"x":"La 1718 (2006) es de la RPDC: sus criterios se refieren a programas nucleares, otros de ADM y de misiles balísticos (NI R.7 párr. 13 a). Irán corresponde a la 1737 y su Comité; Al-Qaida y Talibán son R.6 (Comités 1267 y 1988).","ref":"NI R.7 párrs. 5 a) y 13 a)"},{"id":"O070","tema":"o_onu","tipo":"caso","q":"Un banco identifica a una entidad que presta apoyo a las actividades sensibles de proliferación nuclear de Irán. ¿Qué resolución y qué comité corresponden según la NI R.7?","a":"1737 (2006) y el Comité de Sanciones 1737","o":["1718 (2006) y el Comité de Sanciones 1718","1267 (1999) y el Comité 1267","1737 (2006) y el Comité de Sanciones 1737","1373 (2001) y la autoridad nacional competente"],"x":"Irán = 1737 (2006); la nota 22 enlista también la 1747, la 1803 y la 1929. Designa el Consejo de Seguridad en los anexos o el Comité de Sanciones 1737 (NI R.7 párr. 5 b). La 1718 es de la RPDC. Gancho: Corea 1718, Irán 1737, ambas de 2006.","ref":"NI R.7 párrs. 5 b) y 13 b)"},{"id":"O071","tema":"o_onu","tipo":"memoria","q":"Según la nota 22 de la NI R.7, además de la 1737 (2006), ¿qué resoluciones del Consejo de Seguridad aplican sanciones financieras dirigidas relativas a Irán?","a":"1747 (2007), 1803 (2008) y 1929 (2010)","o":["1874 (2009), 2087 (2013) y 2094 (2013)","1747 (2007), 1803 (2008) y 1929 (2010)","1333 (2000), 1390 (2002), 1455 (2003) y 1526 (2004)","1904 (2009), 1988 (2011) y 1989 (2011)"],"x":"La nota 22 enlista para Irán las resoluciones 1737 (2006), 1747 (2007), 1803 (2008) y 1929 (2010). La 1874, la 2087 y la 2094 son sucesoras de la 1718, sobre la RPDC (nota 24); la 1333, la 1390 y la 1455 son sucesoras de la 1267, sobre terrorismo (NI R.6, nota 13).","ref":"NI R.7 nota 22"},{"id":"O072","tema":"o_onu","tipo":"caso","q":"Una institución financiera encuentra fondos de una persona designada en virtud de la R.6. Según la NI R.6 párr. 6 a), ¿cómo debe congelarlos?","a":"Sin demora y sin previa notificación","o":["Dentro de los diez días laborables siguientes, previa notificación","Sólo cuando exista orden judicial en un proceso penal","Sin demora y sin previa notificación","Sin demora, pero notificando antes a la persona designada"],"x":"Los países deben exigir a todas las personas naturales y jurídicas que congelen «sin demora y sin previa notificación». Las medidas de la R.6 no dependen de la existencia de procesos penales (NI R.6 párr. 2). Los diez días laborables aparecen en otro supuesto: la notificación previa al Comité 1737 de ciertos pagos (NI R.7 párr. 11 c).","ref":"NI R.6 párr. 6 a)"},{"id":"O073","tema":"o_onu","tipo":"caso","q":"Una persona designada controla indirectamente una empresa cuyos fondos no están vinculados con ningún acto terrorista concreto. Según la NI R.6 párr. 6 a), ¿deben congelarse esos fondos?","a":"Sí: abarca fondos controlados directa o indirectamente, no sólo los ligados a un acto","o":["No: sólo se congelan los fondos ligados a un acto, complot o amenaza terrorista","Sí: abarca fondos controlados directa o indirectamente, no sólo los ligados a un acto","No: sólo se congelan los fondos registrados a nombre de la persona designada","Sólo si la empresa también aparece designada por su nombre en la lista del Comité"],"x":"La obligación se extiende a todos los fondos propiedad o bajo control del designado, «y no sólo aquellos que se pueden enlazar a un acto terrorista particular», incluidos los controlados directa o indirectamente y los de quienes actúan en su nombre o bajo su dirección.","ref":"NI R.6 párr. 6 a)"},{"id":"O074","tema":"o_onu","tipo":"caso","q":"Un cliente con un nombre similar al de una persona designada ve congelados sus fondos por error (falso positivo). Según la NI R.6, ¿qué deben tener los países?","a":"Procedimientos públicos para descongelar a tiempo tras verificar que no es el designado","o":["Mantener el congelamiento hasta que el Consejo de Seguridad lo excluya de la lista","Un trámite ante el Comité 1988 para que el cliente solicite su remoción de la lista","Esperar a que un tribunal penal resuelva antes de liberar cualquier fondo congelado","Procedimientos públicos para descongelar a tiempo tras verificar que no es el designado"],"x":"NI R.6 párr. 9: para falsos positivos, los países deben tener procedimientos que se conozcan públicamente para descongelar a tiempo, a partir de la verificación de que la persona no es la designada. No hay que excluirla de ninguna lista, porque nunca estuvo en ella.","ref":"NI R.6 párr. 9"},{"id":"O075","tema":"o_onu","tipo":"caso","q":"El Comité 1267 remueve de su lista a una persona que estaba designada. Según la NI R.6, ¿qué ocurre con la obligación de congelar sus fondos?","a":"Deja de existir","o":["Deja de existir","Subsiste hasta que el país la designe por la 1373","Subsiste hasta que un tribunal nacional confirme la remoción","Se mantiene hasta la siguiente Sesión Plenaria del GAFI"],"x":"NI R.6 párr. 7: «En el caso de que el Comité 1267 o el Comité 1988 haya removido de una lista a una persona o entidad, la obligación de congelamiento deja de existir». La NI R.7 párr. 7 dice lo mismo para las listas de proliferación.","ref":"NI R.6 párr. 7"},{"id":"O076","tema":"o_onu","tipo":"caso","q":"Una persona designada por el país en virtud de la 1373 (2001) ya no satisface los criterios de designación. Según la NI R.6 párr. 8, ¿qué deben tener los países?","a":"Procedimientos para deslistar y descongelar, y revisión ante tribunal o autoridad independiente","o":["Sólo la vía de pedir al Consejo de Seguridad su exclusión, quien decide en definitiva","Un procedimiento para que el Comité 1267 la excluya, actuando bajo el Capítulo VII","Procedimientos para deslistar y descongelar, y revisión ante tribunal o autoridad independiente","La Oficina de Defensa del Pueblo de la ONU como única vía para solicitar su remoción"],"x":"Como en la 1373 designa el país, la salida también es nacional: autoridades y procedimientos para deslistar y descongelar, y para revisar la designación ante un tribunal u otra autoridad competente independiente. Las solicitudes al Consejo de Seguridad son para la 1267 (párr. 7) y la Oficina de Defensa del Pueblo, para la Lista de Al-Qaida (párr. 11).","ref":"NI R.6 párr. 8"},{"id":"O077","tema":"o_onu","tipo":"caso","q":"Una persona incluida en la Lista de Sanciones a Al-Qaida quiere pedir su remoción. Según la NI R.6 párr. 11, ¿sobre qué deben informarle los países?","a":"La Oficina de la ONU de Defensa del Pueblo, conforme a la 1904 (2009)","o":["El Grupo Egmont, que recibe las peticiones de remoción por medio de las UIF","La Oficina de la ONU de Defensa del Pueblo, conforme a la 1904 (2009)","El Comité de Sanciones 1718, que revisa las peticiones de todas las listas","La autoridad nacional que la designó en virtud de la resolución 1373 (2001)"],"x":"Para la Lista de Al-Qaida, los países deben informar sobre la disponibilidad de la Oficina de las Naciones Unidas de Defensa del Pueblo, en virtud de la 1904 (2009), para aceptar peticiones de remoción. La autoridad nacional es la vía para designaciones de la 1373, no para la lista del Consejo.","ref":"NI R.6 párr. 11"},{"id":"O078","tema":"o_onu","tipo":"caso","q":"Una persona designada por el Comité 1267 necesita acceder a parte de sus fondos congelados para cubrir gastos básicos. Según la NI R.6 párr. 10, ¿conforme a qué resolución deben autorizar el acceso los países?","a":"Resolución 1452 (2002) y sucesoras","o":["Resolución 1963 (2010)","Resolución 1904 (2009)","Resolución 1730 (2006)","Resolución 1452 (2002) y sucesoras"],"x":"Para designados por el Consejo de Seguridad o sus comités, el acceso para gastos básicos, honorarios o gastos extraordinarios se autoriza conforme a la 1452 (2002) y sucesoras. La 1963 (2010) es la referencia cuando el congelamiento deriva de una designación nacional en virtud de la 1373.","ref":"NI R.6 párr. 10"},{"id":"O079","tema":"o_onu","tipo":"memoria","q":"En materia de proliferación, ¿tienen los Estados Miembros de la ONU una obligación específica de presentar propuestas de designación al Consejo de Seguridad o a sus Comités, según la NI R.7 párr. 3?","a":"No existe obligación específica, aunque en la práctica el Consejo depende de esas peticiones","o":["Sí: deben presentarlas al Comité 1718 o al 1737 siempre que posean suficiente evidencia","Sí: deben designar ellos mismos, por iniciativa propia, como ocurre con la 1373","No existe obligación específica, aunque en la práctica el Consejo depende de esas peticiones","No: sólo el Consejo identifica a los designados y no recibe peticiones de los Estados"],"x":"NI R.7 párr. 3: «No existe una obligación específica» de presentar propuestas; «sin embargo, en la práctica», el Consejo o los Comités dependen fundamentalmente de las peticiones de los Estados Miembros. En proliferación designa el Consejo de Seguridad, no el país.","ref":"NI R.7 párr. 3"},{"id":"O080","tema":"o_onu","tipo":"caso","q":"Un país diseña su régimen para cumplir la R.7. Según la NI R.7 párr. 4, ¿qué prevé respecto de la autoridad y los procedimientos para proponer personas al Consejo de Seguridad?","a":"Que el país puede considerar establecerlos","o":["Que el país debe establecerlos, igual que en la R.6","Que el país debe designar directamente por iniciativa propia","Que el país puede considerar establecerlos","Que sólo el Grupo Directivo del GAFI puede proponerlos"],"x":"Respeta el modal: «Los países pueden considerar el establecimiento de la autoridad...» y «pudieran considerar» ciertos elementos. En la R.6, en cambio, los países «deben» contar con autoridad para proponer designaciones (NI R.6 párr. 4). Convertir el «pueden considerar» en «deben» es el error típico.","ref":"NI R.7 párr. 4"},{"id":"O081","tema":"o_onu","tipo":"trampa","q":"Un compañero sostiene que la resolución 1540 (2004) es la base de las sanciones financieras dirigidas de la R.7. Según la NI R.7, ¿qué es lo correcto respecto de la 1540?","a":"Es base de obligaciones de no proliferación independientes de la R.7 (nota 23)","o":["Es, junto con la 1718 (2006), la base de las SFD de la R.7 respecto de la RPDC","Es base de obligaciones de no proliferación independientes de la R.7 (nota 23)","Sustituyó a la 1737 (2006) como base de las SFD de la R.7 respecto de Irán","Es base de la R.6, junto con la 1267 (1999) y la 1373 (2001), contra el terrorismo"],"x":"La nota 23 de la NI R.7 menciona la 1540 (2004), junto con la 2235 (2016), el TNP y los convenios sobre armas biológicas y tóxicas y sobre armas químicas, como base de obligaciones de no proliferación que «existen con independencia» de la R.7 y su NI. Las SFD de la R.7 se basan en la 1718 y la 1737 y sus sucesoras (nota 22).","ref":"NI R.7 notas 22 y 23"},{"id":"O082","tema":"o_onu","tipo":"caso","q":"Al preparar un manual, una oficial de cumplimiento enlista los instrumentos que, según la nota 23 de la NI R.7, sustentan obligaciones de no proliferación que existen con independencia de la R.7. ¿Qué lista es la correcta?","a":"TNP, Convenios sobre Armas Biológicas y Tóxicas y sobre Armas Químicas, y resoluciones 1540 (2004) y 2235 (2016)","o":["Convención de Viena, Convención de Palermo y Convenio Internacional para la Represión de la Financiación del Terrorismo","Resoluciones 1718 (2006) y 1737 (2006), junto con todas sus resoluciones sucesoras sobre la RPDC y sobre Irán","Resoluciones 1267 (1999), 1373 (2001) y 1452 (2002), junto con sus resoluciones sucesoras sobre terrorismo","TNP, Convenios sobre Armas Biológicas y Tóxicas y sobre Armas Químicas, y resoluciones 1540 (2004) y 2235 (2016)"],"x":"La nota 23 cita, por ejemplo, el Tratado de No Proliferación Nuclear, el Convenio sobre Armas Biológicas y Tóxicas, el Convenio sobre las Armas Químicas y las resoluciones 1540 (2004) y 2235 (2016). Viena, Palermo y el Convenio de Financiación del Terrorismo son la nota 14 de la NI R.6; la 1718 y la 1737 son la base de las SFD de la R.7.","ref":"NI R.7 nota 23"},{"id":"O083","tema":"o_onu","tipo":"memoria","q":"El Glosario del GAFI, en la definición de «Designación», dice: «...incluyendo la determinación de que las sanciones acordes se aplicarán a la persona o entidad y la comunicación pública de esa determinación». ¿A qué resolución se refiere ese fragmento?","a":"Resolución 1373 (2001)","o":["Resolución 1267 (1999)","Resolución 1718 (2006) y sus sucesoras","Resolución 1373 (2001)","Resolución 1737 (2006)"],"x":"En el Glosario, la viñeta de la 1373 (2001) es la única que añade la determinación de aplicar sanciones y su comunicación pública, porque en la 1373 la designación la hace el país. Las viñetas de la 1267, 1718 y 1737 sólo dicen «y sus resoluciones sucesoras».","ref":"Glosario, «Designación»"},{"id":"O084","tema":"o_onu","tipo":"caso","q":"Una autoridad analiza si una entidad controlada indirectamente por una persona que comete actos terroristas satisface los criterios de designación de la resolución 1373 (2001). Según la NI R.6 párr. 13 c), ¿qué concluye?","a":"Sí los satisface: la 1373 comprende entidades controladas directa o indirectamente","o":["No: la 1373 sólo comprende a quien comete o intenta cometer actos terroristas","No: esas entidades sólo pueden designarse por medio del Comité 1988","Sólo si la entidad además financia actos o actividades de Al-Qaida","Sí los satisface: la 1373 comprende entidades controladas directa o indirectamente"],"x":"Los criterios de la 1373 son tres: (i) quien comete o intenta cometer actos terroristas, o participa en ellos o facilita su comisión; (ii) toda entidad que le pertenezca o esté controlada, directa o indirectamente, por esa persona; y (iii) quien actúa en su nombre o bajo su dirección.","ref":"NI R.6 párr. 13 c)"},{"id":"O085","tema":"o_onu","tipo":"caso","q":"Al decidir si designa a una persona conforme a la resolución 1373 (2001), ¿qué norma probatoria debe aplicar el país según la NI R.6 párr. 4 d)?","a":"Motivos razonables o base razonable, sin depender de un proceso penal","o":["Prueba más allá de toda duda razonable, con sentencia penal firme","Motivos razonables o base razonable, sin depender de un proceso penal","Motivos razonables, siempre que exista un proceso penal en curso","Base razonable, pero sólo si la designación la pide otro país"],"x":"Los países deben aplicar una norma de «motivos razonables» o «base razonable», según la norma legal de su propio sistema jurídico, independientemente de que la designación sea por iniciativa propia o a petición de otro país. Estas designaciones «no deben depender de la existencia de un proceso penal».","ref":"NI R.6 párr. 4 d)"},{"id":"O086","tema":"o_onu","tipo":"caso","q":"Una autoridad acaba de designar a una persona. Según la NI R.6 párr. 6 c), ¿cuándo deben los países comunicar la designación al sector financiero y a las APNFD?","a":"Inmediatamente al tomar dicha acción","o":["Inmediatamente al tomar dicha acción","Dentro de los diez días laborables siguientes","En la siguiente Sesión Plenaria del GAFI","Una vez notificada la persona designada"],"x":"Los países deben contar con mecanismos para comunicar las designaciones al sector financiero y a las APNFD «inmediatamente al tomar dicha acción», con una guía clara sobre sus obligaciones. Esperar a notificar a la persona designada contradice el congelamiento sin previa notificación.","ref":"NI R.6 párr. 6 c)"},{"id":"O087","tema":"o_onu","tipo":"caso","q":"Una institución congeló activos de un designado y además detectó una transacción que el designado intentó realizar. Según la NI R.6 y la NI R.7 (párr. 6 d), ¿qué deben exigir los países a la institución?","a":"Reportar a la autoridad los activos congelados y las acciones tomadas, incluidas las transacciones intentadas","o":["Reportar sólo los activos congelados, porque las transacciones intentadas no se reportan","Notificar directamente al Comité del Consejo de Seguridad, sin pasar por la autoridad nacional","Reportar a la autoridad los activos congelados y las acciones tomadas, incluidas las transacciones intentadas","Informar primero al cliente designado y después reportar los activos a la autoridad competente"],"x":"Párr. 6 d) de ambas notas: los países deben exigir a las instituciones financieras y APNFD que reporten a las autoridades competentes los activos congelados o las acciones tomadas, «incluyendo las transacciones intentadas». Avisar al designado contradice el congelamiento «sin previa notificación».","ref":"NI R.6 y NI R.7, párr. 6 d)"},{"id":"O088","tema":"o_onu","tipo":"caso","q":"Una entidad designada en virtud de la 1737 (2006) debe hacer un pago vencido bajo un contrato celebrado antes de ser listada, y se cumplen las demás condiciones. Según la NI R.7 párr. 11 c), ¿con qué anticipación deben los países notificar al Comité de Sanciones 1737?","a":"Diez días laborables antes de la autorización","o":["Cinco días hábiles después de efectuado el pago","Treinta días naturales antes de celebrar el contrato","Inmediatamente después de autorizar el desbloqueo","Diez días laborables antes de la autorización"],"x":"La NI R.7 párr. 11 c) exige una notificación previa al Comité de Sanciones 1737 sobre la intención de hacer o recibir esos pagos o autorizar el desbloqueo, «diez días laborables antes de dicha autorización». Además, el contrato no debe estar relacionado con bienes o servicios prohibidos y el pago no debe recibirlo un designado.","ref":"NI R.7 párr. 11"},{"id":"O089","tema":"o_onu","tipo":"caso","q":"Una cuenta congelada conforme a la resolución 1718 (2006) genera intereses. Según la NI R.7 párr. 10, ¿qué deben hacer los países?","a":"Permitir que se añadan a la cuenta, siempre que sigan sujetos al congelamiento","o":["Entregarlos al titular, pues no forman parte de los fondos ya congelados","Permitir que se añadan a la cuenta, siempre que sigan sujetos al congelamiento","Transferirlos al Comité de Sanciones 1718 para su administración y custodia","Impedir cualquier abono, porque las cuentas congeladas no pueden recibir ingresos"],"x":"Los países deben permitir la adición a las cuentas congeladas (1718 o 1737) de intereses u otras ganancias, o de pagos vencidos por contratos anteriores, siempre que sigan sujetos a esas disposiciones y queden congelados.","ref":"NI R.7 párr. 10"},{"id":"O090","tema":"o_onu","tipo":"trampa","q":"En la NI R.7 (versión dic-2025), ¿en qué parte aparece mencionada la resolución 2231 (2015)?","a":"En el párr. 9, sobre las condiciones de exención para autorizar el acceso a fondos","o":["En el párr. 9, sobre las condiciones de exención para autorizar el acceso a fondos","En la nota 22, como base de las sanciones financieras dirigidas relativas a Irán","En el párr. 13, como resolución que fija los criterios de designación sobre Irán","En el párr. 5, como fuente de las designaciones que realiza el Comité de Sanciones 1737"],"x":"Trampa de la 2231: en la NI R.7 (dic-2025), las SFD relativas a Irán se basan en la 1737 (2006), junto con la 1747, la 1803 y la 1929 (nota 22 y párr. 13 b). La 2231 (2015) sólo aparece en el párr. 9, junto con la 1718 y la 1737, sobre las condiciones de exención para autorizar el acceso a fondos.","ref":"NI R.7 párr. 9; nota 22"}],"sitio":{"nombre":"Módulo 1","raiz":"../","actual":"m1-s2-organismos","paginas":[{"n":"1","carpeta":"m1-s1-conceptos","pregunta":"Conceptos básicos","estado":"integrada"},{"n":"2","carpeta":"m1-s2-organismos","pregunta":"Organismos y GAFI","estado":"integrada"},{"n":"3","carpeta":"m1-s3-recomendaciones","pregunta":"Las 40 Recomendaciones","estado":"integrada"},{"n":"4","carpeta":"m1-s4-autoridades","pregunta":"Autoridades nacionales","estado":"integrada"},{"n":"¿Quién?","carpeta":"m1-quien-hace-que","pregunta":"¿Quién hace qué?","estado":"integrada","tip":"¿Quién hace qué? · entrenador"}],"integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m1-simulacro/index.html"}}
</script>

<script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=p.tip||`${S.etiqueta_n!=null?S.etiqueta_n:"Sesión "}${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">${actual.tip?esc(actual.tip):esc(S.etiqueta_n!=null?S.etiqueta_n:"Sesión ")+esc(actual.n)+" · "+esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;

R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};

    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;

};

R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;

  `<div class="simbar">${(s.tamanos||[30,50]).map(n=>`<button class="qsim" data-n="${+n}" aria-pressed="false">Simulacro de ${+n}</button>`).join("")}<span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>
   <div class="lbl" style="margin-bottom:6px">O practica por tema (rondas de 10)</div><div class="modes" id="modes" role="group" aria-label="Tipo de práctica"></div><div class="quiz" id="quiz" aria-live="polite"></div>`;

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}

/* ---------- tablero y cuatro tablas ---------- */
const TB={}, CT={};
const tbSec=id=>D.secciones.find(x=>x.id===id);
const tbCell=(s,r,j)=>(s._ix||(s._ix=Object.fromEntries(s.celdas.map(c=>[c.rep+"|"+c.suj,c]))))[r+"|"+j]||{rep:r,suj:j,aplica:false,seguro:false};
const uniq=a=>[...new Set(a.filter(Boolean))];
function tbInit(s){
  const st=TB[s.id]={suj:new Set(),grp:new Set(),frec:"",monto:"",plazo:"",vista:"tabla"};
  const on=s.celdas.filter(c=>c.aplica);
  const sel=(k,lab,vals)=>!vals.length?"":`<div class="row"><span class="lbl">${lab}</span><select data-tbs="${s.id}:${k}"><option value="">Todos</option>${vals.map(v=>`<option>${esc(v)}</option>`).join("")}</select></div>`;
  $("#tbf-"+s.id).innerHTML=
    `<div class="row"><span class="lbl">Sujeto</span>${s.sujetos.map((j,i)=>`<button class="fchip sw ${colorDe(j.color,i)}" data-tbf="${s.id}:suj:${j.k}" aria-pressed="false" title="${esc(j.t)}"><i></i>${esc(j.corto||j.k)}</button>`).join("")}</div>`+
    `<div class="row"><span class="lbl">Tipo</span>${s.grupos.map((g,i)=>`<button class="fchip sw ${colorDe(g.color,i)}" data-tbf="${s.id}:grp:${g.k}" aria-pressed="false"><i></i>${esc(g.t)}</button>`).join("")}</div>`+
    `<div class="row" style="gap:14px">${sel("frec","Frecuencia",uniq(on.map(c=>c.frec_tag)))}${sel("monto","Monto",uniq(on.map(c=>c.monto_tag)))}${sel("plazo","Plazo",uniq(on.map(c=>c.plazo_tag)))}</div>`;
  tbDraw(s.id);
}
function tbMatch(st,c){return (!st.frec||c.frec_tag===st.frec)&&(!st.monto||c.monto_tag===st.monto)&&(!st.plazo||c.plazo_tag===st.plazo);}
function tbDraw(id){
  const s=tbSec(id), st=TB[id], val=st.frec||st.monto||st.plazo;
  const cols=s.sujetos.map((j,i)=>({...j,ci:i})).filter(j=>!st.suj.size||st.suj.has(j.k));
  let hits=0, shown=0;
  if(st.vista==="tabla"){
    let body="";
    s.grupos.forEach((g,gi)=>{
      if(st.grp.size&&!st.grp.has(g.k)) return;
      const rows=s.reportes.filter(r=>r.g===g.k).map(r=>{
        const cells=cols.map(j=>{const c=tbCell(s,r.k,j.k), m=c.aplica&&val&&tbMatch(st,c); if(m)hits++; return {c,j,m};});
        if(val&&!cells.some(x=>x.m)) return "";
        shown++;
        return `<tr><th class="rp" scope="row">${esc(r.t)}${r.regla?`<span class="rg">${esc(r.regla)}</span>`:""}</th>${cells.map(({c,j,m})=>`<td class="${val?(m?"hit":"dim"):""}"><button class="tbc ${c.aplica?"si":"no"}${c.aplica&&c.marca?" tx":""}${c.seguro===false?" dud":""}" data-tbc="${id}|${r.k}|${j.k}" aria-label="${esc(r.t)} · ${esc(j.t)}: ${c.aplica?(c.marca?esc(c.marca):"sí"):"no"}"><span class="mk">${c.aplica&&c.marca?`<span class="mt">${esc(c.marca)}</span>`:""}</span></button></td>`).join("")}</tr>`;
      }).join("");
      if(rows) body+=`<tr class="grp ${colorDe(g.color,gi)}"><th colspan="${cols.length+1}">${esc(g.t)}${g.pregunta?`<span>${esc(g.pregunta)}</span>`:""}</th></tr>`+rows;
    });
    $("#tbo-"+id).innerHTML=`<div class="tbwrap"><table class="tbm"><thead><tr><th class="rp" scope="col">${esc(s.col_titulo||"Reporte")}</th>${cols.map(j=>`<th class="sj ${colorDe(j.color,j.ci)}" scope="col" title="${esc(j.t)}">${esc(j.corto||j.k)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
    $("#tbn-"+id).textContent=val?`${hits} casillas cumplen el filtro en ${shown} reportes.`:`✓ = su DCG lo prevé · punto = no lo prevé · ? = texto dudoso. Toca una casilla para ver monto, plazo y disposición.`;
  } else {
    const list=[];

const rnd=n=>Math.floor(Math.random()*n);
const mixA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function ctNew(id){
  const s=tbSec(id), src=tbSec(s.fuente), g=CT[id], nR=s.filas||4, nC=s.columnas||4;
  const reps=src.reportes.filter(r=>!(s.excluir||[]).includes(r.k));
  const allOn=r=>src.sujetos.every(j=>tbCell(src,r.k,j.k).aplica);
  let R0,C0,M;
  for(let t=0;t<400;t++){
    const cs=mixA(src.sujetos).slice(0,nC), rs=mixA(reps).slice(0,nR);
    if(rs.filter(allOn).length>1) continue;
    if(rs.some(r=>cs.some(j=>tbCell(src,r.k,j.k).seguro===false))) continue;
    const m=rs.map(r=>cs.map(j=>!!tbCell(src,r.k,j.k).aplica));
    const pats=new Set(m.map(x=>x.join()));
    if(pats.size<Math.min(3,nR)) continue;
    if(m.filter(x=>!x.some(Boolean)).length>1) continue;
    R0=rs;C0=cs;M=m;break;
  }
  if(!M){R0=reps.slice(0,nR);C0=src.sujetos.slice(0,nC);M=R0.map(r=>C0.map(j=>!!tbCell(src,r.k,j.k).aplica));}
  Object.assign(g,{src,rows:R0,cols:C0,M,done:false});
  if(g.mode==="llena"){g.mine=M.map(x=>x.map(()=>false)); return ctDrawFill(id);}
  const key=m=>m.map(x=>x.map(Number).join("")).join("|"), seen=new Set([key(M)]), opts=[M];
  let guard=0;
  while(opts.length<4&&guard++<500){
    const d=M.map(x=>x.slice()), k=1+rnd(2);
    for(let q=0;q<k;q++){const r=rnd(nR),c=rnd(nC); d[r][c]=!d[r][c];}
    const kk=key(d); if(!seen.has(kk)){seen.add(kk);opts.push(d);}
  }

  ctDrawPick(id);
}

    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const ordT=(SIMSEC.orden_resultados||(D.sitio&&D.sitio.orden_resultados))==="temario",TK=Object.keys(TEMAS),ix=k=>{const i=TK.indexOf(k);return i<0?1e9:i};
  const rows=Object.entries(ST.byTema).sort(ordT?(a,b)=>ix(a[0])-ix(b[0]):(a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (${ordT?"en el orden del temario":"de menor a mayor"})</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
