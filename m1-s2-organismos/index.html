<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa interactivo de los organismos internacionales, el GAFI y las resoluciones de la ONU (temario CNBV 1.2.1 y 1.2.2), con simulador de reactivos.">
<title>Mapa de Organismos y GAFI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}

{"meta":{"titulo":"Mapa de Organismos y GAFI","descripcion":"Mapa interactivo de los organismos internacionales, el GAFI y las resoluciones de la ONU (temario CNBV 1.2.1 y 1.2.2), con simulador de reactivos.","repo":"m1-s2-organismos","clave":"m1s2","ruta":"financiero","modulo":"Módulo 1 · Certificación CNBV PLD/FT","unidad":"piezas","eyebrow":"Sesión 2 · Temario CNBV ago-2026 · 1.2.1 y 1.2.2","h1_antes":"Organismos internacionales y","h1_resaltado":"GAFI","h1_despues":"","intro":"Seis organismos, cuatro órganos del GAFI, las resoluciones de la ONU que obligan a congelar y la forma en que el GAFI califica a los países. Toca cualquier pieza del mapa para ver su fundamento y practica con reactivos tipo examen.","fuente":"Fuentes: CNBV, «Organismos Internacionales» (gob.mx, 06-ene-2025); GAFI, Mandato 2012-2020 (20-abr-2012); Recomendaciones del GAFI y Metodología, actualización a diciembre de 2025 (R.6, R.7, sus Notas Interpretativas, NI R.29 párr. 13, Glosario, Introducción y párrs. 42, 52 y 72 de la Metodología); CNBV, «Qué es GAFI» (sólo historia)."},"trampas":[{"titulo":"1267 ≠ 1373: ¿quién arma la lista?","texto":"En la <b>1267 (1999)<\/b> y sus sucesoras designa el <b>Consejo de Seguridad<\/b>, a través del Comité 1267 (Al-Qaida) y el Comité 1988 (Talibán), bajo el Capítulo VII. En la <b>1373 (2001)<\/b> designa <b>el país<\/b>, a nivel nacional o supranacional, por iniciativa propia o a petición de otro país, con «motivos razonables» o «base razonable» (R.6, incisos i y ii; NI R.6 párr. 3)."},{"titulo":"El Pleno decide; el Grupo Directivo sólo aconseja.","texto":"El Pleno es el <b>máximo órgano de decisión<\/b> y decide por <b>consenso<\/b> (Mandato párr. 19). El Grupo Directivo es un <b>órgano consultor<\/b> que asesora entre sesiones plenarias (párrs. 37 y 40). Ambos los convoca y preside el Presidente, por lo menos tres veces al año (párrs. 24, 32 y 41)."},{"titulo":"La 1540 no es la de las sanciones financieras de la R.7.","texto":"Las sanciones financieras dirigidas de la R.7 se basan en la <b>1718 (2006, RPDC)<\/b> y la <b>1737 (2006, Irán)<\/b> con las demás resoluciones que enlista la nota 22. La <b>1540 (2004)<\/b> aparece sólo en la nota 23, entre los instrumentos de no proliferación cuyas obligaciones <b>existen con independencia<\/b> de la R.7."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"El mapa","titulo":"Cuatro preguntas, dieciséis piezas","intro":"Ritmo <b>6 · 4 · 3 · 3<\/b>: seis organismos, cuatro órganos del GAFI, tres resoluciones de la ONU que preguntan y tres formas de calificar. El orden es didáctico; el corazón es el GAFI.","centro":{"t":"Organismos y GAFI","s":"6 · 4 · 3 · 3<br>16 piezas"},"ramas":[{"letra":"1","titulo":"¿Quiénes son?","pregunta":"Los seis organismos que cita la CNBV","ritmo":"¿Quiénes?","corto":"Organismos","color":"morado","items":[{"etiqueta":"ONU","nombre":"Organización de las Naciones Unidas","sub":"Foro de sus miembros","verbo":"Reúno","orden":1,"panel":"ONU","desc":"Foro donde sus miembros toman medidas sobre paz y seguridad, derechos humanos, desarme y terrorismo. Su Consejo de Seguridad emite las resoluciones de congelamiento.","puntos":["<b>CNBV:<\/b> «Es un foro para que sus miembros puedan tomar medidas sobre los problemas que enfrenta la humanidad, como la paz y la seguridad, los derechos humanos, el desarme, el terrorismo y mucho más.»","Es <b>observador<\/b> del GAFI (Mandato párr. 14). En el Anexo C figuran la UNODC, la Dirección Ejecutiva del Comité contra el Terrorismo y el Comité de Sanciones contra Al-Qaida (Comité 1267/1989).","Su <b>Consejo de Seguridad<\/b> emite las resoluciones que exigen congelar sin demora (R.6 y R.7). Ver la rama 3."],"ir":"#resoluciones","ir_texto":"Ver sus resoluciones"},{"etiqueta":"BCBS","nombre":"Comité de Supervisión Bancaria de Basilea","sub":"Regulación prudencial de bancos","verbo":"Regulo","orden":2,"panel":"Comité de Basilea","desc":"Principal organismo normativo internacional para la regulación prudencial de los bancos y foro de cooperación en supervisión bancaria. Piensa en supervisores.","puntos":["<b>CNBV:<\/b> «Es el principal organismo normativo internacional para la regulación prudencial de los bancos y constituye un foro de cooperación en materia de supervisión bancaria.»","Es <b>observador<\/b> del GAFI (Mandato, Anexo C)."],"ir":"#foros","ir_texto":"Compararlos"},{"etiqueta":"Wolfsberg","nombre":"Grupo Wolfsberg","sub":"Asociación de bancos","verbo":"Asocio","orden":3,"panel":"Grupo Wolfsberg","desc":"Asociación de bancos que se reúnen para desarrollar estándares contra el financiamiento del terrorismo, la corrupción y el lavado en instituciones financieras.","puntos":["<b>CNBV:<\/b> «Es una asociación de bancos reunidos con la finalidad de desarrollar estándares para la lucha contra el financiamiento del terrorismo, la corrupción y el lavado de dinero en instituciones financieras.»","Es el único de los seis que la CNBV define como <b>asociación de bancos<\/b>; su definición es la única que nombra la <b>corrupción<\/b>."],"ir":"#foros","ir_texto":"Compararlos"},{"etiqueta":"Egmont","nombre":"Grupo Egmont","sub":"Foro de las UIF","verbo":"Conecto","orden":4,"panel":"Grupo Egmont","desc":"Foro de las unidades de inteligencia financiera del mundo para mejorar su cooperación contra el lavado y el financiamiento al terrorismo. Egmont es de las UIF.","puntos":["<b>CNBV:<\/b> «Es un foro para que las unidades de inteligencia financiera alrededor del mundo mejoren sus vínculos de cooperación en la lucha contra el lavado de dinero y el financiamiento al terrorismo.»","<b>Documentos (NI R.29 párr. 13):<\/b> la UIF debe tomar en cuenta la <b>Declaración de Objetivos<\/b> del Grupo Egmont y sus <b>Principios para el Intercambio de Información<\/b> entre UIF, y debe solicitar la membresía del Grupo Egmont.","Es <b>observador<\/b> del GAFI (Mandato párr. 14 y Anexo C)."],"ir":"#foros","ir_texto":"Compararlos"},{"etiqueta":"GAFI","nombre":"Grupo de Acción Financiera Internacional","sub":"Entidad intergubernamental","verbo":"Fijo estándares","orden":5,"panel":"GAFI","destacado":true,"desc":"Entidad intergubernamental que fija estándares y promueve la efectiva implementación de medidas legales, regulatorias y operativas contra el lavado, el FT y otras amenazas.","puntos":["<b>CNBV:<\/b> «Es una entidad intergubernamental cuyos objetivos son fijar estándares y promover la efectiva implementación de medidas legales, regulatorias y operativas para combatir el lavado de activos, el financiamiento del terrorismo y otras amenazas.»","<b>Mandato párr. 1:<\/b> establecido en <b>1989<\/b> por los Ministerios y sus jurisdicciones Miembro. El texto histórico de la CNBV dice que lo creó el <b>G-7<\/b>.","Su estructura está en la rama 2."],"ir":"#organos","ir_texto":"Ver quién decide"},{"etiqueta":"GAFILAT","nombre":"Grupo de Acción Financiera de Latinoamérica","sub":"Organización intergubernamental regional","verbo":"Regionalizo","orden":6,"panel":"GAFILAT","desc":"Organización intergubernamental regional para prevenir y combatir el lavado de activos, el FT y el financiamiento de la proliferación de armas de destrucción masiva.","puntos":["<b>CNBV:<\/b> «Es una organización intergubernamental regional para prevenir y combatir el lavado de activos, el financiamiento del terrorismo y el financiamiento de la proliferación de armas de destrucción masiva.»","La palabra que lo separa del GAFI es <b>regional<\/b>. Su definición nombra el <b>financiamiento de la proliferación<\/b>; la del GAFI en la misma página termina en «y otras amenazas».","Las Recomendaciones (dic-2025) lo mencionan entre los <b>organismos regionales al estilo del GAFI<\/b> que, con el GAFI, desarrollaron el sistema de evaluaciones mutuas. Según el Mandato, los Miembros Asociados son FSRB <b>designados por el GAFI<\/b> (párr. 9); el Anexo B de 2012 enlista al GAFISUD. La traducción al español de las Recomendaciones la realizó el GAFILAT, con autorización del GAFI."]}]},{"letra":"2","titulo":"¿Cómo se gobierna el GAFI?","pregunta":"Sus cuatro estructuras internas","ritmo":"¿Quién manda?","corto":"Órganos GAFI","color":"principal","items":[{"etiqueta":"Párrs. 18–30","nombre":"El Pleno","sub":"Máximo órgano de decisión","verbo":"Decido","orden":7,"panel":"El Pleno","destacado":true,"desc":"Lo forman las jurisdicciones Miembro y organizaciones. Es el máximo órgano de decisión y decide por consenso: nombra, aprueba estándares y admite miembros y observadores.","puntos":["Consta de <b>jurisdicciones Miembro y organizaciones<\/b> (párr. 18).","<b>Máximo órgano de decisión<\/b>; decisiones por <b>consenso<\/b> (párr. 19).","<b>Párr. 20:<\/b> determina cómo conduce sus asuntos; designa al Presidente, al Vicepresidente y al Grupo Directivo; aprueba programa de trabajo y presupuesto; aprueba estándares, guías e informes; decide sobre miembros, estatus de los FSRB y condición de observador; decide cualquier otro asunto.","El Presidente convoca <b>por lo menos tres<\/b> Sesiones Plenarias al año, normalmente en <b>febrero, junio y octubre<\/b> (párr. 24); puede haber extraordinarias (párr. 25).","Sesiones <b>abiertas<\/b>: Miembros, Miembros Asociados y observadores. Sesiones <b>cerradas<\/b>: Miembros y Miembros Asociados (párr. 22).","Puede crear grupos de trabajo y subgrupos; designa a sus presidentes a recomendación del Presidente (párrs. 26–27)."],"ir":"#organos","ir_texto":"Ver quién decide"},{"etiqueta":"Párrs. 31–36","nombre":"Presidente y Vicepresidente","sub":"Conducción y vocería","verbo":"Conduzco","orden":8,"panel":"Presidencia","desc":"El Pleno nombra al Presidente de entre sus Miembros por un año, del 1 de julio al 30 de junio. Convoca y preside Pleno y Grupo Directivo y supervisa a la Secretaría.","puntos":["Nombrado por el Pleno de entre sus Miembros por <b>un año<\/b>: del <b>1 de julio al 30 de junio<\/b> del año siguiente (párr. 31).","<b>Convoca y preside<\/b> las sesiones del Pleno y del Grupo Directivo; <b>supervisa<\/b> a la Secretaría (párr. 32).","Principal <b>portavoz<\/b>; informa a los Ministerios y al público mediante el <b>informe anual<\/b> (párr. 33).","Debe su trabajo completamente al GAFI y a ninguna otra autoridad (párr. 34).","<b>Vicepresidente:<\/b> es también el Presidente designado; lo nombra el Pleno por el año que precede a su periodo presidencial; apoya al Presidente y lo suple (párrs. 35–36)."],"ir":"#organos","ir_texto":"Ver quién decide"},{"etiqueta":"Párrs. 37–42","nombre":"Grupo Directivo","sub":"Órgano consultor","verbo":"Aconsejo","orden":9,"panel":"Grupo Directivo","desc":"Órgano consultor presidido por el Presidente. Asesora entre sesiones plenarias, guía el progreso de la labor y promueve la coordinación entre grupos de trabajo. No es el que decide.","puntos":["Es un <b>órgano consultor<\/b> presidido por el Presidente (párr. 37).","Su composición la decide el <b>Pleno a propuesta del Presidente<\/b>, con representación geográfica equilibrada; se revisa <b>cada año<\/b> (párrs. 38–39).","Proporciona <b>asesoría entre las Sesiones Plenarias<\/b> (párr. 40).","Por lo menos <b>tres reuniones<\/b> al año, convocadas por el Presidente (párr. 41).","<b>Deberes (párr. 42):<\/b> supervisar y guiar el progreso de la labor; promover la coordinación entre grupos de trabajo; asegurar el flujo de información entre Miembros; otro trabajo, previa consulta con el Pleno."],"ir":"#organos","ir_texto":"Ver quién decide"},{"etiqueta":"Párrs. 43–47","nombre":"Secretaría","sub":"Secretario Ejecutivo y personal","verbo":"Ejecuto","orden":10,"panel":"Secretaría","desc":"Secretario Ejecutivo y personal que actúan según instrucciones del Presidente: apoyan la labor, administran recursos y registros. Su servicio lo da la OCDE, en París.","puntos":["Secretario Ejecutivo <b>nombrado por el Pleno a propuesta del Presidente<\/b>, más el personal (párr. 43).","Actúan de acuerdo con las <b>instrucciones del Presidente<\/b> (párr. 44).","<b>Párr. 45:<\/b> apoyar las actividades del GAFI y sus grupos de trabajo; facilitar la cooperación entre Miembros, Miembros Asociados y observadores; asegurar la comunicación; administrar recursos financieros, materiales y humanos; mantener registros, páginas web y correspondencia; lo que le asignen el Presidente o el Pleno.","Servicio proporcionado por la <b>OCDE<\/b>; sede de la OCDE en <b>París<\/b> (párr. 46). Se paga con el presupuesto del GAFI, según las tarifas de la OCDE (párr. 47)."],"ir":"#organos","ir_texto":"Ver quién decide"}]},{"letra":"3","titulo":"¿Qué resoluciones de la ONU?","pregunta":"Resoluciones del Consejo de Seguridad","ritmo":"¿Qué lista?","corto":"Resoluciones","color":"turquesa","items":[{"etiqueta":"1267 (1999)","nombre":"Lista del Consejo de Seguridad","sub":"R.6, inciso (i)","verbo":"La ONU designa","orden":11,"panel":"Resolución 1267 (1999)","desc":"Terrorismo: designa el Consejo de Seguridad o se designa bajo su autoridad (Capítulo VII), vía Comités 1267 (Al-Qaida) y 1988 (Talibán). Se congela sin demora.","puntos":["<b>R.6 (i):<\/b> persona o entidad designada por, o bajo la autoridad de, el Consejo de Seguridad dentro del Capítulo VII, incluyendo de conformidad con la 1267 (1999) y sus resoluciones sucesoras.","<b>NI R.6 párr. 3:<\/b> las designaciones relativas a <b>Al-Qaida<\/b> las hace el <b>Comité 1267<\/b>; las del <b>Talibán<\/b> y amenazas a Afganistán, el <b>Comité 1988<\/b>.","El país no designa: <b>propone<\/b> al Comité, si su autoridad decide hacerlo (NI R.6 párr. 4 a).","Quitar de la lista: solicitud al Consejo de Seguridad; si el Comité remueve a la persona, la obligación de congelar deja de existir (NI R.6 párr. 7)."],"ir":"#resoluciones","ir_texto":"Ver las resoluciones lado a lado"},{"etiqueta":"1373 (2001)","nombre":"Lista del propio país","sub":"R.6, inciso (ii)","verbo":"El país designa","orden":12,"panel":"Resolución 1373 (2001)","desc":"Terrorismo: personas y entidades designadas por el propio país, a nivel nacional o supranacional, por iniciativa propia o a petición de otro país, con motivos razonables.","puntos":["<b>R.6 (ii):<\/b> persona o entidad designada <b>por ese país<\/b> en virtud de la resolución 1373 (2001).","<b>NI R.6 párr. 3:<\/b> designa un país o países, a nivel nacional o supranacional, por iniciativa propia o a petición de otro país.","Norma probatoria: <b>«motivos razonables» o «base razonable»<\/b>; la designación <b>no depende<\/b> de que exista un proceso penal (NI R.6 párr. 4 d).","La obligación de congelar se activa con la <b>designación nacional (supra-)<\/b> (NI R.6 párr. 5).","Criterios (párr. 13 c): quien comete o intenta actos terroristas o participa o facilita su comisión; entidades suyas; y quien actúa en su nombre o bajo su dirección."],"ir":"#resoluciones","ir_texto":"Ver las resoluciones lado a lado"},{"etiqueta":"1540 (2004)","nombre":"No proliferación, fuera de la R.7","sub":"NI R.7, nota 23","verbo":"Aparte","orden":13,"panel":"Resolución 1540 (2004)","desc":"Sólo aparece en una nota de la NI R.7, entre instrumentos de no proliferación cuyas obligaciones existen con independencia de la R.7. Las SFD de la R.7 son otras.","puntos":["<b>NI R.7 párr. 2 y nota 23:<\/b> la R.7 no sustituye otras medidas u obligaciones para manejar fondos u otros activos en investigaciones o procesos, que exigen los tratados y las resoluciones de no proliferación; la nota 23 cita, por ejemplo, el TNP, el Convenio sobre Armas Biológicas y Tóxicas, el Convenio sobre las Armas Químicas y las resoluciones <b>1540 (2004)<\/b> y <b>2235 (2016)<\/b>.","«Esas obligaciones existen con independencia de las obligaciones definidas en la Recomendación 7 y su Nota Interpretativa.»","Las SFD de la R.7 se basan en la <b>1718 (2006)<\/b>, RPDC, y la <b>1737 (2006)<\/b>, Irán; la nota 22 enlista además las resoluciones relativas a cada caso.","La bibliografía no dice más de la 1540: su contenido no se enseña aquí."],"ir":"#resoluciones","ir_texto":"Ver las resoluciones lado a lado"}]},{"letra":"4","titulo":"¿Cómo califica?","pregunta":"Evaluaciones mutuas y calificaciones","ritmo":"¿Cómo me va?","corto":"Evaluación","color":"negro","items":[{"etiqueta":"Párr. 3 c)","nombre":"Evaluaciones mutuas","sub":"Revisiones entre pares","verbo":"Evalúo","orden":14,"panel":"Evaluaciones mutuas","desc":"El GAFI evalúa y supervisa a sus Miembros mediante revisiones entre pares y procesos de seguimiento. Las jurisdicciones Miembro se someten a ellas y el GAFI las publica.","puntos":["<b>Mandato párr. 3 c):<\/b> evaluar y supervisar a sus Miembros mediante «revisiones entre pares» («evaluaciones mutuas») y procesos de seguimiento, para determinar el grado de cumplimiento, implementación y efectividad.","Las <b>jurisdicciones Miembro<\/b> se comprometen a someterse a ellas; <b>las evaluaciones serán publicadas por el GAFI<\/b> (párr. 6 b).","Los <b>Miembros Asociados (FSRB)<\/b> las realizan en sus jurisdicciones y publican los resultados (párr. 12 b).","El <b>FMI y el Banco Mundial<\/b> también evalúan países con la metodología acordada, en el Programa de Evaluación del Sector Financiero (párr. 13 b).","El <b>Pleno<\/b> aprueba los informes elaborados por el GAFI (Mandato párr. 20 d)."],"ir":"#calificar","ir_texto":"Ver cómo se califica"},{"etiqueta":"Met. 42","nombre":"Cumplimiento técnico","sub":"Una calificación por Recomendación","verbo":"Califico","orden":15,"panel":"Calificaciones técnicas","desc":"Cada Recomendación recibe una de cuatro calificaciones según sus deficiencias: C, MC, PC o NC. En circunstancias excepcionales también podrá calificarse como No aplicable (N/A).","puntos":["<b>C · Cumplida:<\/b> no existe ni una deficiencia.","<b>MC · Mayoritariamente cumplida:<\/b> sólo deficiencias menores.","<b>PC · Parcialmente cumplida:<\/b> deficiencias moderadas.","<b>NC · No cumplida:<\/b> deficiencias importantes.","<b>N/A · No aplicable:<\/b> en circunstancias excepcionales podrá usarse; no se aplica ningún requisito por características estructurales, legales o institucionales del país."],"ir":"#calificar","ir_texto":"Ver las dos escalas"},{"etiqueta":"Met. 52·72","nombre":"Efectividad","sub":"Una calificación por Resultado Inmediato","verbo":"Mido","orden":16,"panel":"Calificaciones de efectividad","desc":"Se evalúan once Resultados Inmediatos; cada uno recibe nivel alto, sustancial, moderado o bajo de efectividad, según cuánto se ha logrado y cuánto falta por mejorar.","puntos":["Los evaluadores deben evaluar los <b>once Resultados Inmediatos<\/b> (párr. 52).","<b>Alto (A):<\/b> se ha logrado ampliamente; mejoras menores.","<b>Sustancial (S):<\/b> se ha logrado en buena medida; mejoras moderadas.","<b>Moderado (M):<\/b> se ha logrado hasta cierto grado; mejoras considerables.","<b>Bajo (B):<\/b> no se ha logrado o en grado insignificante; mejoras fundamentales (párr. 72)."],"ir":"#calificar","ir_texto":"Ver las dos escalas"}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por pieza"}},{"tipo":"escala","id":"organos","nav":"Órganos GAFI","titulo":"Quién decide, quién conduce, quién aconseja y quién ejecuta","intro":"Las cuatro estructuras internas del GAFI (Mandato párr. 17). Si alguna pregunta suena a «decidir», la respuesta es el Pleno.","etiqueta":"Mandato del GAFI 2012-2020","subtitulo":"Decide · Conduce · Aconseja · Ejecuta","niveles":[{"t":"Pleno · Decide","d":"Máximo órgano de decisión; por consenso. Designa Presidente, Vicepresidente y Grupo Directivo; aprueba estándares; admite miembros y observadores.","req":"Párrs. 19–20 · al menos 3 sesiones al año"},{"t":"Presidente · Conduce","d":"Convoca y preside Pleno y Grupo Directivo; supervisa a la Secretaría; es el portavoz. Lo asiste un Vicepresidente.","req":"Párrs. 31–36 · 1 año, 1-jul a 30-jun"},{"t":"Grupo Directivo · Aconseja","d":"Órgano consultor: asesora entre sesiones plenarias, guía el progreso y promueve la coordinación entre grupos de trabajo.","req":"Párrs. 37–42 · al menos 3 reuniones al año"},{"t":"Secretaría · Ejecuta","d":"Secretario Ejecutivo y personal; apoyan, administran recursos y registros según instrucciones del Presidente.","req":"Párrs. 43–47 · servicio de la OCDE, París"}],"memo":"<b>Gancho:<\/b> Decido · Conduzco · Aconsejo · Ejecuto. El Grupo Directivo y el Pleno se parecen (los preside el Presidente y se reúnen por lo menos tres veces al año), pero sólo el Pleno decide."},{"tipo":"tarjetas","id":"membresia","nav":"Membresía","titulo":"Quién participa en el GAFI","intro":"Cuatro círculos, con compromisos distintos. Sobre la entrada de Miembros Asociados y de observadores decide el Pleno.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Miembros","subtitulo":"Párrs. 5–8 · Anexo A","filas":[{"k":"Quiénes","v":"Jurisdicciones y organizaciones que acordaron trabajar juntas hacia los objetivos del Mandato. México está en el Anexo A."},{"k":"Jurisdicciones","v":"Respaldar e implementar las Recomendaciones; <b>someterse<\/b> a evaluaciones mutuas, que el GAFI publica."},{"k":"Organizaciones","v":"Respaldar y promover la implementación entre sus jurisdicciones; <b>apoyar<\/b> las evaluaciones mutuas."}]},{"encabezado":true,"color":"morado","titulo":"Miembros Asociados","subtitulo":"Párrs. 9–12 · Anexo B","filas":[{"k":"Quiénes","v":"Organismos regionales tipo GAFI (<b>FSRB<\/b>), designados por el GAFI."},{"k":"Quién decide","v":"El <b>Pleno<\/b> decide si un organismo califica como FSRB (párr. 11)."},{"k":"Compromisos","v":"Respaldar las Recomendaciones; realizar evaluaciones mutuas en sus jurisdicciones y publicarlas; participar en el desarrollo de los estándares."}]},{"encabezado":true,"color":"turquesa","titulo":"FMI y Banco Mundial","subtitulo":"Párr. 13","filas":[{"k":"Papel","v":"«Papel especial» por sus mandatos de estabilidad y desarrollo."},{"k":"Qué hacen","v":"Contribuyen a los estándares; evalúan países en el Programa de Evaluación del Sector Financiero con la metodología acordada; dan asistencia técnica."}]},{"encabezado":true,"color":"negro","titulo":"Observadores","subtitulo":"Párrs. 14–16 · Anexo C","filas":[{"k":"Ejemplos","v":"Naciones Unidas y Grupo Egmont (párr. 14); en el Anexo C también el Comité de Basilea."},{"k":"Quién decide","v":"El <b>Pleno<\/b>, que revisa periódicamente su elegibilidad (párr. 15)."},{"k":"Compromisos","v":"Respaldar las Recomendaciones y contribuir a la labor del GAFI según sus marcos jurídicos."}]}],"nota":"<b>Efecto legal:<\/b> el Mandato no está destinado a crear derechos u obligaciones legales (párr. 48). Vigencia: del 20 de abril de 2012 al 31 de diciembre de 2020 (párr. 49). Es la versión que cita el temario."},{"tipo":"tarjetas","id":"resoluciones","nav":"Resoluciones ONU","titulo":"Las resoluciones, lado a lado","intro":"Las cuatro primeras (1267, 1373, 1718 y 1737) sustentan sanciones financieras dirigidas: los países deben exigir que se congele <b>sin demora y sin previa notificación<\/b> y que no se pongan fondos a disposición de los designados (NI R.6 y NI R.7, párr. 6). Lo que cambia es el tema y quién designa. La <b>1540<\/b> va aparte: la fuente no la vincula con congelamientos ni designaciones.","tarjetas":[{"encabezado":true,"color":"turquesa","titulo":"1267 (1999)","subtitulo":"R.6 (i) · Terrorismo","filas":[{"k":"Tema","v":"Al-Qaida (sucesora 1989) y Talibán (1988)."},{"k":"Designa","v":"El <b>Consejo de Seguridad<\/b>: Comité 1267 y Comité 1988, Capítulo VII."},{"k":"El país","v":"Propone nombres al Comité; no designa."}]},{"encabezado":true,"color":"principal","titulo":"1373 (2001)","subtitulo":"R.6 (ii) · Terrorismo","filas":[{"k":"Tema","v":"Quien comete, intenta, participa o facilita actos terroristas, y sus entidades y agentes."},{"k":"Designa","v":"<b>El país<\/b>, nacional o supranacional, por iniciativa propia o a petición de otro país."},{"k":"Prueba","v":"«Motivos razonables» o «base razonable»; sin depender de proceso penal."}]},{"encabezado":true,"color":"morado","titulo":"1718 (2006)","subtitulo":"R.7 · Proliferación","filas":[{"k":"Tema","v":"RPDC: programas nucleares, otros de ADM y de misiles balísticos."},{"k":"Designa","v":"El <b>Consejo de Seguridad<\/b> en anexos de las resoluciones o el Comité de Sanciones 1718."}]},{"encabezado":true,"color":"coral","titulo":"1737 (2006)","subtitulo":"R.7 · Proliferación","filas":[{"k":"Tema","v":"Irán: actividades sensibles de proliferación nuclear o sistemas vectores. La nota 22 enlista además la 1747, la 1803 y la 1929."},{"k":"Designa","v":"El <b>Consejo de Seguridad<\/b> en anexos o el Comité de Sanciones 1737."}]},{"encabezado":true,"color":"negro","titulo":"1540 (2004)","subtitulo":"NI R.7, nota 23","filas":[{"k":"Tema","v":"No proliferación de armas de destrucción masiva."},{"k":"Relación con la R.7","v":"Sus obligaciones <b>existen con independencia<\/b> de la R.7 y su NI."},{"k":"Designa","v":"La fuente no la vincula a designaciones."}]}],"nota":"<b>Gancho:<\/b> 1267 = lista del mundo (la arma la ONU) · 1373 = lista de casa (la arma el país). Años en orden: 99 → 01. Para proliferación: Corea 1718, Irán 1737, ambas de 2006. La 1540 va aparte."},{"tipo":"tarjetas","id":"foros","nav":"No los cruces","titulo":"Basilea, Wolfsberg y Egmont: ¿quién está detrás?","intro":"Tres organismos que se confunden en el examen. Pregúntate quién se sienta a la mesa.","tarjetas":[{"barra":true,"color":"turquesa","titulo":"Basilea = supervisión bancaria","ref":"CNBV","html":"Organismo normativo internacional para la <b>regulación prudencial<\/b> de los bancos y foro de cooperación en <b>supervisión bancaria<\/b>."},{"barra":true,"color":"morado","titulo":"Wolfsberg = los bancos","ref":"CNBV","html":"<b>Asociación de bancos<\/b> que desarrolla <b>estándares<\/b> contra el FT, la corrupción y el lavado en instituciones financieras."},{"barra":true,"color":"principal","titulo":"Egmont = las UIF","ref":"CNBV · NI R.29 párr. 13","html":"Foro de las <b>unidades de inteligencia financiera<\/b> para cooperar. Emite la <b>Declaración de Objetivos<\/b> y los <b>Principios para el Intercambio de Información<\/b> entre UIF."}]},{"tipo":"tarjetas","id":"calificar","nav":"Calificaciones","titulo":"Dos calificaciones distintas","intro":"El cumplimiento técnico califica cada Recomendación; la efectividad califica cada Resultado Inmediato. No se mezclan sus escalas.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Cumplimiento técnico","subtitulo":"Metodología párr. 42 · por Recomendación","filas":[{"k":"C","v":"No existe ni una deficiencia."},{"k":"MC","v":"Sólo deficiencias menores."},{"k":"PC","v":"Deficiencias moderadas."},{"k":"NC","v":"Deficiencias importantes."},{"k":"N/A","v":"En circunstancias excepcionales podrá usarse: no se aplica ningún requisito."}]},{"encabezado":true,"color":"negro","titulo":"Efectividad","subtitulo":"Metodología párr. 72 · por Resultado Inmediato (11)","filas":[{"k":"Alto","v":"Logrado ampliamente; mejoras menores."},{"k":"Sustancial","v":"Logrado en buena medida; mejoras moderadas."},{"k":"Moderado","v":"Logrado hasta cierto grado; mejoras considerables."},{"k":"Bajo","v":"No logrado o insignificante; mejoras fundamentales."}]}],"nota":"<b>Ojo:<\/b> las palabras «menores · moderadas» aparecen en las dos escalas con sentidos distintos. MC = deficiencias menores; Alto = mejoras menores."},{"tipo":"cifras","id":"cifras","nav":"Fechas y cifras","titulo":"Fechas y cifras que preguntan","intro":"Cada número con su fuente.","cifras":[["1989","año","Se establece el GAFI (Mandato: «por los Ministerios y sus jurisdicciones Miembro»; CNBV histórico: por el G-7)","Mandato párr. 1"],["1990","año","Las 40 Recomendaciones originales, contra el lavado del tráfico ilícito de drogas","Introducción Rec. GAFI"],["2001","año","El GAFI amplía su mandato al FT; 8 Recomendaciones Especiales (la 9ª llega en 2004)","Introducción Rec. GAFI; CNBV histórico"],["2008","año","El mandato se amplía al financiamiento de la proliferación de ADM","Introducción Rec. GAFI"],["2012","año","Recomendaciones revisadas (16-feb) y Mandato en vigor (20-abr)","CNBV histórico; Mandato párr. 49"],["31-dic-2020","vigencia","Fin de vigencia del Mandato 2012-2020","Mandato párr. 49"],["3","al año","Sesiones Plenarias como mínimo, normalmente en febrero, junio y octubre","Mandato párr. 24"],["3","al año","Reuniones del Grupo Directivo como mínimo","Mandato párr. 41"],["1","año","Periodo del Presidente: del 1 de julio al 30 de junio","Mandato párr. 31"],["4 + N/A","calificaciones","Cumplimiento técnico: C, MC, PC, NC; en circunstancias excepcionales podrá calificarse N/A","Metodología párr. 42"],["11","Resultados Inmediatos","Base de la evaluación de efectividad","Metodología párr. 52"],["4","niveles","Efectividad: alto, sustancial, moderado y bajo","Metodología párr. 72"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"o_org":"Organismos y foros internacionales","o_gafi":"GAFI: mandato, órganos, membresía y evaluación","o_onu":"Resoluciones de la ONU y sanciones financieras dirigidas"},"modos":[{"k":"org","l":"Organismos","tema":"o_org"},{"k":"gafi","l":"El GAFI","tema":"o_gafi"},{"k":"onu","l":"Resoluciones ONU","tema":"o_onu"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Fechas y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"O001","tema":"o_org","tipo":"memoria","q":"«Es el principal organismo normativo internacional para la regulación prudencial de los bancos y constituye un foro de cooperación en materia de supervisión bancaria.» Según la CNBV, ¿a qué organismo corresponde esta definición?","a":"Comité de Supervisión Bancaria de Basilea","o":["Grupo Wolfsberg, asociación reunida para desarrollar estándares","Comité de Supervisión Bancaria de Basilea","Grupo Egmont de Unidades de Inteligencia Financiera","Grupo de Acción Financiera Internacional (GAFI)"],"x":"Las palabras clave son «regulación prudencial de los bancos» y «supervisión bancaria»: así define la CNBV al Comité de Basilea. Wolfsberg también se relaciona con bancos, pero la CNBV lo define como una asociación de bancos que desarrolla estándares contra el FT, la corrupción y el lavado, no como organismo normativo prudencial.","ref":"CNBV, Organismos Internacionales"},{"id":"O002","tema":"o_org","tipo":"memoria","q":"«Es una asociación de bancos reunidos con la finalidad de desarrollar estándares para la lucha contra el financiamiento del terrorismo, la corrupción y el lavado de dinero en instituciones financieras.» Según la CNBV, ¿a qué organismo corresponde?","a":"Grupo Wolfsberg","o":["Comité de Supervisión Bancaria de Basilea","Grupo Egmont de Unidades de Inteligencia Financiera","Grupo de Acción Financiera de Latinoamérica (GAFILAT)","Grupo Wolfsberg"],"x":"«Asociación de bancos» es la marca del Grupo Wolfsberg: es el único de los seis organismos que la CNBV define así. Basilea es un organismo normativo para la regulación prudencial de los bancos (piensa en supervisores, no en bancos asociados).","ref":"CNBV, Organismos Internacionales"},{"id":"O003","tema":"o_org","tipo":"memoria","q":"Completa la definición de la CNBV del Grupo Egmont: «Es un foro para que las unidades de inteligencia financiera alrededor del mundo mejoren sus ______ en la lucha contra el lavado de dinero y el financiamiento al terrorismo.»","a":"vínculos de cooperación","o":["vínculos de cooperación","mecanismos de supervisión prudencial","estándares de debida diligencia bancaria","procesos de evaluación mutua entre pares"],"x":"La redacción exacta es «mejoren sus vínculos de cooperación». La supervisión prudencial corresponde a la definición de Basilea; las evaluaciones mutuas («revisiones entre pares») son tarea del GAFI según su Mandato, no del Grupo Egmont.","ref":"CNBV, Organismos Internacionales"},{"id":"O004","tema":"o_org","tipo":"memoria","q":"Completa la definición de la CNBV del GAFILAT: «Es una organización intergubernamental ______ para prevenir y combatir el lavado de activos, el financiamiento del terrorismo y el financiamiento de la proliferación de armas de destrucción masiva.»","a":"regional","o":["mundial","regional","de unidades de inteligencia","sudamericana"],"x":"La palabra exacta es «regional», y es la que separa al GAFILAT del GAFI, que la CNBV define como «entidad intergubernamental» sin calificativo regional. «Sudamericana» no aparece en la definición de la CNBV.","ref":"CNBV, Organismos Internacionales"},{"id":"O005","tema":"o_org","tipo":"caso","q":"La unidad de inteligencia financiera de un país quiere estrechar su cooperación con las UIF de otros países en la lucha contra el lavado de dinero y el financiamiento al terrorismo. Según la definición de la CNBV, ¿qué foro existe precisamente para ello?","a":"Grupo Egmont","o":["Comité de Supervisión Bancaria de Basilea","Grupo Wolfsberg","Grupo Egmont","Organización de las Naciones Unidas"],"x":"La CNBV define al Grupo Egmont como el foro para que las UIF de todo el mundo mejoren sus vínculos de cooperación. Gancho: Egmont = las UIF. Basilea reúne la supervisión bancaria y Wolfsberg es una asociación de bancos.","ref":"CNBV, Organismos Internacionales"},{"id":"O006","tema":"o_org","tipo":"caso","q":"Varios bancos internacionales se reúnen para desarrollar estándares contra el financiamiento del terrorismo, la corrupción y el lavado de dinero en instituciones financieras. ¿Qué organismo de los que cita la CNBV responde a esa descripción?","a":"Grupo Wolfsberg","o":["Grupo Wolfsberg","Grupo Egmont","Comité de Supervisión Bancaria de Basilea","Grupo de Acción Financiera de Latinoamérica"],"x":"Quien se sienta a la mesa son los bancos: eso es Wolfsberg, «una asociación de bancos». Además, su definición es la única que menciona la corrupción. Basilea es un organismo normativo para la regulación prudencial, no una asociación de bancos.","ref":"CNBV, Organismos Internacionales"},{"id":"O007","tema":"o_org","tipo":"caso","q":"El área de supervisión de una autoridad financiera busca el foro de cooperación en materia de supervisión bancaria que, según la CNBV, es además el principal organismo normativo para la regulación prudencial de los bancos. ¿Cuál es?","a":"Comité de Supervisión Bancaria de Basilea","o":["Grupo Wolfsberg","Grupo Egmont","Grupo de Acción Financiera de Latinoamérica","Comité de Supervisión Bancaria de Basilea"],"x":"Regulación prudencial y supervisión bancaria son las dos ideas de la definición del Comité de Basilea. Wolfsberg, en cambio, es una asociación de bancos que desarrolla estándares; Egmont es el foro de las UIF.","ref":"CNBV, Organismos Internacionales"},{"id":"O008","tema":"o_org","tipo":"memoria","q":"«...cuyos objetivos son fijar estándares y promover la efectiva implementación de medidas legales, regulatorias y operativas...» Según la CNBV, ¿a qué organismo pertenece este fragmento?","a":"Grupo de Acción Financiera Internacional","o":["Grupo de Acción Financiera de Latinoamérica","Grupo de Acción Financiera Internacional","Comité de Supervisión Bancaria de Basilea","Grupo Wolfsberg"],"x":"Es la definición de la CNBV del GAFI, que coincide con el objetivo del párr. 2 de su Mandato. El GAFILAT es el distractor tentador, pero su definición habla de una organización intergubernamental regional «para prevenir y combatir», no de «fijar estándares».","ref":"CNBV, Organismos Internacionales; Mandato párr. 2"},{"id":"O009","tema":"o_org","tipo":"trampa","q":"De las seis definiciones de la CNBV, ¿cuál nombra expresamente el financiamiento de la proliferación de armas de destrucción masiva?","a":"La del Grupo de Acción Financiera de Latinoamérica","o":["La del Grupo de Acción Financiera Internacional (GAFI)","La del Grupo de Acción Financiera de Latinoamérica","La del Grupo Egmont","La del Grupo Wolfsberg"],"x":"Trampa clásica: en la página de la CNBV, la definición del GAFILAT termina en «el financiamiento de la proliferación de armas de destrucción masiva», mientras que la del GAFI termina en «y otras amenazas». No se trata de cuál organismo combate la proliferación, sino de qué dice literalmente cada definición.","ref":"CNBV, Organismos Internacionales"},{"id":"O010","tema":"o_org","tipo":"memoria","q":"¿Cuál es la única definición de la CNBV, entre los seis organismos internacionales, que menciona la corrupción?","a":"La del Grupo Wolfsberg","o":["La del Grupo Egmont","La de la Organización de las Naciones Unidas","La del Grupo Wolfsberg","La del Comité de Supervisión Bancaria de Basilea"],"x":"Wolfsberg desarrolla estándares para la lucha contra «el financiamiento del terrorismo, la corrupción y el lavado de dinero en instituciones financieras». La ONU menciona la paz, la seguridad, los derechos humanos, el desarme y el terrorismo, pero no la corrupción.","ref":"CNBV, Organismos Internacionales"},{"id":"O011","tema":"o_org","tipo":"memoria","q":"Completa la definición de la CNBV de la ONU: «Es un foro para que sus miembros puedan tomar medidas sobre los problemas que enfrenta la humanidad, como ______, los derechos humanos, el desarme, el terrorismo y mucho más.»","a":"la paz y la seguridad","o":["la estabilidad financiera internacional","la regulación prudencial de los bancos","la integridad del sistema financiero","la paz y la seguridad"],"x":"La redacción exacta es «la paz y la seguridad». La regulación prudencial pertenece a la definición de Basilea y la «integridad del sistema financiero internacional» aparece en el objetivo del GAFI (Mandato párr. 2), no en la definición de la ONU.","ref":"CNBV, Organismos Internacionales"},{"id":"O012","tema":"o_org","tipo":"caso","q":"Una oficial de cumplimiento prepara una lámina y debe describir al GAFILAT con la palabra que, en la definición de la CNBV, lo distingue del GAFI. ¿Qué palabra debe usar?","a":"Regional","o":["Regional","Supervisor","Bancario","Consultivo"],"x":"La CNBV define al GAFILAT como «organización intergubernamental regional». Al GAFI lo define como «entidad intergubernamental», sin el adjetivo regional. Ninguna de las dos definiciones usa supervisor, bancario o consultivo.","ref":"CNBV, Organismos Internacionales"},{"id":"O013","tema":"o_org","tipo":"memoria","q":"Según el Mandato 2012-2020 (párr. 14), ¿qué organismos se mencionan expresamente como ejemplos de quienes trabajan en estrecha colaboración con el GAFI y participan como observadores?","a":"Las Naciones Unidas y el Grupo Egmont","o":["El Fondo Monetario Internacional y el Banco Mundial","Las Naciones Unidas y el Grupo Egmont","El Grupo Wolfsberg y el Comité de Basilea","Los organismos regionales tipo GAFI (FSRB)"],"x":"El párr. 14 nombra a las Naciones Unidas y al Grupo Egmont de UIF como observadores. El FMI y el Banco Mundial tienen su propio párrafo (13), con un «papel especial»; los FSRB son Miembros Asociados (párr. 9). Wolfsberg no aparece en el Mandato.","ref":"Mandato párr. 14"},{"id":"O014","tema":"o_org","tipo":"caso","q":"Un país revisa si su UIF cumple la Nota Interpretativa de la R.29 en lo relativo al Grupo Egmont. Además de tomar en cuenta sus documentos, ¿qué debe hacer la UIF?","a":"Solicitar la membresía del Grupo Egmont","o":["Esperar a que el Pleno del GAFI la designe observadora","Obtener autorización del Comité de Basilea para intercambiar información","Solicitar la membresía del Grupo Egmont","Adherirse como asociada al Grupo Wolfsberg de bancos"],"x":"La NI R.29 párr. 13 termina: «La UIF debe solicitar la Membresía del Grupo Egmont». La condición de observador del GAFI es para organismos (Mandato párr. 15), no para una UIF nacional, y Basilea no autoriza intercambios entre UIF.","ref":"NI R.29 párr. 13"},{"id":"O015","tema":"o_org","tipo":"memoria","q":"Según la NI R.29 párr. 13, ¿qué documentos del Grupo Egmont deben asegurar los países que la UIF tome en cuenta?","a":"Su Declaración de Objetivos y sus Principios para el Intercambio de Información entre UIF","o":["Su Declaración de Objetivos y sus Principios para el Intercambio de Información entre UIF","Su Mandato de Objetivos y su Metodología de Evaluación Mutua entre unidades de inteligencia financiera","Sus Estándares de Debida Diligencia y sus Principios de Banca Corresponsal elaborados con bancos privados","Su Declaración de Principios Prudenciales y su Guía de Supervisión Bancaria aplicable a las UIF"],"x":"Son dos: la Declaración de Objetivos y los Principios para el Intercambio de Información entre las UIF para casos de lavado de activos y FT. Según la nota, establecen una guía sobre el papel y funciones de las UIF y los mecanismos de intercambio. Mandato y Metodología son documentos del GAFI, no de Egmont.","ref":"NI R.29 párr. 13"},{"id":"O016","tema":"o_org","tipo":"memoria","q":"¿Cuál de los siguientes organismos figura en el Anexo C (Observadores) del Mandato 2012-2020?","a":"Comité de Supervisión Bancaria de Basilea","o":["Grupo Wolfsberg","Comité de Supervisión Bancaria de Basilea","Grupo de Acción Financiera de Sudamérica (GAFISUD)","Los organismos regionales tipo GAFI (FSRB) en conjunto"],"x":"El Anexo C enlista al Comité de Supervisión Bancaria de Basilea (BCBS) como observador, junto con el Grupo Egmont y Naciones Unidas, entre otros. GAFISUD aparece en el Anexo B, como Miembro Asociado (FSRB), y Wolfsberg no figura en ningún anexo.","ref":"Mandato, Anexos B y C"},{"id":"O017","tema":"o_org","tipo":"caso","q":"En una sesión abierta del Pleno del GAFI participa un representante del Grupo Egmont. Según el Mandato 2012-2020, ¿con qué calidad participa Egmont en la labor del GAFI?","a":"Como observador","o":["Como observador","Como Miembro Asociado (FSRB)","Como organización Miembro listada en el Anexo A","Como invitado ad hoc de una jurisdicción no Miembro"],"x":"El párr. 14 dice que las Naciones Unidas y el Grupo Egmont «participan como observadores» en la labor del GAFI, y Egmont figura en el Anexo C. Los Miembros Asociados son organismos regionales tipo GAFI; las invitaciones ad hoc son para jurisdicciones no Miembro (párr. 23).","ref":"Mandato párr. 14 y Anexo C"},{"id":"O018","tema":"o_org","tipo":"memoria","q":"Según la CNBV, ¿qué es el Grupo de Acción Financiera Internacional?","a":"Una entidad intergubernamental","o":["Una organización intergubernamental regional","Un foro de unidades de inteligencia financiera","Una asociación de bancos internacionales","Una entidad intergubernamental"],"x":"La CNBV lo define como «una entidad intergubernamental», lo mismo que el párr. 1 del Mandato. «Organización intergubernamental regional» es la definición del GAFILAT; el foro de UIF es Egmont y la asociación de bancos es Wolfsberg.","ref":"CNBV, Organismos Internacionales; Mandato párr. 1"},{"id":"O019","tema":"o_org","tipo":"trampa","q":"La CNBV usa la palabra «foro» en las definiciones de la ONU, del Comité de Basilea y del Grupo Egmont. ¿Quiénes integran el foro del Grupo Egmont según su definición?","a":"Las unidades de inteligencia financiera","o":["Los supervisores bancarios de cada país","Las unidades de inteligencia financiera","Los bancos privados asociados","Los Estados y sus ministerios"],"x":"El foro del Grupo Egmont es para que «las unidades de inteligencia financiera alrededor del mundo» mejoren sus vínculos de cooperación. La trampa es la palabra «foro»: la ONU es un foro «para que sus miembros» tomen medidas, y Basilea es un «foro de cooperación en materia de supervisión bancaria». Los bancos asociados corresponden a Wolfsberg.","ref":"CNBV, Organismos Internacionales"},{"id":"O020","tema":"o_org","tipo":"caso","q":"En un simulacro aparece este fragmento: «...para combatir el lavado de activos, el financiamiento del terrorismo y otras amenazas.» Un participante debe identificar, según la CNBV, de qué organismo es la definición. ¿Cuál es?","a":"Grupo de Acción Financiera Internacional","o":["Grupo de Acción Financiera Internacional","Grupo de Acción Financiera de Latinoamérica","Grupo Egmont","Organización de las Naciones Unidas"],"x":"La definición de la CNBV del GAFI termina en «y otras amenazas». La del GAFILAT termina con el financiamiento de la proliferación de armas de destrucción masiva y usa «prevenir y combatir». Ese final es la pista para no confundirlos.","ref":"CNBV, Organismos Internacionales"},{"id":"O021","tema":"o_gafi","tipo":"memoria","q":"Completa el párr. 1 del Mandato del GAFI 2012-2020: «El Grupo de Acción Financiera Internacional (GAFI) es una entidad intergubernamental establecida en 1989 por ______.»","a":"los Ministerios y sus jurisdicciones Miembro","o":["el Consejo de Seguridad de las Naciones Unidas","el Fondo Monetario Internacional y el Banco Mundial","los Ministerios y sus jurisdicciones Miembro","la OCDE, desde su sede en París"],"x":"Según el Mandato, el GAFI fue establecido «por los Ministerios y sus jurisdicciones Miembro». El texto histórico de la CNBV dice que lo creó el G-7: si la pregunta cita el Mandato, la respuesta es la del Mandato. La OCDE sólo presta el servicio de la Secretaría (párr. 46).","ref":"Mandato párr. 1"},{"id":"O022","tema":"o_gafi","tipo":"cifra","q":"Según el Mandato 2012-2020, ¿en qué año se estableció el GAFI?","a":"1989","o":["1990","1989","2001","1996"],"x":"El párr. 1 del Mandato dice «establecida en 1989». 1990 es el año de las 40 Recomendaciones originales, 1996 el de su primera revisión y 2001 el de la ampliación del mandato al financiamiento del terrorismo.","ref":"Mandato párr. 1"},{"id":"O023","tema":"o_gafi","tipo":"trampa","q":"Según el texto histórico de la CNBV «Qué es GAFI», ¿quién creó el GAFI en 1989?","a":"El Grupo de los Siete (G-7)","o":["El G-20","El Consejo de Seguridad de la ONU","La OCDE","El Grupo de los Siete (G-7)"],"x":"El texto histórico de la CNBV dice que el GAFI «fue creado en 1989 por el Grupo de los Siete G-7». Ojo: el Mandato 2012-2020 dice que fue establecido «por los Ministerios y sus jurisdicciones Miembro». Responde según la fuente que cite la pregunta. El G-20 aparece en el Mandato párr. 3 f) como parte de la comunidad internacional, no como creador.","ref":"CNBV, «Qué es GAFI» (histórico)"},{"id":"O024","tema":"o_gafi","tipo":"memoria","q":"Completa el objetivo del GAFI según el párr. 2 del Mandato: «fijar estándares y promover la efectiva implementación de medidas legales, regulatorias y operativas para combatir el lavado de activos, el financiamiento del terrorismo y otras amenazas relacionadas con ______.»","a":"la integridad del sistema financiero internacional","o":["la integridad del sistema financiero internacional","la paz y la seguridad de la comunidad internacional","la estabilidad y el desarrollo financiero y económico","la proliferación de armas de destrucción masiva"],"x":"La redacción exacta es «la integridad del sistema financiero internacional». La «estabilidad y el desarrollo financiero y económico» es el mandato del FMI y el Banco Mundial (párr. 13); la paz y la seguridad aparecen en la definición de la CNBV de la ONU.","ref":"Mandato párr. 2"},{"id":"O025","tema":"o_gafi","tipo":"caso","q":"Una jurisdicción Miembro del GAFI recibe a un equipo de evaluadores para su revisión entre pares. Según el Mandato 2012-2020, ¿qué compromiso asumió esa jurisdicción?","a":"Someterse a las evaluaciones mutuas, que el GAFI publicará","o":["Sólo apoyar las evaluaciones mutuas de sus jurisdicciones miembro, sin someterse a ellas","Someterse a las evaluaciones mutuas, que el GAFI publicará","Realizar ella misma las evaluaciones mutuas en su territorio y publicar los resultados","Someterse a la evaluación sólo cuando el FMI la incluya en su Programa de Evaluación"],"x":"Párr. 6 b): las jurisdicciones Miembro se comprometen a «someterse y participar activamente de forma sistemática» en las evaluaciones mutuas, y «las evaluaciones serán publicadas por el GAFI». Apoyarlas sin someterse es el compromiso de las organizaciones Miembro (párr. 7 b); realizarlas y publicarlas en sus jurisdicciones es de los Miembros Asociados (párr. 12 b).","ref":"Mandato párr. 6 b)"},{"id":"O026","tema":"o_gafi","tipo":"caso","q":"Una organización (no una jurisdicción) es Miembro del GAFI. Según el Mandato 2012-2020, ¿qué compromiso tiene respecto de las evaluaciones mutuas?","a":"Apoyarlas de forma sistemática con la metodología acordada","o":["Someterse a ellas y aceptar que el GAFI las publique","Decidir por consenso qué jurisdicciones se evalúan cada año","Apoyarlas de forma sistemática con la metodología acordada","Realizarlas en el Programa de Evaluación del Sector Financiero"],"x":"Párr. 7 b): las organizaciones Miembro se comprometen a «apoyar de forma sistemática» las evaluaciones mutuas y procesos de seguimiento. Someterse a ellas es el compromiso de las jurisdicciones Miembro (párr. 6 b); el Programa de Evaluación del Sector Financiero es del FMI y el Banco Mundial (párr. 13 b).","ref":"Mandato párr. 7 b)"},{"id":"O027","tema":"o_gafi","tipo":"caso","q":"Un organismo regional solicita que se le reconozca como organismo regional tipo GAFI (FSRB) para participar como Miembro Asociado. Según el Mandato 2012-2020, ¿quién toma esa decisión?","a":"El Pleno del GAFI","o":["El Pleno del GAFI","El Grupo Directivo, a propuesta del Presidente","El Presidente, previa consulta con los Miembros","El Secretario Ejecutivo, con el apoyo de la OCDE"],"x":"Párr. 11: la decisión de si un organismo califica como FSRB, y por tanto es elegible como Miembro Asociado, «se toma por el Pleno del GAFI». También el párr. 20 e) lo confirma: el Pleno decide sobre el estatus de los FSRB. El Grupo Directivo sólo aconseja.","ref":"Mandato párrs. 11 y 20 e)"},{"id":"O028","tema":"o_gafi","tipo":"memoria","q":"Según el Mandato 2012-2020 (párr. 9), ¿qué son los Miembros Asociados del GAFI?","a":"Organismos regionales tipo GAFI (FSRB) designados por el GAFI","o":["Instituciones financieras internacionales con un papel especial","Organismos internacionales que participan como observadores","Jurisdicciones no Miembro invitadas ad hoc por el Presidente","Organismos regionales tipo GAFI (FSRB) designados por el GAFI"],"x":"Párr. 9: «Los Miembros Asociados son organismos regionales tipo GAFI (FSRBs), designados por el GAFI, que participan en la labor del GAFI». El «papel especial» es del FMI y el Banco Mundial (párr. 13); los observadores son otros organismos internacionales (párr. 14).","ref":"Mandato párr. 9"},{"id":"O029","tema":"o_gafi","tipo":"caso","q":"Un país es evaluado por el FMI con la metodología acordada, en el contexto del Programa de Evaluación del Sector Financiero. Según el Mandato 2012-2020, ¿cómo se describe el papel del FMI y del Banco Mundial?","a":"Instituciones financieras internacionales con un papel especial","o":["Organismos regionales tipo GAFI (FSRB) con evaluación propia","Organizaciones Miembro del GAFI listadas en el Anexo A","Instituciones financieras internacionales con un papel especial","Jurisdicciones no Miembro invitadas ad hoc a las Sesiones Plenarias"],"x":"El Mandato los coloca bajo «Instituciones financieras internacionales» y dice que juegan «un papel especial» por sus mandatos de promover la estabilidad y el desarrollo financiero y económico (párr. 13); ayudan a la implementación mediante evaluaciones en el Programa de Evaluación del Sector Financiero (párr. 13 b). No son FSRB ni figuran en el Anexo A.","ref":"Mandato párr. 13"},{"id":"O030","tema":"o_gafi","tipo":"caso","q":"Entre una Sesión Plenaria y la siguiente, un órgano del GAFI proporciona asesoría para apoyar al Presidente y llevar adelante las instrucciones del GAFI. ¿Qué órgano es?","a":"El Grupo Directivo","o":["El Pleno","El Grupo Directivo","La Secretaría","El Vicepresidente"],"x":"Párr. 40: «El Grupo Directivo proporciona asesoría entre las Sesiones Plenarias para apoyar al Presidente». Es un órgano consultor (párr. 37). El Pleno decide; la Secretaría ejecuta según instrucciones del Presidente.","ref":"Mandato párrs. 37 y 40"},{"id":"O031","tema":"o_gafi","tipo":"caso","q":"El GAFI elaboró un nuevo estándar y una guía que deben aprobarse. Según el Mandato 2012-2020, ¿qué órgano los aprueba?","a":"El Pleno, por consenso","o":["El Pleno, por consenso","El Grupo Directivo, entre sesiones plenarias","El Presidente, como principal portavoz del GAFI","La Secretaría, con el servicio de la OCDE"],"x":"Párr. 20 d): el Pleno «aprueba estándares, guías e informe elaborados por el GAFI», y sus decisiones se toman por consenso (párr. 19). Si suena a decidir o aprobar, es el Pleno; el Grupo Directivo sólo asesora.","ref":"Mandato párrs. 19 y 20 d)"},{"id":"O032","tema":"o_gafi","tipo":"memoria","q":"«Es el máximo órgano de decisión del GAFI. Sus decisiones se toman por consenso.» Según el Mandato 2012-2020, ¿a qué estructura interna se refiere?","a":"El Pleno","o":["El Grupo Directivo","La Secretaría","El Presidente","El Pleno"],"x":"Es el párr. 19, sobre el Pleno. El Grupo Directivo se parece porque también lo preside el Presidente y se reúne por lo menos tres veces al año, pero es «un órgano consultor» (párr. 37), no el que decide.","ref":"Mandato párr. 19"},{"id":"O033","tema":"o_gafi","tipo":"memoria","q":"«...es un órgano consultor y es presidido por el Presidente.» Según el Mandato 2012-2020, ¿a qué estructura interna del GAFI corresponde este fragmento?","a":"El Grupo Directivo","o":["El Pleno","La Secretaría","El Grupo Directivo","El Grupo de Revisión de Cooperación Internacional"],"x":"Es el párr. 37: «El Grupo Directivo del GAFI es un órgano consultor y es presidido por el Presidente». El Pleno también lo preside el Presidente (párr. 21), pero es el máximo órgano de decisión. Los grupos de trabajo tienen presidentes propios designados por el Pleno (párr. 27).","ref":"Mandato párr. 37"},{"id":"O034","tema":"o_gafi","tipo":"memoria","q":"Completa el párr. 19 del Mandato 2012-2020: «El Pleno es el ______ del GAFI. Sus decisiones se toman por ______.»","a":"máximo órgano de decisión / consenso","o":["órgano consultor / consenso","máximo órgano de decisión / consenso","máximo órgano de decisión / mayoría calificada","órgano ejecutivo / mayoría simple de los Miembros"],"x":"La redacción exacta es «máximo órgano de decisión» y «consenso». «Órgano consultor» es como el Mandato define al Grupo Directivo (párr. 37). El Mandato no prevé votaciones por mayoría para el Pleno.","ref":"Mandato párr. 19"},{"id":"O035","tema":"o_gafi","tipo":"memoria","q":"Según el Mandato 2012-2020, la composición de cierta estructura del GAFI «se decide por el Pleno a propuesta del Presidente [...] teniendo en cuenta una representación equilibrada en términos de regiones geográficas» y «se revisa de forma anual». ¿De qué estructura se trata?","a":"El Grupo Directivo","o":["El Grupo Directivo","La Secretaría","Los grupos de trabajo","El Pleno"],"x":"Párrs. 38 y 39: la composición del Grupo Directivo la decide el Pleno a propuesta del Presidente, con representación geográfica equilibrada, y se revisa cada año. El Pleno consta de jurisdicciones Miembro y organizaciones (párr. 18). La participación en grupos de trabajo está abierta a todos los Miembros, Miembros Asociados, el FMI, el Banco Mundial y los observadores (párr. 28).","ref":"Mandato párrs. 38-39"},{"id":"O036","tema":"o_gafi","tipo":"caso","q":"Hay que administrar los recursos financieros, materiales y humanos asignados al GAFI, mantener sus registros y ocuparse de su correspondencia. Según el Mandato 2012-2020, ¿a quién corresponden estas responsabilidades?","a":"A la Secretaría","o":["Al Grupo Directivo","Al Pleno","A la Secretaría","Al Vicepresidente"],"x":"Párr. 45 d) y e): administrar recursos y mantener registros, páginas web y correspondencia son responsabilidades de la Secretaría, que actúa según las instrucciones del Presidente (párr. 44). El Grupo Directivo supervisa y guía el progreso de la labor (párr. 42), lo que es distinto de administrar.","ref":"Mandato párrs. 44-45"},{"id":"O037","tema":"o_gafi","tipo":"memoria","q":"Según el Mandato 2012-2020, ¿quién nombra al Secretario Ejecutivo del GAFI?","a":"El Pleno, a propuesta del Presidente","o":["El Presidente, previa consulta con el Grupo Directivo","El Pleno, a propuesta del Presidente","La OCDE, que presta el servicio de la Secretaría","El Grupo Directivo, con representación geográfica equilibrada"],"x":"Párr. 43: el Secretario Ejecutivo «es nombrado por el Pleno a propuesta del Presidente». El Presidente propone y dirige al Secretario Ejecutivo (párr. 44), pero no lo nombra; la OCDE sólo proporciona el servicio de la Secretaría (párr. 46).","ref":"Mandato párrs. 43-44"},{"id":"O038","tema":"o_gafi","tipo":"memoria","q":"Según el Mandato 2012-2020, ¿dónde está ubicada la Secretaría del GAFI?","a":"En la sede de la OCDE en París","o":["En la sede de las Naciones Unidas en Nueva York","En Washington, D.C., donde se firmó el Mandato","En la sede del Banco Mundial","En la sede de la OCDE en París"],"x":"Párr. 46: «El servicio de la Secretaría es proporcionado por la OECD, y la Secretaría está ubicada en la Sede de la OECD en París». Washington, D.C. es el lugar donde se fechó el Mandato (20 de abril de 2012), no la sede de la Secretaría.","ref":"Mandato párr. 46"},{"id":"O039","tema":"o_gafi","tipo":"caso","q":"El Pleno nombra Presidente del GAFI a un representante de una jurisdicción Miembro. Según el Mandato 2012-2020, ¿cuál es su periodo?","a":"Un año, del 1 de julio al 30 de junio del año siguiente","o":["Un año, del 1 de julio al 30 de junio del año siguiente","Un año calendario, del 1 de enero al 31 de diciembre siguiente","Dos años, del 20 de abril al 19 de abril del segundo año","De febrero a octubre, entre la primera y la última plenaria"],"x":"Párr. 31: el Presidente es nombrado por el Pleno de entre sus Miembros «por el término de un año»; su periodo «inicia el 1 de julio y termina el 30 de junio del año siguiente». El 20 de abril es la fecha de entrada en vigor del Mandato (párr. 49).","ref":"Mandato párr. 31"},{"id":"O040","tema":"o_gafi","tipo":"caso","q":"Una persona acaba de ser nombrada Vicepresidente del GAFI. Según el Mandato 2012-2020, ¿qué implica ese nombramiento?","a":"Es también el Presidente designado, por el año previo a su presidencia","o":["Preside de forma permanente el Grupo Directivo, mientras el Presidente conduce el Pleno","Dirige al Secretario Ejecutivo conforme a las indicaciones que le dé el Pleno","Es también el Presidente designado, por el año previo a su presidencia","Lo nombra el Grupo Directivo por dos años y supervisa a la Secretaría"],"x":"Párr. 35: el Vicepresidente «es también el Presidente designado» y es nombrado por el Pleno por el año que precede a su periodo presidencial; apoya al Presidente y lo suple cuando sea necesario (párr. 36). Presidir el Grupo Directivo, dirigir al Secretario Ejecutivo y supervisar a la Secretaría son funciones del Presidente (párrs. 32 y 44).","ref":"Mandato párrs. 35-36"},{"id":"O041","tema":"o_gafi","tipo":"cifra","q":"Completa el párr. 24 del Mandato 2012-2020: «El Presidente convoca por lo menos a ______ Sesiones Plenarias cada año calendario...»","a":"tres","o":["dos","tres","cuatro","seis"],"x":"Por lo menos tres Sesiones Plenarias al año, normalmente en febrero, junio y octubre. Además, pueden convocarse reuniones extraordinarias cuando las circunstancias lo requieran (párr. 25). El Grupo Directivo también tiene un mínimo de tres reuniones al año (párr. 41).","ref":"Mandato párr. 24"},{"id":"O042","tema":"o_gafi","tipo":"trampa","q":"Un compañero afirma: «El Mandato obliga a celebrar las Sesiones Plenarias en febrero, junio y octubre». ¿Qué dice exactamente el párr. 24?","a":"Por lo menos tres sesiones cada año calendario, normalmente en febrero, junio y octubre","o":["Exactamente tres sesiones cada año calendario, obligatoriamente en febrero, junio y octubre","Por lo menos tres sesiones cada año calendario, normalmente en febrero, junio y octubre","Por lo menos dos sesiones cada año calendario, normalmente en enero y en julio","Las sesiones que acuerde el Grupo Directivo, sin un número mínimo anual"],"x":"La trampa está en los matices: «por lo menos» tres (no exactamente) y «normalmente» en febrero, junio y octubre (no obligatoriamente). Además pueden convocarse sesiones extraordinarias (párr. 25). Quien convoca es el Presidente, no el Grupo Directivo.","ref":"Mandato párrs. 24-25"}
