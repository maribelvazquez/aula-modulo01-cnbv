iarios, Transmisores de dinero y Sociedades financieras de objeto múltiple no reguladas a que se refiere la presente fracción, así como realizar los demás actos necesarios para el ejercicio de esta atribución."],"conteo":""},{"etiqueta":"III","nombre":"Opinar a la SHCP","verbo":"Opinan","gancho":"Sobre las DCG que expide la SHCP","puntos":["<b>Fr. III.<\/b> Emitir opinión a la Secretaría de Hacienda y Crédito Público, respecto de las disposiciones de carácter general que expida en materia de prevención, detección y reporte de actos, omisiones u operaciones que pudiesen ubicarse en los supuestos de los artículos 139 Quáter o 400 Bis del Código Penal Federal."],"conteo":""},{"etiqueta":"VI","nombre":"Lineamientos y guías","verbo":"Orientan","gancho":"Sin perjuicio de la competencia de la SHCP","puntos":["<b>Fr. VI.<\/b> Emitir lineamientos, mejores prácticas, criterios, directrices, guías y demás disposiciones para el adecuado cumplimiento de las disposiciones de carácter general en materia de prevención de operaciones que pudiesen ubicarse en los supuestos de los artículos 139 Quáter o 400 Bis del Código Penal Federal a las que se encuentren sujetas las Entidades, sociedades autorizadas para operar con modelos novedosos, Asesores en inversiones, Centros cambiarios, Transmisores de dinero y Sociedades financieras de objeto múltiple no reguladas sujetas a la supervisión de la Comisión. Lo anterior, sin perjuicio de la competencia que en materia de emisión de disposiciones de carácter general tiene la Secretaría de Hacienda y Crédito Público, así como respecto de la interpretación de estas."],"conteo":""},{"etiqueta":"X","nombre":"Certificar profesionales","verbo":"Certifican","gancho":"Auditores, oficiales de cumplimiento y demás profesionales","puntos":["<b>Fr. X.<\/b> Certificar a los auditores externos independientes, oficiales de cumplimiento y demás profesionales en términos de lo dispuesto en el artículo 4, fracciones X y X Bis de la LCNBV, pudiendo realizar los demás actos necesarios para su ejecución."],"conteo":""},{"etiqueta":"XVI","nombre":"Intercambiar información","verbo":"Comparten","gancho":"Con autoridades nacionales e internacionales","puntos":["<b>Fr. XVI.<\/b> Compartir o intercambiar datos, registros, documentos y, en general, toda aquella información que hubieren obtenido en el ejercicio de sus facultades con los diferentes organismos, dependencias y autoridades nacionales e internacionales relacionadas con la prevención, detección y combate de los delitos tipificados en los artículos 139 Quáter o 400 Bis del Código Penal Federal, en términos de las disposiciones jurídicas aplicables."],"conteo":""},{"etiqueta":"XVIII","nombre":"Enviar la lista de personas bloqueadas","verbo":"Envían","gancho":"La reciben de la SHCP","puntos":["<b>Fr. XVIII.<\/b> Enviar a las Entidades, sociedades autorizadas para operar con modelos novedosos, Centros cambiarios, Transmisores de dinero y sociedades financieras de objeto múltiple no reguladas sujetas a la supervisión de la Comisión, la lista de personas bloqueadas que reciba por parte de la Secretaría de Hacienda y Crédito Público para tal efecto, pudiendo realizar los actos necesarios para ello."],"conteo":""},{"etiqueta":"C","nombre":"Registro de centros cambiarios y transmisores","verbo":"Registra","gancho":"Sólo la DG PLD C","puntos":["<b>Art. 48, párrafo que sigue a la fr. XIX (resumen):<\/b> a la DG de Prevención de Operaciones con Recursos de Procedencia Ilícita C le corresponde, además, llevar el Registro Público de Centros cambiarios y Transmisores de dinero, inscribir y renovar el registro a las personas morales que cumplan los requisitos de la LGOAAC y llevar a cabo las anotaciones de ese Registro.","Coordinaciones de apoyo: A 1 a A 4 (DG A), B 1 a B 4 (DG B) y C 1 a C 3 (DG C); pueden ejercer las frs. I, II, VIII, IX, X y XII."],"conteo":""},{"etiqueta":"Resto","nombre":"Las demás del art. 48","verbo":"","gancho":"Para reconocerlas","puntos":["<b>Fr. IV.<\/b> Ejercer las atribuciones que conforme a las leyes relativas al sistema financiero mexicano y a las disposiciones a que se refiere la fracción I de este artículo, competa llevar a cabo a la Comisión, así como realizar los demás actos necesarios para el ejercicio de dichas atribuciones.","<b>Fr. V.<\/b> Atender las consultas relacionadas con la aplicación de las disposiciones en materia de prevención, detección y reporte de actos, omisiones u operaciones que pudiesen ubicarse en los supuestos de los artículos 139 Quáter o 400 Bis del Código Penal Federal.","<b>Fr. VII.<\/b> Proponer a la Dirección General de Delitos y Sanciones, la suspensión de operaciones de los Centros cambiarios y Transmisores de dinero que se encuentren realizando operaciones en contravención a lo previsto en la LGOAAC; la suspensión o cancelación de los contratos celebrados con las instituciones de crédito, casas de bolsa y casas de cambio con las que operen, o bien que se abstengan de realizar nuevas operaciones con dichas Entidades, en términos de la LGOAAC.","<b>Fr. VIII.<\/b> Expedir certificaciones de los documentos que obren en sus archivos.","<b>Fr. IX.<\/b> Emitir el dictamen técnico a que se refieren los artículos 86 Bis y 87-P de la LGOAAC, así como realizar los demás actos necesarios para tal efecto.","<b>Fr. XI.<\/b> Requerir la comparecencia de presuntos infractores y demás personas que puedan contribuir al adecuado desarrollo de la investigación de actos o hechos que contravengan las disposiciones jurídicas aplicables relacionadas con su ámbito de competencia, así como realizar los demás actos necesarios para efectos de lo anterior.","<b>Fr. XII.<\/b> Formular estadísticas relacionadas con los asuntos objeto de la competencia de la Vicepresidencia de Supervisión de Procesos Preventivos.","<b>Fr. XIII.<\/b> Coordinar las actividades de automatización de los diferentes procesos de la Vicepresidencia de Supervisión de Procesos Preventivos, así como apoyar las acciones necesarias para su adecuado funcionamiento.","<b>Fr. XIV.<\/b> Proponer y, en su caso, implementar los indicadores de gestión que resulten necesarios para dar seguimiento a los procesos de la Vicepresidencia de Supervisión de Procesos Preventivos.","<b>Fr. XV.<\/b> Fungir como enlace de la Vicepresidencia de Supervisión de Procesos Preventivos con la Dirección General de Informática para efectos de lo dispuesto en la fracción IV del artículo 50 del presente Reglamento.","<b>Fr. XVII.<\/b> Coadyuvar con la Secretaría de Hacienda y Crédito Público y el Ministerio Público Federal en términos de lo dispuesto en el artículo 4, fracción XIX Bis de la LCNBV, de conformidad con los convenios de colaboración que para tal efecto se suscriban.","<b>Fr. XIX.<\/b> Las demás que señalen otras disposiciones jurídicas, así como resolver los asuntos relacionados a las disposiciones que confieran alguna atribución a la Comisión, en el ámbito de su competencia y que no estén expresamente atribuidas a otra unidad administrativa de la Comisión."],"conteo":"12 fr."}]},{"letra":"3","titulo":"Otras direcciones","pregunta":"Sanción, autoridades y excepciones","estilo":"ficha","color":"negro","items":[{"etiqueta":"Art. 41 XI","nombre":"DG de Delitos y Sanciones","verbo":"Sanciono","gancho":"Cuando la Junta de Gobierno se lo haya delegado","puntos":["<b>Art. 41, fr. XI.<\/b> Otorgar audiencia a los presuntos infractores para que manifiesten por escrito lo que a su interés convenga, ofrezcan pruebas y formulen alegatos. Asimismo, imponer las sanciones administrativas por infracciones a las leyes relativas al sistema financiero mexicano y a las disposiciones de carácter general que emanen de ellas, cuando le hayan sido delegadas por la Junta de Gobierno en términos de los artículos 12, fracción IV de la LCNBV y 10 de este Reglamento."],"conteo":""},{"etiqueta":"Art. 49 I","nombre":"DG de Atención a Autoridades","verbo":"Atiendo","gancho":"Requerimientos y aseguramientos","puntos":["<b>Art. 49, fr. I (resumen).<\/b> Atender los requerimientos de información y documentación, así como las órdenes de aseguramiento o desbloqueo de cuentas, transferencias o situación de fondos que formulen las autoridades judiciales, hacendarias federales y administrativas competentes, relativos a operaciones efectuadas por los clientes y usuarios de servicios financieros con las entidades y demás personas sujetas a la supervisión de la Comisión, con sujeción a las disposiciones en materia de secreto financiero."],"conteo":""},{"etiqueta":"Art. 38 II","nombre":"DG de Asuntos Internacionales","verbo":"Excepción","gancho":"No con autoridades PLD/FT","puntos":["<b>Art. 38, fr. II (resumen).<\/b> Actúa como coordinador y enlace con autoridades homólogas de otros países y organismos multilaterales para intercambio de información, asistencia técnica y capacitación, <b>salvo con autoridades internacionales en materia de prevención, detección y reporte<\/b> de actos, omisiones u operaciones de los arts. 139 Quáter o 400 Bis del CPF."],"conteo":""},{"etiqueta":"Art. 46 III","nombre":"DG de Disposiciones","verbo":"Excepción","gancho":"No opina en materia PLD/FT","puntos":["<b>Art. 46, fr. III (resumen).<\/b> Ejerce las atribuciones para dar opinión sobre las disposiciones que otras autoridades financieras pretendan expedir, <b>con excepción de las materias relativas a la prevención, detección y reporte<\/b> de actos, omisiones u operaciones de los arts. 139 Quáter o 400 Bis del CPF."],"conteo":""}]}],"frase":{"titulo":"La CNBV en una frase","html":"Las DG PLD supervisan, visitan, opinan, orientan y certifican; Delitos y Sanciones sanciona; Atención a Autoridades responde a las autoridades."}},{"tipo":"cifras","id":"cifras","nav":"Cifras","titulo":"Cifras de estructura","intro":"Pocas y con su fuente: ninguna fecha se pregunta como dato.","cifras":[["45","fracciones","Atribuciones de la UIF","RISCHP art. 10"],["3","incisos","Fr. I: medidas (a), reportes (b) y conocimiento del cliente y demás lineamientos (c)","RISCHP art. 10, fr. I"],["19","fracciones","Atribuciones de las DG PLD A, B y C","RI CNBV art. 48"],["41","autoridades","Coordinadas por la UIF para elaborar la ENR 2023","ENR 2023, II.3"],["37","factores","Factores de riesgo de la ENR 2023, en cinco rubros","ENR 2023, II"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"a_reg":"Régimen y participantes","a_uif":"UIF · art. 10 RISCHP","a_cnbv":"CNBV · Reglamento Interior"},"modos":[{"k":"a_reg","l":"El régimen","tema":"a_reg"},{"k":"a_uif","l":"La UIF","tema":"a_uif"},{"k":"a_cnbv","l":"La CNBV","tema":"a_cnbv"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Trampas y cifras","tipos":["cifra","trampa"]}],"banco":[{"id":"A001","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, ¿qué autoridades conforman las «Autoridades Supervisoras» del régimen de PLD/CFT?","a":"CNBV, CNSF, CONSAR y SAT","o":["CNBV, CNSF, CONSAR y el Banco de México","CNBV, UIF, CNSF y la Unidad de Banca de Desarrollo","CNBV, CONSAR, SAT y la Unidad de Banca, Valores y Ahorro","CNBV, CNSF, CONSAR y SAT"],"x":"La ENR 2023 (III.3) integra a las supervisoras con la CNBV, la CNSF, la CONSAR y el SAT. El Banco de México no forma parte de esa conformación: sólo «también supervisa» los Riesgos Adicionales de sistemas de pagos.","ref":"ENR 2023, III.3"},{"id":"A002","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, ¿cómo están conformadas las «Autoridades Reguladoras» del régimen de PLD/CFT?","a":"SHCP, por medio de la UBD, la UBVA, la USPSS y la UIF, así como el Banco de México","o":["SHCP, por medio de la UBD, la UBVA y la USPSS, así como la CNBV y el Banco de México","SHCP, por medio de la UBD, la UBVA, la USPSS y la UIF, así como el Banco de México","SHCP, por medio de la UBD y la UBVA, así como la UIF, la CNSF, la CONSAR y el SAT","SHCP, por medio de la UBD, la UBVA, la USPSS y la UIF, así como el SAT y la CONSAR"],"x":"La ENR 2023 (III.2) cuenta entre las reguladoras a la SHCP por sus unidades UBD, UBVA, USPSS y UIF, y al Banco de México. La CNBV, la CNSF, la CONSAR y el SAT son supervisoras, no reguladoras.","ref":"ENR 2023, III.2"},{"id":"A003","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, ¿qué acción del régimen consiste en que «los recursos (ilícitos, para el caso de LD, y con fines ilícitos, para el caso de FT) no sean introducidos al sistema financiero o a la economía nacional»?","a":"Prevenir","o":["Prevenir","Detectar","Combatir","Supervisar"],"x":"Es la definición literal de «Prevenir». Detectar es que la introducción sea oportunamente identificada; Combatir, que se castigue la conducta y se sustraigan los recursos.","ref":"ENR 2023, III"},{"id":"A004","tema":"a_reg","tipo":"memoria","q":"¿Cómo define la ENR 2023 la acción de «Detectar» dentro del régimen de PLD/CFT?","a":"Que la introducción de dichos recursos sea oportunamente identificada por los SO y las autoridades competentes","o":["Que la introducción de dichos recursos sea oportunamente identificada por los SO y las autoridades competentes","Que los recursos ilícitos o con fines ilícitos no sean introducidos al sistema financiero o a la economía nacional del país","Que se castigue debidamente la conducta ilícita detectada y se sustraiga de dichos recursos al delincuente que los obtuvo","Que la UIF reciba los reportes y avisos de los SO y disemine oportunamente los productos de inteligencia realizados"],"x":"«Detectar» se refiere a la identificación oportuna, por los SO y las autoridades, de la introducción de los recursos. No confundir con Prevenir (que no entren) ni con Combatir (castigo y sustracción).","ref":"ENR 2023, III"},{"id":"A005","tema":"a_reg","tipo":"caso","q":"Un juez dicta sentencia condenatoria por lavado de dinero y los bienes del sentenciado se decomisan. Según la ENR 2023, ¿qué acción del régimen se materializa?","a":"Combatir: que se castigue debidamente la conducta ilícita detectada y se sustraiga de dichos recursos al delincuente","o":["Prevenir: que los recursos ilícitos o con fines ilícitos no sean introducidos al sistema financiero o a la economía nacional","Combatir: que se castigue debidamente la conducta ilícita detectada y se sustraiga de dichos recursos al delincuente","Detectar: que la introducción de dichos recursos sea oportunamente identificada por los SO y las autoridades competentes","Supervisar: que los SO cumplan con sus obligaciones adecuadamente, por medio de acciones de vigilancia e inspección de las autoridades"],"x":"Castigar la conducta y sustraer los recursos al delincuente es «Combatir». Supervisar es función de las autoridades supervisoras (III.3), no una de las tres acciones Prevenir, Detectar y Combatir.","ref":"ENR 2023, III"},{"id":"A006","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, el Régimen Nacional de PLD/CFT tiene como objeto proteger el SF y la economía nacional mediante…","a":"el establecimiento de medidas y procedimientos para prevenir y detectar ORPI, a través de una coordinación interinstitucional","o":["la supervisión in situ y extra situ de los sujetos obligados, a cargo de las autoridades supervisoras del sistema financiero y del SAT","el establecimiento de medidas y procedimientos para prevenir y detectar ORPI, a través de una coordinación interinstitucional","la emisión de disposiciones de carácter general por la UIF, con la aprobación previa de las autoridades supervisoras competentes","la imposición de sanciones administrativas a los sujetos obligados que incumplan, a cargo de la autoridad central del régimen de PLD/CFT"],"x":"El objeto descrito en la ENR 2023 es proteger el SF y la economía mediante medidas y procedimientos para prevenir y detectar ORPI con coordinación interinstitucional. La supervisión y la sanción son funciones de participantes, no el objeto del régimen.","ref":"ENR 2023, III"},{"id":"A007","tema":"a_reg","tipo":"caso","q":"Una casa de bolsa identifica y conoce a sus clientes, monitorea sus operaciones y envía reportes a la UIF. Según la ENR 2023, ¿qué carácter tiene en el régimen?","a":"Sujeto obligado: primer frente con los clientes y usuarios que proporcionan la información necesaria a las autoridades","o":["Autoridad supervisora auxiliar: vigila a sus propios clientes y usuarios por medio de acciones de vigilancia e inspección","Sujeto obligado: primer frente con los clientes y usuarios que proporcionan la información necesaria a las autoridades","Autoridad reguladora delegada: formula políticas de promoción, regulación y supervisión aplicables a sus clientes","Otro integrante del régimen: coadyuva con la FGR en la investigación y persecución de los delitos de LD/FT"],"x":"Identificar y conocer clientes, monitorear, detectar y reportar a la UIF son las funciones de los sujetos obligados, que la ENR describe como «el primer frente con los clientes y usuarios». No supervisan ni regulan.","ref":"ENR 2023, III.1"},{"id":"A008","tema":"a_reg","tipo":"caso","q":"Una persona que realiza actividades vulnerables conforme a la LFPIORPI recibe una visita de verificación in situ en materia de PLD/FT. Según la ENR 2023, ¿qué autoridad supervisa a estos sujetos obligados?","a":"El Servicio de Administración Tributaria (SAT)","o":["El Servicio de Administración Tributaria (SAT)","La Comisión Nacional Bancaria y de Valores (CNBV)","La Unidad de Inteligencia Financiera (UIF) de la SHCP","La Comisión Nacional de Seguros y Fianzas (CNSF)"],"x":"La ENR 2023 (factor 12) señala que el SAT supervisa a quienes realizan Actividades Vulnerables conforme a la LFPIORPI. La CNBV, la CNSF y la CONSAR supervisan a las Entidades Financieras de su competencia; la UIF no es supervisora.","ref":"ENR 2023, factor 12"},{"id":"A009","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023 (factor 12), la CONSAR, la CNBV y la CNSF son autoridades supervisoras en materia de PLD/FT tratándose de…","a":"las Entidades Financieras sobre las que tienen competencia","o":["quienes realizan Actividades Vulnerables conforme a la LFPIORPI","las Entidades Financieras sobre las que tienen competencia","los sistemas de pagos, en lo que se refiere a los Riesgos Adicionales","las unidades administrativas de la SHCP que emiten las DCG en la materia"],"x":"El factor 12 asigna a CONSAR, CNBV y CNSF las Entidades Financieras de su competencia; al SAT, las Actividades Vulnerables. Los sistemas de pagos (Riesgos Adicionales) los supervisa Banxico.","ref":"ENR 2023, factor 12"},{"id":"A010","tema":"a_reg","tipo":"caso","q":"Una autoridad revisa obligaciones de PLD/CFT relacionadas con los sistemas de pagos, dentro de los denominados «Riesgos Adicionales». Según la ENR 2023, ¿cuál es?","a":"El Banco de México","o":["El Banco de México","La CNBV, por medio de sus DG de Prevención de ORPI","La UIF, como autoridad central del régimen","La CONSAR, como supervisora del sistema financiero"],"x":"La ENR 2023 (III.3) dice que «BANXICO también supervisa la parte de obligaciones de los denominados Riesgos Adicionales, en lo que se refiere a los sistemas de pagos». Banxico es reguladora (III.2) y, además, en ese ámbito supervisa.","ref":"ENR 2023, III.3"},{"id":"A011","tema":"a_reg","tipo":"trampa","q":"En el diagrama de la CNBV «Participantes en el Régimen Preventivo de Lavado de Dinero» (VSPP, 2019), ¿qué participante tiene a su cargo la «Investigación y persecución de los delitos»?","a":"Procuraduría General de la República","o":["Comisión Nacional Bancaria y de Valores","Procuraduría General de la República","Unidad de Inteligencia Financiera (SHCP)","Poder Judicial de la Federación"],"x":"El diagrama de 2019 nombra a la Procuraduría General de la República (hoy FGR, como la llama la ENR 2023). La CNBV supervisa, sanciona y atiende requerimientos; la UIF analiza y denuncia. El Poder Judicial no aparece en el diagrama.","ref":"VSPP 2019, p. 2"},{"id":"A012","tema":"a_reg","tipo":"trampa","q":"En el diagrama de la CNBV «Participantes en el Régimen Preventivo» (VSPP, 2019), ¿qué participante tiene la función de «Imposición de sanciones»?","a":"Comisión Nacional Bancaria y de Valores","o":["Unidad de Inteligencia Financiera (SHCP)","Unidad de Banca, Valores y Ahorro y Unidad de Banca de Desarrollo (SHCP)","Comisión Nacional Bancaria y de Valores","Procuraduría General de la República"],"x":"En el diagrama de 2019 la CNBV concentra supervisión del cumplimiento, imposición de sanciones y atención a requerimientos de autoridades. La UIF analiza y denuncia; no sanciona.","ref":"VSPP 2019, p. 2"},{"id":"A013","tema":"a_reg","tipo":"caso","q":"Una unidad de la SHCP publica nueva normatividad en materia de prevención de lavado de dinero. En el diagrama de la CNBV (VSPP, 2019), ¿qué participante tiene esa función?","a":"Unidad de Banca, Valores y Ahorro y Unidad de Banca de Desarrollo (SHCP)","o":["Unidad de Inteligencia Financiera (SHCP), como autoridad central","Unidad de Banca, Valores y Ahorro y Unidad de Banca de Desarrollo (SHCP)","Comisión Nacional Bancaria y de Valores, como órgano desconcentrado","Unidad de Seguros, Pensiones y Seguridad Social y Banco de México"],"x":"El diagrama de 2019 asigna la «Emisión de normatividad en la materia» a la UBVA y la UBD (SHCP). La USPSS y Banxico se suman como reguladoras en la ENR 2023, pero no figuran en el diagrama.","ref":"VSPP 2019, p. 2"},{"id":"A014","tema":"a_reg","tipo":"caso","q":"Un participante analiza reportes, identifica personas y actividades, así como el origen y destino de recursos potencialmente ilícitos, y presenta denuncias. En el diagrama de la CNBV (VSPP, 2019), ¿de cuál se trata?","a":"Unidad de Inteligencia Financiera (SHCP)","o":["Comisión Nacional Bancaria y de Valores","Procuraduría General de la República","Unidad de Inteligencia Financiera (SHCP)","Sujetos Obligados del sistema financiero"],"x":"Análisis de reportes, detección de operaciones sospechosas, identificación de personas y del origen y destino de recursos y presentación de denuncias son las funciones de la UIF en el diagrama. La PGR investiga y persigue; la CNBV supervisa.","ref":"VSPP 2019, p. 2"},{"id":"A015","tema":"a_reg","tipo":"trampa","q":"Según la ENR 2023, ¿cuál de las siguientes autoridades NO forma parte de la conformación de las «Autoridades Supervisoras»?","a":"La Unidad de Inteligencia Financiera","o":["La Comisión Nacional del Sistema de Ahorro para el Retiro","El Servicio de Administración Tributaria","La Unidad de Inteligencia Financiera","La Comisión Nacional de Seguros y Fianzas"],"x":"La ENR 2023 coloca a la UIF entre las reguladoras y como participante propio (recibe, analiza, disemina y denuncia), no entre las supervisoras. En el RISCHP sólo «participa» con los desconcentrados en la verificación (art. 10, fr. VII).","ref":"ENR 2023, III.3"},{"id":"A016","tema":"a_reg","tipo":"caso","q":"Tras recibir una denuncia de la UIF, una autoridad investiga y persigue el delito de LD y luego retroalimenta a la UIF sobre la información incluida en esa denuncia. Según la ENR 2023, ¿cuál es?","a":"La FGR y las Procuradurías o Fiscalías Generales de Justicia Estatales","o":["El Poder Judicial de la Federación y los Poderes Judiciales Estatales","La CNBV, por medio de su Dirección General de Delitos y Sanciones","La FGR y las Procuradurías o Fiscalías Generales de Justicia Estatales","La Secretaría de Seguridad Pública y Protección Ciudadana (SSPC)"],"x":"La ENR 2023 (III.5) asigna a la FGR y a las fiscalías estatales investigar y perseguir los delitos, incluido el LD/FT, y retroalimentar a la UIF. El Poder Judicial imparte justicia; no investiga.","ref":"ENR 2023, III.5"},{"id":"A017","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, ¿qué integrante del régimen tiene como función principal la «impartición de justicia con apego al marco jurídico de la nación, garantizando el Estado de Derecho e incluyendo los casos de LD/FT»?","a":"El PJF y los Poderes Judiciales Estatales","o":["La FGR y las Fiscalías Generales de Justicia Estatales","La Fiscalía Especializada en Combate a la Corrupción","El PJF y los Poderes Judiciales Estatales","La Secretaría de Seguridad Pública y Protección Ciudadana"],"x":"La impartición de justicia corresponde al Poder Judicial de la Federación y a los estatales (ENR 2023, III.5). La FGR investiga y persigue; su interacción con el Poder Judicial es la consignación de investigaciones.","ref":"ENR 2023, III.5"},{"id":"A018","tema":"a_reg","tipo":"caso","q":"Una investigación de LD requiere asistencia legal mutua de una autoridad extranjera. Según la ENR 2023, ¿qué integrante del régimen coordina la Asistencia Legal Mutua con autoridades extranjeras?","a":"La Secretaría de Relaciones Exteriores (SRE)","o":["La Fiscalía Especializada en Combate a la Corrupción (FECC)","La Secretaría de Seguridad Pública y Protección Ciudadana (SSPC)","La Auditoría Superior de la Federación (ASF)","La Secretaría de Relaciones Exteriores (SRE)"],"x":"La ENR 2023 (III.5) identifica a la SRE como quien «coordina la Asistencia Legal Mutua con autoridades extranjeras». La FECC y la ASF entran cuando hay delitos de corrupción vinculados a ORPI.","ref":"ENR 2023, III.5"},{"id":"A019","tema":"a_reg","tipo":"caso","q":"Al investigar una ORPI, se descubre que además existen delitos electorales vinculados. Según la ENR 2023, ¿qué otro integrante del régimen interviene en ese supuesto?","a":"La Fiscalía Especializada en Delitos Electorales (FEDE)","o":["La Fiscalía Especializada en Delitos Electorales (FEDE)","La Fiscalía Especializada en Combate a la Corrupción (FECC)","La Secretaría de la Función Pública (SFP)","La Secretaría de Relaciones Exteriores (SRE)"],"x":"La ENR 2023 menciona a la FEDE «en los casos en que existan además delitos electorales vinculados a ORPI». La FECC y la SFP se vinculan con delitos de corrupción.","ref":"ENR 2023, III.5"},{"id":"A020","tema":"a_reg","tipo":"caso","q":"Una investigación de ORPI revela además delitos de corrupción vinculados. Según la ENR 2023, ¿qué integrantes del régimen intervienen en esos casos?","a":"FECC, ASF y SFP","o":["FECC, ASF y SFP","FEDE, SRE y SSPC","CNBV, SAT y FEDE","FGR, SRE y la CONSAR"],"x":"La ENR 2023 señala a la FECC, la ASF y la SFP «en los casos en que existan además delitos de corrupción vinculados a ORPI». La FEDE corresponde a delitos electorales y la SRE a la asistencia legal mutua.","ref":"ENR 2023, III.5"},{"id":"A021","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, ¿qué integrante del régimen de PLD/CFT trabaja con la Guardia Financiera?","a":"La SSPC, que trabaja con la Guardia Financiera","o":["La SRE, que coordina la asistencia legal mutua","La FGR, que investiga y persigue los delitos","El SAT, que supervisa las actividades vulnerables","La SSPC, que trabaja con la Guardia Financiera"],"x":"La ENR 2023 menciona a la SSPC, «misma que trabaja con la Guardia Financiera», entre los otros integrantes del régimen.","ref":"ENR 2023, III.5"},{"id":"A022","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, su elaboración fue un «ejercicio integral» coordinado por…","a":"la UIF como autoridad central del régimen de PLD/CFT","o":["la UIF como autoridad central del régimen de PLD/CFT","la CNBV como autoridad supervisora con el mayor número de sujetos obligados","la SHCP por medio de la UBVA, como autoridad reguladora del régimen de PLD/CFT","el Banco de México, como autoridad reguladora y supervisora de los sistemas de pagos"],"x":"La característica d) de la ENR 2023 dice que es un ejercicio integral «coordinado por la UIF como autoridad central del régimen de PLD/CFT», con implicación de todas las autoridades con responsabilidades en él.","ref":"ENR 2023, II.2 d)"},{"id":"A023","tema":"a_reg","tipo":"cifra","q":"Según la ENR 2023, ¿a través de cuántas autoridades coordinó la UIF su elaboración en el grupo de trabajo interinstitucional?","a":"41 autoridades","o":["39 autoridades","41 autoridades","37 autoridades","26 autoridades"],"x":"La UIF coordinó la ENR 2023 «a través de 41 autoridades»; las 39 son personas enlaces (dos de ellas representan a dos autoridades). 37 es el número de factores de riesgo.","ref":"ENR 2023, II.3"},{"id":"A024","tema":"a_reg","tipo":"memoria","q":"Según la ENR 2023, la UIF interactúa con los SO, a través de las Supervisoras y de manera directa, ¿con qué propósito?","a":"Retroalimentar la calidad de los reportes y avisos enviados y crear y diseminar guías, mejores prácticas, indicadores de riesgo y tipologías","o":["Retroalimentar la calidad de los reportes y avisos enviados y crear y diseminar guías, mejores prácticas, indicadores de riesgo y tipologías","Practicar visitas de inspección ordinarias y especiales sobre la calidad de los reportes y avisos enviados por cada sujeto obligado del régimen","Imponer sanciones por la presentación extemporánea de reportes y avisos, previa audiencia del sujeto obligado y con la opinión de su supervisora","Certificar a los oficiales de cumplimiento que elaboran y envían los reportes y avisos a la autoridad, en coordinación con las supervisoras"],"x":"La ENR 2023 (III.4) describe la interacción de la UIF con los SO para retroalimentar la calidad de reportes y avisos y diseminar guías, mejores prácticas, indicadores y tipologías. Visitar, sancionar y certificar no son funciones de la UIF.","ref":"ENR 2023, III.4"},{"id":"A025","tema":"a_reg","tipo":"caso","q":"Un banco detecta una operación de riesgo y envía el reporte correspondiente. Según la ENR 2023, ¿a quién lo envía y qué hace esa autoridad con él?","a":"A la UIF, que analiza la información para detectar posibles conductas de LD/FT y disemina los productos de inteligencia","o":["A la CNBV, que analiza el reporte, impone la sanción que proceda y, en su caso, presenta la denuncia ante la FGR","A la FGR, que investiga y persigue el delito y después retroalimenta a la UIF sobre la información del reporte","A la UIF, que analiza la información para detectar posibles conductas de LD/FT y disemina los productos de inteligencia","A la UBVA de la SHCP, que emite las DCG aplicables y verifica la calidad del reporte presentado por el banco"],"x":"Los SO envían reportes y avisos a la UIF, que los analiza para detectar posibles conductas de LD/FT y disemina inteligencia (ENR 2023, III.1 y III.4). La CNBV supervisa; la FGR persigue.","ref":"ENR 2023, III.1 y III.4"},{"id":"A026","tema":"a_reg","tipo":"trampa","q":"Según la ENR 2023, ¿quién tiene la atribución de emitir las Disposiciones de Carácter General (DCG) en materia de PLD/CFT con fundamento en las Leyes Financieras?","a":"La SHCP, a través de sus Unidades Administrativas competentes","o":["La UIF, por sí misma, como autoridad central del régimen de PLD/CFT","La CNBV, como autoridad supervisora de las entidades del sistema financiero","El Banco de México, como integrante de las autoridades reguladoras","La SHCP, a través de sus Unidades Administrativas competentes"],"x":"La ENR 2023 (III) dice que las Leyes Financieras otorgaron a la SHCP la atribución de emitir DCG, por medio de sus unidades competentes. La UIF propone y opina (RISCHP art. 10, fr. I); la CNBV opina y emite lineamientos sin perjuicio de la SHCP.","ref":"ENR 2023, III"},{"id":"A027","tema":"a_reg","tipo":"caso","q":"Una autoridad supervisora del sistema financiero, distinta de la CNBV, actualiza las matrices de riesgos de cada sector que supervisa en PLD/CFT. Según la ENR 2023 (factor 7), ¿cuál puede ser?","a":"La CNSF","o":["El SAT","La CNSF","La UIF","El Banco de México"],"x":"El factor 7 señala que «las tres autoridades supervisoras de SF (CNBV, CNSF, CONSAR)» cuentan con matrices de riesgos por sector. El SAT supervisa actividades vulnerables, no el SF; la UIF no es supervisora.","ref":"ENR 2023, factor 7"},{"id":"A028","tema":"a_uif","tipo":"memoria","q":"¿Qué autoridad tiene la atribución de «Coordinar la recepción y análisis de la información contenida en los reportes…, los avisos previstos en la [LFPIORPI] y su Reglamento, y en las declaraciones a que se refiere el artículo 9o. de la Ley Aduanera»?","a":"La Unidad de Inteligencia Financiera de la SHCP","o":["La Unidad de Inteligencia Financiera de la SHCP","La Dirección General de Prevención de Operaciones con Recursos de Procedencia Ilícita A de la CNBV","El Servicio de Administración Tributaria, como supervisor de las actividades vulnerables","La Dirección General de Atención a Autoridades de la Comisión Nacional Bancaria y de Valores"],"x":"Es la fr. VIII del art. 10 del RISCHP, atribución de la UIF: recibe y analiza. Las DG PLD de la CNBV verifican el cumplimiento; no coordinan la recepción de reportes.","ref":"RISCHP art. 10, fr. VIII"},{"id":"A029","tema":"a_uif","tipo":"caso","q":"Un banco detecta una operación inusual de un cliente y presenta el reporte. Conforme al RISCHP, ¿qué autoridad coordina la recepción y análisis de la información contenida en ese reporte?","a":"La UIF, conforme al art. 10 del RISCHP","o":["La CNBV, por medio de sus DG de Prevención de ORPI","La UIF, conforme al art. 10 del RISCHP","La Unidad de Banca, Valores y Ahorro de la SHCP","La FGR, por conducto del Ministerio Público de la Federación"],"x":"La fr. VIII del art. 10 asigna a la UIF coordinar la recepción y análisis de reportes y avisos. La CNBV supervisa el cumplimiento; la FGR actúa después, si hay denuncia.","ref":"RISCHP art. 10, fr. VIII"},{"id":"A030","tema":"a_uif","tipo":"caso","q":"Al analizar un reporte, la UIF necesita documentación adicional del propio sujeto obligado que lo presentó. ¿Con qué atribución del art. 10 del RISCHP puede pedírsela?","a":"Requerir y recabar de las entidades y personas sujetas a las DCG, directamente o a través de las instancias correspondientes, información, documentación, datos e imágenes relacionadas con los reportes","o":["Requerir y recabar de las entidades y personas sujetas a las DCG, directamente o a través de las instancias correspondientes, información, documentación, datos e imágenes relacionadas con los reportes","Requerir la comparecencia de presuntos infractores y demás personas que puedan contribuir al adecuado desarrollo de la investigación de actos o hechos que contravengan las disposiciones aplicables, así como realizar los actos necesarios","Practicar visitas ordinarias, especiales y de investigación con el objeto de verificar el cumplimiento, pudiendo solicitar y recabar cualquier información y documentación de la entidad visitada y realizar los demás actos necesarios","Celebrar convenios con las autoridades federales, de las entidades federativas y de los municipios, a fin de recabar información, datos e imágenes que obren en su poder y que permita comprobar o descartar las operaciones"],"x":"La fr. IX permite a la UIF requerir y recabar de los SO, directamente o por las instancias correspondientes, información relacionada con reportes y avisos. Requerir comparecencias y practicar visitas son atribuciones de las DG PLD de la CNBV (art. 48, frs. XI y II).","ref":"RISCHP art. 10, fr. IX"},{"id":"A031","tema":"a_uif","tipo":"trampa","q":"La UIF necesita información que obra en las bases de datos de un órgano administrativo desconcentrado de la propia SHCP. ¿Qué atribución del art. 10 del RISCHP ejerce?","a":"Requerir a las unidades administrativas y órganos desconcentrados de la Secretaría la información y documentación necesaria, incluido el acceso a sus bases de datos","o":["Requerir y recabar de las entidades y personas sujetas a las DCG y de quienes realicen actividades vulnerables información, documentación, datos e imágenes relacionadas con los reportes","Requerir a las unidades administrativas y órganos desconcentrados de la Secretaría la información y documentación necesaria, incluido el acceso a sus bases de datos","Requerir a los sujetos a que se refiere el artículo 51 de la LFPIORPI la información y documentación a la que tengan acceso, y celebrar los convenios respectivos con el Banco de México","Establecer los lineamientos y programas en materia de recepción y análisis de la información, documentación, datos e imágenes que obtenga, de conformidad con las disposiciones aplicables"],"x":"Pedir información a unidades y desconcentrados de la propia Secretaría es la fr. X, que incluye el acceso a bases de datos. La fr. IX, que se le parece, es para requerir a los sujetos obligados.","ref":"RISCHP art. 10, fr. X"},{"id":"A032","tema":"a_uif","tipo":"memoria","q":"Conforme al art. 10, fr. I del RISCHP, respecto de los proyectos de disposiciones de carácter general que deba emitir la Secretaría en materia de PLD/FT, la UIF tiene la atribución de…","a":"Proponer y emitir opinión a las demás unidades administrativas de la Secretaría","o":["Emitirlas y publicarlas en el DOF, previo acuerdo de la Junta de Gobierno de la CNBV","Aprobarlas en definitiva cuando se las propongan los órganos administrativos desconcentrados","Expedirlas directamente, con la opinión previa de la CNBV, la CNSF y la CONSAR","Proponer y emitir opinión a las demás unidades administrativas de la Secretaría"],"x":"La fr. I es «proponer y emitir opinión» sobre los proyectos de DCG que deba emitir la Secretaría. La UIF no emite ni aprueba las DCG: quien las emite es la SHCP.","ref":"RISCHP art. 10, fr. I"},{"id":"A033","tema":"a_uif","tipo":"memoria","q":"Los proyectos de DCG sobre los que la UIF propone y emite opinión (art. 10, fr. I del RISCHP) incluyen lineamientos sobre…","a":"el adecuado conocimiento de clientes y usuarios, la capacitación interna y las estructuras internas que funcionen como áreas de cumplimiento","o":["la imposición de sanciones administrativas a los sujetos obligados que incumplan y la publicación de las sanciones que queden firmes ante los tribunales","el adecuado conocimiento de clientes y usuarios, la capacitación interna y las estructuras internas que funcionen como áreas de cumplimiento","la certificación de auditores externos independientes, oficiales de cumplimiento y demás profesionales que presten servicios a los sujetos obligados","el registro de centros cambiarios y transmisores de dinero, así como la inscripción, renovación y anotaciones que deban obrar en ese registro"],"x":"El inciso c) de la fr. I comprende conocimiento del cliente, información para abrir cuentas, resguardo de información, capacitación, sistemas automatizados y áreas de cumplimiento. Certificar y llevar el registro de centros cambiarios corresponde a la CNBV (art. 48).","ref":"RISCHP art. 10, fr. I, inc. c)"},{"id":"A034","tema":"a_uif","tipo":"cifra","q":"¿Cuántas fracciones tiene el art. 10 del Reglamento Interior de la SHCP, que fija las atribuciones de la UIF?","a":"45 fracciones","o":["19 fracciones","37 fracciones","41 fracciones","45 fracciones"],"x":"El art. 10 del RISCHP tiene 45 fracciones (de la I a la XLV). Las 19 son las del art. 48 del RI CNBV (DG PLD A, B y C).","ref":"RISCHP art. 10"},{"id":"A035","tema":"a_uif","tipo":"memoria","q":"Conforme al art. 10 del RISCHP, ¿qué atribución tiene la UIF respecto de las reglas de carácter general que la Secretaría deba emitir en términos de la LFPIORPI y su Reglamento?","a":"Proponerlas, para aprobación superior, y resolver lo referente a su aplicación","o":["Proponerlas, para aprobación superior, y resolver lo referente a su aplicación","Emitirlas directamente y publicarlas, sin necesidad de aprobación superior alguna","Opinar sobre ellas cuando el SAT, que es quien las propone, se lo solicite por escrito","Interpretarlas para efectos penales, en coordinación con la Fiscalía General de la República"],"x":"La fr. II es «Proponer, para aprobación superior, las reglas de carácter general… y resolver lo referente a su aplicación». La interpretación de la UIF es «para efectos administrativos» (fr. III), no penales.","ref":"RISCHP art. 10, fr. II"},{"id":"A036","tema":"a_uif","tipo":"trampa","q":"Completa la fr. II del art. 10 del RISCHP: «Proponer, para aprobación superior, las reglas de carácter general que la Secretaría deba emitir en términos de…»","a":"la LFPIORPI y su Reglamento","o":["la LFPIORPI y su Reglamento","las leyes financieras, aplicables a las entidades del art. 14, fr. I del RISCHP","la Ley de la CNBV y el Reglamento Interior de la propia Comisión","la Ley Aduanera, respecto de las declaraciones de su artículo 9o."],"x":"La fr. II se refiere a las reglas de la LFPIORPI (actividades vulnerables). Las DCG de las leyes financieras son materia de la fr. I, donde la UIF propone y opina; no confundir ambas.","ref":"RISCHP art. 10, fr. II"},{"id":"A037","tema":"a_uif","tipo":"caso","q":"Una persona que realiza actividades vulnerables duda sobre el alcance de una regla de carácter general de la LFPIORPI. Conforme al RISCHP, ¿qué autoridad tiene la atribución de interpretar, para efectos administrativos, esa ley y sus reglas?","a":"La UIF, en el ámbito de competencia de la Secretaría","o":["El SAT, como autoridad supervisora de las actividades vulnerables","La UIF, en el ámbito de competencia de la Secretaría","La Dirección General de Disposiciones de la CNBV, por ser normativa","La FGR, por tratarse de una ley que prevé conductas sancionables"],"x":"La fr. III faculta a la UIF a interpretar, para efectos administrativos, la LFPIORPI, su Reglamento y sus reglas, en el ámbito de competencia de la Secretaría. El SAT supervisa las AV, pero la interpretación es de la UIF.","ref":"RISCHP art. 10, fr. III"},{"id":"A038","tema":"a_uif","tipo":"caso","q":"La UIF y un órgano desconcentrado de la SHCP definen juntos el formato que usarán quienes realizan actividades vulnerables para presentar sus avisos. ¿Qué atribución ejerce la UIF?","a":"Determinar y expedir, en coordinación con los desconcentrados competentes, las formas oficiales para la presentación de reportes y avisos","o":["Aprobar, en su caso, las tipologías, tendencias e indicadores, así como las guías y mejores prácticas para la elaboración y el envío de los reportes y avisos","Determinar y expedir, en coordinación con los desconcentrados competentes, las formas oficiales para la presentación de reportes y avisos","Determinar los medios de cumplimiento alternativos, conforme a lo dispuesto por la LFPIORPI y su Reglamento, a solicitud de quienes realicen actividades vulnerables","Informar a las autoridades competentes y a quienes realicen las actividades vulnerables sobre la calidad y utilidad de los reportes y avisos que presentan"],"x":"Las formas oficiales para reportes y avisos son la fr. VI, que la UIF ejerce «en coordinación con los órganos administrativos desconcentrados competentes». Las guías para elaborar y enviar reportes (fr. XXIV) son otra cosa: orientan, no son el formato.","ref":"RISCHP art. 10, fr. VI"},{"id":"A039","tema":"a_uif","tipo":"trampa","q":"La UIF advierte que un sujeto obligado presentó sus reportes en forma extemporánea. Conforme al art. 10 del RISCHP, ¿qué le corresponde hacer?","a":"Hacerlo del conocimiento del órgano desconcentrado competente para que, en su caso, éste ejerza sus atribuciones","o":["Imponerle directamente la sanción administrativa que corresponda por el cumplimiento extemporáneo de sus obligaciones","Practicarle una visita de inspección ordinaria o especial para verificar el cumplimiento de sus obligaciones","Requerir su comparecencia como presunto infractor ante la propia Unidad y otorgarle audiencia para que formule alegatos","Hacerlo del conocimiento del órgano desconcentrado competente para que, en su caso, éste ejerza sus atribuciones"],"x":"La fr. XXI faculta a la UIF a hacer del conocimiento de los desconcentrados el incumplimiento o cumplimiento extemporáneo para que, en su caso, ejerzan sus atribuciones. La UIF no sanciona ni practica visitas: sólo participa en la verificación con los desconcentrados (fr. VII).","ref":"RISCHP art. 10, fr. XXI"},{"id":"A040","tema":"a_uif","tipo":"trampa","q":"Respecto de la revisión, verificación, comprobación y evaluación del cumplimiento de las DCG y de la LFPIORPI por parte de los sujetos obligados, ¿qué atribución tiene la UIF?","a":"Participar con los órganos administrativos desconcentrados competentes de la Secretaría","o":["Ejercerla en forma exclusiva, por ser la autoridad central del régimen de PLD/CFT","Delegarla en los sujetos obligados, por medio de sus áreas internas de cumplimiento","Participar con los órganos administrativos desconcentrados competentes de la Secretaría","Ejercerla sólo respecto de las entidades financieras supervisadas por la CNBV"],"x":"La fr. VII dice «Participar con los órganos administrativos desconcentrados» en esa revisión: la UIF no supervisa sola. La verificación corresponde a los desconcentrados supervisores; en la CNBV, a las DG PLD (art. 48, frs. I y II).","ref":"RISCHP art. 10, fr. VII"},{"id":"A041","tema":"a_uif","tipo":"caso","q":"La unidad de inteligencia financiera de otro país solicita a la UIF mexicana información y documentación sobre un caso. ¿Qué atribución del art. 10 del RISCHP le permite atenderla?","a":"Proporcionar, requerir e intercambiar con las autoridades competentes nacionales y extranjeras la información y documentación necesaria","o":["Proporcionar, requerir e intercambiar con las autoridades competentes nacionales y extranjeras la información y documentación necesaria","Participar en la negociación de los tratados internacionales en las materias del artículo, con la intervención de otras dependencias de la APF","Someter la designación del personal de las agregadurías en el extranjero de esta Unidad a ratificación de su superior jerárquico","Celebrar convenios con las autoridades de las entidades federativas y de los municipios para recabar información, datos e imágenes"],"x":"Intercambiar información con autoridades extranjeras es la fr. XIV. Negociar tratados (fr. XXII) y las agregadurías (fr. XXXVII) son atribuciones distintas que no resuelven la solicitud concreta.","ref":"RISCHP art. 10, fr. XIV"},{"id":"A042","tema":"a_uif","tipo":"trampa","q":"En un organismo intergubernamental se adoptan acuerdos en materia de PLD/FT y la UIF debe coordinar su implementación por parte de la Secretaría. ¿Qué atribución ejerce?","a":"Fungir como enlace entre la Secretaría y los países, jurisdicciones u organismos internacionales o intergubernamentales, y coordinar la implementación de los acuerdos","o":["Proporcionar, requerir e intercambiar con las autoridades competentes nacionales y extranjeras la información y documentación necesaria para el ejercicio de sus atribuciones","Fungir como enlace entre las unidades de la Secretaría y las dependencias de la APF, las entidades federativas, los municipios y la Fiscalía General de la República","Fungir como enlace entre la Secretaría y los sujetos obligados a observar las DCG, así como con quienes realicen actividades vulnerables y entidades colegiadas","Fungir como enlace entre la Secretaría y los países, jurisdicciones u organismos internacionales o intergubernamentales, y coordinar la implementación de los acuerdos"],"x":"El enlace con países y organismos internacionales, con la coordinación de los acuerdos que se adopten, es la fr. XXIII. La fr. XIV es intercambio de información; la XX es enlace con entes nacionales.","ref":"RISCHP art. 10, fr. XXIII"},{"id":"A043","tema":"a_uif","tipo":"memoria","q":"Conforme al art. 10, fr. XV del RISCHP, ¿ante quién denuncia la UIF las conductas relacionadas con terrorismo, su financiamiento u operaciones con recursos de procedencia ilícita?","a":"Ante el Ministerio Público de la Federación y, en su caso, ante las autoridades investigadoras administrativas competentes","o":["Ante el Poder Judicial de la Federación, para que dicte directamente la sentencia condenatoria y ordene el decomiso de los bienes","Ante el Ministerio Público de la Federación y, en su caso, ante las autoridades investigadoras administrativas competentes","Ante la CNBV, para que su Dirección General de Delitos y Sanciones imponga las sanciones administrativas que procedan","Ante la Secretaría de Relaciones Exteriores, cuando existan elementos o personas involucradas fuera del territorio nacional"],"x":"La fr. XV: «Denunciar ante el Ministerio Público de la Federación y, en su caso, ante las autoridades investigadoras administrativas competentes», allegándose de los elementos probatorios. La sanción administrativa de la CNBV es un carril distinto.","ref":"RISCHP art. 10, fr. XV"},{"id":"A044","tema":"a_uif","tipo":"caso","q":"Tras analizar varios reportes, la UIF reúne elementos probatorios de una posible operación con recursos de procedencia ilícita y quiere llevar el caso a la autoridad penal. ¿Qué atribución ejerce?","a":"Denunciar las conductas, para lo cual se allegará de los elementos probatorios del caso","o":["Coadyuvar, en su caso, con las autoridades competentes, en representación de la Secretaría, en los procesos penales relativos","Coordinar el seguimiento de las denuncias formuladas por esta Unidad, desde su presentación y hasta la resolución definitiva","Celebrar acuerdos reparatorios respecto de los asuntos a que se refiere el artículo, en términos de las disposiciones aplicables","Denunciar las conductas, para lo cual se allegará de los elementos probatorios del caso"],"x":"Llevar el caso a la autoridad penal es denunciar (fr. XV). Coadyuvar (fr. XVI) y dar seguimiento (fr. XVII) ocurren después de presentada la denuncia.","ref":"RISCHP art. 10, fr. XV"},{"id":"A045","tema":"a_uif","tipo":"trampa","q":"La UIF ya presentó una denuncia ante el Ministerio Público de la Federación y quiere estar al tanto de su avance hasta que el asunto quede firme. ¿Qué atribución ejerce?","a":"Coordinar el seguimiento de las denuncias formuladas por esta Unidad, desde su presentación","o":["Coadyuvar, en su caso, con las autoridades competentes, en representación de la Secretaría, en los procesos penales relativos a las conductas","Atender los requerimientos y resoluciones de autoridades administrativas o jurisdiccionales, incluyendo al Ministerio Público de la Federación","Coordinar el seguimiento de las denuncias formuladas por esta Unidad, desde su presentación","Representar a la Unidad en toda clase de juicios o procedimientos ante los tribunales federales y ante otras autoridades competentes"],"x":"Dar seguimiento a las denuncias hasta la resolución inatacable (y a los reportes de inteligencia) es la fr. XVII. Coadyuvar en el proceso penal es la XVI: denuncio (XV), coadyuvo (XVI), sigo (XVII).","ref":"RISCHP art. 10, fr. XVII"},{"id":"A046","tema":"a_uif","tipo":"caso","q":"En el proceso penal derivado de una denuncia de la UIF, ésta interviene en representación de la Secretaría para apoyar a las autoridades competentes. ¿Qué atribución ejerce?","a":"Coadyuvar, en su caso, con las autoridades competentes en los procesos penales relativos a las conductas denunciadas","o":["Interponer los recursos que procedan contra las sentencias y resoluciones definitivas dictadas por el Tribunal Federal de Justicia Administrativa","Intervenir en los juicios de amparo en los que la Unidad o las unidades administrativas que tenga adscritas tengan el carácter de tercero interesado","Comunicar a las autoridades encargadas de la procuración de justicia la información necesaria para identificar a las personas presuntamente involucradas","Coadyuvar, en su caso, con las autoridades competentes en los procesos penales relativos a las conductas denunciadas"],"x":"La fr. XVI: «Coadyuvar, en su caso, con las autoridades competentes, en representación de la Secretaría, en los procesos penales». Las frs. XXXIX y XLV se refieren a juicios administrativos y de amparo.","ref":"RISCHP art. 10, fr. XVI"},{"id":"A047","tema":"a_uif","tipo":"memoria","q":"¿Qué atribución de la UIF concluye con la acción de «integrar los expedientes respectivos», incluso sobre las estructuras financieras de las organizaciones delictivas?","a":"Recibir y recopilar las pruebas, constancias, reportes, avisos, documentación, datos, imágenes e informes sobre las conductas","o":["Coordinar la recepción y análisis de la información contenida en los reportes, los avisos y las declaraciones del art. 9o. de la Ley Aduanera","Establecer los lineamientos y programas en materia de recepción y análisis de la información, documentación, datos e imágenes que obtenga","Comunicar a las autoridades encargadas del combate a la corrupción la información necesaria para identificar actos, operaciones y personas","Recibir y recopilar las pruebas, constancias, reportes, avisos, documentación, datos, imágenes e informes sobre las conductas"],"x":"La fr. XII es la que reúne pruebas, constancias y demás información sobre las conductas y sobre las estructuras financieras de las organizaciones delictivas «e integrar los expedientes respectivos». La fr. VIII es recepción y análisis de reportes; no habla de expedientes.","ref":"RISCHP art. 10, fr. XII"},{"id":"A048","tema":"a_uif","tipo":"caso","q":"La UIF da su visto bueno a un documento que describe esquemas y señales de alerta de lavado de dinero, y a otro que orienta a los sujetos obligados para preparar y remitir sus reportes. ¿Qué atribución ejerce?","a":"Aprobar, en su caso, las tipologías, tendencias e indicadores, así como las guías y mejores prácticas para la elaboración y el envío de los reportes y avisos","o":["Aprobar, en su caso, las tipologías, tendencias e indicadores, así como las guías y mejores prácticas para la elaboración y el envío de los reportes y avisos","Establecer los lineamientos y programas en materia de recepción y análisis de la información, documentación, datos e imágenes que obtenga, conforme a las DCG y a la LFPIORPI","Informar a las autoridades competentes, a los sujetos obligados y a quienes realicen actividades vulnerables sobre la calidad y utilidad de los reportes y avisos recibidos","Determinar y expedir, en coordinación con los órganos administrativos desconcentrados competentes, las formas oficiales para la presentación de reportes y avisos"],"x":"Aprobar tipologías, tendencias, indicadores, guías y mejores prácticas para elaborar y enviar reportes es la fr. XXIV. La XXV se refiere a lineamientos internos de recepción y análisis, no a tipologías.","ref":"RISCHP art. 10, fr. XXIV"},{"id":"A049","tema":"a_uif","tipo":"trampa","q":"La UIF fija cómo recibirá y procesará internamente la información, documentación, datos e imágenes que obtenga, incluidas las declaraciones del art. 9o. de la Ley Aduanera. ¿Qué atribución ejerce?","a":"Establecer los lineamientos y programas en materia de recepción y análisis de esa información","o":["Aprobar, en su caso, las tipologías, tendencias e indicadores, así como las guías y mejores prácticas para el envío de reportes","Establecer los lineamientos y programas en materia de recepción y análisis de esa información","Informar a las autoridades competentes y a los sujetos obligados sobre la calidad y utilidad de los reportes y avisos","Determinar y expedir, en coordinación con los desconcentrados, las formas oficiales para la presentación de reportes"],"x":"Los lineamientos y programas de recepción y análisis son la fr. XXV. Se confunde con la XXIV, que aprueba tipologías, indicadores y guías dirigidas a los sujetos obligados.","ref":"RISCHP art. 10, fr. XXV"},{"id":"A050","tema":"a_uif","tipo":"memoria","q":"Conforme al art. 10 del RISCHP, la UIF informa a las autoridades competentes, a los sujetos obligados y a quienes realicen actividades vulnerables sobre…","a":"la calidad y utilidad de los reportes y avisos","o":["las sanciones administrativas impuestas a otros sujetos obligados del mismo sector","el resultado de las visitas de inspección practicadas por las autoridades supervisoras","la calidad y utilidad de los reportes y avisos","el estado procesal de las denuncias que presentó ante el Ministerio Público de la Federación"],"x":"La fr. XXVI: informar «sobre la calidad y utilidad de los reportes y avisos». Es la base de la retroalimentación que la ENR 2023 describe entre la UIF, los SO y las supervisoras.","ref":"RISCHP art. 10, fr. XXVI"},{"id":"A051","tema":"a_uif","tipo":"trampa","q":"¿Qué autoridad tiene la atribución de «Integrar la lista de personas bloqueadas, prevista en las leyes financieras, incluida la introducción y eliminación de personas en dicha lista»?","a":"La UIF (RISCHP, art. 10, fr. XXXIV)","o":["La UIF (RISCHP, art. 10, fr. XXXIV)","Las DG de Prevención de Operaciones con Recursos de Procedencia Ilícita A, B y C de la CNBV (RI CNBV, art. 48, fr. XVIII)","La Dirección General de Atención a Autoridades de la CNBV (RI CNBV, art. 49, fr. I)","La Dirección General de Delitos y Sanciones de la CNBV (RI CNBV, art. 41)"],"x":"La UIF integra la lista (fr. XXXIV) y emite lineamientos, guías o mejores prácticas sobre ella. La CNBV sólo la envía a sus supervisadas, una vez recibida de la SHCP (art. 48, fr. XVIII): integrar ≠ enviar.","ref":"RISCHP art. 10, fr. XXXIV"},{"id":"A052","tema":"a_uif","tipo":"caso","q":"Una persona incluida en la lista de personas bloqueadas promueve un procedimiento administrativo relacionado con su inclusión. Conforme al RISCHP, ¿quién lo sustancia y resuelve?","a":"La UIF","o":["La DG de Prevención de ORPI C de la CNBV","La DG de Delitos y Sanciones de la CNBV","La UIF","La entidad financiera que aplicó el bloqueo"],"x":"La fr. XXXV atribuye a la UIF «Sustanciar y resolver los procedimientos administrativos relacionados con la integración de la lista». La CNBV sólo envía la lista a sus supervisadas.","ref":"RISCHP art. 10, fr. XXXV"},{"id":"A053","tema":"a_uif","tipo":"memoria","q":"Conforme al RISCHP, ¿qué autoridad tiene la atribución de emitir y mantener actualizada la Evaluación Nacional de Riesgos de Lavado de Dinero y Financiamiento al Terrorismo?","a":"La Unidad de Inteligencia Financiera","o":["La Vicepresidencia de Supervisión de Procesos Preventivos de la CNBV","La Unidad de Banca, Valores y Ahorro de la SHCP","La Unidad de Inteligencia Financiera","El grupo de 41 autoridades del régimen, en forma colegiada"],"x":"Es la fr. XXXVI del art. 10. Las 41 autoridades participaron en la ENR 2023, pero la UIF la coordinó y es la facultada para emitirla y mantenerla actualizada.","ref":"RISCHP art. 10, fr. XXXVI"},{"id":"A054","tema":"a_uif","tipo":"caso","q":"Se celebrará un convenio con una entidad colegiada en términos de la LFPIORPI y su Reglamento. Conforme al art. 10 del RISCHP, ¿cómo lo suscribe la UIF?","a":"En conjunto con el Servicio de Administración Tributaria","o":["En conjunto con el Servicio de Administración Tributaria","En conjunto con la Comisión Nacional Bancaria y de Valores","En conjunto con el Banco de México y la CONSAR","Previa aprobación de la Fiscalía General de la República"],"x":"La fr. XXIX: «Suscribir, en conjunto con el Servicio de Administración Tributaria, los convenios que se celebren con las entidades colegiadas». Con el Banco de México se celebran los convenios de la fr. XXVIII (sujetos del art. 51 LFPIORPI).","ref":"RISCHP art. 10, fr. XXIX"},{"id":"A055","tema":"a_uif","tipo":"caso","q":"La UIF necesita coordinar un asunto de PLD/FT con un municipio y con el poder judicial de una entidad federativa, y firmar con ellos un convenio. ¿Qué atribución ejerce?","a":"Fungir como enlace entre las unidades y desconcentrados de la Secretaría y esos entes, y negociar, celebrar e implementar convenios con ellos","o":["Fungir como enlace entre la Secretaría y los países, jurisdicciones, instancias u organismos internacionales o intergubernamentales y coordinar sus acuerdos","Fungir como enlace entre la Secretaría y los sujetos obligados a observar las DCG, así como con quienes realicen actividades vulnerables y entidades colegiadas","Establecer coordinación con las autoridades fiscales para la práctica de los actos de fiscalización que resulten necesarios con motivo de sus atribuciones","Fungir como enlace entre las unidades y desconcentrados de la Secretaría y esos entes, y negociar, celebrar e implementar convenios con ellos"],"x":"La fr. XX hace a la UIF enlace con dependencias de la APF, entidades federativas, municipios, poderes Judicial y Legislativo, FGR y otros entes, y le permite celebrar convenios con ellos. La XXIII es el enlace internacional; la XXXI, con los SO.","ref":"RISCHP art. 10, fr. XX"},{"id":"A056","tema":"a_uif","tipo":"caso","q":"La UIF transmite a una fiscalía anticorrupción la información necesaria para identificar operaciones y personas presuntamente involucradas con recursos ilícitos, en términos del art. 47 de la LFPIORPI. ¿Qué atribución ejerce?","a":"Comunicar a las autoridades encargadas del combate a la corrupción o de procuración de justicia la información necesaria","o":["Denunciar ante el Ministerio Público de la Federación y las autoridades investigadoras administrativas las conductas, allegándose de pruebas","Dar a conocer a quienes realicen actividades vulnerables las listas, reportes, mecanismos, informes o resoluciones previstas en las disposiciones","Comunicar a las autoridades encargadas del combate a la corrupción o de procuración de justicia la información necesaria","Atender los requerimientos y resoluciones de autoridades administrativas o jurisdiccionales, siempre que no correspondan a otra unidad"],"x":"Comunicar información a las autoridades anticorrupción o de procuración de justicia, en términos del art. 47 de la LFPIORPI, es la fr. XXXIII. Denunciar (fr. XV) implica presentar la denuncia de conductas, no sólo transmitir información.","ref":"RISCHP art. 10, fr. XXXIII"},{"id":"A057","tema":"a_uif","tipo":"caso","q":"Un sujeto obligado impugna una resolución de la UIF y el Tribunal Federal de Justicia Administrativa dicta sentencia definitiva en contra de la Unidad. Conforme al art. 10 del RISCHP, ¿qué puede hacer la UIF?","a":"Interponer los recursos que procedan contra la sentencia y, en su caso, acordar la no interposición de dicho recurso","o":["Celebrar un acuerdo reparatorio con el sujeto obligado para dejar sin efectos la sentencia del Tribunal","Solicitar a la CNBV que imponga una sanción administrativa al sujeto obligado que obtuvo la sentencia","Interponer los recursos que procedan contra la sentencia y, en su caso, acordar la no interposición de dicho recurso","Denunciar la sentencia ante el MPF como conducta prevista en la LFPIORPI, allegándose de pruebas"],"x":"La fr. XXXIX faculta a la UIF a interponer los recursos contra sentencias y resoluciones definitivas del TFJA y, en su caso, acordar no interponerlos. Es parte del bloque de defensa jurídica (frs. XXXVIII a XLV).","ref":"RISCHP art. 10, fr. XXXIX"},{"id":"A058","tema":"a_uif","tipo":"caso","q":"Una persona ejerce su derecho de petición ante la UIF mediante un escrito sobre un asunto de la competencia de la Unidad. Conforme al art. 10 del RISCHP, ¿qué corresponde?","a":"La UIF atiende el escrito, por ser un asunto de su competencia","o":["La UIF lo turna a la CNBV, que es la que atiende peticiones de particulares en PLD/FT","La UIF atiende el escrito, por ser un asunto de su competencia","La UIF lo remite al SAT, porque las peticiones de particulares son de su competencia","La UIF sólo lo atiende si quien lo presenta es un sujeto obligado o realiza actividades vulnerables"],"x":"La fr. XLIV: «Atender los escritos de los particulares en los que ejerzan el derecho de petición, en asuntos de su competencia». No exige que el particular sea sujeto obligado.","ref":"RISCHP art. 10, fr. XLIV"},{"id":"A059","tema":"a_cnbv","tipo":"memoria","q":"Conforme al art. 1 de su Reglamento Interior, la CNBV es…","a":"un órgano administrativo desconcentrado de la SHCP, con autonomía técnica y atribuciones ejecutivas","o":["un organismo descentralizado de la SHCP, con personalidad jurídica y patrimonio propios y autonomía de gestión","un órgano constitucional autónomo, con autonomía técnica y de gestión, independiente de la Administración Pública Federal","un órgano administrativo desconcentrado de la SHCP, con autonomía técnica y atribuciones ejecutivas","una unidad administrativa adscrita a la UIF, con atribuciones de supervisión en materia de PLD/FT y autonomía técnica"],"x":"El art. 1 define a la CNBV como «órgano administrativo desconcentrado de la Secretaría de Hacienda y Crédito Público, con autonomía técnica y atribuciones ejecutivas». No es descentralizado ni autónomo constitucional.","ref":"RI CNBV art. 1"},{"id":"A060","tema":"a_cnbv","tipo":"memoria","q":"Conforme al art. 4 del Reglamento Interior de la CNBV, ¿cuál es la vicepresidencia con la que se relacionan las DG de Prevención de ORPI en sus estadísticas, automatización e indicadores de gestión (art. 48, frs. XII a XV)?","a":"Vicepresidencia de Supervisión de Procesos Preventivos","o":["Vicepresidencia de Prevención de Operaciones con Recursos de Procedencia Ilícita","Vicepresidencia de Inteligencia Financiera y Prevención del Lavado de Dinero","Vicepresidencia de Supervisión de Conducta y Riesgos Preventivos del Mercado","Vicepresidencia de Supervisión de Procesos Preventivos"],"x":"El art. 4, fr. II, A, nombra la «Vicepresidencia de Supervisión de Procesos Preventivos», y el art. 48, frs. XII a XV, se refiere a ella. «Prevención de Operaciones con Recursos de Procedencia Ilícita» es el nombre de las DG A, B y C, no de una vicepresidencia.","ref":"RI CNBV art. 4"},{"id":"A061","tema":"a_cnbv","tipo":"caso","q":"La DG de Prevención de Operaciones con Recursos de Procedencia Ilícita B concluye una visita y encuentra incumplimientos que ameritan sanción administrativa. ¿Qué unidad de la CNBV puede imponerla?","a":"La DG de Delitos y Sanciones, cuando la Junta de Gobierno le haya delegado esa facultad","o":["La propia DG de Prevención de ORPI B, como parte de su atribución de verificar el cumplimiento","La Vicepresidencia de Supervisión de Procesos Preventivos, mediante acuerdo de su titular","La DG de Delitos y Sanciones, cuando la Junta de Gobierno le haya delegado esa facultad","La DG de Atención a Autoridades, al atender el requerimiento de la autoridad competente"],"x":"Las DG PLD supervisan (art. 48), pero la sanción administrativa la impone la DG de Delitos y Sanciones, previa audiencia, «cuando le hayan sido delegadas por la Junta de Gobierno» (art. 41, fr. XI). Supervisar ≠ sancionar.","ref":"RI CNBV art. 41, fr. XI"},{"id":"A062","tema":"a_cnbv","tipo":"caso","q":"Una DG de Prevención de ORPI acude a un transmisor de dinero sujeto a la supervisión de la CNBV para verificar el cumplimiento PLD/FT. Conforme al art. 48, ¿qué visitas puede practicarle?","a":"Ordinarias, especiales y de investigación","o":["Sólo ordinarias, conforme al programa anual de supervisión","Ordinarias y de vigilancia reforzada, previa autorización de la UIF","Especiales y de investigación, sólo a petición de Delitos y Sanciones","Ordinarias, especiales y de investigación"],"x":"El art. 48, fr. II permite practicar «visitas ordinarias, especiales y de investigación» a Entidades, centros cambiarios, transmisores de dinero y SOFOM no reguladas, sin autorización de la UIF.","ref":"RI CNBV art. 48, fr. II"},{"id":"A063","tema":"a_cnbv","tipo":"caso","q":"Una persona aspira a certificarse como oficial de cumplimiento. Conforme al RI CNBV, ¿qué unidades de la CNBV tienen la atribución de certificar a estos profesionales?","a":"Las DG de Prevención de ORPI A, B y C","o":["La Dirección General de Autorizaciones al Sistema Financiero","La Dirección General de Órganos de Gobierno y Consultoría Jurídica","Las DG de Prevención de ORPI A, B y C","La Dirección General de Métodos y Procesos de Supervisión"],"x":"El art. 48, fr. X faculta a las DG PLD A, B y C para «Certificar a los auditores externos independientes, oficiales de cumplimiento y demás profesionales»; sus coordinaciones también pueden ejercerla.","ref":"RI CNBV art. 48, fr. X"},{"id":"A064","tema":"a_cnbv","tipo":"memoria","q":"¿Dónde se encuentra la atribución de «Certificar a los auditores externos independientes, oficiales de cumplimiento y demás profesionales en términos de lo dispuesto en el artículo 4, fracciones X y X Bis de la LCNBV»?","a":"RI CNBV, art. 48, fr. X","o":["RI CNBV, art. 48, fr. X","RI CNBV, art. 41, fr. XI","RISCHP, art. 10, fr. XXIV","RI CNBV, art. 46, fr. I"],"x":"Está en el art. 48, fr. X, entre las atribuciones de las DG PLD A, B y C. El art. 41, fr. XI es la sanción administrativa (Delitos y Sanciones) y el 46, fr. I, la expedición de disposiciones (DG de Disposiciones).","ref":"RI CNBV art. 48, fr. X"},{"id":"A065","tema":"a_cnbv","tipo":"caso","q":"Una entidad financiera supervisada por la CNBV recibe la lista de personas bloqueadas. Conforme al RI CNBV, ¿qué unidad se la envía y de dónde la recibe esa unidad?","a":"Las DG de Prevención de ORPI de la CNBV, que la reciben de la SHCP","o":["La DG de Atención a Autoridades de la CNBV, que la recibe del Poder Judicial","Las DG de Prevención de ORPI de la CNBV, que la reciben de la SHCP","Las DG de Supervisión de Grupos e Intermediarios Financieros, que la reciben de la FGR","La DG de Delitos y Sanciones de la CNBV, que la recibe del Banco de México"],"x":"El art. 48, fr. XVIII: las DG PLD envían a sus supervisadas «la lista de personas bloqueadas que reciba por parte de la Secretaría de Hacienda y Crédito Público». Quien la integra es la UIF (RISCHP art. 10, fr. XXXIV).","ref":"RI CNBV art. 48, fr. XVIII"},{"id":"A066","tema":"a_cnbv","tipo":"trampa","q":"Conforme al art. 48 del RI CNBV, ¿qué atribución tienen las DG de Prevención de ORPI respecto de las DCG que expide la SHCP en materia de prevención, detección y reporte de operaciones de los arts. 139 Quáter o 400 Bis del CPF?","a":"Emitir opinión a la SHCP respecto de dichas disposiciones","o":["Expedirlas en el ámbito de competencia de la Comisión, como disposiciones propias","Aprobarlas antes de su publicación en el Diario Oficial de la Federación","Proponerlas, para aprobación superior, y resolver lo referente a su aplicación","Emitir opinión a la SHCP respecto de dichas disposiciones"],"x":"El art. 48, fr. III: «Emitir opinión a la Secretaría de Hacienda y Crédito Público» sobre esas DCG. Quien las emite es la SHCP; «proponer, para aprobación superior» es redacción de la UIF (RISCHP art. 10, fr. II).","ref":"RI CNBV art. 48, fr. III"},{"id":"A067","tema":"a_cnbv","tipo":"caso","q":"La SHCP prepara DCG en materia de prevención, detección y reporte de operaciones de los arts. 139 Quáter o 400 Bis del CPF y requiere la opinión de la CNBV. ¿Qué unidad de la Comisión la emite?","a":"Las DG de Prevención de ORPI A, B y C (art. 48, fr. III)","o":["La DG de Disposiciones, que opina sobre las disposiciones de otras autoridades financieras (art. 46, fr. III)","La DG de Desarrollo Regulatorio, por tratarse de un proyecto de regulación de la Secretaría (art. 4)","La DG de Asuntos Jurídicos Bursátiles, por tratarse de la interpretación de un proyecto normativo (art. 4)","Las DG de Prevención de ORPI A, B y C (art. 48, fr. III)"],"x":"La DG de Disposiciones opina sobre disposiciones de otras autoridades financieras «con excepción» de la materia PLD/FT (art. 46, fr. III). Esa opinión corresponde a las DG PLD (art. 48, fr. III).","ref":"RI CNBV art. 48, fr. III; art. 46, fr. III"},{"id":"A068","tema":"a_cnbv","tipo":"trampa","q":"Conforme al art. 46, fr. III del RI CNBV, la DG de Disposiciones ejerce las atribuciones para dar opinión sobre las disposiciones que otras autoridades financieras pretendan expedir, con excepción de…","a":"las materias relativas a la prevención, detección y reporte de operaciones de los arts. 139 Quáter o 400 Bis del CPF","o":["las materias relativas a la prevención, detección y reporte de operaciones de los arts. 139 Quáter o 400 Bis del CPF","las disposiciones que emita el Banco de México en materia de sistemas de pagos y de los denominados Riesgos Adicionales","las materias relativas a los usos mercantiles, bancarios y bursátiles o sanas prácticas de los mercados financieros del país","las disposiciones aplicables a las instituciones de tecnología financiera y a las sociedades autorizadas para operar con modelos novedosos"],"x":"La excepción del art. 46, fr. III es la materia PLD/FT (arts. 139 Quáter o 400 Bis del CPF), cuya opinión queda en las DG PLD (art. 48, fr. III).","ref":"RI CNBV art. 46, fr. III"},{"id":"A069","tema":"a_cnbv","tipo":"caso","q":"Un supervisor extranjero homólogo pide a la CNBV intercambio de información y asistencia técnica en temas prudenciales. Conforme al art. 38, fr. II del RI, ¿qué unidad actúa como coordinador y enlace, y con qué salvedad?","a":"La DG de Asuntos Internacionales, salvo con autoridades internacionales en materia de prevención, detección y reporte de ORPI/FT","o":["La DG de Asuntos Internacionales, sin salvedad alguna por materia, con todas las autoridades homólogas y organismos multilaterales","La DG de Prevención de ORPI A, en todos los temas con autoridades homólogas, salvo los relativos a las emisoras de valores","La DG de Atención a Autoridades, salvo con organismos multilaterales internacionales en temas bursátiles y de inversiones","La DG de Asuntos Internacionales, salvo con autoridades internacionales en materia de prevención, detección y reporte de ORPI/FT"],"x":"El art. 38, fr. II hace a la DG de Asuntos Internacionales coordinador y enlace con homólogos extranjeros, «salvo con autoridades internacionales en materia de prevención, detección y reporte» de los arts. 139 Quáter o 400 Bis del CPF.","ref":"RI CNBV art. 38, fr. II"},{"id":"A070","tema":"a_cnbv","tipo":"memoria","q":"Conforme al art. 48 del RI CNBV, ¿con quién pueden las DG de Prevención de ORPI compartir o intercambiar la información que hubieren obtenido en el ejercicio de sus facultades?","a":"Con organismos, dependencias y autoridades nacionales e internacionales relacionadas con la prevención, detección y combate de LD y FT","o":["Con organismos, dependencias y autoridades nacionales e internacionales relacionadas con la prevención, detección y combate de LD y FT","Sólo con la UIF, como autoridad central del régimen de PLD/CFT, la cual decide si la comparte con autoridades extranjeras o nacionales","Sólo con autoridades nacionales; con las extranjeras, exclusivamente a través de la DG de Asuntos Internacionales de la Comisión","Sólo con la SRE, por ser la dependencia que coordina la asistencia legal mutua con autoridades extranjeras en la materia"],"x":"El art. 48, fr. XVI permite compartir o intercambiar información con organismos, dependencias y autoridades «nacionales e internacionales» relacionadas con los delitos de los arts. 139 Quáter o 400 Bis del CPF. La UIF tiene una atribución similar (art. 10, fr. XIV): ambas intercambian.","ref":"RI CNBV art. 48, fr. XVI"},{"id":"A071","tema":"a_cnbv","tipo":"caso","q":"Un juez ordena el aseguramiento de las cuentas de un cliente de un banco y dirige la orden a la CNBV. Conforme al RI CNBV, ¿qué unidad la atiende?","a":"La Dirección General de Atención a Autoridades","o":["La Dirección General de Delitos y Sanciones","La Dirección General de Prevención de ORPI A","La Dirección General Contenciosa de la CNBV","La Dirección General de Atención a Autoridades"],"x":"El art. 49, fr. I asigna a la DG de Atención a Autoridades atender requerimientos de información y órdenes de aseguramiento o desbloqueo de cuentas de autoridades judiciales, hacendarias y administrativas, con sujeción al secreto financiero.","ref":"RI CNBV art. 49, fr. I"},{"id":"A072","tema":"a_cnbv","tipo":"caso","q":"Una persona moral quiere operar como transmisor de dinero y solicita su inscripción conforme a la LGOAAC. ¿Qué unidad de la CNBV lleva el registro correspondiente?","a":"La DG de Prevención de ORPI C","o":["La DG de Prevención de ORPI A","La DG de Autorizaciones al Sistema Financiero","La DG de Prevención de ORPI C","La DG de Autorizaciones Especializadas"],"x":"El art. 48, en el párrafo que sigue a la fr. XIX, asigna sólo a la DG PLD C llevar el Registro Público de Centros cambiarios y Transmisores de dinero, así como inscribir y renovar el registro y hacer sus anotaciones.","ref":"RI CNBV art. 48, párrafo que sigue a la fr. XIX"},{"id":"A073","tema":"a_cnbv","tipo":"caso","q":"La DG de Supervisión de Instituciones de Tecnología Financiera quiere verificar, en una ITF que supervisa, el cumplimiento de las disposiciones PLD/FT. Conforme al RI CNBV, ¿puede hacerlo?","a":"Sí, cuando así lo acuerde con las DG de Prevención de ORPI A, B o C, de manera coordinada","o":["No; la verificación PLD/FT es exclusiva de las DG de Prevención de ORPI, sin excepción alguna","Sí, por sí sola, sin necesidad de acuerdo alguno con otra unidad administrativa de la Comisión","Sí, cuando así lo acuerde con las DG de Prevención de ORPI A, B o C, de manera coordinada","Sólo cuando la UIF se lo instruya mediante requerimiento formal, fundado y motivado"],"x":"El art. 18, penúltimo párrafo, permite a las DG supervisoras (entre ellas la de ITF) ejercer esas atribuciones PLD/FT «cuando así lo acuerden» con las DG PLD A, B o C, de manera coordinada (véase también art. 48, fr. I).","ref":"RI CNBV art. 18, penúltimo párrafo"},{"id":"A074","tema":"a_cnbv","tipo":"memoria","q":"Conforme al art. 48, fr. VI del RI CNBV, ¿qué pueden emitir las DG de Prevención de ORPI para el adecuado cumplimiento de las DCG en materia de prevención?","a":"Lineamientos, mejores prácticas, criterios, directrices y guías, sin perjuicio de la competencia de la SHCP","o":["Lineamientos, mejores prácticas, criterios, directrices y guías, sin perjuicio de la competencia de la SHCP","Las disposiciones de carácter general en la materia, en sustitución de la SHCP y con efectos generales","La interpretación, para efectos administrativos, de la LFPIORPI, su Reglamento y sus reglas generales","Las formas oficiales para la presentación de reportes, en coordinación con la UIF y con el SAT"],"x":"La fr. VI permite emitir lineamientos, mejores prácticas, criterios, directrices y guías, «sin perjuicio de la competencia que en materia de emisión de disposiciones de carácter general tiene la» SHCP. Interpretar la LFPIORPI y expedir formas oficiales son de la UIF.","ref":"RI CNBV art. 48, fr. VI"},{"id":"A075","tema":"a_cnbv","tipo":"caso","q":"Una DG de Prevención de ORPI detecta que un centro cambiario realiza operaciones en contravención a la LGOAAC. Conforme al art. 48 del RI CNBV, ¿qué puede hacer?","a":"Proponer a la DG de Delitos y Sanciones la suspensión de sus operaciones","o":["Proponer a la DG de Delitos y Sanciones la suspensión de sus operaciones","Ordenar por sí misma la clausura de sus oficinas y su intervención gerencial","Solicitar a la UIF que suspenda sus operaciones mediante resolución definitiva","Cancelar directamente su registro y notificarlo al Banco de México"],"x":"El art. 48, fr. VII: «Proponer a la Dirección General de Delitos y Sanciones, la suspensión de operaciones» de centros cambiarios y transmisores de dinero. La DG PLD propone; no ordena la suspensión.","ref":"RI CNBV art. 48, fr. VII"},{"id":"A076","tema":"a_cnbv","tipo":"caso","q":"En la investigación de hechos que contravienen disposiciones PLD/FT de su competencia, una DG de Prevención de ORPI necesita escuchar a un presunto infractor. Conforme al RI CNBV, ¿puede requerir su comparecencia?","a":"Sí; el art. 48 le permite requerir la comparecencia de presuntos infractores y demás personas que puedan contribuir a la investigación","o":["No; sólo la DG de Delitos y Sanciones puede emplazar y hacer constar la comparecencia de presuntos infractores en la Comisión","Sí; el art. 48 le permite requerir la comparecencia de presuntos infractores y demás personas que puedan contribuir a la investigación","No; debe solicitarlo a la UIF, que es la autoridad que requiere y recaba información de los sujetos obligados del régimen","Sí, pero únicamente cuando el presunto infractor sea un centro cambiario o un transmisor de dinero registrado ante ella"],"x":"El art. 48, fr. XI faculta a las DG PLD a «Requerir la comparecencia de presuntos infractores y demás personas que puedan contribuir al adecuado desarrollo de la investigación». La DG de Delitos y Sanciones tiene una atribución parecida (art. 41, fr. I), pero no exclusiva.","ref":"RI CNBV art. 48, fr.
