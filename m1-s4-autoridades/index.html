<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa interactivo del régimen de prevención y de las autoridades nacionales en PLD/FT (temario CNBV 1.3), con fichas de la UIF y la CNBV y simulador de 80 reactivos.">
<title>Mapa de las autoridades nacionales PLD/FT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accion);color:var(--accion-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px;margin-top:4px}
.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}
/* repaso (tandas al azar o secuencia fija) */
.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rp-fallas h3{font-size:18px}
.rp-fallas p{font-size:14.5px}
.rp-box{scroll-margin-top:90px}
.rp-box .qtext{font-size:clamp(22px,2.8vw,34px)}
.rp-box .opt{font-size:17px}
.rp-clave{margin-top:12px;border-left:6px solid var(--principal-linea);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600}
.rp-clave .lbl{margin-bottom:4px}
.rp-fin{margin:10px 0 0;padding-left:22px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,26px);line-height:1.35}
.rp-fin li{margin:10px 0}
.rp-fin small{display:block;font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--muted)}
.rp-box:fullscreen{max-width:none;border-radius:0;border:0;padding:40px 6vw;overflow:auto;background:var(--bg)}
.rp-box:fullscreen .qtext{font-size:clamp(26px,3vw,42px)}
.rp-box:fullscreen .opt{font-size:20px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}

  .hero{grid-template-columns:1fr}

  .stepd{grid-template-columns:1fr}
  .stepd ul{columns:1}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
/* franja del sitio (modo sitio: sólo si datos.sitio existe) */
.sitebar{display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:8px 16px;background:var(--negro);color:#fff;overflow-x:auto;scrollbar-width:none;font-family:var(--f-display);font-size:13px}
.sitebar::-webkit-scrollbar{display:none}
.sitebar .sb-mod{font-weight:700;letter-spacing:.04em;white-space:nowrap;margin-right:4px;color:#fff;text-decoration:none}

.sitebar .sb-p{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:700;white-space:nowrap;flex:none}
.sitebar a.sb-p:hover{border-color:#fff}
.sitebar .sb-p[aria-current="page"]{background:var(--principal);border-color:var(--principal);color:var(--principal-ink)}
.sitebar .sb-p.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.sitebar .sb-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex:none}
.sitebar .sb-cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.sitebar .sb-ses{white-space:nowrap;color:rgba(255,255,255,.8);margin-left:auto;padding-left:12px;font-weight:600}
@media (max-width:700px){.sitebar .sb-ses{display:none}}
@media print{
  body{background:#fff;padding:0}
  .sitebar,.top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}
  .quiz{box-shadow:none;border:0;padding:0;max-width:none}

  .miss{background:none;padding:0} .miss li{break-inside:avoid;margin:10px 0}
  .trow2 .tb{border-color:#999} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

{"meta":{"titulo":"Mapa de las autoridades nacionales PLD/FT","descripcion":"Mapa interactivo del régimen de prevención y de las autoridades nacionales en PLD/FT (temario CNBV 1.3), con fichas de la UIF y la CNBV y simulador de 80 reactivos.","repo":"m1-s4-autoridades","clave":"m1s4","ruta":"financiero","modulo":"Módulo 1 · Certificación CNBV PLD/FT","unidad":"participantes","eyebrow":"Temario CNBV 1.3 · RISCHP art. 10: compilado DOF 6-mar-2023, reformas 17-ene-2024 y 24-feb-2025 (el temario lo cita como «DOF 11-sep-1996, última reforma 24-feb-2025») · RI CNBV 2022 · ENR 2023","h1_antes":"Autoridades","h1_resaltado":"nacionales","h1_despues":"en PLD/FT","intro":"Quién pone las reglas, quién cumple, quién vigila, quién convierte los reportes en inteligencia y quién castiga. Toca cualquier participante para ver sus funciones con fundamento; después entra a las fichas de la UIF y de la CNBV y practica con 80 reactivos.","fuente":"Fuente: Reglamento Interior de la SHCP (DOF 6-mar-2023, reformas del 17-ene-2024 y 24-feb-2025), art. 10; Reglamento Interior de la CNBV (DOF 28-feb-2022); Evaluación Nacional de Riesgos de LD y FT 2023 (noviembre 2023), apartados II y III y factores de riesgo 7 y 12; CNBV-VSPP, «Lavado de Dinero» (30-abr-2019), p. 2."},"trampas":[{"titulo":"La UIF recibe y analiza; la CNBV supervisa.","texto":"La UIF coordina la recepción y análisis de reportes y avisos (art. 10, fr. VIII). La verificación del cumplimiento es de los órganos desconcentrados supervisores (CNBV, CNSF y CONSAR en el sistema financiero; SAT en actividades vulnerables, según la ENR 2023); en la CNBV, de las DG PLD A, B y C (RI CNBV art. 48, frs. I y II). La UIF sólo <b>participa<\/b> con esos órganos en la revisión (fr. VII) y <b>hace del conocimiento<\/b> de ellos el incumplimiento para que, en su caso, ejerzan sus atribuciones (fr. XXI)."},{"titulo":"Proponer ≠ emitir.","texto":"La UIF propone y emite <b>opinión<\/b> sobre los proyectos de DCG que deba emitir la Secretaría (fr. I); la CNBV también emite opinión a la SHCP (art. 48, fr. III). Quien emite las DCG es la SHCP (ENR 2023, apartado III). La CNBV sí emite lineamientos, guías y criterios para su adecuado cumplimiento, <b>sin perjuicio<\/b> de la competencia de la SHCP (art. 48, fr. VI)."},{"titulo":"Supervisar ≠ sancionar · integrar ≠ enviar.","texto":"Las DG de Prevención de Operaciones con Recursos de Procedencia Ilícita A, B y C supervisan (art. 48). La DG de Delitos y Sanciones otorga audiencia e impone la sanción administrativa cuando le haya sido delegada por la Junta de Gobierno (art. 41, fr. XI; la Junta puede delegarla en el Presidente y otros servidores públicos, art. 10). La lista de personas bloqueadas la <b>integra<\/b> la UIF (art. 10, fr. XXXIV) y la <b>envía<\/b> la CNBV a sus supervisadas (art. 48, fr. XVIII)."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"El régimen","titulo":"El régimen de prevención: quién hace qué","intro":"Orden <b>didáctico<\/b>, no legal: la vida de un reporte, de la regla a la sentencia. Los participantes salen de la ENR 2023 (apartado III, con apoyos del apartado II y de los factores 7 y 12) y del diagrama de la CNBV «Participantes en el Régimen Preventivo» (VSPP, 2019). Ritmo 3 · 4 · 2 · 3.","centro":{"t":"Régimen de PLD/FT","s":"4 preguntas<br>12 participantes"},"ramas":[{"letra":"1","titulo":"Regla","pregunta":"¿Quién pone las reglas?","ritmo":"Regulan","corto":"Regla","color":"morado","items":[{"etiqueta":"SHCP","nombre":"Unidades de la SHCP","sub":"UBVA · UBD · USPSS","verbo":"Emito","desc":"Autoridad reguladora: crea el marco jurídico de PLD/FT. Con base en las leyes financieras, la SHCP emite las disposiciones de carácter general (DCG).","orden":1,"panel":"Autoridad reguladora","puntos":["<b>ENR 2023, III.2 · Conformación:<\/b> SHCP, por medio de la Unidad de Banca de Desarrollo (UBD), la Unidad de Banca, Valores y Ahorro (UBVA), la Unidad de Seguros, Pensiones y Seguridad Social (USPSS) y la UIF, así como el Banco de México.","<b>Funciones:<\/b> creación del marco jurídico relativo a la PLD/CFT, por medio de la formulación de políticas de promoción, regulación y supervisión, así como la interpretación del marco normativo.","<b>ENR 2023, III:<\/b> el régimen en las Leyes Financieras ha otorgado a la SHCP la atribución de emitir DCG en la materia, por medio de sus unidades administrativas competentes.","<b>Diagrama CNBV (VSPP, 2019):<\/b> «Unidad de Banca, Valores y Ahorro y Unidad de Banca de Desarrollo (SHCP)» · emisión de normatividad en la materia."],"destacado":false},{"etiqueta":"UIF","nombre":"La UIF como reguladora","sub":"Art. 10, frs. I a III","verbo":"Propongo","desc":"La ENR la cuenta también entre las reguladoras: propone y opina sobre las DCG que emite la Secretaría, propone las reglas de la LFPIORPI e interpreta esa ley.","orden":2,"panel":"UIF · autoridad reguladora","puntos":["<b>Fr. I.<\/b> Proponer y emitir opinión a las demás unidades administrativas de la Secretaría sobre los proyectos de disposiciones de carácter general aplicables a las entidades y personas señaladas en los artículos 14, fracción I; 15, fracción I, y 16, fracción I, de este Reglamento que deba emitir la Secretaría en relación con: a) El establecimiento de medidas y procedimientos para prevenir y detectar actos, omisiones u operaciones que pudieran favorecer, prestar ayuda, auxilio o cooperación de cualquier especie para la comisión de los delitos de terrorismo y su financiamiento o de operaciones con recursos de procedencia ilícita; b) La presentación a la Secretaría de reportes sobre los actos, operaciones y servicios que las entidades y personas obligadas a ello realicen con sus clientes y usuarios, relativos al inciso anterior, así como sobre todo acto, operación o servicio que, en su caso, realicen los miembros del consejo de administración, directivos, funcionarios, empleados y apoderados de dichos sujetos obligados, que pudiesen ubicarse en el supuesto previsto en el inciso anterior o que, en su caso, pudiesen contravenir o vulnerar la adecuada aplicación de las disposiciones señaladas, y c) Los lineamientos sobre el procedimiento y criterios que las entidades y personas obligadas deban observar en términos de ley respecto del adecuado conocimiento de sus clientes y usuarios; la información y documentación que, en su caso, dichos sujetos deban recabar para la apertura de cuentas o celebración de contratos relativos a las operaciones y servicios que ellas presten y que acredite la identidad de sus clientes; la forma en que los mismos sujetos deberán resguardar y garantizar la seguridad de la información y documentación relativas a la identificación de sus clientes y usuarios o de quienes lo hayan sido; la de aquellos actos, operaciones y servicios reportados de acuerdo con lo anterior; los términos para proporcionar capacitación al interior de las entidades y personas obligadas de conformidad con la ley sobre la materia objeto de esta fracción; el uso de sistemas automatizados que coadyuven al cumplimiento de las medidas y procedimientos establecidas en las disposiciones de carácter general a que se refiere esta fracción, así como el establecimiento de estructuras internas que deban funcionar como áreas de cumplimiento en la materia, al interior de cada sujeto obligado.","<b>Fr. II.<\/b> Proponer, para aprobación superior, las reglas de carácter general que la Secretaría deba emitir en términos de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento, y resolver lo referente a su aplicación.","<b>Fr. III.<\/b> Interpretar, para efectos administrativos, la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, su Reglamento, las reglas de carácter general y demás disposiciones jurídicas que de dichos ordenamientos emanen, en el ámbito de competencia de la Secretaría.","Ojo: <b>propone y opina<\/b>; quien emite las DCG es la SHCP."],"destacado":false},{"etiqueta":"Banxico","nombre":"Banco de México","sub":"Reguladora y supervisora","verbo":"Regulo","desc":"Aparece dos veces en la ENR 2023: entre las autoridades reguladoras y como supervisor de los riesgos adicionales en lo que se refiere a sistemas de pagos.","orden":3,"panel":"Banco de México","puntos":["<b>ENR 2023, III.2:<\/b> forma parte de las autoridades reguladoras.","<b>ENR 2023, III.3:<\/b> también supervisa la parte de obligaciones de los denominados Riesgos Adicionales, en lo que se refiere a los sistemas de pagos.","No aparece en el diagrama de la CNBV de 2019."],"destacado":false}]},{"letra":"2","titulo":"Cumplo y vigilo","pregunta":"¿Quién cumple y quién lo vigila?","ritmo":"Cumplen y supervisan","corto":"Cumplo","color":"turquesa","items":[{"etiqueta":"SO","nombre":"Sujetos obligados","sub":"Sistema financiero y AV","verbo":"Reporto","desc":"Primer frente con los clientes: los identifican y conocen, monitorean sus operaciones, detectan las de riesgo y envían reportes y avisos a la UIF.","orden":4,"panel":"Sujetos obligados","puntos":["<b>ENR 2023, III.1 · Conformación:<\/b> integrantes del Sistema Financiero Mexicano y quienes realizan actividades vulnerables.","<b>Funciones:<\/b> identificar y conocer a los clientes, monitorear las operaciones realizadas, detectar operaciones de riesgo y enviar reportes y avisos a la UIF.","Son el primer frente con los clientes y usuarios que proporcionan la información necesaria a las autoridades.","<b>Diagrama CNBV (VSPP, 2019):<\/b> aplicación de políticas de identificación y conocimiento de clientes y usuarios · presentación de reportes de operaciones."],"destacado":false},{"etiqueta":"CNBV","nombre":"Comisión Nacional Bancaria y de Valores","sub":"Autoridad supervisora","verbo":"Superviso","desc":"Supervisa que las entidades financieras de su competencia cumplan con PLD/FT, por vigilancia e inspección. El diagrama de la CNBV le suma sanciones y requerimientos.","orden":5,"panel":"CNBV","puntos":["<b>ENR 2023, III.3:<\/b> autoridad supervisora; supervisa que los SO cumplan con sus obligaciones adecuadamente, por medio de acciones de vigilancia e inspección.","<b>Diagrama CNBV (VSPP, 2019):<\/b> supervisión del cumplimiento de la normatividad · imposición de sanciones · atención a requerimientos de autoridades.","<b>RI CNBV, art. 1:<\/b> órgano administrativo desconcentrado de la SHCP, con autonomía técnica y atribuciones ejecutivas.","Detalle de sus unidades en la sección «Fichas CNBV»."],"destacado":true},{"etiqueta":"CNSF · CONSAR","nombre":"CNSF y CONSAR","sub":"Autoridades supervisoras","verbo":"Supervisan","desc":"Las otras dos supervisoras del sistema financiero: vigilan el cumplimiento PLD/FT de las entidades financieras sobre las que tienen competencia.","orden":6,"panel":"CNSF y CONSAR","puntos":["<b>ENR 2023, III.3:<\/b> la Comisión Nacional de Seguros y Fianzas (CNSF) y la Comisión Nacional del Sistema de Ahorro para el Retiro (CONSAR) son autoridades supervisoras.","<b>ENR 2023, factor 12:<\/b> la CONSAR, la CNBV y la CNSF supervisan tratándose de las Entidades Financieras sobre las que tienen competencia.","<b>ENR 2023, factor 7:<\/b> las tres supervisoras del SF (CNBV, CNSF y CONSAR) cuentan con matrices de riesgos para cada sector supervisado."],"destacado":false},{"etiqueta":"SAT","nombre":"Servicio de Administración Tributaria","sub":"Supervisor de AV","verbo":"Verifico","desc":"Supervisa a quienes realizan actividades vulnerables conforme a la LFPIORPI: revisión extra situ a riesgo bajo–medio y visitas in situ a los de mayor riesgo.","orden":7,"panel":"SAT","puntos":["<b>ENR 2023, III.3:<\/b> autoridad supervisora.","<b>ENR 2023, factor 12:<\/b> el SAT supervisa a quienes realizan Actividades Vulnerables conforme a la LFPIORPI.","<b>ENR 2023, factor 12:<\/b> realiza supervisión extra situ a los SO que representen un riesgo bajo–medio y visitas de verificación in situ a los de mayor riesgo, de acuerdo con su matriz de riesgo."],"destacado":false}]},{"letra":"3","titulo":"Inteligencia","pregunta":"¿Quién convierte reportes en inteligencia?","ritmo":"La UIF","corto":"UIF","color":"principal","items":[{"etiqueta":"UIF · VIII","nombre":"Recibe y analiza","sub":"Unidad de Inteligencia Financiera","verbo":"Analizo","desc":"Recibe los reportes y avisos de los sujetos obligados y analiza la información para detectar posibles conductas de LD/FT. Es la autoridad central del régimen.","orden":8,"panel":"UIF · recibe y analiza","puntos":["<b>ENR 2023, III.4:<\/b> recibir reportes y avisos por parte de los SO, analizar la información recibida para detectar posibles conductas de LD/FT y diseminar los productos de inteligencia realizados.","<b>ENR 2023, II.2 d):<\/b> la UIF es la autoridad central del régimen de PLD/CFT y coordinó la ENR 2023.","<b>Fr. VIII.<\/b> Coordinar la recepción y análisis de la información contenida en los reportes a que se refiere el inciso b) de la fracción I de este artículo, los avisos previstos en la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento, y en las declaraciones a que se refiere el artículo 9o. de la Ley Aduanera.","<b>Fr. IX.<\/b> Requerir y recabar de las entidades y personas sujetas a las disposiciones de carácter general señaladas en la fracción I de este artículo y de quienes realicen las actividades vulnerables, entidades colegiadas y órganos concentradores a que se refieren las secciones Segunda y Cuarta del Capítulo III de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, directamente o a través de las instancias correspondientes, según sea el caso, información, documentación, datos e imágenes relacionadas con los reportes previstos en el inciso b) de la fracción I de este artículo y los avisos a que se refiere la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento, así como obtener información adicional de otras personas o fuentes para el ejercicio de sus atribuciones."],"destacado":true},{"etiqueta":"UIF · XV","nombre":"Comparte y denuncia","sub":"Unidad de Inteligencia Financiera","verbo":"Denuncio","desc":"Envía informes de inteligencia, presenta denuncias de LD/FT, intercambia información y retroalimenta a sujetos obligados y supervisoras sobre sus reportes.","orden":9,"panel":"UIF · comparte y denuncia","puntos":["<b>ENR 2023, III.4:<\/b> enviar informes de inteligencia y, en su caso, presentar las denuncias correspondientes de LD/FT.","<b>ENR 2023, III.4:<\/b> interactúa con los SO, a través de las Supervisoras y de manera directa, para retroalimentar la calidad de reportes y avisos y diseminar guías, mejores prácticas, indicadores de riesgo y tipologías; con las Supervisoras, para informar sobre el cumplimiento de los SO en sus reportes y avisos.","<b>Fr. XIV.<\/b> Proporcionar, requerir e intercambiar con las autoridades competentes nacionales y extranjeras la información y documentación necesaria para el ejercicio de sus atribuciones.","<b>Fr. XV.<\/b> Denunciar ante el Ministerio Público de la Federación y, en su caso, ante las autoridades investigadoras administrativas competentes las conductas que pudieran favorecer, prestar ayuda, auxilio o cooperación de cualquier especie para la comisión de los delitos de terrorismo y su financiamiento o de operaciones con recursos de procedencia ilícita, así como aquellas conductas previstas en la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, para lo cual se allegará de los elementos probatorios del caso."],"destacado":true}]},{"letra":"4","titulo":"Castigo","pregunta":"¿Quién investiga y juzga?","ritmo":"Persiguen y juzgan","corto":"Castigo","color":"negro","items":[{"etiqueta":"FGR","nombre":"Fiscalía General de la República","sub":"Y fiscalías estatales","verbo":"Persigo","desc":"Investiga y persigue los delitos del orden federal y estatal, incluido el LD/FT. En el diagrama de la CNBV de 2019 todavía aparece como Procuraduría General de la República.","orden":10,"panel":"FGR y fiscalías","puntos":["<b>ENR 2023, III.5:<\/b> FGR y Procuradurías o Fiscalías Generales de Justicia Estatales: investigar y perseguir los delitos del orden federal y estatal, incluyendo el LD/FT.","Interactúa con la impartición de justicia (consignación de investigaciones de LD/FT) y con la UIF (retroalimentación sobre la información de las denuncias e informes de inteligencia).","<b>Diagrama CNBV (VSPP, 2019), «Procuraduría General de la República»:<\/b> investigación y persecución de los delitos · verificación de las actividades ilícitas que involucran los recursos detectados · comprobación de vínculos con actividades criminales · obtención de sentencias condenatorias · decomiso de bienes de procedencia ilícita."],"destacado":false},{"etiqueta":"PJF","nombre":"Poder Judicial","sub":"Federal y estatales","verbo":"Juzgo","desc":"El Poder Judicial de la Federación y los poderes judiciales estatales imparten justicia con apego al marco jurídico, incluidos los casos de LD/FT.","orden":11,"panel":"Poder Judicial","puntos":["<b>ENR 2023, III.5:<\/b> impartición de justicia con apego al marco jurídico de la nación, garantizando el Estado de Derecho e incluyendo los casos de LD/FT.","Interactúa con la procuración de justicia (identificación de los elementos de prueba del delito admitidos para casos de LD/FT).","No aparece en el diagrama de la CNBV de 2019."],"destacado":false},{"etiqueta":"Otros","nombre":"Otras autoridades de apoyo","sub":"Según el caso","verbo":"Apoyo","desc":"Entran cuando el caso lo pide: FEDE si hay delitos electorales, SRE para la asistencia legal mutua, FECC, ASF y SFP si hay corrupción, y la SSPC.","orden":12,"panel":"Otros integrantes del régimen","puntos":["<b>ENR 2023, III.5:<\/b> Fiscalía Especializada en Delitos Electorales (FEDE), en los casos en que existan además delitos electorales vinculados a ORPI.","Secretaría de Relaciones Exteriores (SRE), quien coordina la Asistencia Legal Mutua con autoridades extranjeras.","Fiscalía Especializada en Combate a la Corrupción (FECC), Auditoría Superior de la Federación (ASF) y Secretaría de la Función Pública (SFP), en los casos en que existan además delitos de corrupción vinculados a ORPI.","Secretaría de Seguridad Pública y Protección Ciudadana (SSPC), que trabaja con la Guardia Financiera."],"destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por participante"}},{"tipo":"escala","id":"objeto","nav":"Para qué","titulo":"¿Para qué existe el régimen?","intro":"La ENR 2023 (apartado III) resume la acción del Estado en tres verbos.","etiqueta":"ENR 2023 · apartado III","subtitulo":"Prevenir · Detectar · Combatir","niveles":[{"t":"Prevenir","d":"Que los recursos (ilícitos, para el LD, y con fines ilícitos, para el FT) no sean introducidos al sistema financiero o a la economía nacional."},{"t":"Detectar","d":"Que la introducción de dichos recursos sea oportunamente identificada por los SO y las autoridades competentes."},{"t":"Combatir","d":"Que se castigue debidamente la conducta ilícita detectada y se sustraiga de dichos recursos al delincuente."}],"memo":"<b>Objeto del Régimen Nacional de PLD/CFT (ENR 2023, III):<\/b> proteger el SF y la economía nacional mediante el establecimiento de medidas y procedimientos para prevenir y detectar ORPI, a través de una coordinación interinstitucional, que tenga como fines recabar elementos útiles para investigar y perseguir los delitos de LD, los relacionados con estos últimos, las estructuras financieras de las organizaciones delictivas y evitar el uso de los recursos para su financiamiento; así como prevenir y detectar actos u operaciones que pudieran favorecer, prestar ayuda, auxilio o cooperación de cualquier especie para la comisión de los delitos de terrorismo y su financiamiento."},{"tipo":"tarjetas","id":"fotos","nav":"Dos fotos","titulo":"Dos fotos del régimen: CNBV 2019 y ENR 2023","intro":"Las dos traen cinco participantes, pero no los mismos. Si el reactivo cita el diagrama de la CNBV, responde con el diagrama; si cita la ENR, con la ENR.","tarjetas":[{"encabezado":true,"color":"morado","titulo":"Diagrama de la CNBV","subtitulo":"VSPP · «Lavado de Dinero» · 30-abr-2019 · p. 2","filas":[{"k":"Regula","v":"UBVA y UBD (SHCP): emisión de normatividad en la materia."},{"k":"Cumple","v":"Sujetos obligados: políticas de identificación y conocimiento de clientes y usuarios; reportes de operaciones."},{"k":"Supervisa","v":"<b>Sólo la CNBV:<\/b> supervisión del cumplimiento, <b>imposición de sanciones<\/b> y atención a requerimientos de autoridades."},{"k":"Analiza","v":"UIF (SHCP): análisis de reportes; detección de operaciones, situaciones patrimoniales o de negocios sospechosos; identificación de personas, actividades y origen y destino de recursos potencialmente ilícitos; presentación de denuncias."},{"k":"Persigue","v":"<b>Procuraduría General de la República:<\/b> investigación y persecución; verificación de actividades ilícitas; comprobación de vínculos criminales; sentencias condenatorias; decomiso de bienes."}]},{"encabezado":true,"color":"principal","titulo":"Evaluación Nacional de Riesgos","subtitulo":"ENR 2023 · noviembre 2023 · apartado III","filas":[{"k":"Regula","v":"SHCP por la <b>UBD, UBVA, USPSS y UIF<\/b>, y el <b>Banco de México<\/b>."},{"k":"Cumple","v":"Sujetos obligados: integrantes del SF y quienes realizan actividades vulnerables."},{"k":"Supervisa","v":"<b>CNBV, CNSF, CONSAR y SAT<\/b>; Banxico en los riesgos adicionales de sistemas de pagos."},{"k":"Analiza","v":"UIF: recibe reportes y avisos, analiza, disemina inteligencia, envía informes y, en su caso, presenta denuncias."},{"k":"Persigue","v":"<b>FGR<\/b> y fiscalías estatales; Poder Judicial; FEDE, SRE, FECC, ASF, SFP y SSPC según el caso."}]}],"nota":"<b>Lo que cambia:<\/b> la ENR agrega reguladoras (USPSS, UIF, Banxico), supervisoras (CNSF, CONSAR, SAT) y al Poder Judicial; la PGR de 2019 es la FGR de 2023. La sanción, en el diagrama de 2019, es función de la CNBV."},{"tipo":"flujo","id":"ruta","nav":"Ruta de un reporte","titulo":"La ruta de un reporte","intro":"Orden <b>didáctico<\/b> para casos de examen; la norma no fija esta secuencia. Los dos carriles corren al mismo tiempo: la inteligencia no espera a la supervisión, ni al revés.","carriles":[{"titulo":"Inteligencia y persecución","sub":"UIF → FGR → Poder Judicial","color":"principal","nodos":[{"titulo":"El sujeto obligado reporta","ref":"ENR III.1","texto":"Detecta la operación de riesgo y envía el reporte o aviso a la UIF."},{"titulo":"La UIF recibe y analiza","ref":"RISCHP art. 10, fr. VIII","texto":"Coordina la recepción y análisis; puede requerir más información al SO (fr. IX) e intercambiar con autoridades nacionales y extranjeras (fr. XIV)."},{"titulo":"La UIF denuncia","ref":"Art. 10, frs. XV a XVII","texto":"Denuncia ante el Ministerio Público de la Federación, coadyuva en el proceso penal y da seguimiento a sus denuncias."},{"titulo":"La FGR investiga y persigue","ref":"ENR III.5","texto":"Investiga y persigue el delito; retroalimenta a la UIF sobre sus denuncias e informes."},{"titulo":"El Poder Judicial juzga","ref":"ENR III.5","texto":"Imparte justicia en los casos de LD/FT."}]},{"titulo":"Supervisión y sanción","sub":"CNBV","color":"negro","nodos":[{"titulo":"La CNBV supervisa","ref":"RI CNBV art. 48, frs. I y II","texto":"Las DG PLD A, B y C verifican el cumplimiento y practican visitas ordinarias, especiales y de investigación."},{"titulo":"La UIF avisa del incumplimiento","ref":"RISCHP art. 10, fr. XXI","texto":"Hace del conocimiento de los órganos desconcentrados el incumplimiento o cumplimiento extemporáneo, para que, en su caso, ejerzan sus atribuciones."},{"titulo":"La CNBV sanciona","ref":"RI CNBV art. 41, fr. XI","texto":"La DG de Delitos y Sanciones otorga audiencia e impone sanciones administrativas cuando la Junta de Gobierno se lo haya delegado."}]}]},{"tipo":"mapa","id":"uif","nav":"Fichas UIF","titulo":"La UIF en 45 fracciones: art. 10 del Reglamento Interior de la SHCP","intro":"Seis bloques (agrupación <b>didáctica<\/b>). Las fichas con nombre son las de examen probable, con su texto literal; «Las demás» completan el bloque. El examen pide reconocer la redacción, no el número.","centro":{"t":"Unidad de Inteligencia Financiera","s":"Art. 10 RISCHP<br>45 fracciones"},"ramas":[{"letra":"1","titulo":"Norma","pregunta":"Propongo y opino; no emito","estilo":"ficha","color":"morado","items":[{"etiqueta":"I","nombre":"DCG del sistema financiero","verbo":"Propongo","gancho":"¿Quién emite? La Secretaría","puntos":["<b>Fr. I.<\/b> Proponer y emitir opinión a las demás unidades administrativas de la Secretaría sobre los proyectos de disposiciones de carácter general aplicables a las entidades y personas señaladas en los artículos 14, fracción I; 15, fracción I, y 16, fracción I, de este Reglamento que deba emitir la Secretaría en relación con: a) El establecimiento de medidas y procedimientos para prevenir y detectar actos, omisiones u operaciones que pudieran favorecer, prestar ayuda, auxilio o cooperación de cualquier especie para la comisión de los delitos de terrorismo y su financiamiento o de operaciones con recursos de procedencia ilícita; b) La presentación a la Secretaría de reportes sobre los actos, operaciones y servicios que las entidades y personas obligadas a ello realicen con sus clientes y usuarios, relativos al inciso anterior, así como sobre todo acto, operación o servicio que, en su caso, realicen los miembros del consejo de administración, directivos, funcionarios, empleados y apoderados de dichos sujetos obligados, que pudiesen ubicarse en el supuesto previsto en el inciso anterior o que, en su caso, pudiesen contravenir o vulnerar la adecuada aplicación de las disposiciones señaladas, y c) Los lineamientos sobre el procedimiento y criterios que las entidades y personas obligadas deban observar en términos de ley respecto del adecuado conocimiento de sus clientes y usuarios; la información y documentación que, en su caso, dichos sujetos deban recabar para la apertura de cuentas o celebración de contratos relativos a las operaciones y servicios que ellas presten y que acredite la identidad de sus clientes; la forma en que los mismos sujetos deberán resguardar y garantizar la seguridad de la información y documentación relativas a la identificación de sus clientes y usuarios o de quienes lo hayan sido; la de aquellos actos, operaciones y servicios reportados de acuerdo con lo anterior; los términos para proporcionar capacitación al interior de las entidades y personas obligadas de conformidad con la ley sobre la materia objeto de esta fracción; el uso de sistemas automatizados que coadyuven al cumplimiento de las medidas y procedimientos establecidas en las disposiciones de carácter general a que se refiere esta fracción, así como el establecimiento de estructuras internas que deban funcionar como áreas de cumplimiento en la materia, al interior de cada sujeto obligado."],"conteo":"3 incisos"},{"etiqueta":"II","nombre":"Reglas de la LFPIORPI","verbo":"Propongo","gancho":"Para aprobación superior","puntos":["<b>Fr. II.<\/b> Proponer, para aprobación superior, las reglas de carácter general que la Secretaría deba emitir en términos de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento, y resolver lo referente a su aplicación."],"conteo":""},{"etiqueta":"III","nombre":"Interpretar la LFPIORPI","verbo":"Interpreto","gancho":"Para efectos administrativos","puntos":["<b>Fr. III.<\/b> Interpretar, para efectos administrativos, la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, su Reglamento, las reglas de carácter general y demás disposiciones jurídicas que de dichos ordenamientos emanen, en el ámbito de competencia de la Secretaría."],"conteo":""},{"etiqueta":"VI","nombre":"Formas oficiales","verbo":"Expido","gancho":"Reportes, avisos y demás información","puntos":["<b>Fr. VI.<\/b> Determinar y expedir, en coordinación con los órganos administrativos desconcentrados competentes de la Secretaría, las formas oficiales para la presentación de reportes a que se refiere el inciso b) de la fracción I de este artículo y para la recepción de los avisos y la presentación de la demás información que establecen la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, su Reglamento y las reglas de carácter general que de dichos ordenamientos emanen."],"conteo":""},{"etiqueta":"XXIV","nombre":"Tipologías y guías","verbo":"Apruebo","gancho":"Tendencias, indicadores, guías y mejores prácticas","puntos":["<b>Fr. XXIV.<\/b> Aprobar, en su caso, las tipologías, tendencias e indicadores en las materias a que se refiere este artículo, así como las guías y mejores prácticas para la elaboración y el envío de los reportes y avisos a que se refiere la fracción VIII del presente artículo."],"conteo":""},{"etiqueta":"Resto","nombre":"Las demás del bloque","verbo":"","gancho":"Para reconocerlas, no para memorizar el número","puntos":["<b>Fr. IV.<\/b> Participar con las unidades administrativas competentes de la Secretaría, en el estudio y elaboración de proyectos de iniciativas de leyes, reglamentos, acuerdos o decretos relativos a las materias a que se refiere este artículo.","<b>Fr. V.<\/b> Emitir opinión jurídica a las unidades administrativas competentes de la Secretaría sobre la interpretación, para efectos administrativos, de las disposiciones de carácter general señaladas en la fracción I de este artículo, así como de las disposiciones legales de las que aquellas emanen.","<b>Fr. XXX.<\/b> Determinar los medios de cumplimiento alternativos, conforme a lo dispuesto por la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento."],"conteo":"3 fr."}]},{"letra":"2","titulo":"Recibo y pido","pregunta":"Me llega y lo pido","estilo":"ficha","color":"principal","items":[{"etiqueta":"VII","nombre":"Participar en la verificación","verbo":"Participo","gancho":"Con los desconcentrados; no supervisa sola","puntos":["<b>Fr. VII.<\/b> Participar con los órganos administrativos desconcentrados competentes de la Secretaría, en la revisión, verificación, comprobación y evaluación del cumplimiento de las disposiciones de carácter general a que se refiere la fracción I de este artículo, así como de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, su Reglamento y demás disposiciones jurídicas que de dichos ordenamientos emanen, por parte de las entidades y personas obligadas a ello en términos de las disposiciones jurídicas aplicables."],"conteo":""},{"etiqueta":"VIII","nombre":"Recepción y análisis","verbo":"Analizo","gancho":"Reportes, avisos y declaraciones (art. 9o. Ley Aduanera)","puntos":["<b>Fr. VIII.<\/b> Coordinar la recepción y análisis de la información contenida en los reportes a que se refiere el inciso b) de la fracción I de este artículo, los avisos previstos en la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento, y en las declaraciones a que se refiere el artículo 9o. de la Ley Aduanera."],"conteo":""},{"etiqueta":"IX","nombre":"Requerir a sujetos obligados","verbo":"Requiero","gancho":"A SO, AV, entidades colegiadas y órganos concentradores","puntos":["<b>Fr. IX.<\/b> Requerir y recabar de las entidades y personas sujetas a las disposiciones de carácter general señaladas en la fracción I de este artículo y de quienes realicen las actividades vulnerables, entidades colegiadas y órganos concentradores a que se refieren las secciones Segunda y Cuarta del Capítulo III de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, directamente o a través de las instancias correspondientes, según sea el caso, información, documentación, datos e imágenes relacionadas con los reportes previstos en el inciso b) de la fracción I de este artículo y los avisos a que se refiere la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento, así como obtener información adicional de otras personas o fuentes para el ejercicio de sus atribuciones."],"conteo":""},{"etiqueta":"Resto","nombre":"Las demás del bloque","verbo":"","gancho":"Para reconocerlas, no para memorizar el número","puntos":["<b>Fr. X.<\/b> Requerir a las unidades administrativas y órganos administrativos desconcentrados de la Secretaría la información y documentación necesaria para el ejercicio de sus atribuciones, incluido el acceso a las bases de datos que contengan dicha información y documentación, en los términos y plazos establecidos por la propia Unidad, de conformidad con las disposiciones jurídicas aplicables.","<b>Fr. XXV.<\/b> Establecer los lineamientos y programas en materia de recepción y análisis de la información, documentación, datos e imágenes que obtenga, de conformidad con las disposiciones de carácter general a que se refiere la fracción I de este artículo, la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, su Reglamento y demás disposiciones que de dichos ordenamientos emanen, y en las declaraciones a que se refiere el artículo 9o. de la Ley Aduanera.","<b>Fr. XXVI.<\/b> Informar a las autoridades competentes, así como a los sujetos obligados a observar las disposiciones de carácter general a que se refiere la fracción I de este artículo y a quienes realicen las actividades vulnerables y entidades colegiadas previstas en las secciones Segunda y Cuarta del Capítulo III de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, sobre la calidad y utilidad de los reportes y avisos a que se refiere la fracción VIII de este artículo.","<b>Fr. XXVII.<\/b> Celebrar convenios con las autoridades federales, de las entidades federativas, de los municipios y de las demarcaciones territoriales de la Ciudad de México, así como con los órganos constitucionales autónomos, a fin de recabar información, datos e imágenes que obren en su poder, en términos del artículo 45 de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y demás disposiciones jurídicas aplicables, que permita comprobar o descartar las operaciones presuntamente relacionadas con los delitos a que se refiere la fracción I de este artículo.","<b>Fr. XXVIII.<\/b> Requerir a los sujetos a que se refiere el artículo 51 de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, la información y documentación a la que tengan acceso, y celebrar para tales efectos los convenios respectivos con el Banco de México."],"conteo":"5 fr."}]},{"letra":"3","titulo":"Comparto","pregunta":"Adentro y afuera","estilo":"ficha","color":"turquesa","items":[{"etiqueta":"XIV","nombre":"Intercambiar información","verbo":"Intercambio","gancho":"Autoridades nacionales y extranjeras","puntos":["<b>Fr. XIV.<\/b> Proporcionar, requerir e intercambiar con las autoridades competentes nacionales y extranjeras la información y documentación necesaria para el ejercicio de sus atribuciones."],"conteo":""},{"etiqueta":"XXI","nombre":"Avisar del incumplimiento","verbo":"Aviso","gancho":"Para que el desconcentrado ejerza sus atribuciones","puntos":["<b>Fr. XXI.<\/b> Hacer del conocimiento de los órganos administrativos desconcentrados competentes de la Secretaría, según corresponda, el incumplimiento o cumplimiento extemporáneo de las obligaciones establecidas en las disposiciones de carácter general a que se refiere la fracción I de este artículo o en la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, su Reglamento y demás disposiciones jurídicas que de dichos ordenamientos emanen, con el objeto de que, en su caso, estos órganos administrativos desconcentrados ejerzan sus atribuciones."],"conteo":""},{"etiqueta":"XXIII","nombre":"Enlace internacional","verbo":"Enlazo","gancho":"Países, jurisdicciones y organismos internacionales","puntos":["<b>Fr. XXIII.<\/b> Fungir, en las materias a que se refiere este artículo, como enlace entre la Secretaría y los países, jurisdicciones, instancias u organismos internacionales o intergubernamentales y demás entes de derecho público internacional, con la participación que en términos de ley corresponde a otras dependencias y entidades de la Administración Pública Federal, y coordinar la implementación de los acuerdos que se adopten."],"conteo":""},{"etiqueta":"Resto","nombre":"Las demás del bloque","verbo":"","gancho":"Para reconocerlas, no para memorizar el número","puntos":["<b>Fr. XI.<\/b> Establecer coordinación con las instancias competentes para reforzar los procesos de identificación, inteligencia y combate de las conductas que pudieran favorecer, prestar ayuda, auxilio o cooperación de cualquier especie para la comisión de los delitos de terrorismo y su financiamiento o de operaciones con recursos de procedencia ilícita y los relacionados con dichos delitos.","<b>Fr. XIII.<\/b> Establecer coordinación con las autoridades fiscales para la práctica de los actos de fiscalización que resulten necesarios con motivo del ejercicio de las atribuciones conferidas conforme al presente artículo.","<b>Fr. XX.<\/b> Fungir, en los asuntos a que se refiere este artículo, como enlace entre las unidades administrativas y órganos administrativos desconcentrados de la Secretaría y los siguientes entes: las dependencias y entidades de la Administración Pública Federal, las entidades federativas, los municipios, los poderes Judicial y Legislativo de la Federación y de las entidades federativas, la Fiscalía General de la República, los órganos de procuración de justicia de las entidades federativas, los órganos constitucionales autónomos, las empresas productivas del Estado, y los órganos colegiados e instituciones no gubernamentales, así como negociar, celebrar e implementar convenios o cualquier otro instrumento jurídico con dichos entes.","<b>Fr. XXII.<\/b> Participar en la negociación de los tratados internacionales en las materias a que se refiere este artículo, con la intervención que corresponda a otras dependencias o entidades de la Administración Pública Federal y celebrar los acuerdos interinstitucionales previstos en la Ley sobre la Celebración de Tratados y demás instrumentos jurídicos internacionales que no requieren la firma de la persona titular de la Secretaría.","<b>Fr. XXIX.<\/b> Suscribir, en conjunto con el Servicio de Administración Tributaria, los convenios que se celebren con las entidades colegiadas en términos de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y su Reglamento.","<b>Fr. XXXI.<\/b> Fungir como enlace entre la Secretaría y los sujetos obligados a observar las disposiciones de carácter general señaladas en la fracción I de este artículo, así como con quienes realicen las actividades vulnerables y entidades colegiadas previstas en las secciones Segunda y Cuarta del Capítulo III de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, respecto de los asuntos señalados en el presente artículo.","<b>Fr. XXXII.<\/b> Dar a conocer, cuando corresponda a la Secretaría, a quienes realicen las actividades vulnerables a que se refiere la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, directamente o por conducto del órgano administrativo desconcentrado competente de la Secretaría, las listas, reportes, mecanismos, informes o resoluciones previstas en las disposiciones jurídicas a que se refieren las fracciones I y II de este artículo.","<b>Fr. XXXIII.<\/b> Comunicar a las autoridades encargadas del combate a la corrupción o de procuración de justicia, la información necesaria para identificar actos u operaciones, así como personas presuntamente involucradas con recursos de procedencia ilícita, en términos del artículo 47 de la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita.","<b>Fr. XXXVII.<\/b> Someter la designación del personal de las agregadurías en el extranjero de esta Unidad a ratificación de su superior jerárquico."],"conteo":"9 fr."}]},{"letra":"4","titulo":"Denuncio","pregunta":"Expediente, denuncia, seguimiento","estilo":"ficha","color":"coral","items":[{"etiqueta":"XII","nombre":"Integrar expedientes","verbo":"Recopilo","gancho":"Pruebas, constancias y estructuras financieras","puntos":["<b>Fr. XII.<\/b> Recibir y recopilar, en relación con las materias a que se refiere este artículo, las pruebas, constancias, reportes, avisos, documentación, datos, imágenes e informes sobre las conductas que pudieran favorecer, prestar ayuda, auxilio o cooperación de cualquier especie para la comisión de los delitos de terrorismo y su financiamiento o de operaciones con recursos de procedencia Ilícita, los relacionados con dichos delitos, así como sobre las estructuras financieras de las organizaciones delictivas, e integrar los expedientes respectivos."],"conteo":""},{"etiqueta":"XV","nombre":"Denunciar","verbo":"Denuncio","gancho":"Ante el Ministerio Público de la Federación","puntos":["<b>Fr. XV.<\/b> Denunciar ante el Ministerio Público de la Federación y, en su caso, ante las autoridades investigadoras administrativas competentes las conductas que pudieran favorecer, prestar ayuda, auxilio o cooperación de cualquier especie para la comisión de los delitos de terrorismo y su financiamiento o de operaciones con recursos de procedencia ilícita, así como aquellas conductas previstas en la Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, para lo cual se allegará de los elementos probatorios del caso."],"conteo":""},{"etiqueta":"XVII","nombre":"Seguimiento de denuncias","verbo":"Sigo","gancho":"Hasta la resolución que no admita medio de defensa","puntos":["<b>Fr. XVII.<\/b> Coordinar el seguimiento de las denuncias formuladas por esta Unidad, desde su presentación y, en su caso, hasta la emisión de la resolución que no admita medio de defensa alguno, así como de los reportes de inteligencia presentados ante la autoridad competente."],"conteo":""},{"etiqueta":"Resto","nombre":"Las demás del bloque","verbo":"","gancho":"Para reconocerlas, no para memorizar el número","puntos":["<b>Fr. XVI.<\/b> Coadyuvar, en su caso, con las autoridades competentes, en representación de la Secretaría, en los procesos penales relativos a las conductas a que se refiere la fracción anterior de este artículo.","<b>Fr. XVIII.<\/b> Celebrar acuerdos reparatorios respecto de los asuntos a que se refiere este artículo, en términos de las disposiciones jurídicas aplicables.","<b>Fr. XIX.<\/b> Atender los requerimientos y resoluciones de autoridades administrativas o jurisdiccionales, incluyendo al Ministerio Público de la Federación, siempre que no corresponda a otra unidad administrativa de la Secretaría."],"conteo":"3 fr."}]},{"letra":"5","titulo":"Listo y mido","pregunta":"Lista y mapa de riesgos","estilo":"ficha","color":"amarillo","items":[{"etiqueta":"XXXIV","nombre":"Lista de personas bloqueadas","verbo":"Integro","gancho":"Introducción y eliminación de personas","puntos":["<b>Fr. XXXIV.<\/b> Integrar la lista de personas bloqueadas, prevista en las leyes financieras, incluida la introducción y eliminación de personas en dicha lista, así como emitir los lineamientos, guías o mejores prácticas en la materia a que se refiere esta fracción."],"conteo":""},{"etiqueta":"XXXV","nombre":"Procedimientos de la lista","verbo":"Resuelvo","gancho":"Sustancia y resuelve","puntos":["<b>Fr. XXXV.<\/b> Sustanciar y resolver los procedimientos administrativos relacionados con la integración de la lista a que se refiere la fracción anterior."],"conteo":""},{"etiqueta":"XXXVI","nombre":"Evaluación Nacional de Riesgos","verbo":"Evalúo","gancho":"Emitir y mantener actualizada","puntos":["<b>Fr. XXXVI.<\/b> Emitir y mantener actualizada la Evaluación Nacional de Riesgos de Lavado de Dinero y Financiamiento al Terrorismo."],"conteo":""}]},{"letra":"6","titulo":"Me defiendo","pregunta":"En tribunales","estilo":"ficha","color":"negro","items":[{"etiqueta":"XXXVIII","nombre":"Representar en juicios","verbo":"Represento","gancho":"Tribunales federales y otras autoridades","puntos":["<b>Fr. XXXVIII.<\/b> Representar a esta Unidad y a las unidades administrativas que tenga adscritas en toda clase de juicios o procedimientos ante los tribunales federales y ante otras autoridades competentes en que sea parte, o cuando sin ser parte, sea requerida su intervención por la autoridad que conoce del juicio o procedimiento, o tenga interés para intervenir conforme a sus atribuciones; ejercitar los derechos, acciones, excepciones y defensas de las que sea titular, así como desistir y transigir cuando así convenga a los intereses de esta Unidad e interponer los recursos que procedan ante dichos tribunales y autoridades."],"conteo":""},{"etiqueta":"Resto","nombre":"Las demás del bloque","verbo":"","gancho":"Para reconocerlas, no para memorizar el número","puntos":["<b>Fr. XXXIX.<\/b> Interponer, en representación de esta Unidad o de las unidades administrativas que tenga adscritas, los recursos que procedan contra las sentencias y resoluciones definitivas dictadas por el Tribunal Federal de Justicia Administrativa, y, en su caso, acordar la no interposición de dicho recurso.","<b>Fr. XL.<\/b> Intervenir, en representación de esta Unidad o de las unidades administrativas que tenga adscritas, en los juicios de amparo promovidos contra sentencias dictadas por el Tribunal Federal de Justicia Administrativa, y formular los alegatos e interponer los recursos correspondientes.","<b>Fr. XLI.<\/b> Representar a esta Unidad o a las unidades administrativas que tenga adscritas, para allanarse cuando así proceda, a las demandas formuladas en los juicios materia de su competencia.","<b>Fr. XLII.<\/b> Designar y dirigir, por sí o a través de sus direcciones generales, a las personas servidoras públicas que serán autorizadas o acreditadas como delegadas por las autoridades correspondientes de esta Unidad en los juicios o procedimientos de su competencia y, en su caso, actuar en los mismos términos.","<b>Fr. XLIII.<\/b> Sustanciar, por sí o a través de sus direcciones generales, la instrucción de los procedimientos administrativos en que deba intervenir esta Unidad, o las unidades administrativas que tenga adscritas, conforme a las disposiciones jurídicas aplicables, relacionados con actos, atribuciones y facultades de dicha Unidad o de sus unidades administrativas, y emitir las resoluciones que resuelvan dichos procedimientos.","<b>Fr. XLIV.<\/b> Atender los escritos de los particulares en los que ejerzan el derecho de petición, en asuntos de su competencia.","<b>Fr. XLV.<\/b> Intervenir en los juicios de amparo en los que esta Unidad o las unidades administrativas que tenga adscrita tengan el carácter de tercero interesado."],"conteo":"7 fr."}]}],"frase":{"titulo":"Los seis bloques en una frase","html":"Propongo la norma, recibo y pido, comparto, denuncio, listo y mido… y me defiendo."}},{"tipo":"mapa","id":"cnbv","nav":"Fichas CNBV","titulo":"La CNBV por dentro: Reglamento Interior (DOF 28-feb-2022)","intro":"El Reglamento no tiene un artículo con atribuciones específicas de la Vicepresidencia de Supervisión de Procesos Preventivos (sólo las genéricas del art. 17, que le permiten ejercer las de las DG que tenga adscritas). Las facultades PLD/FT están en las direcciones generales de Prevención de Operaciones con Recursos de Procedencia Ilícita A, B y C (art. 48); las DG supervisoras de cada sector pueden ejercer la verificación cuando lo acuerden con ellas (art. 18, penúltimo párrafo).","centro":{"t":"CNBV","s":"Reglamento Interior<br>arts. 1, 3, 4, 17, 18, 38, 41, 46, 48 y 49"},"ramas":[{"letra":"1","titulo":"La Comisión","pregunta":"¿Qué es y cómo se organiza?","estilo":"ficha","color":"morado","items":[{"etiqueta":"Art. 1","nombre":"Naturaleza","verbo":"Soy","gancho":"Desconcentrado de la SHCP","puntos":["<b>Art. 1 (resumen).<\/b> La CNBV, como órgano administrativo desconcentrado de la SHCP, con autonomía técnica y atribuciones ejecutivas, ejerce las atribuciones que le confieren su propia Ley, las leyes relativas al sistema financiero mexicano y los demás ordenamientos jurídicos aplicables."],"conteo":""},{"etiqueta":"Art. 4","nombre":"Estructura","verbo":"Me organizo","gancho":"Vicepresidencias y direcciones generales","puntos":["<b>Art. 4, fr. II, A:<\/b> entre las vicepresidencias, la de Supervisión de Procesos Preventivos.","<b>Art. 4, fr. II, B:<\/b> entre las direcciones generales, las de Prevención de Operaciones con Recursos de Procedencia Ilícita A, B y C, la de Delitos y Sanciones y la de Atención a Autoridades.","<b>Art. 3:<\/b> órganos y unidades: Junta de Gobierno, Comité Interinstitucional, Presidencia, vicepresidencias y direcciones generales."],"conteo":""}]},{"letra":"2","titulo":"DG PLD A, B y C · art. 48","pregunta":"Las que supervisan PLD/FT","estilo":"ficha","color":"principal","items":[{"etiqueta":"I","nombre":"Verificar el cumplimiento","verbo":"Supervisan","gancho":"Entidades, centros cambiarios, transmisores, SOFOM no reguladas…","puntos":["<b>Fr. I.<\/b> Ejercer las atribuciones señaladas en los artículos 18 y 19 de este Reglamento, para verificar el cumplimiento de las disposiciones jurídicas en materia de prevención, detección y reporte de actos, omisiones u operaciones que pudiesen ubicarse en los supuestos de los artículos 139 Quáter o 400 Bis del Código Penal Federal, respecto de las Entidades, sociedades autorizadas para operar con modelos novedosos, Asesores en inversiones, Centros cambiarios, Transmisores de dinero y Sociedades financieras de objeto múltiple no reguladas sujetas a su supervisión, en el ámbito de su competencia. Al efecto, podrán acordar conforme a los procesos internos correspondientes con las direcciones generales de Supervisión de Grupos e Intermediarios Financieros A, B, C, D, E o F; de Supervisión de Banca de Desarrollo y Entidades de Fomento; de Supervisión de Uniones de Crédito; de Supervisión de Cooperativas de Ahorro y Préstamo A o B; de Supervisión de Sociedades Financieras Populares A o B; de Administración de Inversiones; de Supervisión de Entidades e Intermediarios Bursátiles; de Supervisión de Conducta de Participantes del Mercado o de Supervisión de Instituciones de Tecnología Financiera, que realicen la supervisión de Entidades, sociedades autorizadas para operar con modelos novedosos y Asesores en inversiones para verificar el cumplimiento de las disposiciones jurídicas señaladas en el párrafo anterior, en los términos a que se refieren los artículos 18, penúltimo párrafo y 19, penúltimo párrafo de este Reglamento."],"conteo":""},{"etiqueta":"II","nombre":"Visitas","verbo":"Visitan","gancho":"Ordinarias, especiales y de investigación","puntos":["<b>Fr. II.<\/b> Practicar a las Entidades, sociedades autorizadas para operar con modelos novedosos, Asesores en inversiones, Centros cambiarios, Transmisores de dinero y Sociedades financieras de objeto múltiple no reguladas sujetas a la supervisión de la Comisión, visitas ordinarias, especiales y de investigación con el objeto de verificar el cumplimiento de las disposiciones jurídicas señaladas en la fracción I de este artículo. Al efecto, podrá solicitar y recabar cualquier información y documentación de las Entidades, sociedades autorizadas para operar con modelos novedosos, Asesores en inversiones, Centros camb
